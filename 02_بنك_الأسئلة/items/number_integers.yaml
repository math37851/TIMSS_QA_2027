  time: 100
  stem: |
    في تجربة علمية، تنقسم خلية بكتيرية إلى خليتين كل 20 دقيقة، وتنقسم كل خلية جديدة بالطريقة نفسها.
    بدأت التجربة بخلية واحدة. كم خلية سيكون العدد بعد ساعتين؟
  answer: {value: 64, unit: "خلية"}
  verify: "2**(120 // 20)"
  solution: |
    ساعتان $= 120$ دقيقة، أي $120 \div 20 = 6$ انقسامات.
    يتضاعف عدد الخلايا في كل انقسام: $2^6 = 64$ خلية.
  remediation: |
    ارسم جدولاً: الزمن بالدقائق ($0, 20, 40, \ldots$) وعدد الخلايا ($1, 2, 4, 8, \ldots$) ليلاحظ الطلاب التضاعف، ثم اكتبه قوةً للعدد $2$.
  misconceptions: [doubling-as-adding, count-intervals-wrong]
  hint: "كم مرة تنقسم الخلايا خلال ساعتين؟"
  qatar_link: "الصف الثامن — الأسس"

- id: M8-N1-011
  topic: N1
  cognitive: applying
  area: implement
  difficulty: foundation
  benchmark: low
  format: mc
  context: qatar
  time: 60
  stem: |
    ساحة مربعة الشكل في حديقة أسباير مساحتها $81\,\text{m}^2$. ما طول ضلعها؟
  figure:
    type: polygon
    points: [[0, 0], [3, 0], [3, 3], [0, 3]]
    side_labels: [null, null, null, '?']
    unit: 46
    extra: [{text: [1.5, 1.5], s: '81 m²', size: 17, color: '#8A1538', weight: bold}]
    alt: "مربع مساحته 81 متراً مربعاً وطول ضلعه مجهول"
  options: ['$9\,\text{m}$', '$20.25\,\text{m}$', '$40.5\,\text{m}$', '$81\,\text{m}$']
  option_values: [9, 20.25, 40.5, 81]
  key: A
  verify: "sqrt(81)"
  rationale:
    B: "قسم المساحة على 4 كما لو كانت محيطاً."
    C: "قسم المساحة على 2 بدلاً من إيجاد الجذر التربيعي."
    D: "اعتبر طول الضلع مساوياً للمساحة."
  solution: |
    مساحة المربع = طول الضلع × طول الضلع. العدد الذي مربعه $81$ هو $9$، لأن $9 \times 9 = 81$.
    إذن طول الضلع $9\,\text{m}$.
  remediation: |
    اربط الجذر التربيعي بمساحة المربع باستعمال شبكة مربعات، وميّز بين قسمة المحيط على 4 وإيجاد الجذر التربيعي للمساحة.
  misconceptions: [area-perimeter-confusion, sqrt-as-half]
  qatar_link: "الجذور التربيعية — الصف الثامن"

- id: M8-N1-012
  topic: N1
  cognitive: applying
  area: formulate
  difficulty: easy
  benchmark: intermediate
  format: numeric
  context: qatar
  time: 100
  stem: |
    في إحدى مدارس الدوحة 261 طالباً في الصف الثامن. يريد المدير توزيعهم على فصول متساوية في العدد،
    بحيث يكون في كل فصل أكثر من 20 طالباً وأقل من 30 طالباً. كم طالباً سيكون في كل فصل؟
  answer: {value: 29, unit: "طالباً"}
  verify: "(lambda L: L[0] if len(L) == 1 else -1)([d for d in divisors(261) if 20 < d < 30])"
  solution: |
    نبحث عن عامل للعدد $261$ بين $20$ و $30$: $261 = 9 \times 29$.
    إذن في كل فصل $29$ طالباً (9 فصول). لا يوجد عامل آخر للعدد $261$ بين $20$ و $30$.
  remediation: |
    علّم الطلاب اختبار القسمة على الأعداد المرشحة بالحاسبة ($21, 22, \ldots, 29$) وتسجيل ما يعطي ناتجاً صحيحاً.
  misconceptions: [guess-without-checking]
  hint: "جرّب قسمة 261 على الأعداد من 21 إلى 29."
  qatar_link: "العوامل وقابلية القسمة — الصف السادس"

- id: M8-N1-013
  topic: N1
  cognitive: knowing
  area: compute
  difficulty: easy
  benchmark: intermediate
  format: multi_numeric
  context: pure
  time: 100
  stem: |
    يمكن كتابة العدد 360 على صورة حاصل ضرب قوى أعداد أولية:
    $360 = 2^a \times 3^b \times 5^c$
    ما قيم $a$ و $b$ و $c$ ؟
  fields:
    - {label: '$a$', value: 3}
    - {label: '$b$', value: 2}
    - {label: '$c$', value: 1}
  scoring: {mode: all}
  verify: "(lambda f: [f[2], f[3], f[5]])(factorint(360))"
  solution: |
    $360 = 2 \times 180 = 2 \times 2 \times 90 = 2 \times 2 \times 2 \times 45 = 2^3 \times 45$ ، و $45 = 3^2 \times 5$.
    إذن $360 = 2^3 \times 3^2 \times 5^1$ ، أي $a = 3$ ، $b = 2$ ، $c = 1$.
  remediation: |
    استعمل شجرة العوامل، ثم تحقق بضرب الناتج: $8 \times 9 \times 5 = 360$.
  misconceptions: [incomplete-factorization]
  qatar_link: "التحليل إلى العوامل الأولية — الصف السادس"

- id: M8-N1-014
  topic: N1
  cognitive: reasoning
  area: analyze
