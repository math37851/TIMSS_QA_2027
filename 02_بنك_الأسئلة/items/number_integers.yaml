  rubric:
    full: 'يختار «لا» ويقدّم مثالاً صحيحاً يبيّن أن الناتج أكبر، مثل $5 - (-3) = 8$ و $8 > 5$، أو يوضح أن طرح عدد سالب يساوي جمع عدد موجب فيزداد الناتج.'
    zero: 'يختار «نعم»، أو يختار «لا» دون مثال أو تبرير صحيح، أو يكتفي بقاعدة عامة غير دقيقة مثل «سالب وسالب يصير موجب» دون مثال.'
    examples:
      correct: ['لا، لأن $10 - (-2) = 12$ وهو أكبر من $10$.']
      incorrect: ['نعم، لأن الطرح يصغّر العدد دائماً.']
  verify: "5 - (-3) == 8"
  solution: |
    طرح عدد سالب يساوي جمع معكوسه الموجب، فيزداد الناتج: $5 - (-3) = 5 + 3 = 8$ و $8 > 5$.
    إذن علي ليس على صواب.
  remediation: |
    اعرض أمثلة على خط الأعداد، واطلب من الطلاب صياغة قاعدة: «طرح عدد سالب يزيد العدد».
  misconceptions: [subtraction-always-decreases]
  qatar_link: "الصف السابع — الدرس 1-4"

- id: M8-N2-014
  topic: N2
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: high
  format: numeric
  context: qatar
  time: 130
  stem: |
    يبلغ ارتفاع قرين أبو البول، أعلى نقطة في قطر، نحو $103\,\text{m}$ فوق سطح البحر.
    غوّاص على عمق $25\,\text{m}$ تحت سطح البحر. طار طائر إلى نقطة تقع في منتصف المسافة الرأسية بين قمة القرين والغوّاص تماماً.
    كم يبلغ ارتفاع الطائر فوق سطح البحر؟
  answer: {value: 39, unit: "m"}
  verify: "(103 + (-25)) / 2"
  solution: |
    نمثّل الموقعين بالأعداد $103$ و $-25$.
    المسافة الرأسية بينهما $103 - (-25) = 128\,\text{m}$ ، ونصفها $64\,\text{m}$.
    الطائر عند $-25 + 64 = 39$ ، أي $39\,\text{m}$ فوق سطح البحر.
    (أو مباشرة: $\frac{103 + (-25)}{2} = \frac{78}{2} = 39$.)
  remediation: |
    ارسم خط أعداد رأسياً يوضح سطح البحر (0) والقمة والغوّاص، واحسب المسافة الكلية أولاً ثم منتصفها.
  misconceptions: [ignore-negative-sign, midpoint-of-magnitudes]
  hint: "احسب أولاً المسافة الرأسية بين القمة والغوّاص."
  qatar_link: "الصف السابع — الوحدة 1"

- id: M8-N2-015
  topic: N2
  cognitive: reasoning
  area: generalize
  difficulty: hard
  benchmark: advanced
  format: mc
  context: pure
  time: 110
  stem: |
    إذا كان $a$ و $b$ عددين سالبين، فأيّ المقادير الآتية يكون موجباً **دائماً**؟
  options: ['$a + b$', '$a - b$', '$b - a$', '$-a - b$']
  key: D
  verify: "all(-p - q > 0 for p in range(-9, 0) for q in range(-9, 0)) and any(p - q <= 0 for p in range(-9, 0) for q in range(-9, 0)) and any(q - p <= 0 for p in range(-9, 0) for q in range(-9, 0)) and all(p + q < 0 for p in range(-9, 0) for q in range(-9, 0))"
  rationale:
    A: 'مجموع عددين سالبين سالب دائماً، مثل $-2 + (-3) = -5$.'
    B: 'يعتمد على القيمتين: $-2 - (-5) = 3$ لكن $-5 - (-2) = -3$.'
    C: 'يعتمد على القيمتين كذلك، مثل $-3 - (-1) = -2$.'
  solution: |
    $-a - b = -(a + b)$. بما أن $a + b$ سالب دائماً، فإن معكوسه $-(a + b)$ موجب دائماً.
    مثال: $a = -2$ ، $b = -3$ ⇐ $-a - b = 2 + 3 = 5$.
  remediation: |
    اطلب من الطلاب تجريب أزواج مختلفة من الأعداد السالبة في جدول، ثم ملاحظة أي المقادير لا تتغير إشارته.
  misconceptions: [examples-prove-general, negative-of-negative]
  qatar_link: "الصف السابع — الوحدة 1"

- id: M8-N2-016
  topic: N2
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: high
  format: cr_explain
  context: real
  time: 150
  stem: |
    قال كريم: «الفرق بين درجتي الحرارة $8\,^\circ\text{C}$ و $-3\,^\circ\text{C}$ هو 5 درجات».
    اشرح الخطأ الذي وقع فيه كريم، ثم اكتب الفرق الصحيح.
  points: 2
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يوضح الخطأ (طرح 3 من 8 متجاهلاً أن $-3$ تحت الصفر، أو حسب $8 - 3$ بدلاً من $8 - (-3)$) ويكتب الفرق الصحيح $11$ درجة.'}
      - {code: 10, points: 1, desc: 'يكتب الفرق الصحيح $11$ دون توضيح الخطأ، أو يوضح الخطأ دون الوصول إلى $11$.'}
      - {code: 70, points: 0, desc: 'يوافق كريماً، أو يكتب فرقاً غير صحيح دون توضيح صحيح.'}
    examples:
      correct: ['نسي كريم أن $-3$ تحت الصفر؛ الفرق $8 - (-3) = 11$ درجة.']
      incorrect: ['الفرق 5 لأن $8 - 3 = 5$.']
  model_answer: 'أخطأ كريم لأنه طرح $3$ من $8$ متجاهلاً أن $-3$ تحت الصفر. الفرق الصحيح: $8 - (-3) = 8 + 3 = 11$ درجة.'
  verify: "8 - (-3) == 11"
  solution: |
    من $-3$ إلى $0$ ثلاث درجات، ومن $0$ إلى $8$ ثماني درجات، فالفرق $3 + 8 = 11$ درجة.
    أي $8 - (-3) = 11$ ، وليس $8 - 3 = 5$.
  remediation: |
    استعمل مقياس الحرارة لتوضيح أن المسافة بين عددين على جانبي الصفر تساوي مجموع بعديهما عن الصفر.
  misconceptions: [ignore-negative-sign]
  qatar_link: "الصف السابع — الدرس 1-4"
