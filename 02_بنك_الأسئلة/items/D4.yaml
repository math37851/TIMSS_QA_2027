  context: real
  time: 50
  stem: |
    في سحب مدرسي وُضعت في صندوق 12 بطاقة مرقمة من $1$ إلى $12$، وسُحبت بطاقة واحدة عشوائياً.
    ما احتمال أن يكون العدد على البطاقة أقل من $9$؟
  options: ['$\frac{1}{3}$', '$\frac{1}{2}$', '$\frac{2}{3}$', '$\frac{3}{4}$']
  option_values: ["1/3", "1/2", "2/3", "3/4"]
  key: C
  verify: "Rational(len([n for n in range(1, 13) if n < 9]), 12)"
  rationale:
    A: 'حسب احتمال الحدث المعاكس (البطاقات من $9$ إلى $12$) فكتب $\frac{4}{12}$.'
    B: 'ظن أن الحدث إما أن يقع وإما لا يقع فتتساوى الفرص.'
    D: 'عدّ البطاقة $9$ ضمن المرغوب مع أن $9$ ليست أقل من $9$.'
  solution: |
    عدد البطاقات الممكنة $12$، وكلها متساوية الفرص.
    البطاقات التي عليها عدد أقل من $9$ هي $1, 2, 3, 4, 5, 6, 7, 8$، وعددها $8$.
    الاحتمال $= \frac{8}{12} = \frac{2}{3}$.
  remediation: |
    اطلب كتابة أعداد البطاقات كلها ثم وضع دائرة حول المرغوب منها.
    ذكّر بأن «أقل من $9$» لا تشمل العدد $9$ نفسه.
  misconceptions: [wrong-event, equiprobability-bias, strict-vs-inclusive-inequality]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-008
  topic: D4
  cognitive: applying
  area: implement
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: real
  time: 60
  stem: |
    في لعبة بمعرض مدرسي أدار طلال مؤشر الدوّارة الموضحة. نسبة مساحات القطاعات $A : B : C : D$ هي $1 : 2 : 2 : 3$، ويتوقف المؤشر عند كل قطاع بفرصة تتناسب مع مساحته.
    ما احتمال أن يتوقف المؤشر عند القطاع $A$ أو القطاع $B$؟
  figure: {type: spinner, sectors: [{label: 'A', weight: 1}, {label: 'B', weight: 2}, {label: 'C', weight: 2}, {label: 'D', weight: 3}], alt: "دوّارة من أربعة قطاعات مساحاتها بنسبة 1 إلى 2 إلى 2 إلى 3"}
  options: ['$\frac{3}{8}$', '$\frac{1}{2}$', '$\frac{3}{5}$', '$\frac{5}{8}$']
  option_values: ["3/8", "1/2", "3/5", "5/8"]
  key: A
  verify: "Rational(1 + 2, 1 + 2 + 2 + 3)"
  rationale:
    B: 'عدّ القطاعين من أصل أربعة قطاعات كأنها متساوية الفرص.'
    C: 'قارن جزأي القطاعين ($1 + 2 = 3$) بباقي الأجزاء ($2 + 3 = 5$) فكتب $\frac{3}{5}$.'
    D: 'حسب احتمال القطاعين $C$ و$D$ بدلاً من $A$ و$B$.'
  solution: |
    مجموع الأجزاء $= 1 + 2 + 2 + 3 = 8$، فكأن الدوّارة مقسمة إلى $8$ أجزاء متساوية.
    القطاع $A$ يشغل جزءاً واحداً والقطاع $B$ يشغل جزأين.
    الاحتمال $= \frac{1 + 2}{8} = \frac{3}{8}$.
  remediation: |
    عندما تختلف مساحات القطاعات لا تتساوى الفرص.
    اقسم الدوّارة ذهنياً إلى $8$ أجزاء متطابقة ثم عدّ أجزاء القطاعين المطلوبين.
  misconceptions: [equiprobability-bias, part-part-vs-part-whole, wrong-event]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-009
  topic: D4
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: high
  format: numeric
  context: real
  time: 80
  stem: |
    رمت منى حجر نرد عادياً عدة مرات، وسجلت في الجدول عدد مرات ظهور كل عدد (بيانات افتراضية).
    ما الاحتمال التجريبي لظهور عدد زوجي؟ اكتب الإجابة كسراً أو عدداً عشرياً.
  table:
    headers: ['العدد الظاهر', 'عدد المرات']
    rows: [['1', '7'], ['2', '9'], ['3', '8'], ['4', '10'], ['5', '6'], ['6', '10']]
    row_headers: true
  answer: {value: 0.58, allow_fraction: true, accept: ["29/50"]}
  verify: "Rational(9 + 10 + 10, 7 + 9 + 8 + 10 + 6 + 10)"
  solution: |
    عدد مرات الرمي الكلي $= 7 + 9 + 8 + 10 + 6 + 10 = 50$.
    الأعداد الزوجية $2$ و$4$ و$6$ ظهرت $9 + 10 + 10 = 29$ مرة.
    الاحتمال التجريبي $= \frac{29}{50} = 0.58$.
  remediation: |
    الاحتمال التجريبي = عدد مرات وقوع الحدث ÷ عدد المحاولات الكلي، ويُحسب من نتائج التجربة لا من عدد أوجه النرد.
    قارن النتيجة بالاحتمال النظري $\frac{1}{2}$ ولاحظ أنهما متقاربان لكنهما غير متساويين.
  misconceptions: [theoretical-instead-of-experimental, part-part-vs-part-whole]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-010
  topic: D4
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: high
  format: numeric
  context: qatar
  time: 75
  stem: |
    في تدريبات دوري مدارس الدوحة لكرة القدم، سجّل لاعب 18 هدفاً من 24 ركلة ترجيح (بيانات افتراضية).
    إذا استمر اللاعب بالمستوى نفسه، فكم هدفاً يُتوقع أن يسجل في 40 ركلة ترجيح؟
  answer: {value: 30, unit: 'هدفاً', allow_fraction: true}
  verify: "Rational(18, 24) * 40"
  solution: |
    الاحتمال التجريبي لتسجيل هدف $= \frac{18}{24} = \frac{3}{4}$.
    العدد المتوقع في $40$ ركلة $= \frac{3}{4} \times 40 = 30$ هدفاً.
  remediation: |
    العدد المتوقع = الاحتمال × عدد المحاولات.
    تجنّب الجمع: زيادة عدد الركلات بمقدار $16$ لا تعني زيادة الأهداف بمقدار $16$.
  misconceptions: [additive-scaling, operation-confusion]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-011
  topic: D4
  cognitive: applying
  area: represent
  difficulty: medium
  benchmark: high
  format: mc
  context: qatar
  time: 80
  stem: |
    في فعالية تعريفية بمترو الدوحة، يدير سالم دوّارة بثلاثة قطاعات متطابقة بألوان الخطوط: الأحمر والأخضر والذهبي، ثم يرمي قطعة نقود (صورة أو كتابة).
    أي قائمة تمثل فضاء العينة (جميع النواتج الممكنة) لهذه التجربة؟
  figure: {type: spinner, sectors: [{label: 'أحمر', weight: 1, color: '#C0392B'}, {label: 'أخضر', weight: 1, color: '#3C8D40'}, {label: 'ذهبي', weight: 1, color: '#C2A649', text_color: '#1F2A3C'}], alt: "دوّارة من ثلاثة قطاعات متطابقة: أحمر وأخضر وذهبي"}
  options:
    - '6 نواتج: (أحمر، صورة)، (أحمر، كتابة)، (أخضر، صورة)، (أخضر، كتابة)، (ذهبي، صورة)، (ذهبي، كتابة)'
    - '5 نواتج: أحمر، أخضر، ذهبي، صورة، كتابة'
    - '3 نواتج: أحمر، أخضر، ذهبي'
    - '4 نواتج: (أحمر، صورة)، (أحمر، كتابة)، (أخضر، صورة)، (ذهبي، كتابة)'
  key: A
  verify: "len([(a, b) for a in range(3) for b in range(2)]) == 6"
  rationale:
    B: 'جمع عدد نواتج الدوّارة وعدد نواتج القطعة ($3 + 2 = 5$) بدلاً من تكوين الأزواج.'
    C: 'اكتفى بنواتج الدوّارة وأهمل نواتج القطعة.'
    D: 'كوّن أزواجاً ناقصة ونسي بعض التوافيق.'
  solution: |
    لكل ناتج من نواتج الدوّارة الثلاثة يوجد ناتجان للقطعة (صورة أو كتابة).
    عدد النواتج الكلي $= 3 \times 2 = 6$.
    القائمة الصحيحة هي التي تضم الأزواج الستة كلها.
  remediation: |
    ارسم جدولاً صفوفه نواتج الدوّارة وأعمدته نواتج القطعة؛ كل خانة تمثل ناتجاً واحداً.
    عدد الخانات هو عدد النواتج الممكنة.
  misconceptions: [operation-confusion, incomplete-sample-space]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

