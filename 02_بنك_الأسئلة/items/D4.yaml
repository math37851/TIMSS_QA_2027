- id: M8-D4-013
  topic: D4
  cognitive: applying
  area: formulate
  difficulty: medium
  benchmark: high
  format: numeric
  context: real
  time: 90
  stem: |
    في مكتبة المدرسة صندوق فيه كتب قصصية وعلمية وتاريخية فقط، وسُحب منه كتاب واحد عشوائياً.
    احتمال أن يكون الكتاب قصصياً $0.4$، واحتمال أن يكون علمياً يساوي ثلاثة أمثال احتمال أن يكون تاريخياً.
    ما احتمال أن يكون الكتاب تاريخياً؟ اكتب الإجابة كسراً أو عدداً عشرياً.
  hint: 'مجموع احتمالات جميع النواتج الممكنة يساوي $1$.'
  answer: {value: 0.15, allow_fraction: true, accept: ["3/20"]}
  verify: "solve(Eq(Rational(2, 5) + 4 * x, 1), x)[0]"
  solution: |
    ليكن احتمال أن يكون الكتاب تاريخياً $p$، فيكون احتمال أن يكون علمياً $3p$.
    مجموع احتمالات الأنواع الثلاثة يساوي $1$: $0.4 + 3p + p = 1$.
    $4p = 0.6$، إذن $p = 0.15$ أي $\frac{3}{20}$.
  remediation: |
    اكتب النموذج: مجموع الاحتمالات $= 1$، وعبّر عن الاحتمالين المجهولين بمتغير واحد ($p$ و$3p$).
    ثم حلّ المعادلة وتحقق: $0.4 + 0.45 + 0.15 = 1$.
  misconceptions: [divide-by-wrong-count, wrong-event]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-014
  topic: D4
  cognitive: applying
  area: formulate
  difficulty: hard
  benchmark: advanced
  format: mc
  context: real
  time: 120
  stem: |
    في كيس 6 كرات حمراء و4 كرات زرقاء، جميعها متماثلة عدا اللون.
    أضافت ليلى $x$ كرة حمراء إلى الكيس حتى أصبح احتمال سحب كرة حمراء يساوي $\frac{3}{4}$.
    أي معادلة تصلح لإيجاد $x$؟
  figure: {type: bag, counts: {"أحمر": 6, "أزرق": 4}, per_row: 5, alt: "كيس فيه 6 كرات حمراء و4 كرات زرقاء"}
  options: ['$\frac{6 + x}{10} = \frac{3}{4}$', '$\frac{6 + x}{10 + x} = \frac{3}{4}$', '$\frac{6}{10 + x} = \frac{3}{4}$', '$\frac{6 + x}{4} = \frac{3}{4}$']
  key: B
  verify: "solve(Eq((6 + x)/(10 + x), Rational(3, 4)), x) == [6] and Rational(6 + 6, 10) != Rational(3, 4) and Rational(6, 10 + 6) != Rational(3, 4) and Rational(6 + 6, 4) != Rational(3, 4)"
  rationale:
    A: 'أضاف $x$ إلى عدد الكرات الحمراء ونسي أن عدد الكرات الكلي يزيد أيضاً فيصبح $10 + x$.'
    C: 'أضاف $x$ إلى عدد الكرات الكلي فقط ونسي أن عدد الكرات الحمراء يزيد أيضاً.'
    D: 'قسم عدد الكرات الحمراء على عدد الكرات الزرقاء (نسبة جزء إلى جزء) بدلاً من عدد الكرات الكلي.'
  solution: |
    بعد الإضافة يصبح عدد الكرات الحمراء $6 + x$، وعدد الكرات الكلي $10 + x$.
    الاحتمال $= \frac{6 + x}{10 + x}$، ويجب أن يساوي $\frac{3}{4}$.
    المعادلة الصحيحة: $\frac{6 + x}{10 + x} = \frac{3}{4}$، وحلها $x = 6$ (تحقق: $\frac{12}{16} = \frac{3}{4}$).
  remediation: |
    قبل كتابة المعادلة حدّد ما يتغير بعد الإضافة: البسط (الكرات الحمراء) والمقام (الكرات الكلية) معاً.
    جرّب كل معادلة بتعويض $x = 6$ لترى أيها يعطي $\frac{3}{4}$.
  misconceptions: [total-not-updated, favorable-not-updated, part-part-vs-part-whole]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-015
  topic: D4
  cognitive: applying
  area: implement
  difficulty: hard
  benchmark: advanced
  format: dragdrop_order
  context: pure
  time: 150
  stem: |
    رُمي حجرا نرد عاديان معاً، وجُمع العددان الظاهران.
    رتّب الأحداث الآتية من الأقل احتمالاً إلى الأكثر احتمالاً.
  hint: 'ارسم جدولاً $6 \times 6$ لمجاميع العددين الظاهرين، ثم عدّ الخانات المناسبة لكل حدث.'
  # value = الاحتمال (العدد المناسب من 36 ÷ 36): 1 ، 3 ، 6 ، 18 ، 30
  cards:
    - {id: s12, text: 'المجموع يساوي $12$', value: 0.0278}
    - {id: s4, text: 'المجموع يساوي $4$', value: 0.0833}
    - {id: s7, text: 'المجموع يساوي $7$', value: 0.1667}
    - {id: even, text: 'المجموع عدد زوجي', value: 0.5}
    - {id: gt4, text: 'المجموع أكبر من $4$', value: 0.8333}
  key: [s12, s4, s7, even, gt4]
  direction: asc
  order_labels: ['الأقل احتمالاً', 'الأكثر احتمالاً']
  verify: "[len([1 for a in range(1, 7) for b in range(1, 7) if a + b == 12]), len([1 for a in range(1, 7) for b in range(1, 7) if a + b == 4]), len([1 for a in range(1, 7) for b in range(1, 7) if a + b == 7]), len([1 for a in range(1, 7) for b in range(1, 7) if (a + b) % 2 == 0]), len([1 for a in range(1, 7) for b in range(1, 7) if a + b > 4])] == [1, 3, 6, 18, 30]"
  solution: |
    عدد النواتج الممكنة عند رمي حجري نرد $= 6 \times 6 = 36$ ناتجاً متساوي الفرص.
    المجموع $12$: ناتج واحد هو $(6, 6)$، فالاحتمال $\frac{1}{36}$.
    المجموع $4$: النواتج $(1, 3)$ و$(2, 2)$ و$(3, 1)$، فالاحتمال $\frac{3}{36}$.
    المجموع $7$: ستة نواتج، فالاحتمال $\frac{6}{36}$.
    المجموع الزوجي: $18$ ناتجاً، فالاحتمال $\frac{18}{36}$.
    المجموع الأكبر من $4$: المجاميع $2$ و$3$ و$4$ لها $1 + 2 + 3 = 6$ نواتج، فيبقى $30$ ناتجاً والاحتمال $\frac{30}{36}$.
    الترتيب: المجموع $12$ ثم $4$ ثم $7$ ثم الزوجي ثم الأكبر من $4$.
  remediation: |
    كوّن جدول النواتج $6 \times 6$ ولوّن الخانات المطلوبة لكل حدث.
    ناقش: المجاميع ليست متساوية الفرص؛ فالمجموع $7$ أكثر احتمالاً من المجموع $12$ لأن له نواتج أكثر.
  misconceptions: [equiprobability-bias, wrong-event]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-016
  topic: D4
  cognitive: reasoning
  area: analyze
  difficulty: medium
  benchmark: high
  format: mc
  context: real
  time: 90
  stem: |
    في معرض مدرسي يريد عامر سحب كرة حمراء ليفوز بجائزة. أمامه كيسان فيهما كرات حمراء وزرقاء فقط، وجميعها متماثلة عدا اللون.
    يسحب كرة واحدة عشوائياً من أحد الكيسين.
    من أي كيس تكون فرصة سحب كرة حمراء أكبر؟
  table:
    headers: ['الكيس', 'كرات حمراء', 'كرات زرقاء']
    rows: [['$X$', '3', '5'], ['$Y$', '4', '8']]
    row_headers: true
  options:
    - 'الكيس $Y$؛ لأن عدد الكرات الحمراء فيه أكبر'
    - 'الفرصة متساوية؛ لأن في كل كيس كرات حمراء وزرقاء'
    - 'الكيس $Y$؛ لأن $\frac{4}{12}$ أكبر من $\frac{3}{8}$'
    - 'الكيس $X$؛ لأن $\frac{3}{8}$ أكبر من $\frac{4}{12}$'
  key: D
  verify: "Rational(3, 3 + 5) > Rational(4, 4 + 8) and 3 < 4"
  rationale:
    A: 'قارن عدد الكرات الحمراء فقط ولم ينسبه إلى عدد الكرات الكلي في كل كيس.'
    B: 'ظن أن اللونين متساويا الفرص في كل كيس مهما اختلفت أعدادهما.'
    C: 'قارن الكسرين بصورة خاطئة (نظر إلى البسط أو المقام فقط) وعدّ $\frac{4}{12}$ أكبر.'
  solution: |
    الكيس $X$: عدد الكرات الكلي $= 3 + 5 = 8$، والاحتمال $\frac{3}{8} = \frac{9}{24}$.
    الكيس $Y$: عدد الكرات الكلي $= 4 + 8 = 12$، والاحتمال $\frac{4}{12} = \frac{8}{24}$.
    بما أن $\frac{9}{24} > \frac{8}{24}$ فالفرصة أكبر في الكيس $X$، رغم أن عدد الكرات الحمراء فيه أقل.
  remediation: |
    الاحتمال يعتمد على نسبة الكرات الحمراء إلى عدد الكرات الكلي وليس على عددها وحده.
    قارن الاحتمالين بتوحيد المقامين أو بتحويلهما إلى عددين عشريين ($0.375$ و$0.33$ تقريباً).
  misconceptions: [compare-one-quantity, equiprobability-bias]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-017
  topic: D4
  cognitive: reasoning
  area: analyze
  difficulty: medium
  benchmark: high
  format: dragdrop_categorize
  context: qatar
  time: 120
  stem: |
    في ركن الألعاب بكتارا تُلعب كل لعبة بين لاعبين، ولكل لاعب قاعدة للفوز. أحجار النرد كلها عادية (أوجهها من $1$ إلى $6$).
    صنّف كل لعبة: عادلة (احتمال الفوز متساوٍ للاعبين) أو غير عادلة.
  categories: ['عادلة', 'غير عادلة']
  cards:
    - {id: g1, text: 'نرد: يفوز سالم بعدد زوجي، ويفوز ماجد بعدد فردي'}
    - {id: g2, text: 'نرد: يفوز سالم بالعدد $6$، ويفوز ماجد بأي عدد آخر'}
    - {id: g3, text: 'دوّارة من $8$ قطاعات متطابقة (4 حمراء و4 زرقاء): تفوز سارة بالأحمر وتفوز نورة بالأزرق'}
    - {id: g4, text: 'دوّارة من $3$ قطاعات متطابقة (حمراء وزرقاء وخضراء): تفوز سارة بالأحمر وتفوز نورة بالأزرق أو الأخضر'}
    - {id: g5, text: 'نرد: يفوز سالم بعدد أقل من $4$، ويفوز ماجد بعدد أكبر من $3$'}
    - {id: g6, text: 'نرد: يفوز سالم بعدد أقل من $3$، ويفوز ماجد بعدد أكبر من $3$'}
  key: {g1: 'عادلة', g2: 'غير عادلة', g3: 'عادلة', g4: 'غير عادلة', g5: 'عادلة', g6: 'غير عادلة'}
  verify: "len([n for n in range(1, 7) if n % 2 == 0]) == len([n for n in range(1, 7) if n % 2 == 1]) and len([n for n in range(1, 7) if n == 6]) != len([n for n in range(1, 7) if n != 6]) and 4 == 8 - 4 and Rational(1, 3) != Rational(2, 3) and len([n for n in range(1, 7) if n < 4]) == len([n for n in range(1, 7) if n > 3]) and len([n for n in range(1, 7) if n < 3]) != len([n for n in range(1, 7) if n > 3])"
  solution: |
    اللعبة عادلة إذا تساوى احتمالا فوز اللاعبين.
    زوجي أو فردي: $\frac{3}{6}$ لكل لاعب، فاللعبة عادلة.
    العدد $6$ أو أي عدد آخر: $\frac{1}{6}$ و$\frac{5}{6}$، فاللعبة غير عادلة.
    دوّارة فيها $4$ حمراء و$4$ زرقاء من $8$: $\frac{4}{8}$ لكل لاعبة، فاللعبة عادلة.
    دوّارة بثلاثة قطاعات: $\frac{1}{3}$ و$\frac{2}{3}$، فاللعبة غير عادلة.
    أقل من $4$ مقابل أكبر من $3$: $\frac{3}{6}$ لكل لاعب، فاللعبة عادلة.
    أقل من $3$ مقابل أكبر من $3$: $\frac{2}{6}$ و$\frac{3}{6}$، فاللعبة غير عادلة.
  remediation: |
    لكل لعبة اكتب احتمال فوز كل لاعب ككسر ثم قارن بينهما.
    كون اللاعبين اثنين لا يعني أن فرصتيهما متساويتان، والعدد الذي لا يفوز به أحد (مثل $3$) يُعدّ ضمن النواتج الممكنة.
  misconceptions: [equiprobability-bias, strict-vs-inclusive-inequality]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-018
  topic: D4
  cognitive: reasoning
  area: generalize
  difficulty: hard
  benchmark: advanced
  format: mc
  context: pure
  time: 120
  stem: |
    يبيّن الجدول عدد النواتج الممكنة عند رمي قطعة نقود عادلة عدة مرات.
    رُميت القطعة $n$ مرة. ما احتمال أن تظهر الصورة في جميع الرميات؟
  table:
    headers: ['عدد الرميات', 'عدد النواتج الممكنة']
    rows: [['1', '2'], ['2', '4'], ['3', '8']]
    row_headers: true
  options: ['$\frac{1}{2n}$', '$\frac{1}{n^2}$', '$\frac{1}{2^n}$', '$\frac{n}{2}$']
  key: C
  verify: "len([1 for a in range(2)]) == 2 and len([1 for a in range(2) for b in range(2)]) == 4 and len([1 for a in range(2) for b in range(2) for c in range(2)]) == 8 and Rational(1, 2 ** 4) == Rational(1, len([1 for a in range(2) for b in range(2) for c in range(2) for d in range(2)])) and Rational(1, 2 * 3) != Rational(1, 8) and Rational(1, 3 ** 2) != Rational(1, 8) and Rational(3, 2) != Rational(1, 8)"
  rationale:
    A: 'لاحظ أن عدد النواتج $2$ ثم $4$ فاعتبره $2n$، لكن العدد يتضاعف ويصبح $8$ عند $n = 3$ وليس $6$.'
    B: 'ربط عدد النواتج بمربع عدد الرميات، وهذا لا يصح عند $n = 1$ لأنه يعطي $\frac{1}{1}$.'
    D: 'جمع احتمالات الرميات ($\frac{1}{2}$ مكررة $n$ مرة) بدلاً من ضربها، فحصل على قيمة قد تتجاوز $1$.'
  solution: |
    في كل رمية يوجد ناتجان ممكنان، لذلك يتضاعف عدد النواتج مع كل رمية: $2, 4, 8, \ldots$
    عند رمي القطعة $n$ مرة يكون عدد النواتج $2^n$ وجميعها متساوية الفرص.
    ناتج واحد فقط يحقق «صورة في جميع الرميات».
    الاحتمال $= \frac{1}{2^n}$.
  remediation: |
    اكتب نواتج رميتين ثم ثلاث رميات بجدول أو شجرة، وانتبه إلى أن كل رمية جديدة تضاعف عدد النواتج.
    تحقق من كل صيغة بتعويض $n = 1$ و$n = 2$ و$n = 3$ ومقارنتها بعدد النواتج المعروف.
  misconceptions: [power-as-multiplication, constant-difference-assumption, operation-confusion]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-019
  topic: D4
  cognitive: reasoning
  area: justify
  difficulty: medium
  benchmark: high
  format: select_explain
  context: real
  time: 90
  stem: |
    رمى حازم قطعة نقود عادلة 5 مرات فظهرت الصورة في الرميات الخمس كلها.
    قال حازم: «في الرمية السادسة تكون الكتابة أكثر احتمالاً من الصورة، لأن الصورة ظهرت كثيراً».
    هل حازم على صواب؟ اختر الإجابة ثم برّر بحساب الاحتمال.
  options: ['نعم، حازم على صواب', 'لا، حازم ليس على صواب']
  key: B
  points: 1
  rubric:
    full: 'يختار «لا»، ويبرّر بأن الرميات مستقلة وأن احتمال الصورة في الرمية السادسة ما زال $\frac{1}{2}$ ويساوي احتمال الكتابة $\frac{1}{2}$ (أو $50\%$)، فالقطعة لا تتأثر بنتائج الرميات السابقة.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تبرير صحيح (مثل: «لأن الحظ يتغير» أو ذكر احتمال دون ربطه بالرمية السادسة)، أو يبرّر باحتمال ظهور خمس صور متتالية دون مقارنة الصورة بالكتابة في الرمية السادسة.'
    examples:
      correct:
        - 'لا؛ احتمال الكتابة في الرمية السادسة $\frac{1}{2}$ مثل احتمال الصورة تماماً، فالرميات السابقة لا تؤثر.'
        - 'لا؛ في كل رمية احتمال الصورة $50\%$ واحتمال الكتابة $50\%$.'
      incorrect:
        - 'نعم؛ لأن الصورة ظهرت 5 مرات فلا بد أن تظهر الكتابة.'
        - 'لا؛ لأن حازم لا يعرف النتيجة مسبقاً.'
  verify: "Rational(1, 2) == 1 - Rational(1, 2) and Rational(1, 2) ** 5 == Rational(1, 32)"
  solution: |
    الرميات مستقلة؛ فالقطعة لا «تتذكر» نتائج الرميات السابقة.
    في الرمية السادسة: احتمال الصورة $= \frac{1}{2}$، واحتمال الكتابة $= 1 - \frac{1}{2} = \frac{1}{2}$.
    الاحتمالان متساويان، فحازم ليس على صواب.
    ظهور 5 صور متتالية نادر (احتماله $\left(\frac{1}{2}\right)^5 = \frac{1}{32}$)، لكنه حدث بالفعل ولا يغيّر احتمال الرمية التالية.
  remediation: |
    نفّذ التجربة عملياً: ارمِ قطعة نقود مرات كثيرة وسجّل نتيجة الرمية التي تلي كل ثلاث صور متتالية.
    قارن التكرار النسبي للكتابة بالقيمة $\frac{1}{2}$، وناقش لماذا لا «تعوّض» الكتابة عن الصور السابقة.
  misconceptions: [gamblers-fallacy]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-020
  topic: D4
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: advanced
  format: select_explain
  context: real
  time: 150
  stem: |
    في كل جولة من لعبة بين ماهر ولينا يُرمى حجرا نرد عاديان معاً، ثم يُضرب العددان الظاهران.
    يحصل ماهر على نقطة إذا كان حاصل الضرب فردياً، وتحصل لينا على نقطة إذا كان زوجياً.
    قالت لينا: «اللعبة عادلة، لأن حاصل الضرب إما فردي وإما زوجي».
    هل اللعبة عادلة؟ اختر الإجابة ثم برّر بحساب احتمال كل لاعب.
  options: ['لا، اللعبة غير عادلة', 'نعم، اللعبة عادلة']
  key: A
  points: 1
  rubric:
    full: 'يختار «لا»، ويبرّر بحساب الاحتمالين: حاصل الضرب فردي فقط عندما يكون العددان فرديين، أي $3 \times 3 = 9$ نواتج من $36$، فاحتمال ماهر $\frac{9}{36} = \frac{1}{4}$ واحتمال لينا $\frac{27}{36} = \frac{3}{4}$؛ فحظ لينا أكبر بثلاثة أضعاف.'
    zero: 'يختار «نعم»، أو يختار «لا» دون حساب صحيح للاحتمالين (مثل: «لأن الزوجي أكثر» دون أرقام)، أو بحساب خاطئ.'
    examples:
      correct:
        - 'لا؛ احتمال الفردي $\frac{9}{36} = \frac{1}{4}$ واحتمال الزوجي $\frac{27}{36} = \frac{3}{4}$.'
        - 'لا؛ الفردي يحتاج عددين فرديين: $3 \times 3 = 9$ من $36$ ناتجاً، والباقي $27$ ناتجاً زوجي.'
      incorrect:
        - 'نعم؛ لأن الناتج إما فردي وإما زوجي فالفرصة $50\%$ لكل منهما.'
        - 'لا؛ لأن الزوجي أكثر.'
  verify: "len([1 for a in range(1, 7) for b in range(1, 7) if (a * b) % 2 == 1]) == 9 and len([1 for a in range(1, 7) for b in range(1, 7) if (a * b) % 2 == 0]) == 27"
  solution: |
    عدد النواتج الممكنة لحجري نرد $= 6 \times 6 = 36$.
    حاصل الضرب يكون فردياً فقط إذا كان العددان فرديين: $3$ اختيارات لكل حجر، أي $3 \times 3 = 9$ نواتج.
    احتمال ماهر $= \frac{9}{36} = \frac{1}{4}$، واحتمال لينا $= 1 - \frac{1}{4} = \frac{3}{4}$.
    الاحتمالان غير متساويين، فاللعبة غير عادلة.
  remediation: |
    ارسم جدولاً $6 \times 6$ لحاصل ضرب العددين وعدّ الخانات الفردية والزوجية.
    كون النتيجة من نوعين (فردي أو زوجي) لا يعني أن احتماليهما متساويان.
  misconceptions: [equiprobability-bias]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-021
  topic: D4
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: advanced
  format: cr_explain
  context: qatar
  time: 240
  stem: |
    في ركن ألعاب بسوق واقف دوّارة مقسمة إلى 4 قطاعات متطابقة: أحمر وأزرق وأخضر وذهبي.
    يقول مشرف اللعبة إن احتمال أن يتوقف المؤشر عند الأحمر يساوي $\frac{1}{4}$.
    أدارت ريم الدوّارة عدة مرات ودوّنت في الجدول عدد مرات توقف المؤشر عند الأحمر (بيانات افتراضية).
    أولاً: احسب الاحتمال التجريبي للأحمر في كل تجربة.
    ثانياً: هل تدعم النتائج قول المشرف؟ فسّر إجابتك بمقارنة الاحتمال التجريبي بالاحتمال النظري عند زيادة عدد الدورات.
  figure: {type: spinner, sectors: [{label: 'أحمر', weight: 1, color: '#C0392B'}, {label: 'أزرق', weight: 1, color: '#1F5FAD'}, {label: 'أخضر', weight: 1, color: '#3C8D40'}, {label: 'ذهبي', weight: 1, color: '#C2A649', text_color: '#1F2A3C'}], alt: "دوّارة من أربعة قطاعات متطابقة: أحمر وأزرق وأخضر وذهبي"}
  table:
    headers: ['عدد الدورات', 'مرات توقف المؤشر عند الأحمر']
    rows: [['20', '9'], ['200', '54'], ['1000', '247']]
    row_headers: true
  points: 2
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يحسب الاحتمالات التجريبية الثلاثة بصورة صحيحة ($0.45$ و$0.27$ و$0.247$ أو ما يكافئها)، ويستنتج أن النتائج تدعم قول المشرف، ويفسر ذلك بأن الاحتمال التجريبي يقترب من الاحتمال النظري $0.25$ كلما زاد عدد الدورات، وأن نتيجة 20 دورة وحدها لا تكفي للحكم.'}
      - {code: 10, points: 1, desc: 'يحسب قيمتين على الأقل من الاحتمالات الثلاثة بصورة صحيحة، لكن الاستنتاج أو التفسير ناقص أو غير صحيح (مثل: يكتفي بتجربة واحدة، أو لا يقارن بالاحتمال النظري، أو لا يربط الاقتراب بزيادة عدد الدورات)؛ أو يقدم استنتاجاً وتفسيراً صحيحين مع خطأ حسابي في قيمة واحدة.'}
      - {code: 70, points: 0, desc: 'أقل من قيمتين صحيحتين دون تفسير صحيح، أو استنتاج خاطئ دون حساب (مثل: الدوّارة غير عادلة لأن $0.45$ تختلف عن $0.25$).'}
    examples:
      correct:
        - '$\frac{9}{20} = 0.45$ و$\frac{54}{200} = 0.27$ و$\frac{247}{1000} = 0.247$. كلما زاد عدد الدورات اقترب الاحتمال التجريبي من $0.25$، فالنتائج تدعم قول المشرف، أما $20$ دورة فقليلة وتتأثر بالصدفة.'
      incorrect:
        - 'الاحتمال التجريبي $0.45$ بعيد عن $0.25$، فالمشرف مخطئ.'
        - 'النتائج لا تساوي $0.25$ تماماً في أي تجربة، لذلك لا تدعم القول.'
  model_answer: |
    الاحتمال النظري للأحمر $= \frac{1}{4} = 0.25$.
    الاحتمال التجريبي: $\frac{9}{20} = 0.45$ ثم $\frac{54}{200} = 0.27$ ثم $\frac{247}{1000} = 0.247$.
    الفرق عن $0.25$ يتناقص: $0.20$ ثم $0.02$ ثم $0.003$.
    نعم، تدعم النتائج قول المشرف؛ فعدد قليل من الدورات (20) يتأثر بالصدفة، وكلما زاد عدد الدورات اقترب الاحتمال التجريبي من الاحتمال النظري $0.25$.
  verify: "Rational(9, 20) == Rational(45, 100) and Rational(54, 200) == Rational(27, 100) and abs(Rational(9, 20) - Rational(1, 4)) > abs(Rational(54, 200) - Rational(1, 4)) > abs(Rational(247, 1000) - Rational(1, 4))"
  solution: |
    الاحتمال النظري للأحمر $= \frac{1}{4} = 0.25$ لأن القطاعات الأربعة متطابقة.
    الاحتمال التجريبي لكل تجربة = عدد مرات الأحمر ÷ عدد الدورات:
    $\frac{9}{20} = 0.45$ و$\frac{54}{200} = 0.27$ و$\frac{247}{1000} = 0.247$.
    فرق كل قيمة عن $0.25$ هو $0.20$ ثم $0.02$ ثم $0.003$، وهو يتناقص مع زيادة عدد الدورات.
    إذن النتائج تدعم قول المشرف: الاحتمال التجريبي يقترب من الاحتمال النظري كلما زادت المحاولات.
  remediation: |
    درّب الطلبة على حساب التكرار النسبي لكل عدد من الدورات ثم مقارنة الفرق عن الاحتمال النظري.
    ناقش: لماذا لا نحكم على عدالة لعبة من عدد قليل من المحاولات؟ وماذا يحدث عند زيادة عدد المحاولات؟
  misconceptions: [examples-prove-general, experimental-must-equal-theoretical]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"
