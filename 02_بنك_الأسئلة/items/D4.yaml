- id: M8-D4-002
  topic: D4
  cognitive: knowing
  area: recall
  difficulty: foundation
  benchmark: low
  format: mc
  context: pure
  time: 30
  stem: |
    أي قيمة مما يأتي يمكن أن تكون احتمال وقوع حدث؟
  options: ['$-0.2$', '$\frac{5}{4}$', '$120\%$', '$\frac{7}{10}$']
  option_values: ["-1/5", "5/4", "6/5", "7/10"]
  key: D
  verify: "(0 <= Rational(7, 10) <= 1) and len([v for v in [Rational(-1, 5), Rational(5, 4), Rational(6, 5), Rational(7, 10)] if 0 <= v <= 1]) == 1"
  rationale:
    A: 'ظن أن الاحتمال قد يكون سالباً، مع أن أصغر قيمة للاحتمال هي $0$.'
    B: 'الكسر $\frac{5}{4} = 1.25$ أكبر من $1$، وأكبر قيمة للاحتمال هي $1$.'
    C: 'النسبة $120\%$ أكبر من $100\%$، فلا تمثل احتمالاً.'
  solution: |
    الاحتمال عدد بين $0$ و$1$ (أو بين $0\%$ و$100\%$): $0$ للحدث المستحيل و$1$ للحدث المؤكد.
    القيمة $-0.2$ أقل من $0$، والقيمتان $\frac{5}{4} = 1.25$ و$120\% = 1.2$ أكبر من $1$.
    القيمة $\frac{7}{10} = 0.7$ وحدها تقع بين $0$ و$1$.
  remediation: |
    مثّل مقياس الاحتمال على خط أعداد من $0$ (مستحيل) إلى $1$ (مؤكد)، وضع عليه القيم المقترحة.
    ناقش: هل يوجد حدث أكثر من «مؤكد» أو أقل من «مستحيل»؟
  misconceptions: [probability-outside-zero-one]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-003
  topic: D4
  cognitive: knowing
  area: identify
  difficulty: foundation
  benchmark: low
  format: dragdrop_categorize
  context: qatar
  time: 75
  stem: |
    في سحب جوائز احتفال اليوم الوطني وُضعت في صندوق 20 بطاقة مرقمة من $1$ إلى $20$، وسُحبت بطاقة واحدة عشوائياً.
    صنّف كل حدث في الفئة المناسبة.
  categories: ['مستحيل', 'ممكن وغير مؤكد', 'مؤكد']
  cards:
    - {id: c1, text: 'العدد المسحوب أكبر من $0$'}
    - {id: c2, text: 'العدد المسحوب يساوي $25$'}
    - {id: c3, text: 'العدد المسحوب زوجي'}
    - {id: c4, text: 'العدد المسحوب أقل من $21$'}
    - {id: c5, text: 'العدد المسحوب يقبل القسمة على $5$'}
    - {id: c6, text: 'العدد المسحوب سالب'}
  key: {c1: 'مؤكد', c2: 'مستحيل', c3: 'ممكن وغير مؤكد', c4: 'مؤكد', c5: 'ممكن وغير مؤكد', c6: 'مستحيل'}
  verify: "len([n for n in range(1, 21) if n > 0]) == 20 and len([n for n in range(1, 21) if n == 25]) == 0 and 0 < len([n for n in range(1, 21) if n % 2 == 0]) < 20 and len([n for n in range(1, 21) if n < 21]) == 20 and 0 < len([n for n in range(1, 21) if n % 5 == 0]) < 20 and len([n for n in range(1, 21) if n < 0]) == 0"
  solution: |
    البطاقات مرقمة من $1$ إلى $20$. نعدّ البطاقات التي تحقق كل حدث:
    «أكبر من $0$» و«أقل من $21$» تحققهما البطاقات العشرون كلها، فالحدثان مؤكدان.
    «يساوي $25$» و«سالب» لا تحققهما أي بطاقة، فالحدثان مستحيلان.
    «زوجي» تحققه $10$ بطاقات و«يقبل القسمة على $5$» تحققه $4$ بطاقات، فالحدثان ممكنان وغير مؤكدين.
  remediation: |
    اطلب كتابة أعداد البطاقات من $1$ إلى $20$ ثم عدّ البطاقات التي تحقق الحدث:
    صفر بطاقة يعني مستحيلاً، وكل البطاقات يعني مؤكداً، وما بينهما ممكن وغير مؤكد.
  misconceptions: [possible-vs-certain]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-004
  topic: D4
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: qatar
  time: 45
  stem: |
    تتوقع نشرة الطقس أن احتمال هطول المطر في الدوحة غداً يساوي $5\%$ (بيانات افتراضية).
    أي وصف مما يأتي أنسب لهذا الحدث؟
  options: ['مستحيل', 'غير مرجّح', 'متساوي الفرص', 'مرجّح']
  key: B
  verify: "0 < Rational(5, 100) < Rational(1, 2)"
  rationale:
    A: 'ظن أن الاحتمال الصغير يعني الاستحالة، مع أن $5\%$ أكبر من $0\%$.'
    C: 'ظن أن المطر إما أن يهطل وإما لا يهطل، فتتساوى الفرص.'
    D: 'نظر إلى العدد $5$ دون مقارنته بمقياس الاحتمال من $0\%$ إلى $100\%$.'
  solution: |
    $5\% = 0.05$، وهي قيمة قريبة من $0$ وأقل بكثير من $\frac{1}{2}$.
    الحدث ليس مستحيلاً لأن احتماله أكبر من $0$، لكنه غير مرجّح.
  remediation: |
    ضع القيم $0\%$ و$50\%$ و$100\%$ على مقياس مدرّج، ثم حدّد موقع $5\%$ بينها.
    اربط المواقع بالأوصاف: مستحيل، غير مرجّح، متساوي الفرص، مرجّح، مؤكد.
  misconceptions: [unlikely-means-impossible, equiprobability-bias]
  qatar_link: "الاحتمال — الصف السابع، الفصل الثاني (مراجعة)"

- id: M8-D4-005
  topic: D4
  cognitive: knowing
  area: compute
  difficulty: easy
  benchmark: intermediate
  format: numeric
  context: qatar
  time: 60
  stem: |
    في علبة تمور 10 حبات خلاص و8 حبات سكري و7 حبات مجدول، وجميعها متماثلة في الحجم.
    اختار سعيد حبة واحدة عشوائياً دون أن ينظر.
    ما احتمال أن تكون الحبة سكري؟ اكتب الإجابة كسراً أو عدداً عشرياً.
  answer: {value: 0.32, allow_fraction: true, accept: ["8/25"]}
  verify: "Rational(8, 10 + 8 + 7)"
  solution: |
    عدد الحبات الكلي $= 10 + 8 + 7 = 25$، وعدد حبات السكري $8$.
    الاحتمال $= \frac{8}{25}$ أو $0.32$.
  remediation: |
    الاحتمال = عدد النواتج المرغوبة ÷ عدد النواتج الممكنة.
    ابدأ بجمع كل الحبات لإيجاد المقام، ولا تقارن السكري بباقي الأنواع فقط.
