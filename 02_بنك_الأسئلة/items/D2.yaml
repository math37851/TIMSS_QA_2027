- id: M8-D2-015
  topic: D2
  cognitive: reasoning
  area: analyze
  difficulty: medium
  benchmark: high
  format: select_explain
  context: real
  time: 120
  stem: |
    يبيّن مخطط الانتشار عدد متابعي حساب تعليمي (بالآلاف) بعد عدد من الأشهر منذ إنشائه (بيانات افتراضية).
    معادلة خط الاتجاه $y = 5x + 20$، حيث $x$ عدد الأشهر و$y$ عدد المتابعين بالآلاف.
    قال سامي: «الرقم $5$ في المعادلة يعني أن للحساب $5$ آلاف متابع عند إنشائه».
    هل سامي على صواب؟ اختر الإجابة ثم برّر.
  figure:
    type: scatter
    title: "متابعو الحساب التعليمي (بيانات افتراضية)"
    points: [[1, 27], [2, 28], [3, 38], [4, 38], [5, 47], [6, 48], [7, 57], [8, 62], [9, 63], [10, 72]]
    trend: {m: 5, b: 20}
    x_min: 0
    x_max: 10
    x_step: 1
    y_min: 0
    y_max: 80
    y_step: 10
    x_label: "عدد الأشهر منذ الإنشاء"
    y_label: "المتابعون (بالآلاف)"
    width: 520
    height: 340
  options: ['نعم، سامي على صواب', 'لا، سامي ليس على صواب']
  key: B
  points: 1
  verify: "(5 * 3 + 20) - (5 * 2 + 20) == 5 and 5 * 0 + 20 == 20 and 5 != 20"
  rubric:
    full: 'يختار «لا» ويوضح أن $5$ هو ميل خط الاتجاه، أي أن عدد المتابعين المتوقع يزداد بمقدار $5$ آلاف تقريباً مع كل شهر إضافي، وأن عدد المتابعين عند الإنشاء ($x = 0$) هو المقطع $y$ ويساوي $20$ ألفاً.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تفسير صحيح لمعنى الميل أو المقطع $y$ (مثل: «لأن المعادلة غير صحيحة»).'
    examples:
      correct:
        - 'لا؛ $5$ هو الميل أي زيادة المتابعين كل شهر، أما عند الإنشاء فعدد المتابعين $20$ ألفاً.'
        - 'لا؛ عند $x = 0$ تكون $y = 20$ لا $5$، والرقم $5$ يعني زيادة $5$ آلاف متابع كل شهر.'
      incorrect:
        - 'نعم، لأن $5$ هو أول عدد في المعادلة.'
        - 'لا، لأن $5$ أصغر من $20$.'
  solution: |
    في المعادلة $y = mx + b$ يمثّل $m$ الميل، وهو معدل التغير: هنا $m = 5$، أي أن عدد المتابعين المتوقع يزداد $5$ آلاف تقريباً مع كل شهر إضافي.
    أما عدد المتابعين عند الإنشاء فنجده بتعويض $x = 0$: $y = 5 \times 0 + 20 = 20$ ألفاً، وهو المقطع $y$.
    إذن سامي ليس على صواب لأنه خلط بين الميل والمقطع $y$.
  remediation: |
    ميّز بين الميل (التغير في $y$ لكل زيادة $1$ في $x$) والمقطع $y$ (قيمة $y$ عندما $x = 0$).
    اطلب من الطلاب تفسير $m$ و$b$ بجملة تتضمن الوحدات في كل مرة.
  misconceptions: [slope-intercept-confusion]
  qatar_link: "الصف الثامن: الدرس 8-3 (تفسير الميل والمقطع y في النموذج الخطي) والدرس 2-9"

- id: M8-D2-016
  topic: D2
  cognitive: reasoning
