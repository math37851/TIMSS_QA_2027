- id: M8-D2-001
  topic: D2
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: intermediate
  format: mc
  context: qatar
  time: 90
  stem: |
    يبيّن التمثيل بالخطوط عدد ركاب مترو الدوحة (بالآلاف) في أيام أحد الأسابيع.
    بين أيّ يومين متتاليين كانت **الزيادة** في عدد الركاب هي الأكبر؟
  figure:
    type: line
    title: "ركاب مترو الدوحة خلال أسبوع (بيانات افتراضية)"
    x: ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"]
    values: [120, 180, 170, 175, 190, 230, 150]
    y_label: "عدد الركاب (بالآلاف)"
    y_max: 250
    y_step: 50
    width: 560
  options: ["الأربعاء والخميس", "السبت والأحد", "الخميس والجمعة", "الثلاثاء والأربعاء"]
  key: B
  verify: "max([180 - 120, 170 - 180, 175 - 170, 190 - 175, 230 - 190, 150 - 230]) == 180 - 120"
  rationale:
    A: "اختار اليومين اللذين وصل فيهما عدد الركاب إلى أعلى قيمة، لا أكبر زيادة ($+40$ ألفاً فقط)."
    C: "أكبر تغيّر في الرسم لكنه نقصان ($-80$ ألفاً) وليس زيادة."
    D: "الزيادة هنا $+15$ ألفاً فقط."
  solution: |
    نحسب التغير بين كل يومين متتاليين (بالآلاف): السبت→الأحد $+60$، الأحد→الاثنين $-10$، الاثنين→الثلاثاء $+5$،
    الثلاثاء→الأربعاء $+15$، الأربعاء→الخميس $+40$، الخميس→الجمعة $-80$.
    أكبر زيادة هي $+60$ بين السبت والأحد (القطعة الأشد صعوداً).
  remediation: |
    درّب الطلاب على التمييز بين «أعلى قيمة» و«أكبر زيادة»: الزيادة تُقرأ من شدة ميل القطعة الصاعدة، لا من ارتفاع النقطة.
    اطلب منهم كتابة الفرق فوق كل قطعة في الرسم.
  misconceptions: [highest-value-vs-largest-increase, change-magnitude-ignores-direction]
  qatar_link: "تفسير التمثيلات البيانية — الصفوف 6–8"

- id: M8-D2-002
  topic: D2
  cognitive: knowing
  area: recall
  difficulty: foundation
  benchmark: low
  format: mc
  context: pure
  time: 30
  stem: |
    تقترب نقاط مخطط الانتشار من مستقيم، وتزداد قيم $y$ غالباً كلما زادت قيم $x$.
    ما نوع الترابط الخطي بين $x$ و$y$؟
  options: ['ترابط سالب', 'لا يوجد ترابط', 'ترابط موجب', 'ترابط غير خطي']
  key: C
  verify: "sum([(a - Rational(5, 2)) * (b - Rational(23, 4)) for a, b in [(1, 3), (2, 5), (3, 6), (4, 9)]]) > 0"
  rationale:
    A: 'الترابط السالب تتناقص فيه $y$ غالباً عند زيادة $x$، وهذا عكس المعطى.'
    B: 'عدم وجود ترابط يعني عدم ظهور نمط واضح في النقاط، أما هنا فالنمط صاعد.'
    D: 'النقاط هنا تقترب من مستقيم، أما الترابط غير الخطي فتتبع فيه النقاط منحنى.'
  solution: |
    عندما تزداد قيم $y$ غالباً بزيادة قيم $x$ تميل النقاط إلى الصعود من اليسار إلى اليمين،
    ويسمى هذا **ترابطاً موجباً** (ميل خط الاتجاه موجب).
    أما إذا تناقصت $y$ بزيادة $x$ فالترابط سالب، وإذا لم يظهر نمط واضح فلا يوجد ترابط.
  remediation: |
    اربط اسم الترابط بحركة النقاط: صعود من اليسار إلى اليمين يعني موجباً، وهبوط يعني سالباً، وتبعثر بلا نمط يعني لا ترابط.
    اطلب من الطلاب رسم ثلاثة مخططات صغيرة وتسمية كل منها.
  misconceptions: [correlation-sign-reversed, scatter-pattern-ignored]
  qatar_link: "الصف الثامن — الدرس 8-2: الترابط الخطي (موجب وسالب ولا ترابط)"

- id: M8-D2-003
  topic: D2
  cognitive: knowing
  area: identify
  difficulty: foundation
  benchmark: low
  format: mc
  context: qatar
  time: 40
  stem: |
    يبيّن التمثيل بالخطوط عدد زوار كتارا (بالآلاف) في ستة أشهر.
    بين أيّ شهرين متتاليين بقي عدد الزوار **ثابتاً**؟
  figure:
    type: line
    title: "زوار كتارا (بيانات افتراضية)"
    x: ["نوفمبر", "ديسمبر", "يناير", "فبراير", "مارس", "أبريل"]
    values: [50, 50, 70, 90, 60, 40]
    y_label: "عدد الزوار (بالآلاف)"
    y_max: 100
    y_step: 20
    width: 540
  options: ["نوفمبر وديسمبر", "ديسمبر ويناير", "يناير وفبراير", "فبراير ومارس"]
  key: A
  verify: "[50 - 50 == 0, 70 - 50 == 0, 90 - 70 == 0, 60 - 90 == 0] == [True, False, False, False]"
  rationale:
    B: 'ارتفع العدد من $50$ إلى $70$ ألفاً، فالقطعة صاعدة وليست أفقية.'
    C: 'ارتفع العدد من $70$ إلى $90$ ألفاً، فالقطعة صاعدة.'
    D: 'انخفض العدد من $90$ إلى $60$ ألفاً، فالقطعة هابطة.'
  solution: |
    القطعة الأفقية في التمثيل بالخطوط تعني أن القيمة لم تتغير.
    بين نوفمبر وديسمبر بقي العدد $50$ ألف زائر،
    أما في الفترات الأخرى فيصعد الخط أو يهبط: $+20$ ثم $+20$ ثم $-30$ ثم $-20$.
  remediation: |
    درّب الطلاب على وصف كل قطعة من الخط: صاعدة (تزايد)، هابطة (تناقص)، أفقية (ثبات).
    اطلب منهم كتابة الكلمة المناسبة فوق كل قطعة من الرسم.
  misconceptions: [ignore-graph-shape, misread-grid-line]
  qatar_link: "الصف السادس: قراءة التمثيل بالخطوط؛ الصف الثامن — الدرس 3-5: فترات التزايد والتناقص"

- id: M8-D2-004
  topic: D2
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: qatar
  time: 50
  stem: |
    سُجّلت درجة الحرارة والرطوبة النسبية في الدوحة في ثماني ساعات مختلفة من يوم صيفي،
    ومُثّلت كل ساعة بنقطة في مخطط الانتشار (بيانات افتراضية).
    أيّ العبارات الآتية تصف الترابط بين درجة الحرارة والرطوبة؟
  figure:
    type: scatter
    title: "الحرارة والرطوبة في الدوحة (بيانات افتراضية)"
    points: [[27, 80], [29, 74], [31, 66], [33, 62], [35, 52], [37, 47], [39, 40], [41, 33]]
    x_min: 26
    x_max: 42
    x_step: 2
    y_min: 20
    y_max: 90
    y_step: 10
    x_label: "درجة الحرارة (\u200e°C)"
    y_label: "الرطوبة النسبية (%)"
    width: 520
    height: 340
  options:
    - 'كلما ارتفعت درجة الحرارة زادت الرطوبة غالباً.'
    - 'لا توجد علاقة بين درجة الحرارة والرطوبة.'
    - 'ترتفع الرطوبة ثم تنخفض كلما ارتفعت درجة الحرارة.'
    - 'كلما ارتفعت درجة الحرارة قلّت الرطوبة غالباً.'
  key: D
  verify: "[(33 - 80) * (41 - 27) > 0, (33 - 80) * (41 - 27) == 0, not all([b < a for a, b in [(80, 74), (74, 66), (66, 62), (62, 52), (52, 47), (47, 40), (40, 33)]]), (33 - 80) * (41 - 27) < 0] == [False, False, False, True]"
  rationale:
    A: 'عكس الاتجاه: النقاط تهبط من اليسار إلى اليمين، فالرطوبة تقلّ عند ارتفاع الحرارة.'
    B: 'يوجد نمط واضح؛ النقاط قريبة من مستقيم هابط وليست متناثرة بلا نظام.'
    C: 'الرطوبة تنخفض في كل قراءة جديدة ولا ترتفع في أي مرحلة.'
  solution: |
    ننظر إلى اتجاه النقاط من اليسار إلى اليمين:
    عند $27\,^\circ\text{C}$ تكون الرطوبة $80\%$، وعند $41\,^\circ\text{C}$ تكون $33\%$،
    والنقاط كلها تهبط تقريباً على استقامة واحدة.
    إذن كلما ارتفعت الحرارة قلّت الرطوبة غالباً، أي أن الترابط الخطي **سالب**.
  remediation: |
    تخيّل مستقيماً قريباً من النقاط: إن هبط من اليسار إلى اليمين فالترابط سالب.
    اطلب من الطلاب قراءة نقطتين في طرفي المخطط ومقارنة قيمتيهما.
  misconceptions: [correlation-sign-reversed, scatter-pattern-ignored, ignore-graph-shape]
  qatar_link: "الصف الثامن — الدرس 8-2: الترابط الخطي؛ الصف السادس: قراءة الرسوم البيانية"

- id: M8-D2-005
  topic: D2
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: dragdrop_categorize
  context: real
  time: 90
  stem: |
    قاست لمى ارتفاع نبتة فول عند نهاية الأسابيع $2$ و$4$ و$6$ و$8$ فقط (بيانات افتراضية).
    وتريد تقدير ارتفاع النبتة في أسابيع أخرى اعتماداً على نمط القياسات.
    صنّف كل تقدير: **استكمال داخلي** (داخل مدى القياسات) أو **استكمال خارجي** (خارج مدى القياسات).
  table:
    headers: ['الأسبوع $x$', '$2$', '$4$', '$6$', '$8$']
    rows: [['الارتفاع $y$ بالسنتيمتر', '$6$', '$11$', '$17$', '$22$']]
    row_headers: true
  cards:
    - {id: w1, text: 'الأسبوع $1$'}
    - {id: w3, text: 'الأسبوع $3$'}
    - {id: w5, text: 'الأسبوع $5$'}
    - {id: w7, text: 'الأسبوع $7$'}
    - {id: w10, text: 'الأسبوع $10$'}
    - {id: w12, text: 'الأسبوع $12$'}
  categories: ['استكمال داخلي', 'استكمال خارجي']
  key: {w1: 'استكمال خارجي', w3: 'استكمال داخلي', w5: 'استكمال داخلي', w7: 'استكمال داخلي', w10: 'استكمال خارجي', w12: 'استكمال خارجي'}
  verify: "all([2 <= w <= 8 for w in [3, 5, 7]]) and all([w < 2 or w > 8 for w in [1, 10, 12]])"
  solution: |
    مدى القياسات من الأسبوع $2$ إلى الأسبوع $8$.
    الأسابيع $3$ و$5$ و$7$ تقع داخل هذا المدى، فتقديرها **استكمال داخلي**.
    الأسبوع $1$ يسبق أول قياس، والأسبوعان $10$ و$12$ بعد آخر قياس، فتقديرها **استكمال خارجي**.
  hint: 'قارن رقم الأسبوع بأول أسبوع وآخر أسبوع في الجدول.'
  remediation: |
    قارن القيمة المطلوبة بأصغر قيمة وأكبر قيمة في البيانات: إن وقعت بينهما فالتقدير داخلي، وإن وقعت قبل الأصغر أو بعد الأكبر فهو خارجي.
    اطلب من الطلاب تلوين مدى البيانات على خط الأعداد قبل التصنيف.
  misconceptions: [interpolation-extrapolation-confusion, extrapolation-only-forward]
  qatar_link: "الصف الثامن — الدرس 8-3: النماذج الخطية (التنبؤ)؛ الصف السادس: قراءة التمثيل بالخطوط"

- id: M8-D2-006
  topic: D2
  cognitive: knowing
  area: compute
  difficulty: easy
  benchmark: intermediate
  format: numeric
  context: qatar
  time: 60
  stem: |
    يبيّن التمثيل بالخطوط مبيعات متجر تمور في سوق واقف (بآلاف الريالات) في أسابيع رمضان الأربعة (بيانات افتراضية).
    ما متوسط الزيادة الأسبوعية في المبيعات من الأسبوع الأول إلى الأسبوع الرابع؟
  figure:
    type: line
    title: "مبيعات متجر تمور في رمضان (بيانات افتراضية)"
    x: ["الأسبوع 1", "الأسبوع 2", "الأسبوع 3", "الأسبوع 4"]
    values: [30, 40, 60, 90]
    y_label: "المبيعات (بآلاف الريالات)"
    y_max: 100
    y_step: 10
    width: 520
  answer: {value: 20, unit: "ألف ريال", tol: 0.01}
  verify: "Rational(90 - 30, 4 - 1)"
  solution: |
    الزيادة الكلية من الأسبوع الأول إلى الرابع: $90 - 30 = 60$ ألف ريال.
    بين الأسبوع الأول والرابع توجد $3$ فترات أسبوعية (وليس $4$).
    متوسط الزيادة الأسبوعية: $60 \div 3 = 20$ ألف ريال.
  hint: 'اقسم الزيادة الكلية على عدد الفترات بين القراءتين.'
  remediation: |
    متوسط الزيادة = الزيادة الكلية ÷ عدد الفترات، وعدد الفترات بين أربع قراءات هو ثلاث لا أربع.
    تمرّن على متوسط التغير بين الأسبوعين الثاني والرابع في الرسم نفسه.
  misconceptions: [count-intervals-wrong, operation-confusion]
  qatar_link: "الصف السادس: قراءة التمثيل بالخطوط؛ الصف الثامن — الدرس 2-6: التناسب وميل المستقيم (معدل التغير)"

- id: M8-D2-007
  topic: D2
  cognitive: applying
  area: implement
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: qatar
  time: 60
  stem: |
    يبيّن مخطط الانتشار العلاقة بين متوسط درجة الحرارة اليومية واستهلاك الكهرباء اليومي في مبنى سكني بالدوحة (بيانات افتراضية).
    معادلة خط الاتجاه $y = 12x - 180$، حيث $x$ درجة الحرارة بالدرجات المئوية و$y$ الاستهلاك بالكيلوواط ساعة ($\text{kWh}$).
    ما الاستهلاك اليومي المتوقع عندما تبلغ درجة الحرارة $40\,^\circ\text{C}$؟
  figure:
    type: scatter
    title: "الحرارة واستهلاك الكهرباء (بيانات افتراضية)"
    points: [[26, 140], [29, 160], [32, 215], [35, 230], [38, 285], [41, 305], [44, 350]]
    trend: {m: 12, b: -180}
    x_min: 24
    x_max: 46
    x_step: 2
    y_min: 100
    y_max: 400
    y_step: 50
    x_label: "متوسط الحرارة اليومية (\u200e°C)"
    y_label: "الاستهلاك (kWh)"
    width: 540
    height: 360
  options: ['$220\,\text{kWh}$', '$300\,\text{kWh}$', '$480\,\text{kWh}$', '$660\,\text{kWh}$']
  option_values: [220, 300, 480, 660]
  key: B
  verify: "12 * 40 - 180"
  rationale:
    A: 'جمع العددين $40 + 180$ بدلاً من التعويض في المعادلة.'
    C: 'ضرب $12 \times 40$ فقط وأهمل الحد $-180$.'
    D: 'جمع $180$ بدلاً من طرحه: $480 + 180$.'
  solution: |
    نعوّض $x = 40$ في معادلة خط الاتجاه:
    $y = 12 \times 40 - 180 = 480 - 180 = 300$
    إذن الاستهلاك اليومي المتوقع $300\,\text{kWh}$.
  hint: 'عوّض قيمة $x$ في المعادلة، واضرب أولاً ثم اطرح.'
  remediation: |
    عند التنبؤ بخط الاتجاه عوّض قيمة $x$ في $y = mx + b$ ثم اضرب أولاً واجمع أو اطرح بعد ذلك.
    درّب الطلاب على قراءة $m$ و$b$ من المعادلة قبل التعويض.
  misconceptions: [forget-constant-term, operation-confusion, sign-error-transposition]
  qatar_link: "الصف الثامن: الدرس 8-3 (النماذج الخطية) والدرس 2-9 (المعادلة y = mx + b)"

- id: M8-D2-008
  topic: D2
  cognitive: applying
  area: implement
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: real
  time: 100
  stem: |
    يبيّن مخططا النقاط عدد الكتب التي قرأها طلاب مجموعتين في نادي القراءة خلال شهر، وكل نقطة تمثّل طالباً واحداً (بيانات افتراضية).
    أيّ العبارات الآتية يدعمها المخططان؟
  figure:
    - {type: dot_plot, title: 'المجموعة الأولى', min: 0, max: 6, step: 1, counts: {"1": 2, "2": 4, "3": 6, "4": 3, "5": 1}, x_label: 'عدد الكتب المقروءة', width: 320}
    - {type: dot_plot, title: 'المجموعة الثانية', min: 0, max: 6, step: 1, counts: {"1": 1, "2": 2, "3": 3, "4": 5, "5": 5}, x_label: 'عدد الكتب المقروءة', width: 320}
  options:
    - 'أكبر عدد كتب قرأه طالب في المجموعة الأولى أكبر منه في المجموعة الثانية.'
    - 'عدد طلاب المجموعة الأولى أكبر من عدد طلاب المجموعة الثانية.'
    - 'وسيط عدد الكتب في المجموعة الأولى أكبر من وسيطه في المجموعة الثانية.'
    - 'وسيط عدد الكتب في المجموعة الثانية أكبر من وسيطه في المجموعة الأولى.'
  key: D
  verify: "[max([1] * 2 + [2] * 4 + [3] * 6 + [4] * 3 + [5]) > max([1] + [2] * 2 + [3] * 3 + [4] * 5 + [5] * 5), len([1] * 2 + [2] * 4 + [3] * 6 + [4] * 3 + [5]) > len([1] + [2] * 2 + [3] * 3 + [4] * 5 + [5] * 5), median([1] * 2 + [2] * 4 + [3] * 6 + [4] * 3 + [5]) > median([1] + [2] * 2 + [3] * 3 + [4] * 5 + [5] * 5), median([1] + [2] * 2 + [3] * 3 + [4] * 5 + [5] * 5) > median([1] * 2 + [2] * 4 + [3] * 6 + [4] * 3 + [5])] == [False, False, False, True]"
  rationale:
    A: 'أكبر عدد كتب في المجموعتين هو $5$، فهما متساويان في هذه القيمة.'
    B: 'في كل مجموعة $16$ طالباً، فعدد الطلاب متساوٍ.'
    C: 'الوسيط في المجموعة الأولى $3$ وفي الثانية $4$، أي أن العلاقة معكوسة.'
  solution: |
    نعدّ النقاط في كل مخطط: في كل مجموعة $16$ طالباً، وأكبر عدد كتب في المجموعتين $5$.
    وسيط المجموعة الأولى: القيمتان الوسطيان (الثامنة والتاسعة) كلتاهما $3$، فالوسيط $3$.
    وسيط المجموعة الثانية: القيمتان الوسطيان كلتاهما $4$، فالوسيط $4$.
    إذن وسيط المجموعة الثانية أكبر، وهذا ما تدعمه العبارة D.
  hint: 'اعدّ النقاط في كل مخطط ثم ابحث عن القيمة الوسطى.'
  remediation: |
    لمقارنة مجموعتين استعمل مقياساً واحداً للمركز (الوسيط أو المتوسط الحسابي) وقارن القيمة نفسها في المجموعتين، ولا تكتفِ بأعلى قيمة.
    تمرّن على إيجاد الوسيط من مخطط النقاط بعدّ النقاط من الطرفين نحو الوسط.
  misconceptions: [compare-one-quantity, count-total-confusion, order-direction]
  qatar_link: "الصف السادس: الوسيط ومخطط النقاط ومقارنة مجموعتين"

- id: M8-D2-009
  topic: D2
