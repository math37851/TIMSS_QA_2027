  stem: |
    يقدّر خط الاتجاه $y = 4x + 15$ عدد أعضاء نادٍ رياضي مدرسي بعد $x$ شهراً من افتتاحه (بيانات افتراضية).
    أكمل القيم المتوقعة بسحب العدد المناسب إلى كل خانة.
  cards: ['8', '16', '23', '24', '31', '39']
  template: '$x = 2 \Rightarrow y =$ [[1]] $\quad$ $x = 4 \Rightarrow y =$ [[2]] $\quad$ $x = 6 \Rightarrow y =$ [[3]]'
  key: {1: '23', 2: '31', 3: '39'}
  check: "s1 == 4 * 2 + 15 && s2 == 4 * 4 + 15 && s3 == 4 * 6 + 15"
  solution: |
    نعوّض في المعادلة $y = 4x + 15$:
    $x = 2$: $y = 4 \times 2 + 15 = 23$
    $x = 4$: $y = 4 \times 4 + 15 = 31$
    $x = 6$: $y = 4 \times 6 + 15 = 39$
  hint: 'اضرب $x$ في $4$ ثم أضف $15$.'
  remediation: |
    لإكمال قيم متوقعة من معادلة خط الاتجاه اضرب $x$ في الميل $m$ ثم أضف $b$.
    الأعداد $8$ و$16$ و$24$ تظهر عند نسيان الحد $+15$.
  misconceptions: [forget-constant-term, slope-intercept-confusion]
  qatar_link: "الصف الثامن: الدرس 2-9 (المعادلة y = mx + b) والدرس 8-3 (النماذج الخطية)"

- id: M8-D2-010
  topic: D2
  cognitive: knowing
  area: compute
  difficulty: medium
  benchmark: intermediate
  format: multi_numeric
  context: real
  time: 120
  stem: |
    يبيّن مخطط الانتشار عدد ساعات المذاكرة الأسبوعية ($x$) ودرجة الاختبار ($y$) لعشرة طلاب، ويظهر خط الاتجاه (بيانات افتراضية).
    يمر خط الاتجاه بالنقطتين $(2, 40)$ و$(10, 80)$.
    (1) احسب ميل خط الاتجاه.
    (2) ما الدرجة المتوقعة، حسب خط الاتجاه، لطالب يذاكر $9$ ساعات أسبوعياً؟
  figure:
    type: scatter
    title: "ساعات المذاكرة ودرجة الاختبار (بيانات افتراضية)"
    points: [[1, 33], [2, 42], [3, 42], [4, 52], [5, 58], [6, 58], [7, 68], [8, 66], [9, 78], [10, 78]]
    trend: {m: 5, b: 30}
    x_min: 0
    x_max: 10
    x_step: 1
    y_min: 0
    y_max: 100
    y_step: 10
    x_label: "ساعات المذاكرة الأسبوعية"
    y_label: "درجة الاختبار"
    width: 520
    height: 340
  fields:
    - {label: 'ميل خط الاتجاه $m$', value: 5}
    - {label: 'الدرجة المتوقعة عند $9$ ساعات', value: 75}
  scoring: {mode: all}
  verify: "[Rational(80 - 40, 10 - 2), 40 + Rational(80 - 40, 10 - 2) * (9 - 2)]"
  solution: |
    (1) الميل $m = \frac{80 - 40}{10 - 2} = \frac{40}{8} = 5$، أي أن الدرجة تزداد $5$ درجات لكل ساعة مذاكرة إضافية.
    (2) نبدأ من النقطة $(2, 40)$: $y = 40 + 5 \times (9 - 2) = 40 + 35 = 75$.
    أو نحسب المقطع $y$ من $40 = 5 \times 2 + b$ فيكون $b = 30$، ثم $y = 5 \times 9 + 30 = 75$.
  hint: 'الميل هو التغير في $y$ مقسوماً على التغير في $x$ بين النقطتين.'
  remediation: |
    الميل = التغير في $y$ ÷ التغير في $x$ بين نقطتين على الخط بالترتيب نفسه.
    للتنبؤ عوّض في $y = mx + b$، واعتمد قيمة خط الاتجاه لا قيمة أقرب نقطة بيانات.
  misconceptions: [slope-as-rise-only, slope-rise-run-inverted, forget-constant-term]
  qatar_link: "الصف الثامن: الدروس 2-6 (ميل المستقيم) و8-2 (الترابط الخطي) و8-3 (النماذج الخطية)"

- id: M8-D2-011
  topic: D2
  cognitive: applying
  area: formulate
  difficulty: medium
  benchmark: high
  format: mc
  context: real
  time: 120
  stem: |
    يبيّن مخطط الانتشار ارتفاع الماء المتبقي في خزان (بالسنتيمتر) بعد عدد من الساعات من بدء تفريغه (بيانات افتراضية).
    يمر خط الاتجاه بالنقطتين $(2, 50)$ و$(10, 10)$.
    ما معادلة خط الاتجاه $y = mx + b$؟
  figure:
    type: scatter
    title: "ارتفاع الماء المتبقي في الخزان (بيانات افتراضية)"
    points: [[1, 56], [2, 48], [3, 46], [4, 41], [5, 33], [6, 31], [7, 26], [8, 19], [9, 17], [10, 11]]
    trend: {m: -5, b: 60}
    x_min: 0
    x_max: 12
    x_step: 1
    y_min: 0
    y_max: 70
    y_step: 10
    x_label: "الزمن (بالساعات)"
    y_label: "ارتفاع الماء (cm)"
    width: 540
    height: 360
  options: ['$y = -5x + 60$', '$y = 5x + 60$', '$y = -60x + 5$', '$y = -\frac{1}{5}x + 60$']
  key: A
  verify: "[(m, b) == (Rational(10 - 50, 10 - 2), 50 - Rational(10 - 50, 10 - 2) * 2) for m, b in [(-5, 60), (5, 60), (-60, 5), (Rational(-1, 5), 60)]] == [True, False, False, False]"
  rationale:
    B: 'الماء ينقص مع الزمن فالميل سالب؛ الإشارة الموجبة خطأ.'
    C: 'عكس موضعي الميل والمقطع $y$: المقطع $y$ هو $60$ والميل هو $-5$.'
    D: 'قلب الميل: $\frac{8}{-40} = -\frac{1}{5}$ بدلاً من $\frac{-40}{8} = -5$.'
  solution: |
    نحسب الميل من النقطتين $(2, 50)$ و$(10, 10)$:
    $m = \frac{10 - 50}{10 - 2} = \frac{-40}{8} = -5$
    نجد المقطع $y$ بتعويض النقطة $(2, 50)$: $50 = -5 \times 2 + b$ فيكون $b = 60$.
    المعادلة $y = -5x + 60$.
  remediation: |
    الميل = فرق قيم $y$ ÷ فرق قيم $x$ بالترتيب نفسه، والإشارة السالبة تعني تناقصاً.
    بعد إيجاد $m$ عوّض إحدى النقطتين لإيجاد $b$، ثم تحقّق بتعويض النقطة الأخرى.
  misconceptions: [ignore-negative-sign, slope-intercept-confusion, slope-rise-run-inverted]
