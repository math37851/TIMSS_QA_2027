- id: M8-D2-017
  topic: D2
  cognitive: applying
  area: formulate
  difficulty: hard
  benchmark: high
  format: mc
  context: pure
  time: 150
  stem: |
    يبيّن مخطط الانتشار مجموعة نقاط وخط الاتجاه الخاص بها.
    ما معادلة خط الاتجاه $y = mx + b$؟
  figure:
    type: scatter
    points: [[2, 5], [3, 7], [4, 7], [5, 10], [6, 11], [7, 12], [8, 15]]
    trend: {m: 1.5, b: 2}
    x_min: 1
    x_max: 9
    x_step: 1
    y_min: 0
    y_max: 16
    y_step: 1
    x_label: "x"
    y_label: "y"
    width: 500
    height: 380
  options: ['$y = \frac{2}{3}x + 2$', '$y = \frac{3}{2}x + 2$', '$y = \frac{3}{2}x + 5$', '$y = \frac{3}{2}x + 8$']
  key: B
  verify: "[(m, b) == (Rational(11 - 5, 6 - 2), 5 - Rational(11 - 5, 6 - 2) * 2) for m, b in [(Rational(2, 3), 2), (Rational(3, 2), 2), (Rational(3, 2), 5), (Rational(3, 2), 8)]] == [False, True, False, False]"
  rationale:
    A: 'قلب الميل: استعمل $\frac{4}{6}$ (فرق $x$ ÷ فرق $y$) بدلاً من $\frac{6}{4}$.'
    C: 'ميله صحيح لكنه أخذ قيمة $y$ للنقطة $(2, 5)$ على أنها المقطع $y$ دون طرح $m \times x = 3$.'
    D: 'ميله صحيح لكنه جمع $m \times x = 3$ إلى $5$ بدلاً من طرحه فحصل على $8$.'
  solution: |
    نقرأ من الشبكة نقطتين تقعان تماماً على خط الاتجاه، مثل $(2, 5)$ و$(6, 11)$.
    الميل: $m = \frac{11 - 5}{6 - 2} = \frac{6}{4} = \frac{3}{2}$.
    نعوّض النقطة $(2, 5)$ في $y = mx + b$: $5 = \frac{3}{2} \times 2 + b$ فيكون $b = 5 - 3 = 2$.
    المعادلة $y = \frac{3}{2}x + 2$.
  hint: 'اقرأ نقطتين تقعان تماماً على تقاطع خطوط الشبكة.'
  remediation: |
    اختر من الخط نقطتين واضحتين على تقاطع خطوط الشبكة، ثم احسب الميل = فرق $y$ ÷ فرق $x$، وبعدها أوجد $b$ من $b = y - mx$.
    تحقّق من المعادلة بتعويض نقطة ثالثة على الخط، مثل $(4, 8)$.
  misconceptions: [slope-rise-run-inverted, first-value-as-intercept, sign-error-transposition]
  qatar_link: "الصف الثامن: الدرسان 2-9 (المعادلة y = mx + b) و8-3 (النماذج الخطية)"

- id: M8-D2-018
  topic: D2
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: advanced
  format: mc
  context: qatar
  time: 150
  stem: |
    يبيّن الرسمان الآتيان بيانات افتراضية عن محطة الخرسعة للطاقة الشمسية في أربعة أشهر:
    عدد ساعات الشمس الفعلية يومياً، والطاقة الكهربائية الناتجة في كل ساعة شمس (بالميغاواط ساعة).
    في أيّ شهر كان إنتاج المحطة اليومي هو الأكبر؟
  figure:
    - {type: bar, title: 'ساعات الشمس الفعلية يومياً', categories: ['يناير', 'مارس', 'مايو', 'يوليو'], values: [8, 9, 11, 12], y_label: 'الساعات', y_max: 14, y_step: 2, value_labels: true, width: 380}
    - {type: line, title: 'الطاقة الناتجة لكل ساعة شمس', x: ['يناير', 'مارس', 'مايو', 'يوليو'], values: [500, 450, 400, 350], y_label: 'ميغاواط ساعة', y_max: 500, y_step: 50, width: 380}
  options: ['يناير', 'مارس', 'مايو', 'يوليو']
  key: C
  verify: "[h * r == max([8 * 500, 9 * 450, 11 * 400, 12 * 350]) for h, r in [(8, 500), (9, 450), (11, 400), (12, 350)]] == [False, False, True, False]"
  rationale:
    A: 'اختار الشهر الذي تكون فيه الطاقة لكل ساعة شمس أعلى ($500$) واعتمد على الرسم الثاني وحده؛ إنتاجه $8 \times 500 = 4000$ فقط.'
    B: 'إنتاج مارس $9 \times 450 = 4050$، وهو أقل من إنتاج مايو.'
    D: 'اختار الشهر الأطول شمساً ($12$ ساعة) واعتمد على الرسم الأول وحده؛ لكن الطاقة لكل ساعة أقل ($350$) فإنتاجه $4200$.'
  solution: |
    الإنتاج اليومي = عدد ساعات الشمس × الطاقة الناتجة في كل ساعة شمس.
    يناير: $8 \times 500 = 4000$
    مارس: $9 \times 450 = 4050$
    مايو: $11 \times 400 = 4400$
    يوليو: $12 \times 350 = 4200$
    أكبر إنتاج يومي $4400$ ميغاواط ساعة في شهر مايو.
  hint: 'اقرأ القيمتين لكل شهر من الرسمين ثم اضربهما.'
  remediation: |
    عند الجمع بين رسمين لا تكتفِ بقراءة أحدهما: اقرأ القيمتين لكل شهر ثم اجمعهما أو اضربهما بحسب المطلوب.
    اطلب من الطلاب إنشاء جدول من ثلاثة أعمدة (الشهر، الساعات، الطاقة لكل ساعة) ثم إضافة عمود الإنتاج.
  misconceptions: [compare-one-quantity, operation-confusion]
  qatar_link: "الصف السادس: قراءة الرسوم البيانية والجمع بين مصدرين؛ الصف الثامن: الوحدة 8"

- id: M8-D2-019
  topic: D2
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: high
  format: numeric
  context: real
  time: 150
  stem: |
    يبيّن مخطط الانتشار أسعار سيارات مستعملة من الطراز نفسه (بآلاف الريالات) بحسب عمرها بالسنوات، ويظهر خط الاتجاه (بيانات افتراضية).
    ويبيّن الجدول أعمار ثلاث سيارات من الطراز نفسه معروضة للبيع في أحد المعارض.
    اعتماداً على خط الاتجاه، ما مجموع أسعار السيارات الثلاث المتوقعة (بآلاف الريالات)؟
  table:
    headers: ['السيارة', 'الأولى', 'الثانية', 'الثالثة']
    rows: [['العمر بالسنوات', '$2$', '$5$', '$8$']]
    row_headers: true
  figure:
    type: scatter
    title: "أسعار السيارات المستعملة (بيانات افتراضية)"
    points: [[1, 86], [2, 76], [3, 73], [4, 64], [5, 61], [6, 52], [7, 49], [8, 40], [9, 37], [10, 31]]
    trend: {m: -6, b: 90}
    x_min: 0
    x_max: 11
    x_step: 1
    y_min: 0
    y_max: 100
    y_step: 10
    x_label: "عمر السيارة (بالسنوات)"
    y_label: "السعر (بآلاف الريالات)"
    width: 540
    height: 360
  answer: {value: 180, unit: "ألف ريال", tol: 0.01}
  verify: "sum([-6 * a + 90 for a in [2, 5, 8]])"
  solution: |
    نقرأ من خط الاتجاه نقطتين واضحتين، مثل $(0, 90)$ و$(10, 30)$:
    الميل $= \frac{30 - 90}{10 - 0} = -6$ والمقطع $y$ يساوي $90$، فالمعادلة $y = -6x + 90$.
    الأسعار المتوقعة: عمر $2$: $-6 \times 2 + 90 = 78$ ، وعمر $5$: $-6 \times 5 + 90 = 60$ ، وعمر $8$: $-6 \times 8 + 90 = 42$.
    المجموع: $78 + 60 + 42 = 180$ ألف ريال.
  hint: 'أوجد معادلة خط الاتجاه أولاً ثم عوّض الأعمار الثلاثة.'
  remediation: |
    استخرج معادلة خط الاتجاه من المخطط أولاً (الميل والمقطع $y$)، ثم طبّقها على كل قيمة من الجدول واجمع النتائج.
    انتبه لإشارة الميل السالب: السعر ينقص مع زيادة العمر.
  misconceptions: [ignore-negative-sign, forget-constant-term, read-wrong-x]
  qatar_link: "الصف الثامن: الدرس 8-3 (استعمال النموذج الخطي للتنبؤ) والدرس 2-9"

- id: M8-D2-020
  topic: D2
  cognitive: reasoning
  area: generalize
  difficulty: hard
  benchmark: advanced
  format: select_explain
  context: real
  time: 150
  stem: |
    يبيّن مخطط الانتشار أطوال أطفال (بالسنتيمتر) في أعمار من $2$ إلى $8$ سنوات، وخط الاتجاه معادلته $y = 6x + 76$،
    حيث $x$ العمر بالسنوات و$y$ الطول بالسنتيمتر (بيانات افتراضية).
    قالت سلمى: «بما أن الطول يزداد $6$ سنتيمترات كل سنة، فسيكون طول ابن عمي عندما يبلغ $40$ سنة نحو $316$ سنتيمتراً».
    هل استنتاج سلمى معقول؟ اختر الإجابة ثم برّر.
  figure:
    type: scatter
    title: "أطوال الأطفال حسب العمر (بيانات افتراضية)"
    points: [[2, 87], [3, 95], [4, 101], [5, 105], [6, 113], [7, 118], [8, 125]]
    trend: {m: 6, b: 76}
    x_min: 0
    x_max: 10
    x_step: 1
    y_min: 60
    y_max: 140
    y_step: 20
    x_label: "العمر (بالسنوات)"
    y_label: "الطول (cm)"
    width: 520
    height: 340
  options: ['نعم، استنتاجها معقول', 'لا، استنتاجها غير معقول']
  key: B
  points: 1
  verify: "6 * 40 + 76 == 316 and 40 > max([2, 3, 4, 5, 6, 7, 8])"
  rubric:
    full: 'يختار «لا» ويبرّر بأن خط الاتجاه مبني على بيانات للأعمار من $2$ إلى $8$ سنوات فقط، وأن العمر $40$ سنة بعيد جداً عن هذا المدى، فالتنبؤ هناك (استكمال خارجي بعيد) غير موثوق؛ فنمو الطول يتباطأ ويتوقف بعد سن معينة، والناتج $316$ سنتيمتراً غير واقعي.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تبرير يتعلق بحدود البيانات أو بعدم واقعية النتيجة (مثل: «الحساب خاطئ» دون سبب).'
    examples:
      correct:
        - 'لا؛ البيانات للأعمار من $2$ إلى $8$ فقط، والنمو يتوقف بعد البلوغ، فلا يصح استعمال الخط عند $40$ سنة.'
        - 'لا؛ طول $316$ سنتيمتراً غير ممكن، لأن خط الاتجاه لا يصلح للتنبؤ بعيداً عن مدى البيانات.'
      incorrect:
        - 'نعم، لأن الطول يزداد $6$ سنتيمترات كل سنة.'
        - 'لا، لأن سلمى أخطأت في عملية الضرب.'
  solution: |
    عند التعويض $x = 40$ في $y = 6x + 76$ نحصل على $y = 6 \times 40 + 76 = 316$ سنتيمتراً، والحساب صحيح رياضياً.
    لكن البيانات تغطي الأعمار من $2$ إلى $8$ سنوات فقط، والعمر $40$ سنة بعيد جداً عن هذا المدى (استكمال خارجي بعيد).
    نمو الطول لا يستمر بمعدل ثابت إلى الأبد؛ فهو يتباطأ ويتوقف بعد سن معينة، فالنتيجة غير واقعية والنموذج الخطي لا يصلح هناك.
  remediation: |
    استعمل خط الاتجاه للتنبؤ داخل مدى البيانات أو قريباً منه، وكن حذراً كلما ابتعدت عنه، واسأل: هل يمكن أن يستمر هذا الاتجاه في الواقع؟
    اطلب من الطلاب اقتراح أكبر عمر معقول لاستعمال هذا النموذج.
  misconceptions: [extrapolation-always-valid, constant-difference-assumption]
  qatar_link: "الصف الثامن — الدرس 8-3: النماذج الخطية (حدود التنبؤ)"

- id: M8-D2-021
  topic: D2
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: advanced
  format: cr_explain
  context: qatar
  time: 200
  stem: |
    يبيّن مخطط الانتشار مبيعات الآيس كريم (بآلاف الريالات) وعدد المكيفات المباعة في اثني عشر شهراً بإحدى مدن قطر (بيانات افتراضية)، ويظهر خط الاتجاه.
    قال خالد: «زيادة مبيعات الآيس كريم تسبّب زيادة مبيعات المكيفات».
    (1) صف الترابط بين المتغيرين.
    (2) هل يدعم المخطط استنتاج خالد؟ فسّر إجابتك.
  figure:
    type: scatter
    title: "مبيعات الآيس كريم والمكيفات (بيانات افتراضية)"
    points: [[20, 30], [22, 33], [30, 45], [40, 60], [55, 85], [70, 110], [75, 118], [72, 112], [60, 90], [45, 65], [30, 42], [21, 32]]
    trend: {m: 1.6, b: -2}
    x_min: 0
    x_max: 80
    x_step: 10
    y_min: 0
    y_max: 120
    y_step: 20
    x_label: "مبيعات الآيس كريم (بآلاف الريالات)"
    y_label: "عدد المكيفات المباعة"
    width: 540
    height: 360
  points: 2
  verify: "sum([(a - 45) * (b - Rational(137, 2)) for a, b in [(20, 30), (22, 33), (30, 45), (40, 60), (55, 85), (70, 110), (75, 118), (72, 112), (60, 90), (45, 65), (30, 42), (21, 32)]]) > 0"
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يصف الترابط بأنه موجب (تزداد مبيعات المكيفات بزيادة مبيعات الآيس كريم)، ويرفض استنتاج خالد مبيّناً أن الترابط لا يعني السببية، ويذكر عاملاً مشتركاً محتملاً (مثل ارتفاع درجة الحرارة في الصيف الذي يزيد الطلب على الاثنين).'}
      - {code: 10, points: 1, desc: 'يصف الترابط الموجب ويرفض الاستنتاج دون ذكر عامل مشترك أو تفسير كافٍ (مثل: «الترابط لا يعني السببية» فقط)؛ أو يذكر عاملاً مشتركاً دون وصف الترابط أو دون رفض الاستنتاج صراحة.'}
      - {code: 70, points: 0, desc: 'يقبل استنتاج خالد، أو يصف الترابط بأنه سالب أو منعدم، أو يقدّم إجابة غير مرتبطة بالسؤال.'}
    examples:
      correct:
        - 'الترابط موجب: تزداد مبيعات المكيفات كلما زادت مبيعات الآيس كريم. لكن هذا لا يثبت أن أحدهما يسبّب الآخر، فارتفاع الحرارة في الصيف يزيد مبيعات الاثنين معاً.'
      incorrect:
        - 'الترابط موجب، إذن الآيس كريم هو سبب زيادة المكيفات.'
        - 'الترابط سالب لأن المبيعات تتغير.'
        - 'نعم، المخطط يدعم استنتاج خالد لأن النقاط قريبة من خط الاتجاه.'
  model_answer: '(1) الترابط موجب: تميل مبيعات المكيفات إلى الزيادة كلما زادت مبيعات الآيس كريم. (2) لا يدعم المخطط استنتاج خالد؛ فالترابط لا يعني السببية. السبب الأرجح عامل مشترك هو ارتفاع درجة الحرارة في الصيف، فهو يزيد مبيعات الآيس كريم ومبيعات المكيفات معاً.'
  solution: |
    (1) النقاط تصعد من اليسار إلى اليمين وتقترب من مستقيم صاعد، فالترابط الخطي موجب.
    (2) وجود ترابط موجب لا يثبت أن زيادة أحد المتغيرين هي سبب زيادة الآخر؛ فقد يتأثر المتغيران بعامل ثالث.
    هنا يرتفع الطلب على الآيس كريم وعلى المكيفات معاً عندما ترتفع درجة الحرارة في الصيف، لذلك لا يدعم المخطط استنتاج خالد.
  remediation: |
    ميّز بين وصف العلاقة (ترابط موجب أو سالب) وتفسيرها (سبب ونتيجة). عند رؤية ترابط اسأل: هل يوجد عامل ثالث يؤثر في المتغيرين معاً؟
    اطلب من الطلاب أمثلة أخرى، مثل مبيعات المعاطف ومبيعات المشروبات الساخنة في الشتاء.
  misconceptions: [correlation-implies-causation, correlation-sign-reversed]
