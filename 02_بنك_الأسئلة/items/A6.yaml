  stem: |
    يقيس سالم مساحة بلاطات مربعة مختلفة ويسجل النتائج في الجدول، حيث $s$ طول الضلع بالسنتيمتر و$A$ المساحة بالسنتيمتر المربع.
    مثّل سالم النقاط $(s, A)$ على المستوى الإحداثي ثم وصل بينها بمستقيم، لأن المساحة تزداد كلما زاد طول الضلع.
    هل ما فعله سالم صحيح؟ برّر إجابتك مستعيناً بقيم الجدول.
  table: {headers: ['$s$', '$2$', '$4$', '$6$', '$8$'], rows: [['$A$', '$4$', '$16$', '$36$', '$64$']], row_headers: true}
  points: 2
  verify: "(lambda a: len(set([a[i + 1] - a[i] for i in range(3)])) > 1 and all([a[i] == (2*(i + 1))**2 for i in range(4)]))([4, 16, 36, 64])"
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يبيّن أن رسم سالم غير صحيح ويبرّر بدليل عددي صحيح من الجدول: الفروق بين قيم $A$ المتتالية (12 و20 و28) غير ثابتة، أو أن الميول بين النقاط المتتالية مختلفة، أو أن النقاط لا تقع على مستقيم؛ مع الإشارة إلى أن الصحيح وصلها بمنحنى.'}
      - {code: 10, points: 1, desc: 'يقرر أن رسم سالم غير صحيح مع تبرير عام أو ناقص دون أرقام (مثل «العلاقة غير خطية» أو «المساحة تزداد بسرعة أكبر»)، أو يحسب الفروق حساباً صحيحاً دون أن يستنتج.'}
      - {code: 70, points: 0, desc: 'يقرر أن رسم سالم صحيح، أو يقدم تبريراً غير ذي صلة، أو لا يجيب.'}
    examples:
      correct:
        - 'غير صحيح؛ الفروق بين المساحات 12 و20 و28 وليست ثابتة، فالنقاط لا تقع على مستقيم ويجب وصلها بمنحنى.'
        - 'المستقيم المار بالنقطتين $(2, 4)$ و$(4, 16)$ يعطي 28 عند $s = 6$ بينما الجدول يعطي 36، إذن النقاط ليست على مستقيم.'
      incorrect:
        - 'صحيح لأن المساحة تزداد كلما زاد الضلع.'
        - 'غير صحيح لأن العلاقة غير خطية. (بلا دليل عددي: درجة جزئية)'
  model_answer: 'رسم سالم غير صحيح. الفروق بين قيم $A$ المتتالية هي 12 و20 و28، وهي غير ثابتة، أي أن المساحة لا تزداد بمقدار ثابت عندما يزداد طول الضلع بمقدار ثابت هو 2؛ لذلك لا تقع النقاط على مستقيم. فالمستقيم المار بالنقطتين $(2, 4)$ و$(4, 16)$ يعطي 28 عند $s = 6$ بينما الجدول يعطي 36. يجب وصل النقاط بمنحنى، فالعلاقة $A = s^2$ غير خطية.'
  solution: |
    نحسب الفروق بين قيم $A$ المتتالية: $16 - 4 = 12$ ، $36 - 16 = 20$ ، $64 - 36 = 28$.
    الفروق غير ثابتة بينما يزداد طول الضلع بمقدار ثابت (2)، لذلك لا تقع النقاط على مستقيم واحد، ويتغير ميل القطعة بين كل نقطتين متتاليتين.
    مثال: المستقيم المار بالنقطتين $(2, 4)$ و$(4, 16)$ ميله $\frac{16 - 4}{4 - 2} = 6$، فيعطي $A = 16 + 6 \times 2 = 28$ عند $s = 6$، بينما يعطي الجدول $36$.
    إذن رسم سالم غير صحيح؛ يجب وصل النقاط بمنحنى. فالمساحة دالة غير خطية في طول الضلع: $A = s^2$.
  remediation: |
    اطلب من الطالب حساب ميل القطعة بين كل نقطتين متتاليتين (6 ثم 10 ثم 14) ليلاحظ أنه يتغير، وأن المستقيم يتطلب ميلاً ثابتاً. ثم يرسم النقاط ويصلها بمنحنى. وبيّن أن عبارة «تزداد كلما زاد» لا تعني أن العلاقة خطية.
  misconceptions: [increasing-means-linear, connect-points-with-line]
  qatar_link: 'الصف الثامن، الوحدة 3: 3-1 العلاقات والدوال، والدرس المحذوف 3-3 — بند جسري (الربط بين الجدول والتمثيل البياني).'
