  rubric:
    full: 'يختار «دانة على صواب» ويبرّر بأن عدد الخرزات في الشكل $n$ يساوي $n \times n = n^2$ فيكون في الشكل 20: $20^2 = 400$؛ أو يبيّن أن العلاقة ليست تناسباً: مضاعفة رقم الشكل 5 مرات تضاعف العدد $5 \times 5 = 25$ مرة، أي $16 \times 25 = 400$.'
    zero: 'يختار «هند على صواب»، أو يختار «دانة» دون تبرير مقبول (مثل «لأن 400 أكبر» أو تخمين بلا حساب).'
    examples:
      correct:
        - 'الشكل 20 فيه 20 صفاً وفي كل صف 20 خرزة، فالعدد $20 \times 20 = 400$.'
        - 'عدد الخرزات هو رقم الشكل مضروباً في نفسه: $4 \times 4 = 16$ و$20 \times 20 = 400$.'
      incorrect:
        - 'دانة لأن حسابها صحيح.'
        - 'هند لأن 5 أمثال 16 تساوي 80.'
  model_answer: 'دانة على صواب. في الشكل $n$ يوجد $n$ صفاً في كل صف $n$ خرزة، فالعدد $n^2$؛ وفي الشكل 20 يكون $20^2 = 400$. تفكير هند خاطئ لأنها عاملت العلاقة كأنها تناسب، لكن عند مضاعفة رقم الشكل 5 مرات يتضاعف العدد 25 مرة.'
  solution: |
    في الشكل $n$ نجد $n$ صفاً في كل صف $n$ خرزة، فعدد الخرزات $n \times n = n^2$. (الشكل 3: $3 \times 3 = 9$، والشكل 4: $4 \times 4 = 16$.)
    في الشكل 20: $20^2 = 400$ خرزة؛ إذن دانة على صواب.
    خطأ هند: افترضت أن العلاقة تناسب، أي أنه إذا زاد رقم الشكل 5 مرات زاد العدد 5 مرات. لكن عدد الخرزات يزداد بمقدار أكبر كل مرة (3 ثم 5 ثم 7 ...)، فالعلاقة غير خطية: إذا تضاعف رقم الشكل 5 مرات تضاعف العدد $5 \times 5 = 25$ مرة، أي $16 \times 25 = 400$.
  remediation: |
    اطلب من الطالب رسم الشكلين 5 و6 وعدّ الخرزات، ثم تنظيم القيم في جدول والبحث عن علاقة بين رقم الشكل والعدد. نبّه إلى أن مضاعفة المدخل لا تضاعف المخرج في الدوال غير الخطية: ضُوعف رقم الشكل من 2 إلى 4 بينما تضاعف العدد أربع مرات (من 4 إلى 16).
  misconceptions: [linear-scaling-of-quadratic, additive-scaling]
  qatar_link: 'الصف الثامن، الوحدة 3: الدرس المحذوف 3-3 (الدوال غير الخطية) — بند جسري؛ ويستند إلى الأسس (الوحدة 1) والتناسب (الوحدة 2).'

- id: M8-A6-016
  topic: A6
