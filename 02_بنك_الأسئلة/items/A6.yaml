- id: M8-A6-011
  topic: A6
  cognitive: applying
  area: formulate
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: qatar
  time: 70
  stem: |
    تُغطّى حديقة مربعة الشكل في لوسيل بعشب صناعي. طول ضلع الحديقة $s$ بالمتر، وسعر المتر المربع الواحد من العشب 5 ريالات (بيانات افتراضية).
    أي دالة تعطي تكلفة التغطية $C$ بالريال؟
  options: ['$C = 5s$', '$C = 5s^2$', '$C = (5s)^2$', '$C = s^2 + 5$']
  option_values: [50, 500, 2500, 105]   # قيمة كل خيار عند s = 10
  key: B
  verify: "5 * 10**2"
  rationale:
    A: 'يضرب السعر في طول الضلع فقط، فيحسب كأن المساحة تساوي $s$ بدل $s^2$.'
    C: 'يربّع الناتج $5s$ كله، فيربّع السعر أيضاً؛ والمطلوب تربيع طول الضلع فقط.'
    D: 'يجمع المساحة مع السعر بدل أن يضربهما (خلط بين العمليات).'
  solution: |
    مساحة الحديقة المربعة = طول الضلع × طول الضلع $= s \times s = s^2$ متراً مربعاً.
    التكلفة = المساحة × سعر المتر المربع $= s^2 \times 5 = 5s^2$.
    تحقق: لحديقة طول ضلعها $10\,\text{m}$ تكون المساحة $100\,\text{m}^2$ والتكلفة $500$ ريال، وهذا ما تعطيه الدالة $C = 5s^2$.
    لاحظ أن التكلفة ليست متناسبة طردياً مع $s$: إذا تضاعف طول الضلع تضاعفت التكلفة أربع مرات، لذلك الدالة غير خطية.
  remediation: |
    اطلب من الطالب أن يكتب الدالة بخطوتين: المساحة بدلالة $s$ أولاً، ثم التكلفة = المساحة × السعر. ويمكن اختبار كل خيار بقيمة بسيطة مثل $s = 2$: المساحة 4 والتكلفة 20 ريالاً، وهي لا تتحقق إلا في الدالة $C = 5s^2$.
  misconceptions: [forget-to-square, square-whole-expression, operation-confusion]
  qatar_link: 'الصف الثامن، الوحدة 3: 3-1 العلاقات والدوال (كتابة قاعدة الدالة)؛ والدرس المحذوف 3-3 — بند جسري.'

- id: M8-A6-012
  topic: A6
  cognitive: reasoning
  area: analyze
  difficulty: medium
  benchmark: high
  format: mc
  context: real
  time: 100
  stem: |
    أُسقطت كرة من قمة برج، وسُجّلت المسافة $d$ بالأمتار التي قطعتها بعد $t$ ثانية (قيم تقريبية).
    أي العبارات الآتية صحيحة؟
  table: {headers: ['$t$', '$0$', '$1$', '$2$', '$3$', '$4$'], rows: [['$d$', '$0$', '$5$', '$20$', '$45$', '$80$']], row_headers: true}
  options:
    - 'الدالة خطية لأن $d$ تزداد مع كل ثانية.'
    - 'الدالة خطية لأن $t$ تزداد بمقدار ثابت هو 1.'
    - 'الدالة غير خطية لأن الفروق بين قيم $d$ المتتالية غير ثابتة.'
    - 'الدالة غير خطية لأن الفروق بين قيم $d$ المتتالية تتناقص.'
  key: C
  verify: "(lambda d: len(set([d[i + 1] - d[i] for i in range(4)])) > 1 and d[1] - d[0] == 5 and d[4] - d[3] == 35 and all([d[i] == 5*i**2 for i in range(5)]))([0, 5, 20, 45, 80])"
  rationale:
    A: 'يظن أن أي دالة متزايدة خطية؛ لكن تزايد $d$ وحده لا يكفي، فقد تتزايد الدالة غير الخطية أيضاً.'
    B: 'يفحص الفروق في قيم $t$ (المدخل) وليس في قيم $d$ (المخرج)؛ والمهم هو ثبات تغير $d$.'
    D: 'يصل إلى أن الدالة غير خطية لكنه يخطئ في قراءة الفروق: هي 5 و15 و25 و35، أي أنها تتزايد ولا تتناقص.'
  solution: |
    في الدالة الخطية تتغير $d$ بمقدار ثابت كلما زادت $t$ بمقدار ثابت، ويكون رسمها مستقيماً. نفحص الفروق بين قيم $d$ المتتالية:
    $5 - 0 = 5$ ، $20 - 5 = 15$ ، $45 - 20 = 25$ ، $80 - 45 = 35$.
    الفروق 5 و15 و25 و35 غير ثابتة (وهي تتزايد)، فالدالة غير خطية ولن تقع نقاطها على مستقيم.
    الخيار A خطأ لأن تزايد $d$ وحده لا يكفي: الدالة $y = 2x$ تتزايد أيضاً وهي خطية. الخيار B خطأ لأن المطلوب ثبات الفروق في $d$ وليس في $t$. الخيار D خطأ لأن الفروق تتزايد ولا تتناقص.
    معلومة إضافية: الفروق الثانية (10 و10 و10) ثابتة، وهذا يدل على أن $d = 5t^2$، وهي دالة تربيعية.
  remediation: |
    اطلب من الطالب رسم نقاط الجدول ليرى أنها تقع على منحنى يزداد انحداره. ثم درّبه على قاعدة: الدالة الخطية تعني زيادة ثابتة في المخرج لكل زيادة ثابتة في المدخل؛ فيحسب الفروق في المخرج ويقارنها دائماً قبل أن يحكم.
  misconceptions: [increasing-means-linear, check-input-differences-only, misread-differences-trend]
  qatar_link: 'الصف الثامن، الوحدة 3: الدرس المحذوف 3-3 (مقارنة الدوال الخطية وغير الخطية بالجدول) — بند جسري؛ ويستند إلى معدل التغير في الوحدة 2.'

- id: M8-A6-013
  topic: A6
  cognitive: reasoning
  area: generalize
  difficulty: hard
  benchmark: advanced
  format: mc
  context: real
  time: 120
  stem: |
    تُرصَف أرضية قاعة بنمط من البلاطات. يبيّن الجدول عدد البلاطات $T$ في الشكل رقم $n$.
    أي عبارة تعطي عدد البلاطات في الشكل رقم $n$؟
  table: {headers: ['$n$', '$1$', '$2$', '$3$', '$4$'], rows: [['$T$', '$2$', '$6$', '$12$', '$20$']], row_headers: true}
  options: ['$T = 4n - 2$', '$T = n^2 + 1$', '$T = 2n^2$', '$T = n^2 + n$']
  key: D
  verify: "(lambda ok: ok(lambda n: n**2 + n) and not ok(lambda n: 4*n - 2) and not ok(lambda n: n**2 + 1) and not ok(lambda n: 2*n**2))(lambda f: all([f(1) == 2, f(2) == 6, f(3) == 12, f(4) == 20]))"
  rationale:
    A: 'يعتمد على الفرق الأول (4) فقط ويفترض زيادة ثابتة، فيحصل على 2 و6 و10؛ لكن الجدول يعطي 12 عند $n = 3$.'
    B: 'يطابق الشكل الأول فقط: يعطي 2 عند $n = 1$ لكنه يعطي 5 بدل 6 عند $n = 2$.'
    C: 'يطابق الشكل الأول فقط: يعطي 2 عند $n = 1$ لكنه يعطي 8 بدل 6 عند $n = 2$.'
  solution: |
    نبحث عن قاعدة تعطي 2 و6 و12 و20.
    الفروق المتتالية: 4 و6 و8؛ وهي غير ثابتة، فالنمط غير خطي. وتزداد هذه الفروق بمقدار ثابت هو 2، وهذا يدل على أن القاعدة تحوي $n^2$.
    نطرح $n^2$ من كل عدد: $2 - 1 = 1$ ، $6 - 4 = 2$ ، $12 - 9 = 3$ ، $20 - 16 = 4$. الباقي يساوي $n$ دائماً.
    إذن $T = n^2 + n$.
    نتحقق: عند $n = 3$ نحصل على $9 + 3 = 12$، وعند $n = 4$ نحصل على $16 + 4 = 20$، وهما يطابقان الجدول.
    أما $T = 4n - 2$ فتعطي 10 عند $n = 3$، و$T = n^2 + 1$ تعطي 5 عند $n = 2$، و$T = 2n^2$ تعطي 8 عند $n = 2$؛ فكلها لا تطابق الجدول.
  remediation: |
    علّم الطالب خطوات اكتشاف القاعدة: أولاً يحسب الفروق المتتالية. وإذا لم تكن ثابتة يحسب الفروق الثانية، فثباتها يدل على وجود $n^2$. ثم يطرح $n^2$ من الأعداد وينظر فيما يتبقى. وبعد ذلك يجرّب القاعدة على جميع قيم الجدول وليس على القيمة الأولى فقط.
  misconceptions: [constant-difference-assumption, first-term-only-check]
  qatar_link: 'الصف الثامن، الوحدة 3: 3-1 العلاقات والدوال، والدرس المحذوف 3-3 — بند جسري (تعميم نمط غير خطي).'

- id: M8-A6-014
  topic: A6
  cognitive: reasoning
  area: analyze
  difficulty: hard
  benchmark: advanced
  format: select_explain
  context: qatar
  time: 180
  stem: |
    يعلن متجران في سوق واقف عن قسيمة شراء أسبوعية لعملائهما خلال حملة تسويقية (بيانات افتراضية). في الأسبوع $n$: قيمة قسيمة متجر النخلة $10n$ ريالات، وقيمة قسيمة متجر اللؤلؤة $n^2$ ريالات.
    تقول ليلى: «قيمة قسيمة متجر النخلة أكبر في الأسابيع الثلاثة الأولى، إذن هي أكبر في جميع الأسابيع».
    هل ليلى على صواب؟ اختر الإجابة ثم برّر بالأرقام.
  table: {headers: ['الأسبوع $n$', '$1$', '$2$', '$3$'], rows: [['قسيمة متجر النخلة (ريال)', '$10$', '$20$', '$30$'], ['قسيمة متجر اللؤلؤة (ريال)', '$1$', '$4$', '$9$']], row_headers: true}
  options: ['نعم، ليلى على صواب', 'لا، ليلى ليست على صواب']
  key: B
  points: 1
  verify: "(lambda a, b: a(1) > b(1) and a(2) > b(2) and a(3) > b(3) and a(10) == b(10) and b(12) > a(12))(lambda n: 10*n, lambda n: n**2)"
  rubric:
    full: 'يختار «لا، ليلى ليست على صواب» ويبرّر بدليل عددي صحيح، مثل: في الأسبوع 12 قيمة قسيمة متجر النخلة 120 ريالاً وقيمة قسيمة متجر اللؤلؤة 144 ريالاً؛ أو أن قيمتي القسيمتين تتساويان في الأسبوع 10 (100 ريال) ثم تصبح قيمة قسيمة متجر اللؤلؤة أكبر.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تبرير عددي أو منطقي صحيح (مثل «لأن المربعات أكبر» دون مقارنة).'
    examples:
      correct:
        - 'في الأسبوع 12: $10 \times 12 = 120$ و$12^2 = 144$، فقيمة قسيمة اللؤلؤة أكبر.'
        - 'عند $n = 10$ تتساوى قيمتا القسيمتين (100 ريال)، وبعد ذلك يصبح $n^2$ أكبر من $10n$.'
        - 'قيمة قسيمة النخلة تزداد 10 ريالات كل أسبوع، وقيمة قسيمة اللؤلؤة تزداد بمقدار يكبر كل أسبوع (3 ثم 5 ثم 7)، فتلحق بها وتتجاوزها بعد الأسبوع 10.'
      incorrect:
        - 'لا، لأن المربعات تزداد أسرع. (بلا أرقام أو مقارنة)'
        - 'نعم، لأن 10 أكبر من 1 و20 أكبر من 4 و30 أكبر من 9.'
  model_answer: 'لا، ليلى ليست على صواب. قيمتا القسيمتين تتساويان في الأسبوع 10 (100 ريال لكل منهما)، وفي الأسبوع 12 تكون قيمة قسيمة متجر النخلة $10 \times 12 = 120$ ريالاً وقيمة قسيمة متجر اللؤلؤة $12^2 = 144$ ريالاً. فنمط متجر اللؤلؤة غير خطي ويتفوق لاحقاً.'
  solution: |
    نحسب قيمتي القسيمتين في أسابيع أخرى:
    متجر النخلة $10n$: 10 ، 20 ، 30 ، ... ، 100 في الأسبوع 10 ، 120 في الأسبوع 12.
    متجر اللؤلؤة $n^2$: 1 ، 4 ، 9 ، ... ، 100 في الأسبوع 10 ، 144 في الأسبوع 12.
    قيمتا القسيمتين تتساويان في الأسبوع 10، وبعده تصبح قيمة قسيمة متجر اللؤلؤة أكبر. إذن ليلى ليست على صواب.
    السبب: قيمة قسيمة متجر النخلة تزداد بمقدار ثابت (10 ريالات كل أسبوع)، أما قيمة قسيمة متجر اللؤلؤة فتزداد بمقدار يكبر كل أسبوع (3 ثم 5 ثم 7 ...). وقد اعتمدت ليلى على الأسابيع الأولى فقط، والنمو غير الخطي قد يتفوق لاحقاً.
  remediation: |
    اطلب من الطالب أن يوسّع الجدول حتى الأسبوع 12 وأن يرسم الدالتين على المستوى الإحداثي نفسه: المستقيم $y = 10x$ والمنحنى $y = x^2$، ليرى أنهما يتقاطعان عند $x = 10$ وأن المنحنى يعلو المستقيم بعد ذلك. نبّه إلى أن بضع أمثلة لا تثبت قاعدة عامة.
  misconceptions: [examples-prove-general, constant-difference-assumption]
  qatar_link: 'الصف الثامن، الوحدة 3: الدرس المحذوف 3-3 (مقارنة النمو الخطي وغير الخطي) — بند جسري.'

- id: M8-A6-015
  topic: A6
  cognitive: reasoning
