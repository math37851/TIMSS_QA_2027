  stem: |
    يمثل الرسم البياني الآتي دالة. أي معادلة قد تمثل هذه الدالة؟
  figure: {type: coord, xmin: -3, xmax: 3, ymin: -3, ymax: 7, unit: 26, curves: [{expr: "x**2 - 2"}], alt: "رسم بياني لمنحنى يمر بالنقطة (0, -2) ويرتفع إلى اليمين وإلى اليسار"}
  options: ['$y = 2x - 2$', '$y = x^2 - 2$', '$y = x - 2$', '$y = -x - 2$']
  key: B
  verify: "(lambda ok: ok(lambda t: t**2 - 2) and not ok(lambda t: 2*t - 2) and not ok(lambda t: t - 2) and not ok(lambda t: -t - 2))(lambda f: f(-2) == 2 and f(0) == -2 and f(2) == 2)"
  rationale:
    A: 'معادلة خطية؛ رسمها مستقيم ميله 2 يمر بالنقطة $(0, -2)$ لكنه ليس منحنى. يختارها من ينظر إلى المقطع $y$ فقط ويتجاهل شكل الرسم.'
    C: 'معادلة خطية؛ رسمها مستقيم ميله 1 يمر بالنقطة $(0, -2)$ نفسها لكنه لا ينحني.'
    D: 'معادلة خطية؛ رسمها مستقيم متناقص، بينما المنحنى يهبط ثم يرتفع.'
  solution: |
    ننظر إلى شكل الرسم: هو منحنى وليس خطاً مستقيماً، ويمر بالنقطة $(0, -2)$.
    الدالة الخطية معادلتها من الصورة $y = mx + b$ ورسمها مستقيم دائماً. لذلك لا يمكن أن تمثل $y = 2x - 2$ أو $y = x - 2$ أو $y = -x - 2$ هذا الرسم، مع أن كلاً منها يمر بالنقطة $(0, -2)$ أيضاً.
    أما المعادلة التي يظهر فيها $x^2$ فرسمها منحنى، وهي $y = x^2 - 2$ (الخيار B).
    تحقق: عند $x = 2$ يكون $y = 2^2 - 2 = 2$، والنقطة $(2, 2)$ تقع على المنحنى.
  remediation: |
    اطلب من الطالب إكمال جدول قيم للمعادلتين $y = x - 2$ و$y = x^2 - 2$ عند $x = -2, -1, 0, 1, 2$ ثم رسم النقاط: الأولى تقع على مستقيم والثانية على منحنى. القاعدة المساعدة: إذا ظهر $x$ مرفوعاً للقوة 2 فالدالة غير خطية ورسمها منحنى.
  misconceptions: [ignore-graph-shape, matches-intercept-only]
  qatar_link: 'الصف الثامن، الوحدة 3: 3-1 العلاقات والدوال؛ والدرس المحذوف 3-3 (مقارنة الدوال الخطية وغير الخطية) — بند جسري.'

- id: M8-A6-002
  topic: A6
  cognitive: knowing
  area: compute
  difficulty: foundation
  benchmark: low
  format: numeric
  context: qatar
  time: 40
  stem: |
    يُرصَف ممشى على كورنيش الدوحة ببلاطات مربعة الشكل. تعطي الدالة $A = s^2$ مساحة البلاطة $A$ بالسنتيمتر المربع، حيث $s$ طول ضلعها بالسنتيمتر.
    ما مساحة بلاطة طول ضلعها $12\,\text{cm}$؟
  answer: {value: 144, unit: "cm²"}
  verify: "12**2"
  solution: |
    نعوّض $s = 12$ في الدالة:
    $A = s^2 = 12^2 = 12 \times 12 = 144$
    مساحة البلاطة $144\,\text{cm}^2$.
    ملاحظة: الأس 2 يعني ضرب العدد في نفسه، لذلك تزداد المساحة بسرعة أكبر من زيادة طول الضلع؛ ولهذا ليست الدالة $A = s^2$ دالة خطية.
  remediation: |
    إذا أجاب الطالب $24$ فقد ضاعف العدد بدل ضربه في نفسه، وإذا أجاب $48$ فقد حسب المحيط. ارسم مربعاً طول ضلعه $3$ وعدّ مربعاته الصغيرة (9) ليرى أن $3^2 = 3 \times 3$، ثم يعوّض بالعدد 12.
  misconceptions: [square-as-double, area-perimeter-confusion]
  qatar_link: 'الصف الثامن، الوحدة 3: 3-1 العلاقات والدوال (التعويض في قاعدة الدالة)؛ تمهيد للدالة غير الخطية في الدرس المحذوف 3-3 — بند جسري.'

- id: M8-A6-003
  topic: A6
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: pure
  time: 50
  stem: |
    يمثل المنحنى في الشكل العلاقة بين $x$ و$y$. ما قيمة $y$ عندما $x = 2$؟
  figure: {type: coord, xmin: -3, xmax: 3, ymin: 0, ymax: 10, unit: 26, curves: [{expr: "x**2 + 1"}], alt: "منحنى يمر بالنقاط (0, 1) و(1, 2) و(2, 5) و(3, 10)"}
  options: ['$3$', '$4$', '$5$', '$10$']
  option_values: [3, 4, 5, 10]
  key: C
  verify: "2**2 + 1"
  rationale:
    A: 'يعامل العلاقة كأنها خطية: من $(0, 1)$ إلى $(1, 2)$ تزداد $y$ بمقدار 1، فيتوقع $y = 3$ عند $x = 2$؛ لكن المنحنى يصعد بسرعة أكبر.'
    B: 'يقرأ خط الشبكة الأدنى من النقطة بدل موضع المنحنى الصحيح (قراءة غير دقيقة للمحور $y$).'
    D: 'يقرأ قيمة $y$ عند $x = 3$ بدل $x = 2$.'
  solution: |
    نبدأ من $x = 2$ على المحور الأفقي ونصعد رأسياً حتى المنحنى، ثم نقرأ قيمة $y$ على المحور الرأسي: $y = 5$.
    يمر المنحنى بالنقاط $(0, 1)$ و$(1, 2)$ و$(2, 5)$ و$(3, 10)$، وزيادات $y$ بينها هي 1 ثم 3 ثم 5، أي أنها غير ثابتة؛ لذلك الدالة غير خطية، ولا يصح أن نتوقع $y = 3$ عند $x = 2$.
  remediation: |
    درّب الطالب على خطوات القراءة: من $x$ إلى المنحنى ثم إلى $y$. ثم دوّن النقاط في جدول وقارن الزيادات (1 ثم 3 ثم 5) ليلاحظ أنها تكبر، ولذلك لا يمكن التنبؤ بقيمة $y$ بإضافة زيادة ثابتة.
  misconceptions: [constant-difference-assumption, misread-grid-line, read-wrong-x]
  qatar_link: 'الصف الثامن، الوحدة 3: 3-1 العلاقات والدوال (قراءة قيم من التمثيل البياني)؛ والدرس المحذوف 3-3 — بند جسري.'

- id: M8-A6-004
  topic: A6
  cognitive: knowing
  area: compute
  difficulty: easy
  benchmark: intermediate
  format: multi_numeric
  context: pure
  time: 80
  stem: |
    يبيّن الجدول بعض قيم الدالة $y = x^2 + 1$. أوجد القيم الناقصة.
  table: {headers: ['$x$', '$-3$', '$-1$', '$0$', '$2$', '$4$'], rows: [['$y$', '$?$', '$?$', '$1$', '$5$', '$?$']], row_headers: true}
  fields:
    - {label: 'قيمة $y$ عند $x = -3$', value: 10}
    - {label: 'قيمة $y$ عند $x = -1$', value: 2}
    - {label: 'قيمة $y$ عند $x = 4$', value: 17}
  scoring: {mode: partial, partial_min: 2}
  verify: "[(-3)**2 + 1, (-1)**2 + 1, 4**2 + 1]"
  solution: |
    نعوّض كل قيمة لـ $x$ في الدالة $y = x^2 + 1$:
    عند $x = -3$: $y = (-3)^2 + 1 = 9 + 1 = 10$
    عند $x = -1$: $y = (-1)^2 + 1 = 1 + 1 = 2$
    عند $x = 4$: $y = 4^2 + 1 = 16 + 1 = 17$
    لاحظ أن مربع العدد السالب موجب، لذلك $(-3)^2 = 9$ وليس $-9$.
  remediation: |
    ذكّر الطالب بأن $(-3)^2 = (-3) \times (-3) = 9$ لأن حاصل ضرب عددين سالبين موجب، وبأن الأس يُحسب قبل الجمع. ويمكن التحقق بالتماثل: $x = -1$ و$x = 1$ يعطيان قيمة $y$ نفسها.
  misconceptions: [negative-square-sign, square-as-double, forget-constant-term]
  qatar_link: 'الصف الثامن، الوحدة 3: 3-1 العلاقات والدوال (جدول قيم الدالة)؛ تمهيد للدالة غير الخطية في الدرس المحذوف 3-3 — بند جسري.'

- id: M8-A6-005
  topic: A6
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: dragdrop_categorize
  context: pure
  time: 100
  stem: |
    صنّف كل بطاقة (معادلة أو جدول قيم) بسحبها إلى الفئة المناسبة: دالة خطية أو دالة غير خطية.
  hint: في المعادلة ابحث عن $x^2$، وفي الجدول احسب الفروق بين قيم $y$ المتتالية.
  categories: ['دالة خطية', 'دالة غير خطية']
  cards:
    - {id: t2, text: '$\begin{array}{c|cccc} x & 0 & 1 & 2 & 3 \\ \hline y & 0 & 1 & 4 & 9 \end{array}$'}
    - {id: e1, text: '$y = 4x - 1$'}
    - {id: t1, text: '$\begin{array}{c|cccc} x & 0 & 1 & 2 & 3 \\ \hline y & 2 & 5 & 8 & 11 \end{array}$'}
    - {id: e2, text: '$y = x^2 + 3$'}
    - {id: e3, text: '$y = 8 - 2x$'}
    - {id: t3, text: '$\begin{array}{c|cccc} x & 1 & 2 & 3 & 4 \\ \hline y & 3 & 5 & 9 & 15 \end{array}$'}
  key:
    e1: 'دالة خطية'
    e2: 'دالة غير خطية'
    e3: 'دالة خطية'
    t1: 'دالة خطية'
    t2: 'دالة غير خطية'
    t3: 'دالة غير خطية'
  verify: "(lambda lin: lin([4*t - 1 for t in range(4)]) and not lin([t**2 + 3 for t in range(4)]) and lin([8 - 2*t for t in range(4)]) and lin([2, 5, 8, 11]) and not lin([0, 1, 4, 9]) and not lin([3, 5, 9, 15]))(lambda v: len(set([v[i + 1] - v[i] for i in range(len(v) - 1)])) == 1)"
  solution: |
    الدالة الخطية رسمها مستقيم، ومعادلتها من الصورة $y = mx + b$ ولا يظهر فيها $x$ مرفوعاً لقوة. وفي الجدول تكون الفروق بين قيم $y$ المتتالية ثابتة عندما تزداد قيم $x$ بمقدار ثابت.
    المعادلات: $y = 4x - 1$ و$y = 8 - 2x$ خطيتان، أما $y = x^2 + 3$ ففيها $x^2$ فهي غير خطية.
    الجداول: فروق $y$ في الجدول الأول 3 و3 و3 (ثابتة) فهو خطي. وفروق الجدول الثاني 1 و3 و5، وفروق الجدول الثالث 2 و4 و6، وهي غير ثابتة، فكلاهما غير خطي.
  remediation: |
    درّب الطالب على قاعدتين: في المعادلة، هل يوجد $x^2$؟ وفي الجدول، هل الفروق بين قيم $y$ متساوية؟ ثم ارسم نقاط كل جدول ليرى أن نقاط الدالة الخطية تقع على مستقيم وأن غيرها تنحني. انتبه إلى أن الإشارة السالبة أو الحد الثابت لا يجعلان الدالة غير خطية.
  misconceptions: [increasing-means-linear, minus-sign-means-nonlinear, constant-term-means-nonlinear]
  qatar_link: 'الصف الثامن، الوحدة 3: الدرس المحذوف 3-3 (مقارنة الدوال الخطية وغير الخطية) — بند جسري؛ ويستند إلى 3-1 والمعادلات الخطية $y = mx + b$ في الوحدة 2.'

- id: M8-A6-006
