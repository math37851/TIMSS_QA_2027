- id: M8-D3-009
  topic: D3
  cognitive: applying
  area: implement
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: real
  time: 75
  stem: |
    سجّل سالم عدد دقائق تدريبه في 5 أيام: $45,\ 60,\ 30,\ 55,\ 50$ (المتوسط الحسابي $48$ والوسيط $50$).
    في اليوم السادس تدرّب $36$ دقيقة. ماذا يحدث للمتوسط الحسابي وللوسيط بعد إضافة هذه القيمة؟
  options:
    - 'ينقص المتوسط الحسابي، ولا يتغير الوسيط'
    - 'لا يتغير المتوسط الحسابي ولا الوسيط'
    - 'ينقص المتوسط الحسابي، وينقص الوسيط'
    - 'يزداد المتوسط الحسابي، وينقص الوسيط'
  key: C
  rationale:
    A: 'يظن أن الوسيط لا يتأثر بالقيمة المضافة، لكنه يصبح متوسط القيمتين الأوسطتين بعد الإضافة ($45$ و$50$).'
    B: 'يظن أن إضافة قيمة واحدة لا تغيّر المقياسين، لكنها تضيف إلى المجموع وإلى عدد القيم.'
    D: 'يظن أن زيادة عدد القيم ترفع المتوسط الحسابي، مع أن القيمة المضافة $36$ أقل من $48$.'
  verify: "(lambda L, v: mean(L) == 48 and median(L) == 50 and [mean(L + [v]) < mean(L) and median(L + [v]) == median(L), mean(L + [v]) == mean(L) and median(L + [v]) == median(L), mean(L + [v]) < mean(L) and median(L + [v]) < median(L), mean(L + [v]) > mean(L) and median(L + [v]) < median(L)] == [False, False, True, False])([45, 60, 30, 55, 50], 36)"
  solution: |
    بعد إضافة $36$ تصبح القيم: $45,\ 60,\ 30,\ 55,\ 50,\ 36$.
    المتوسط الحسابي الجديد $= \frac{276}{6} = 46$، وهو أقل من $48$.
    بعد الترتيب: $30,\ 36,\ 45,\ 50,\ 55,\ 60$ ← الوسيط الجديد $= \frac{45 + 50}{2} = 47.5$، وهو أقل من $50$.
    إذن ينقص المتوسط الحسابي وينقص الوسيط.
  remediation: |
    اطلب من الطالب حساب المقياسين قبل الإضافة وبعدها ثم مقارنتهما. وضّح أن إضافة قيمة أقل من المتوسط الحسابي تخفضه، وأن الوسيط يتحرك نحو القيمة المضافة.
  misconceptions: [median-unaffected-by-added-value, mean-unchanged-by-added-value]
  qatar_link: "الصف السادس — المتوسط الحسابي والوسيط"

- id: M8-D3-010
  topic: D3
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: intermediate
  format: mc
  context: qatar
  time: 90
  stem: |
    يبيّن الجدول عدد الأهداف التي سجّلها فريق مدرسة لوسيل في 10 مباريات من دوري المدارس (بيانات افتراضية).
    ما المتوسط الحسابي لعدد الأهداف في المباراة الواحدة؟
  table:
    headers: ['عدد الأهداف في المباراة', 'عدد المباريات']
    rows: [['0', '1'], ['1', '1'], ['2', '3'], ['3', '4'], ['4', '1']]
  options: ['$2$', '$2.3$', '$2.5$', '$3$']
  option_values: [2, 2.3, 2.5, 3]
  key: B
  rationale:
    A: 'يحسب متوسط القيم $0,\ 1,\ 2,\ 3,\ 4$ مهملاً التكرارات.'
    C: 'هذا هو الوسيط (متوسط القيمتين الأوسطتين $2$ و$3$) وليس المتوسط الحسابي.'
    D: 'هذا هو المنوال (القيمة الأكثر تكراراً) وليس المتوسط الحسابي.'
  verify: "mean([0, 1, 2, 2, 2, 3, 3, 3, 3, 4])"
  solution: |
    مجموع الأهداف $= 0 \times 1 + 1 \times 1 + 2 \times 3 + 3 \times 4 + 4 \times 1 = 23$.
    عدد المباريات $= 1 + 1 + 3 + 4 + 1 = 10$.
    المتوسط الحسابي $= 23 \div 10 = 2.3$ هدفاً في المباراة.
  remediation: |
    اطلب من الطالب إضافة عمود جديد إلى الجدول بعنوان (عدد الأهداف × عدد المباريات) ثم جمع الأعمدة. نبّه إلى أن القسمة تكون على مجموع التكرارات (عدد المباريات) لا على عدد الصفوف.
  misconceptions: [ignore-frequencies, mode-median-confusion, divide-by-wrong-count]
  qatar_link: "الصف السادس — الجدول التكراري والمتوسط الحسابي"

- id: M8-D3-011
  topic: D3
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: intermediate
  format: numeric
  context: qatar
  time: 90
  stem: |
    اشترت أسرة من سوق واقف 5 أنواع من التمور (بيانات افتراضية). كانت أسعار الكيلوغرام الواحد بالريال لأربعة أنواع منها:
    $42,\ 58,\ 66,\ 72$
    فإذا كان المتوسط الحسابي لأسعار الأنواع الخمسة $60$ ريالاً للكيلوغرام، فكم ريالاً سعر الكيلوغرام من النوع الخامس؟
  answer: {value: 62, unit: "ريال"}
  verify: "5 * 60 - (42 + 58 + 66 + 72)"
  solution: |
    مجموع الأسعار الخمسة $= 5 \times 60 = 300$.
    مجموع الأسعار الأربعة المعروفة $= 42 + 58 + 66 + 72 = 238$.
    سعر النوع الخامس $= 300 - 238 = 62$ ريالاً.
  remediation: |
    علّم الطالب القاعدة: المجموع $=$ المتوسط الحسابي $\times$ عدد القيم، ثم يطرح مجموع القيم المعروفة ليجد القيمة الناقصة، ويتحقق بحساب المتوسط الحسابي للقيم الخمس.
  misconceptions: [missing-value-equals-mean, mean-equals-sum]
  qatar_link: "الصف السادس — المتوسط الحسابي وإيجاد قيمة ناقصة"


