- id: M8-D3-002
  topic: D3
  cognitive: knowing
  area: recall
  difficulty: foundation
  benchmark: low
  format: mc
  context: pure
  time: 30
  stem: |
    أيّ العبارات الآتية تصف الوسيط لمجموعة من القيم؟
  options:
    - 'القيمة الأكثر تكراراً'
    - 'القيمة التي تقع في المنتصف بعد ترتيب القيم'
    - 'مجموع القيم مقسوماً على عددها'
    - 'الفرق بين أكبر قيمة وأصغر قيمة'
  key: B
  rationale:
    A: 'هذا وصف المنوال: القيمة الأكثر ظهوراً، وليس الوسيط.'
    C: 'هذا وصف المتوسط الحسابي: يُحسب بجمع القيم ثم القسمة على عددها.'
    D: 'هذا وصف المدى: يقيس انتشار القيم لا مركزها.'
  verify: "(lambda L: [max(set(L), key=L.count) == median(L), sorted(L)[len(L) // 2] == median(L), mean(L) == median(L), max(L) - min(L) == median(L)])([20, 2, 9, 3, 2]) == [False, True, False, False]"
  solution: |
    الوسيط هو القيمة التي تقع في منتصف القيم بعد ترتيبها تصاعدياً (أو تنازلياً).
    القيمة الأكثر تكراراً هي المنوال، ومجموع القيم مقسوماً على عددها هو المتوسط الحسابي، والفرق بين أكبر قيمة وأصغر قيمة هو المدى.
  remediation: |
    اطلب من الطالب ترتيب خمسة أعداد على بطاقات وتحديد العدد الأوسط، ثم ربط كل مصطلح (المنوال، الوسيط، المتوسط الحسابي، المدى) بمثال عددي صغير.
  misconceptions: [mode-median-confusion, mean-median-confusion, range-median-confusion]
  qatar_link: "الصف السادس — المتوسط الحسابي والوسيط والمنوال والمدى"

- id: M8-D3-003
  topic: D3
  cognitive: knowing
  area: compute
  difficulty: foundation
  benchmark: low
  format: numeric
  context: real
  time: 40
  stem: |
    كان مصروف سلمان اليومي بالريال خلال 5 أيام:
    $12,\ 8,\ 15,\ 9,\ 6$
    ما المتوسط الحسابي لمصروفه اليومي؟
  answer: {value: 10, unit: "ريال"}
  verify: "mean([12, 8, 15, 9, 6])"
  solution: |
    المجموع $= 12 + 8 + 15 + 9 + 6 = 50$.
    المتوسط الحسابي $= 50 \div 5 = 10$ ريالات.
  remediation: |
    ذكّر الطالب بأن المتوسط الحسابي هو مجموع القيم مقسوماً على عددها، ودرّبه على التحقق بالتقدير: يقع المتوسط الحسابي بين أصغر قيمة وأكبر قيمة.
  misconceptions: [divide-by-wrong-count, mean-equals-sum]
  qatar_link: "الصف السادس — حساب المتوسط الحسابي"

