    أيّ العبارات الآتية صحيحة؟
  figure:
    - {type: dot_plot, min: 1, max: 10, step: 1, counts: {5: 2, 6: 4, 7: 2}, title: 'متحف قطر الوطني', x_label: 'عدد الزوّار في اليوم (بالمئات)', width: 340, r: 6, alt: 'مخطط نقاط لعدد زوّار متحف قطر الوطني خلال 8 أيام'}
    - {type: dot_plot, min: 1, max: 10, step: 1, counts: {2: 1, 4: 1, 5: 1, 6: 2, 7: 1, 8: 1, 10: 1}, title: 'متحف الفن الإسلامي', x_label: 'عدد الزوّار في اليوم (بالمئات)', width: 340, r: 6, alt: 'مخطط نقاط لعدد زوّار متحف الفن الإسلامي خلال 8 أيام'}
  options:
    - 'المتوسطان الحسابيان متساويان، لكن عدد الزوّار في متحف الفن الإسلامي أكثر تفاوتاً من يوم إلى آخر'
    - 'متوسط عدد الزوّار في متحف الفن الإسلامي أكبر، لأنه سجّل أعلى عدد زوّار في يوم واحد'
    - 'المتوسطان الحسابيان متساويان، لذلك فالتوزيعان متطابقان'
    - 'وسيط عدد الزوّار في متحف قطر الوطني أصغر من وسيط عدد الزوّار في متحف الفن الإسلامي'
  key: A
  rationale:
    B: 'يظن أن أعلى قيمة تحدد المتوسط الحسابي؛ لكن المتوسط الحسابي في المتحفين يساوي $6$ مئات في اليوم.'
    C: 'يظن أن تساوي المتوسطين الحسابيين يعني تطابق التوزيعين، مع أن مدى الأول $2$ ومدى الثاني $8$.'
    D: 'الوسيطان متساويان ($6$ مئات لكل منهما)، فوسيط متحف قطر الوطني ليس أصغر.'
  verify: "(lambda A, B: [mean(A) == mean(B) and max(B) - min(B) > max(A) - min(A), mean(B) > mean(A), sorted(A) == sorted(B), median(A) < median(B)] == [True, False, False, False])([5, 5, 6, 6, 6, 6, 7, 7], [2, 4, 5, 6, 6, 7, 8, 10])"
  solution: |
    متحف قطر الوطني: القيم $5,\ 5,\ 6,\ 6,\ 6,\ 6,\ 7,\ 7$ ← المجموع $48$، والمتوسط الحسابي $48 \div 8 = 6$، والوسيط $\frac{6 + 6}{2} = 6$، والمدى $7 - 5 = 2$.
    متحف الفن الإسلامي: القيم $2,\ 4,\ 5,\ 6,\ 6,\ 7,\ 8,\ 10$ ← المجموع $48$، والمتوسط الحسابي $48 \div 8 = 6$، والوسيط $\frac{6 + 6}{2} = 6$، والمدى $10 - 2 = 8$.
    المتوسطان الحسابيان متساويان والوسيطان متساويان، لكن مدى متحف الفن الإسلامي أكبر، فأعداد زوّاره أكثر تفاوتاً من يوم إلى آخر.
    إذن العبارة الصحيحة: المتوسطان الحسابيان متساويان، لكن عدد الزوّار في متحف الفن الإسلامي أكثر تفاوتاً.
  remediation: |
    اطلب من الطالب حساب المتوسط الحسابي والوسيط والمدى لكل مجموعة، ثم مقارنة المقاييس الثلاثة.
    وضّح أن تساوي المتوسطين الحسابيين لا يعني تشابه التوزيعين، وأن المدى الأكبر يدل على تفاوت أكبر بين القيم.
  misconceptions: [max-value-determines-mean, same-mean-same-distribution, ignore-spread]
  qatar_link: "الصف السادس — مخطط النقاط والمتوسط الحسابي والوسيط؛ الصف السابع — المقارنة بين مجموعتين"

- id: M8-D3-018
  topic: D3
  cognitive: reasoning
  area: analyze
  difficulty: hard
  benchmark: high
  format: dragdrop_categorize
  context: pure
  time: 150
  stem: |
    مجموعة قيمها $4,\ 6,\ 10,\ 12,\ 18$، ومتوسطها الحسابي $10$.
    صنّف كل تغيير من التغييرات الآتية بحسب أثره في المتوسط الحسابي (يُطبَّق كل تغيير على المجموعة الأصلية وحدها).
  hint: 'قارن القيمة المضافة أو المحذوفة بالمتوسط الحسابي $10$ قبل أن تحسب.'
  categories: ['يزداد المتوسط الحسابي', 'ينقص المتوسط الحسابي', 'لا يتغير المتوسط الحسابي']
  cards:
    - {id: c1, text: 'إضافة القيمة $10$'}
    - {id: c2, text: 'إضافة القيمتين $7$ و$13$'}
    - {id: c3, text: 'حذف القيمة $18$'}
    - {id: c4, text: 'إضافة القيمة $6$'}
    - {id: c5, text: 'حذف القيمة $4$'}
    - {id: c6, text: 'إضافة القيمة $15$'}
    - {id: c7, text: 'حذف القيمة $10$'}
  key: {c1: 'لا يتغير المتوسط الحسابي', c2: 'لا يتغير المتوسط الحسابي', c3: 'ينقص المتوسط الحسابي', c4: 'ينقص المتوسط الحسابي', c5: 'يزداد المتوسط الحسابي', c6: 'يزداد المتوسط الحسابي', c7: 'لا يتغير المتوسط الحسابي'}
  verify: "(lambda L: mean(L) == 10 and mean(L + [10]) == mean(L) and mean(L + [7, 13]) == mean(L) and mean([v for v in L if v != 10]) == mean(L) and mean([v for v in L if v != 18]) < mean(L) and mean(L + [6]) < mean(L) and mean([v for v in L if v != 4]) > mean(L) and mean(L + [15]) > mean(L))([4, 6, 10, 12, 18])"
  solution: |
    المجموع $= 4 + 6 + 10 + 12 + 18 = 50$ وعدد القيم $5$، فالمتوسط الحسابي $= 10$.
    لا يتغير: إضافة $10$ ← $\frac{60}{6} = 10$ · إضافة $7$ و$13$ (مجموعهما $20$، أي ضعف المتوسط) ← $\frac{70}{7} = 10$ · حذف $10$ ← $\frac{40}{4} = 10$.
    ينقص: حذف $18$ ← $\frac{32}{4} = 8$ · إضافة $6$ ← $\frac{56}{6} \approx 9.3$.
    يزداد: حذف $4$ ← $\frac{46}{4} = 11.5$ · إضافة $15$ ← $\frac{65}{6} \approx 10.8$.
    القاعدة: قيمة تساوي المتوسط الحسابي لا تغيّره إضافةً أو حذفاً؛ وقيمة أكبر منه ترفعه عند إضافتها وتخفضه عند حذفها؛ وقيمة أصغر منه تخفضه عند إضافتها وترفعه عند حذفها.
  remediation: |
    درّب الطالب على مقارنة القيمة المضافة أو المحذوفة بالمتوسط الحسابي الحالي قبل الحساب، ثم التحقق بحساب المتوسط الجديد.
    نبّه إلى أن حذف قيمة تساوي المتوسط الحسابي لا يغيّره، وأن إضافة قيمتين مجموعهما ضعف المتوسط الحسابي لا تغيّره أيضاً.
  misconceptions: [adding-value-always-raises-mean, deleting-value-always-lowers-mean]
  qatar_link: "الصف السادس — المتوسط الحسابي وأثر إضافة قيمة أو حذفها"

- id: M8-D3-019
  topic: D3
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: advanced
  format: cr_explain
  context: qatar
  time: 240
  stem: |
    شارك 10 طلاب من كل فصل من فصلين في الصف الثامن في حملة تبرعات بمناسبة اليوم الوطني (بيانات افتراضية).
    يبيّن الجدول تبرعات طلاب الفصل الأول، ويبيّن مخطط النقاط تبرعات طلاب الفصل الثاني، وتمثّل كل نقطة طالباً واحداً.
    قال أحد الطلاب: «تبرّع طلاب الفصل الأول عادةً بمبالغ أكبر، لأن المتوسط الحسابي لتبرعاتهم أكبر».
    (1) احسب المتوسط الحسابي والوسيط لتبرعات كل فصل.
    (2) هل توافق على قول الطالب؟ وضّح إجابتك مستعملاً المقياسين.
  table:
    headers: ['مبلغ التبرع (ريال)', 'عدد طلاب الفصل الأول']
    rows: [['10', '4'], ['20', '4'], ['100', '2']]
  figure: {type: dot_plot, min: 20, max: 40, step: 5, counts: {20: 1, 25: 2, 30: 4, 35: 2, 40: 1}, title: 'تبرعات طلاب الفصل الثاني', x_label: 'مبلغ التبرع (ريال)', alt: 'مخطط نقاط لتبرعات 10 طلاب في الفصل الثاني'}
  points: 2
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يحسب المتوسطين الحسابيين ($32$ و$30$) والوسيطين ($20$ و$30$) بصورة صحيحة، ولا يوافق على قول الطالب، ويفسّر ذلك بأن تبرعين كبيرين ($100$ ريال لكل منهما) رفعا المتوسط الحسابي للفصل الأول، بينما يبيّن الوسيط أن التبرع المعتاد في الفصل الثاني ($30$ ريالاً) أكبر منه في الفصل الأول ($20$ ريالاً).'}
      - {code: 10, points: 1, desc: 'يحسب ثلاث قيم على الأقل من القيم الأربع بصورة صحيحة، لكن الاستنتاج أو التفسير ناقص أو غير صحيح (مثل: يوافق على القول اعتماداً على المتوسط الحسابي وحده، أو لا يوافق دون الإشارة إلى أثر التبرعين الكبيرين أو إلى الوسيط)؛ أو يقدم استنتاجاً وتفسيراً صحيحين مع خطأ حسابي في قيمة واحدة.'}
      - {code: 70, points: 0, desc: 'يحسب أقل من ثلاث قيم صحيحة دون تفسير صحيح، أو يستنتج دون حساب (مثل: يوافق لأن $32$ أكبر من $30$ دون النظر في الوسيط).'}
    examples:
      correct:
        - 'الفصل الأول: المتوسط الحسابي $32$ والوسيط $20$. الفصل الثاني: المتوسط الحسابي $30$ والوسيط $30$. لا أوافق؛ فالمتوسط الحسابي للفصل الأول ارتفع بسبب تبرعين كبيرين ($100$ ريال)، أما الوسيط فيبيّن أن التبرع المعتاد في الفصل الثاني أكبر منه في الفصل الأول.'
      incorrect:
        - 'المتوسط الحسابي للفصل الأول $32$ وهو أكبر من $30$، فالطالب على صواب.'
        - 'لا أوافق لأن الفصل الثاني أفضل.'
  model_answer: |
    الفصل الأول: المجموع $= 4 \times 10 + 4 \times 20 + 2 \times 100 = 320$، فالمتوسط الحسابي $= 320 \div 10 = 32$. القيم مرتبة: $10,\ 10,\ 10,\ 10,\ 20,\ 20,\ 20,\ 20,\ 100,\ 100$، والوسيط $\frac{20 + 20}{2} = 20$.
    الفصل الثاني: المجموع $= 20 + 2 \times 25 + 4 \times 30 + 2 \times 35 + 40 = 300$، فالمتوسط الحسابي $= 30$، والوسيط $= 30$.
    لا أوافق: المتوسط الحسابي للفصل الأول ($32$) أكبر قليلاً، لكن تبرعين كبيرين ($100$ ريال لكل منهما) رفعاه؛ أما الوسيط فيبيّن أن التبرع المعتاد في الفصل الأول ($20$ ريالاً) أقل منه في الفصل الثاني ($30$ ريالاً).
  verify: "(lambda A, B: mean(A) == 32 and mean(B) == 30 and median(A) == 20 and median(B) == 30 and mean(A) > mean(B) and median(A) < median(B))([10, 10, 10, 10, 20, 20, 20, 20, 100, 100], [20, 25, 25, 30, 30, 30, 30, 35, 35, 40])"
  solution: |
    الفصل الأول (من الجدول): المجموع $= 4 \times 10 + 4 \times 20 + 2 \times 100 = 320$، فالمتوسط الحسابي $= 320 \div 10 = 32$ ريالاً.
    القيم مرتبة: $10,\ 10,\ 10,\ 10,\ 20,\ 20,\ 20,\ 20,\ 100,\ 100$، والقيمتان الأوسطتان (الخامسة والسادسة) $20$ و$20$، فالوسيط $= 20$ ريالاً.
    الفصل الثاني (من مخطط النقاط): المجموع $= 20 + 2 \times 25 + 4 \times 30 + 2 \times 35 + 40 = 300$، فالمتوسط الحسابي $= 30$ ريالاً، والقيمتان الأوسطتان $30$ و$30$، فالوسيط $= 30$ ريالاً.
    المتوسط الحسابي للفصل الأول ($32$) أكبر قليلاً من الثاني ($30$)، لكن وسيطه ($20$) أصغر من وسيط الثاني ($30$).
    تبرعان كبيران ($100$ ريال لكل منهما) رفعا المتوسط الحسابي للفصل الأول، بينما تبرع 8 طلاب من أصل 10 في ذلك الفصل بمبلغ $20$ ريالاً أو أقل. فالوسيط يصف التبرع المعتاد بصورة أفضل، ولا نوافق على قول الطالب.
  remediation: |
    اطلب من الطالب حساب المقياسين لكل فصل، ثم تمثيل تبرعات الفصل الأول بمخطط نقاط ليرى أن التبرعين الكبيرين بعيدان عن بقية القيم.
    ناقش: متى يكون الوسيط أنسب من المتوسط الحسابي لوصف القيمة المعتادة؟ وماذا نفعل إذا أعطى المقياسان استنتاجين مختلفين؟
  misconceptions: [mean-always-best, compare-one-quantity, ignore-frequencies]
  qatar_link: "الصف السادس — المتوسط الحسابي والوسيط والجدول التكراري؛ الصف السابع — المقارنة بين مجموعتين"

- id: M8-D3-020
  topic: D3
  cognitive: reasoning
  area: generalize
  difficulty: hard
  benchmark: high
  format: cr_explain
  context: real
  time: 210
  stem: |
    درجات 5 طلاب في اختبار قصير من 20 درجة: $12,\ 14,\ 15,\ 16,\ 18$، ومتوسطها الحسابي $15$.
    (1) أضاف المعلم $2$ إلى درجة كل طالب. ما المتوسط الحسابي الجديد؟
    (2) حوّل المعلم الدرجات الأصلية إلى درجات من 100 بضرب درجة كل طالب في $5$. ما المتوسط الحسابي الجديد؟
    (3) هل تنطبق النتيجتان نفسهما على أي مجموعة من القيم؟ اكتب القاعدة العامة في كل حالة، ووضّح لماذا تصح.
  points: 2
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يجد المتوسطين الجديدين ($17$ و$75$)، ويذكر القاعدتين العامتين (إضافة العدد نفسه إلى كل قيمة تضيفه إلى المتوسط الحسابي، وضرب كل قيمة في العدد نفسه يضرب المتوسط الحسابي في ذلك العدد)، ويبرّر تبريراً عاماً غير مقتصر على المثال، مثل: المجموع يزداد بمقدار (عدد القيم × العدد المضاف) أو يُضرب في العدد، وعدد القيم لا يتغير.'}
      - {code: 10, points: 1, desc: 'يجد المتوسطين الجديدين ويذكر القاعدتين أو إحداهما، لكن التبرير غائب أو يقتصر على المثال العددي أو غير صحيح؛ أو يقدم تبريراً عاماً صحيحاً لقاعدة واحدة فقط.'}
      - {code: 70, points: 0, desc: 'قيمة خاطئة لأحد المتوسطين دون تبرير صحيح (مثل: المتوسط الحسابي بعد الضرب في $5$ يصبح $20$)، أو قاعدة عامة خاطئة، أو لا إجابة.'}
    examples:
      correct:
        - '$17$ و$75$. نعم تنطبق: إضافة عدد إلى كل قيمة تزيد المجموع بمقدار (عدد القيم × العدد)، فيزيد المتوسط الحسابي بالعدد نفسه. وضرب كل قيمة في عدد يضرب المجموع فيه، فيُضرب المتوسط الحسابي فيه أيضاً لأن عدد القيم لم يتغير.'
      incorrect:
        - '$17$ و$75$، وتنطبق لأن الأمثلة صحيحة.'
        - 'بعد الضرب في $5$ يصبح المتوسط الحسابي $20$ لأن $15 + 5 = 20$.'
  model_answer: |
    (1) الدرجات الجديدة $14,\ 16,\ 17,\ 18,\ 20$ ومجموعها $85$، فالمتوسط الحسابي $85 \div 5 = 17$ أي $15 + 2$.
    (2) الدرجات الجديدة $60,\ 70,\ 75,\ 80,\ 90$ ومجموعها $375$، فالمتوسط الحسابي $375 \div 5 = 75$ أي $15 \times 5$.
    (3) نعم. إذا كان لدينا $n$ من القيم مجموعها $S$ فمتوسطها الحسابي $\frac{S}{n}$.
    إضافة $k$ إلى كل قيمة تزيد المجموع بمقدار $n \times k$، فيصبح المتوسط الحسابي $\frac{S + n \times k}{n} = \frac{S}{n} + k$.
    ضرب كل قيمة في $c$ يضرب المجموع في $c$، فيصبح المتوسط الحسابي $\frac{c \times S}{n} = c \times \frac{S}{n}$.
  verify: "mean([12, 14, 15, 16, 18]) == 15 and mean([12 + 2, 14 + 2, 15 + 2, 16 + 2, 18 + 2]) == 17 and mean([12 * 5, 14 * 5, 15 * 5, 16 * 5, 18 * 5]) == 75"
  solution: |
    (1) الدرجات الجديدة: $14,\ 16,\ 17,\ 18,\ 20$، ومجموعها $85$، فالمتوسط الحسابي الجديد $= 85 \div 5 = 17$، أي $15 + 2$.
    (2) الدرجات الجديدة: $60,\ 70,\ 75,\ 80,\ 90$، ومجموعها $375$، فالمتوسط الحسابي الجديد $= 375 \div 5 = 75$، أي $15 \times 5$.
    (3) نعم، تنطبق القاعدتان على أي مجموعة من $n$ من القيم مجموعها $S$ ومتوسطها الحسابي $\frac{S}{n}$:
    إضافة $k$ إلى كل قيمة تزيد المجموع بمقدار $n \times k$، فيصبح المتوسط الحسابي $\frac{S + n \times k}{n} = \frac{S}{n} + k$.
    ضرب كل قيمة في $c$ يضرب المجموع في $c$، فيصبح المتوسط الحسابي $\frac{c \times S}{n} = c \times \frac{S}{n}$.
    عدد القيم $n$ لا يتغير في الحالتين، ولهذا تتغير النتيجة بالعدد نفسه.
  remediation: |
    اطلب من الطالب تجربة القاعدتين على مجموعة أخرى، ثم كتابة المجموع قبل التغيير وبعده لتظهر العلاقة العامة.
    نبّه إلى أن الأمثلة وحدها لا تثبت القاعدة، وأن التبرير العام يعتمد على أن المجموع يزداد بمقدار ثابت لكل قيمة أو يُضرب في عدد ثابت، بينما عدد القيم لا يتغير.
  misconceptions: [examples-prove-general, shift-scale-confusion, operation-confusion]
  qatar_link: "الصف السادس — المتوسط الحسابي؛ الصف السابع — النسبة والتناسب (تحويل الدرجات)"

- id: M8-D3-021
  topic: D3
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: high
  format: select_explain
  context: real
  time: 150
  stem: |
    في إحدى المدارس، المتوسط الحسابي لدرجات 10 طلاب في المجموعة المتقدمة هو $90$، والمتوسط الحسابي لدرجات 40 طالباً في المجموعة العادية هو $60$.
    قالت سارة: «المتوسط الحسابي لدرجات الطلاب الخمسين معاً هو $75$، لأن $\frac{90 + 60}{2} = 75$».
    هل سارة على صواب؟ اختر، ثم برّر إجابتك.
  options: ["نعم، سارة على صواب", "لا، سارة ليست على صواب"]
  key: B
  points: 1
  rubric:
    full: 'يختار «لا»، ويبرّر بأن عدد طلاب المجموعتين مختلف ($10$ و$40$)، فالمتوسط الحسابي للجميع أقرب إلى $60$ منه إلى $90$ ولا يساوي $75$؛ أو يحسب المتوسط الصحيح $\frac{10 \times 90 + 40 \times 60}{50} = 66$.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تبرير صحيح (مثل: «لأن الحساب خاطئ»، أو «لأن المتوسط ليس $75$» دون ذكر اختلاف عدد الطلاب أو حساب المتوسط الصحيح).'
    examples:
      correct:
        - 'لا؛ لأن عدد طلاب المجموعة العادية أكبر بكثير ($40$ مقابل $10$)، فالمتوسط الحسابي للجميع أقرب إلى $60$. المجموع $900 + 2400 = 3300$، وبالقسمة على $50$ يكون المتوسط $66$.'
        - 'لا، لأن متوسطي المجموعتين لا يُجمعان ويُقسمان على $2$ إلا إذا كان عدد الطلاب متساوياً في المجموعتين.'
      incorrect:
        - 'نعم، لأن $\frac{90 + 60}{2} = 75$.'
        - 'لا، لأن سارة أخطأت في الحساب.'
  verify: "(lambda total: [total == 75, total != 75] == [False, True] and total == 66)(Rational(10 * 90 + 40 * 60, 50))"
  solution: |
    مجموع درجات المجموعة المتقدمة $= 10 \times 90 = 900$، ومجموع درجات المجموعة العادية $= 40 \times 60 = 2400$.
    مجموع درجات الطلاب الخمسين $= 900 + 2400 = 3300$.
    المتوسط الحسابي لهم جميعاً $= 3300 \div 50 = 66$، وليس $75$.
    السبب أن عدد طلاب المجموعة العادية أكبر بأربعة أمثال، فتؤثر درجاتها في المتوسط أكثر، فيقترب الناتج من $60$.
    متوسط المتوسطين ($75$) لا يساوي المتوسط الحسابي الكلي إلا إذا تساوى عدد الطلاب في المجموعتين.
  remediation: |
    ذكّر الطالب بأن المتوسط الحسابي الكلي $=$ مجموع كل الدرجات $\div$ عدد كل الطلاب، وليس متوسط المتوسطين.
    يحسب مجموع كل مجموعة بضرب متوسطها في عدد طلابها، ثم يجمع المجموعين ويقسم على $50$. ويتحقق منطقياً: المتوسط الكلي يقع بين $60$ و$90$ ويقترب من متوسط المجموعة الأكبر عدداً.
  misconceptions: [average-of-averages, group-sizes-ignored]
  qatar_link: "الصف السادس — المتوسط الحسابي؛ الصف السابع — المقارنة بين مجموعتين"
