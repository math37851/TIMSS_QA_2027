  figure: {type: dot_plot, min: 1, max: 7, step: 1, counts: {1: 1, 2: 1, 3: 2, 4: 3, 5: 3, 6: 4, 7: 2}, x_label: 'عدد الشتلات التي زرعها الطالب'}
