- id: M8-D3-001
  topic: D3
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: high
  format: select_explain
  context: real
  time: 150
  stem: |
    سجّلت نورة عدد الدقائق التي قضتها في القراءة خلال 7 أيام:
    $20,\ 25,\ 18,\ 22,\ 25,\ 20,\ 95$
    تريد نورة قيمة واحدة تمثّل وقت قراءتها المعتاد في اليوم. أيّهما يمثّل ذلك بصورة أفضل؟ اختر، ثم برّر إجابتك.
  options: ["المتوسط الحسابي", "الوسيط"]
  key: B
  points: 1
  rubric:
    full: 'يختار **الوسيط**، ويبرّر بأن القيمة $95$ متطرفة (أكبر كثيراً من بقية القيم) فترفع المتوسط الحسابي (نحو $32$ دقيقة) فوق معظم القيم، بينما الوسيط ($22$ دقيقة) قريب من القيم المعتادة. يُقبل التبرير دون حساب إذا أشار بوضوح إلى أثر القيمة المتطرفة.'
    zero: 'يختار المتوسط الحسابي، أو يختار الوسيط دون تبرير صحيح (مثل: «لأنه في المنتصف» دون الإشارة إلى القيمة المتطرفة).'
    examples:
      correct: ['الوسيط، لأن اليوم الذي قرأت فيه 95 دقيقة يرفع المتوسط كثيراً، والوسيط 22 قريب من باقي الأيام.']
      incorrect: ['المتوسط الحسابي لأنه يستعمل كل القيم.', 'الوسيط لأنه أسهل في الحساب.']
  verify: "median([20, 25, 18, 22, 25, 20, 95]) == 22 and mean([20, 25, 18, 22, 25, 20, 95]) > 30"
  solution: |
    بعد الترتيب: $18, 20, 20, 22, 25, 25, 95$ ← الوسيط $= 22$.
    المتوسط الحسابي $= \frac{225}{7} \approx 32.1$ دقيقة، وهو أكبر من 6 قيم من القيم السبع بسبب القيمة المتطرفة $95$.
    لذلك يمثّل الوسيط الوقت المعتاد بصورة أفضل.
  remediation: |
    اعرض البيانات على مخطط نقاط لتظهر القيمة المتطرفة بصرياً، ثم احسب المتوسط مع القيمة $95$ وبدونها وناقش الفرق.
  misconceptions: [mean-always-best, median-without-reason]
  qatar_link: "مقاييس النزعة المركزية — الصف السادس/السابع"


