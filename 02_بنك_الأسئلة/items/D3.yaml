- id: M8-D3-005
  topic: D3
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: low
  format: mc
  context: real
  time: 60
  stem: |
    سجّل متجر أحذية في أحد الأيام مقاسات الأحذية المبيعة:
    $36,\ 37,\ 38,\ 39,\ 40,\ 40,\ 40,\ 42$
    أيّ القيم الآتية تساعد صاحب المتجر على تحديد المقاس الذي يطلب منه أكبر عدد من الأزواج؟
  options: ['$42$', '$40$', '$39.5$', '$39$']
  option_values: [42, 40, 39.5, 39]
  key: B
  rationale:
    A: 'القيمة $42$ هي أكبر مقاس مبيع، وليست المقاس الأكثر مبيعاً.'
    C: 'القيمة $39.5$ هي الوسيط، وهي لا تحدّد المقاس الأكثر مبيعاً.'
    D: 'القيمة $39$ هي المتوسط الحسابي، وهو لا يحدّد المقاس الأكثر مبيعاً.'
  verify: "(lambda L: max(set(L), key=L.count))([36, 37, 38, 39, 40, 40, 40, 42])"
  solution: |
    المطلوب هو المقاس الأكثر مبيعاً، أي القيمة الأكثر تكراراً (المنوال).
    المقاس $40$ بيع 3 مرات، وكل مقاس آخر بيع مرة واحدة، فالمنوال $40$.
    أما المتوسط الحسابي ($39$) والوسيط ($39.5$) فيصفان مركز القيم ولا يحدّدان المقاس الأكثر مبيعاً.
  remediation: |
    وضّح للطالب أن لكل مقياس وظيفة: المنوال لاختيار الأكثر شيوعاً، والوسيط والمتوسط الحسابي لوصف مركز القيم. ثم اطلب أمثلة أخرى (أكثر الألوان طلباً، أكثر الأحجام مبيعاً).
  misconceptions: [mean-always-best, mode-median-confusion]
  qatar_link: "الصف السادس — مقاييس النزعة المركزية: اختيار المقياس المناسب"

- id: M8-D3-006
  topic: D3
  cognitive: knowing
  area: compute
  difficulty: easy
  benchmark: intermediate
  format: numeric
  context: qatar
  time: 60
  stem: |
    سجّل ماجد زمن انتظاره بالدقائق في 6 رحلات بمترو الدوحة (بيانات افتراضية):
    $9,\ 4,\ 12,\ 7,\ 5,\ 10$
    ما وسيط أزمنة الانتظار؟
  answer: {value: 8, unit: "دقيقة"}
  verify: "median([9, 4, 12, 7, 5, 10])"
  solution: |
    نرتّب القيم تصاعدياً: $4,\ 5,\ 7,\ 9,\ 10,\ 12$.
    عدد القيم زوجي (6)، فالوسيط هو متوسط القيمتين الأوسطتين:
    $\frac{7 + 9}{2} = 8$ دقائق.
  remediation: |
    درّب الطالب على ثلاث خطوات: رتّب القيم، حدّد القيمتين الأوسطتين، ثم احسب متوسطهما. نبّهه إلى أن أخذ منتصف القائمة قبل الترتيب يعطي نتيجة خاطئة.
  misconceptions: [median-without-sorting, even-median-pick-one]
  qatar_link: "الصف السادس — الوسيط لعدد زوجي من القيم"

- id: M8-D3-007
  topic: D3
  cognitive: applying
  area: formulate
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: real
  time: 60
  stem: |
    حصلت ليلى على الدرجات $72,\ 85,\ 90$ في ثلاثة اختبارات، وتريد أن يكون المتوسط الحسابي لدرجاتها في أربعة اختبارات $85$.
    إذا رمزنا إلى درجتها في الاختبار الرابع بالرمز $x$، فأيّ المعادلات الآتية تُستعمل لإيجاد $x$؟
  options:
    - '$\frac{72 + 85 + 90 + x}{4} = 85$'
    - '$\frac{72 + 85 + 90 + x}{3} = 85$'
    - '$72 + 85 + 90 + x = 85$'
    - '$\frac{72 + 85 + 90}{4} + x = 85$'
  key: A
  rationale:
    B: 'القسمة على $3$ (عدد الاختبارات المعروفة) بدل $4$؛ فالمتوسط الحسابي يشمل الاختبار الرابع أيضاً.'
    C: 'مساواة مجموع الدرجات بالمتوسط الحسابي دون القسمة على عدد الاختبارات.'
    D: 'القسمة على $4$ تشمل الدرجات الثلاث فقط، وتُضاف $x$ بعد القسمة.'
  verify: "[solve(Eq((72 + 85 + 90 + x) / 4, 85), x) == [93], solve(Eq((72 + 85 + 90 + x) / 3, 85), x) == [93], solve(Eq(72 + 85 + 90 + x, 85), x) == [93], solve(Eq(Rational(72 + 85 + 90, 4) + x, 85), x) == [93]] == [True, False, False, False]"
  solution: |
    المتوسط الحسابي لأربع درجات هو مجموعها مقسوماً على $4$، لذلك:
    $\frac{72 + 85 + 90 + x}{4} = 85$
    نضرب الطرفين في $4$: $247 + x = 340$ ← $x = 93$.
  remediation: |
    درّب الطالب على كتابة المتوسط الحسابي في صورة (مجموع كل القيم) ÷ (عددها)، ثم استعمال العلاقة: المجموع $=$ المتوسط الحسابي $\times$ عدد القيم لإيجاد قيمة ناقصة.
  misconceptions: [divide-by-wrong-count, mean-equals-sum, divide-part-only]
  qatar_link: "الصف السادس — المتوسط الحسابي؛ الصف السابع — كتابة المعادلات"

