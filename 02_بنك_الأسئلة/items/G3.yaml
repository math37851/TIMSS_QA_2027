- id: M8-G3-004
  topic: G3
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: dragdrop_categorize
  context: pure
  time: 90
  stem: |
    صنّف كل تحويل بحسب الخاصية التي يحفظها من خواص الشكل الأصلي، وذلك بسحب كل بطاقة إلى الفئة المناسبة.
  categories: ['يحفظ الأطوال والزوايا', 'يحفظ الزوايا فقط']
  cards:
    - 'إزاحة 3 وحدات إلى اليمين'
    - 'انعكاس في المحور $x$'
    - 'دوران $90^\circ$ حول نقطة الأصل'
    - 'دوران $180^\circ$ حول نقطة الأصل'
    - 'تمدد بمعامل $2$'
    - 'تمدد بمعامل $\frac{1}{3}$'
  key:
    'إزاحة 3 وحدات إلى اليمين': 'يحفظ الأطوال والزوايا'
    'انعكاس في المحور $x$': 'يحفظ الأطوال والزوايا'
    'دوران $90^\circ$ حول نقطة الأصل': 'يحفظ الأطوال والزوايا'
    'دوران $180^\circ$ حول نقطة الأصل': 'يحفظ الأطوال والزوايا'
    'تمدد بمعامل $2$': 'يحفظ الزوايا فقط'
    'تمدد بمعامل $\frac{1}{3}$': 'يحفظ الزوايا فقط'
  verify: "all([abs(k) == 1 for k in (1, 1, 1, 1)]) and all([abs(k) != 1 for k in (2, Rational(1, 3))])"
  solution: |
    الإزاحة والانعكاس والدوران تحرّك الشكل دون تغيير أطوال أضلاعه أو قياسات زواياه، فتكون الصورة مطابقة للأصل.
    أما التمدد فيضرب كل طول في معامل التمدد ($2$ أو $\frac{1}{3}$) وتبقى الزوايا كما هي، فتكون الصورة مشابهة للأصل وليست مطابقة له.
  remediation: |
    اطلب من الطلاب قياس أضلاع مثلث وزواياه ثم قياس صورته بعد كل تحويل،
    وتسجيل ما يتغير وما لا يتغير في جدول من عمودين.
  misconceptions: [dilation-preserves-length, dilation-changes-angles]
  hint: "قارن أطوال أضلاع الشكل بأطوال أضلاع صورته: أي التحويلات يغيّرها؟"
