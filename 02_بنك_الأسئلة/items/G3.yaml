  key: D
  verify: "[sorted([f(a, b) for (a, b) in [(3, 1), (6, 1), (3, 3)]]) == [(-2, 1), (1, 1), (1, 3)] for f in [lambda a, b: (-(a + 4), b), lambda a, b: (a + 4, -b), lambda a, b: (-a + 4, -b), lambda a, b: (-a + 4, b)]] == [False, False, False, True]"
  rationale:
    A: 'ترتيب التحويلين معكوس: الإزاحة أولاً تنقل $A(3, 1)$ إلى $(7, 1)$ ثم الانعكاس ينقلها إلى $(-7, 1)$ لا إلى $A''(1, 1)$. ترتيب التحويلات مهم.'
    B: 'الانعكاس في المحور $x$ ينقل $A(3, 1)$ إلى $(3, -1)$ أي تحت المحور $x$، بينما الصورة المعطاة فوقه.'
    C: 'الدوران $180^\circ$ ينقل $A(3, 1)$ إلى $(-3, -1)$ ثم الإزاحة إلى $(1, -1)$، أي تحت المحور $x$ لا فوقه.'
  solution: |
    ننظر إلى اتجاه المثلث: الضلع الأفقي $AB$ يمتد من $A$ نحو اليمين، وفي الصورة يمتد $A'B'$ من $A'$ نحو اليسار، فقد انقلب المثلث يميناً ويساراً. هذا انعكاس في المحور $y$.
    الانعكاس ينقل $A(3, 1)$ إلى $(-3, 1)$ و$B(6, 1)$ إلى $(-6, 1)$ و$C(3, 3)$ إلى $(-3, 3)$.
    ثم إزاحة 4 وحدات إلى اليمين تنقلها إلى $A'(1, 1)$ و$B'(-2, 1)$ و$C'(1, 3)$، وهي رؤوس الصورة المعطاة.
    لو عُكس الترتيب (إزاحة ثم انعكاس) لانتقل $A$ إلى $(7, 1)$ ثم إلى $(-7, 1)$؛ فالترتيب مهم. الإجابة الصحيحة D.
  remediation: |
    اطلب من الطلاب تتبّع رأس واحد (مثل $A$) على الشبكة بعد كل تحويل بالترتيب المذكور، ثم تجربة عكس الترتيب ليلاحظوا أن الصورة تتغير.
    ويمكن استعمال ورقة شفافة لتنفيذ الانعكاس ثم الإزاحة.
  misconceptions: [composition-order-reversed, reflect-wrong-axis, rotation-angle-confusion]
  hint: "حدّد أولاً هل انقلب المثلث، ثم تتبّع الرأس $A$ بعد كل تحويل."
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-4 تركيب التحويلات الهندسية"

- id: M8-G3-017
  topic: G3
  cognitive: applying
  area: represent
  difficulty: hard
  benchmark: advanced
  format: grid_plot
  context: pure
  time: 160
  stem: |
    المثلث ABC مرسوم على المستوى الإحداثي.
    أُجري عليه تحويلان بالترتيب الآتي: أولاً دوران $90^\circ$ في اتجاه عقارب الساعة حول نقطة الأصل، ثم إزاحة وحدتين إلى اليمين.
    ارسم صورة المثلث بعد التحويلين، وذلك بالنقر على مواقع رؤوس الصورة الثلاثة.
  grid: {xmin: -6, xmax: 6, ymin: -5, ymax: 6}
  given:
    polygons:
      - {points: [[-5, 1], [-2, 1], [-5, 3]], labels: ['A', 'B', 'C']}
  mode: polygon
  count: 3
  key: [[3, 5], [3, 2], [5, 5]]
  verify: "sorted(P) == sorted([(b + 2, -a) for (a, b) in [(-5, 1), (-2, 1), (-5, 3)]])"
  solution: |
    الخطوة الأولى: الدوران $90^\circ$ مع عقارب الساعة حول نقطة الأصل يحوّل $(x, y)$ إلى $(y, -x)$:
    $A(-5, 1) \rightarrow (1, 5)$ ، $B(-2, 1) \rightarrow (1, 2)$ ، $C(-5, 3) \rightarrow (3, 5)$.
    الخطوة الثانية: الإزاحة وحدتين إلى اليمين تضيف $2$ إلى الإحداثي $x$:
    $(1, 5) \rightarrow A'(3, 5)$ ، $(1, 2) \rightarrow B'(3, 2)$ ، $(3, 5) \rightarrow C'(5, 5)$.
    الصورة النهائية مطابقة للمثلث الأصلي في الشكل والقياس، وقد تغيّر موضعها واتجاهها فقط.
  remediation: |
    اطلب من الطلاب تنفيذ التحويل الأول على الرؤوس الثلاثة كلها وتسجيل النتائج في جدول، ثم تنفيذ الثاني على نتائج الأول.
    ويمكن استعمال ورقة شفافة لتدوير المثلث حول نقطة الأصل ثم تحريكه، ومقارنة الناتج بما يحدث عند عكس الترتيب أو عكس اتجاه الدوران.
  misconceptions: [direction-confusion, composition-order-reversed, x-y-coordinates-swapped]
  hint: "طبّق الدوران على الرؤوس الثلاثة أولاً، ثم طبّق الإزاحة على النتائج."
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-3 الدوران، والدرس 5-4 تركيب التحويلات الهندسية"

- id: M8-G3-018
  topic: G3
  cognitive: reasoning
  area: analyze
  difficulty: medium
  benchmark: high
  format: select_explain
  context: real
  time: 120
  stem: |
    في معرض مدرسي للصور، قالت ريم: «كل إطارات الصور المستطيلة متشابهة، لأن زوايا كل مستطيل قوائم».
    هل ريم على صواب؟ اختر الإجابة، ثم اشرح اختيارك بمثال.
  options:
    - 'نعم، ريم على صواب.'
    - 'لا، ريم ليست على صواب.'
  key: B
  points: 1
  rubric:
    full: 'يختار «لا» ويقدّم مثالاً مضاداً صحيحاً: مستطيلان زواياهما قوائم لكن نسبة الطول إلى العرض تختلف بينهما (مثل $2 \times 4$ و$2 \times 8$) مع بيان أن أضلاعهما المتناظرة غير متناسبة، أو يوضح أن تساوي الزوايا لا يكفي للتشابه وأنه لا بد من تناسب أطوال الأضلاع.'
    zero: 'يختار «نعم»، أو يختار «لا» دون مثال أو تبرير، أو يبرّر بسبب غير صحيح (مثل اختلاف المساحة أو المحيط فقط، أو أن المستطيلين مختلفان في الحجم).'
    examples:
      correct:
        - 'المستطيل $2 \times 4$ والمستطيل $2 \times 8$ زواياهما قوائم، لكن $\frac{2}{4} \neq \frac{2}{8}$ فأضلاعهما غير متناسبة، إذن هما غير متشابهين.'
        - 'مستطيل عرضه $3$ وطوله $6$ ومستطيل عرضه $3$ وطوله $9$: الزوايا متساوية لكن النسبتين $\frac{3}{6}$ و$\frac{3}{9}$ مختلفتان.'
      incorrect:
        - 'نعم، لأن كل المستطيلات زواياها قوائم.'
        - 'لا، لأن مساحتي المستطيلين مختلفتان.'
        - 'لا، لأن المستطيلات تختلف في الحجم.'
  verify: "Rational(2, 4) != Rational(2, 8)"
  solution: |
    ليست ريم على صواب. تساوي الزوايا (وهي قوائم في كل مستطيل) شرط واحد للتشابه، أما الشرط الثاني فهو تناسب أطوال الأضلاع المتناظرة.
    مثال مضاد: المستطيل $2 \times 4$ والمستطيل $2 \times 8$ زواياهما قوائم، لكن $\frac{2}{2} = 1$ و$\frac{4}{8} = \frac{1}{2}$ غير متساويين، فالمستطيلان غير متشابهين.
    يكفي مثال مضاد واحد لإبطال ادعاء يشمل كل المستطيلات.
  remediation: |
    اطلب من الطلاب رسم مستطيلين متساويي الزوايا مختلفي الشكل على ورق مربعات (مثل مربع ومستطيل طويل)، ثم قياس الأضلاع وحساب نسبة الطول إلى العرض لكل منهما،
    ليستنتجوا أن تساوي الزوايا وحده لا يكفي للتشابه، وتُناقَش فكرة المثال المضاد في إبطال الادعاءات العامة.
  misconceptions: [equal-angles-assumption]
  hint: "ابحث عن مستطيلين زواياهما قوائم لكن شكليهما مختلفان، وقارن نسبة طول كل منهما إلى عرضه."
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-7 الأشكال المتشابهة"

- id: M8-G3-019
  topic: G3
  cognitive: reasoning
  area: justify
  difficulty: medium
  benchmark: high
  format: select_explain
  context: qatar
  time: 140
  stem: |
    على كورنيش الدوحة يمرّ قاربان شراعيان تقليديان (الداو)، وشراع كل منهما على شكل مثلث.
    في الشراع الأول زاويتان قياسهما $40^\circ$ و$75^\circ$، وفي الشراع الثاني زاويتان قياسهما $65^\circ$ و$75^\circ$.
    هل الشراعان متشابهان؟ اختر الإجابة، ثم برّرها مستعملاً قياسات الزوايا.
  options:
    - 'نعم، الشراعان متشابهان.'
    - 'لا، الشراعان غير متشابهين.'
  key: A
  points: 1
  rubric:
    full: 'يختار «نعم» ويبرّر بحساب الزاوية الثالثة في كل شراع ($180^\circ - 40^\circ - 75^\circ = 65^\circ$ و$180^\circ - 65^\circ - 75^\circ = 40^\circ$)، ثم يذكر أن لكل مثلث الزوايا نفسها $40^\circ$ و$65^\circ$ و$75^\circ$، فالزوايا المتناظرة متساوية والمثلثان متشابهان.'
    zero: 'يختار «لا»، أو يختار «نعم» دون حساب الزاوية الثالثة في المثلثين (مثل الاكتفاء بأن للمثلثين زاوية $75^\circ$ مشتركة)، أو يبرّر بسبب غير صحيح مثل تساوي الأضلاع.'
    examples:
      correct:
        - 'الزاوية الثالثة في الأول $65^\circ$ وفي الثاني $40^\circ$، فزوايا كل منهما $40^\circ$ و$65^\circ$ و$75^\circ$، وتساوي الزوايا المتناظرة يعني أن المثلثين متشابهان.'
      incorrect:
        - 'لا، لأن زاوية $40^\circ$ لا تساوي زاوية $65^\circ$.'
        - 'نعم، لأن في كل منهما زاوية $75^\circ$.'
  verify: "180 - 40 - 75 == 65 and 180 - 65 - 75 == 40"
  solution: |
    مجموع زوايا المثلث $180^\circ$.
    الزاوية الثالثة في الشراع الأول $180^\circ - 40^\circ - 75^\circ = 65^\circ$ ، وفي الشراع الثاني $180^\circ - 65^\circ - 75^\circ = 40^\circ$.
    إذن زوايا كل شراع $40^\circ$ و$65^\circ$ و$75^\circ$، أي أن الزوايا المتناظرة متساوية.
    المثلثان اللذان تتساوى زواياهما المتناظرة متشابهان (تتناسب أضلاعهما المتناظرة) ولو اختلف حجماهما، فالشراعان متشابهان. الإجابة الصحيحة: نعم.
  remediation: |
    اطلب من الطلاب إكمال الزاوية الثالثة في كل مثلث باستعمال مجموع زوايا المثلث ثم ترتيب زوايا المثلثين من الأصغر إلى الأكبر ومقارنتها.
    وللتأكد يرسمون مثلثين لهما الزوايا نفسها بحجمين مختلفين ويقيسون أضلاعهما ليلاحظوا أن النسب بين الأضلاع المتناظرة متساوية.
  misconceptions: [incomplete-angle-chain, triangle-sum-ignored-in-justification]
  hint: "أوجد الزاوية الثالثة في كل مثلث أولاً، ثم قارن الزوايا الثلاث في المثلثين."
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-9 زوايا المثلث، والدرس 5-10 المحذوف (تشابه المثلثات) — بند جسري"

- id: M8-G3-020
  topic: G3
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: advanced
  format: cr_explain
  context: real
  time: 180
  points: 2
  stem: |
    تُكبّر ليلى شعار فريق مدرستها، وهو مثلث أضلاعه $3\,\text{cm}$ و$4\,\text{cm}$ و$5\,\text{cm}$، بتمدد معامله $3$.
    قالت ليلى: «الشعار الجديد مطابق للشعار الأصلي، لأن زواياه لم تتغير».
    هل ليلى على صواب؟ اشرح إجابتك مستعملاً أطوال الأضلاع وقياسات الزوايا.
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يجيب بأن ليلى ليست على صواب، ويذكر الأمرين معاً: الزوايا لم تتغير (مثلاً تبقى الزاوية القائمة $90^\circ$)، والأضلاع تضاعفت ثلاث مرات فصارت $9\,\text{cm}$ و$12\,\text{cm}$ و$15\,\text{cm}$ وهي تختلف عن الأضلاع الأصلية، فالشعاران متشابهان لا متطابقان.'}
      - {code: 10, points: 1, desc: 'يجيب بأن ليلى ليست على صواب مع تبرير ناقص: يذكر أن الأطوال تغيّرت أو أن الشعار الجديد أكبر دون ذكر الأطوال الجديدة، أو يذكر أن الشكلين متشابهان دون مقارنة الأضلاع أو ربطها بالتطابق.'}
      - {code: 70, points: 0, desc: 'يجيب بأن ليلى على صواب، أو يقول إن الزوايا تتغير بالتمدد، أو لا يقدّم أي تبرير.'}
    examples:
      correct:
        - 'ليلى ليست على صواب. الزوايا لم تتغير، لكن كل ضلع صار ثلاثة أمثاله: $9$ و$12$ و$15$ بدل $3$ و$4$ و$5$. يجب أن تتساوى الأضلاع في الشكلين المتطابقين، لذا الشعاران متشابهان فقط.'
      incorrect:
        - 'ليلى على صواب لأن الشكل لم يتغير.'
        - 'ليلى ليست على صواب لأن الزوايا تتغير عند التكبير.'
  model_answer: 'ليلى ليست على صواب. التمدد بمعامل $3$ يُبقي قياسات الزوايا كما هي، فتبقى الزاوية القائمة $90^\circ$، لكنه يضرب كل طول في $3$، فتصير الأضلاع $9\,\text{cm}$ و$12\,\text{cm}$ و$15\,\text{cm}$ بدل $3\,\text{cm}$ و$4\,\text{cm}$ و$5\,\text{cm}$. لا يتطابق شكلان إلا إذا تساوت أضلاعهما المتناظرة وزواياهما المتناظرة معاً، لذلك الشعاران متشابهان لا متطابقان.'
  verify: "[3 * 3, 4 * 3, 5 * 3] == [9, 12, 15] and 3**2 + 4**2 == 5**2 and 9**2 + 12**2 == 15**2"
  solution: |
    التمدد بمعامل $3$ يضرب كل طول في $3$ ولا يغيّر قياسات الزوايا.
    الأضلاع الجديدة هي $3 \times 3 = 9\,\text{cm}$ و$4 \times 3 = 12\,\text{cm}$ و$5 \times 3 = 15\,\text{cm}$، وهي تختلف عن $3\,\text{cm}$ و$4\,\text{cm}$ و$5\,\text{cm}$، بينما تبقى الزوايا كما هي.
    يتطابق شكلان عندما تتساوى أضلاعهما المتناظرة وزواياهما المتناظرة معاً، وقد تساوت الزوايا دون الأضلاع؛ فالشعاران متشابهان لا متطابقان.
    إذن ليلى ليست على صواب.
  remediation: |
    اطلب من الطلاب رسم مثلث وصورته بتمدد معامله $2$ أو $3$ على ورق مربعات، ثم قياس الأضلاع والزوايا في الشكلين وتنظيمها في جدول،
    ليستنتجوا أن التمدد يحفظ الزوايا ويغيّر الأطوال، وأن «المتطابق» يتطلب تساوي الأطوال أيضاً.
  misconceptions: [congruent-vs-similar-confusion, dilation-preserves-length]
  hint: "قارن أطوال أضلاع الشعار الجديد بالأطوال الأصلية، ثم تذكّر ما يجب أن يتساوى في شكلين متطابقين."
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-6 التمدد، والدرس 5-5 الأشكال المتطابقة"

- id: M8-G3-021
  topic: G3
  cognitive: applying
  area: represent
  difficulty: medium
  benchmark: high
  format: mc
  context: real
  time: 80
  stem: |
    يكبّر تطبيق لتصميم الشعارات كل شكل على الشاشة بتمدد معامله $\frac{3}{2}$ حول مركز الشاشة،
    وهو نقطة الأصل في المستوى الإحداثي.
    أي قاعدة تصف انتقال كل نقطة $(x, y)$ من الشكل إلى صورتها؟
  options:
    - '$(x, y) \rightarrow \left(x + \frac{3}{2},\ y + \frac{3}{2}\right)$'
    - '$(x, y) \rightarrow \left(\frac{3}{2}x,\ \frac{3}{2}y\right)$'
    - '$(x, y) \rightarrow \left(\frac{2}{3}x,\ \frac{2}{3}y\right)$'
    - '$(x, y) \rightarrow \left(\frac{3}{2}x,\ y\right)$'
  key: B
  verify: "[f(4, 6) == (6, 9) and f(2, 2) == (3, 3) for f in [lambda a, b: (a + Rational(3, 2), b + Rational(3, 2)), lambda a, b: (Rational(3, 2) * a, Rational(3, 2) * b), lambda a, b: (Rational(2, 3) * a, Rational(2, 3) * b), lambda a, b: (Rational(3, 2) * a, b)]] == [False, True, False, False]"
  rationale:
    A: 'هذه القاعدة تضيف العدد نفسه $\frac{3}{2}$ إلى الإحداثيين، وهي إزاحة وليست تمدداً؛ فالتمدد يضرب الإحداثيين في معامل التمدد.'
    C: 'هذه القاعدة تضرب في $\frac{2}{3}$ أي مقلوب معامل التمدد، فتصغّر الشكل بدل أن تكبّره.'
    D: 'هذه القاعدة تضرب الإحداثي $x$ فقط في $\frac{3}{2}$ وتترك $y$ كما هو، فتمدّ الشكل أفقياً ولا تنتج شكلاً مشابهاً.'
  solution: |
    التمدد بمعامل $k$ حول نقطة الأصل يضرب إحداثيي كل نقطة في $k$: $(x, y) \rightarrow (kx, ky)$.
    هنا $k = \frac{3}{2}$ ، فالقاعدة هي $(x, y) \rightarrow \left(\frac{3}{2}x,\ \frac{3}{2}y\right)$ ؛ مثلاً تنتقل النقطة $(4, 6)$ إلى $(6, 9)$.
    الإجابة الصحيحة B.
  remediation: |
    اطلب من الطلاب اختبار كل قاعدة على نقطتين مثل $(4, 6)$ و$(2, 2)$، ومقارنة بُعد الصورة عن نقطة الأصل ببعد النقطة الأصلية.
    ثم يرسمون الشكل وصورته ويقيسون الأبعاد ليتأكدوا أن الصورة مشابهة للأصل وأن معامل التمدد أكبر من $1$ يكبّر الشكل.
  misconceptions: [additive-scaling, rate-inverted, non-uniform-scaling-accepted]
  hint: 'التمدد حول نقطة الأصل يضرب كلا الإحداثيين في معامل التمدد نفسه.'
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-6 التمدد"
