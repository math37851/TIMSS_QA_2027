- id: M8-G3-012
  topic: G3
  cognitive: applying
  area: implement
  difficulty: easy
  benchmark: intermediate
  format: numeric
  context: qatar
  time: 70
  stem: |
    تُزيَّن ممرّات إحدى المدارس برايات مثلثة الشكل بمناسبة اليوم الوطني (18 ديسمبر).
    أضلاع الراية الصغيرة $30\,\text{cm}$ و$40\,\text{cm}$ و$50\,\text{cm}$،
    وللراية الكبيرة شكل مشابه لشكلها، وطول أقصر أضلاعها $45\,\text{cm}$.
    ما محيط الراية الكبيرة بالسنتيمتر؟
  figure:
    type: geo
    alt: راية مثلثة صغيرة وراية كبيرة مشابهة لها
    unit: 30
    pad: 66
    items:
      - {poly: [[0, 0], [4, 0], [0, 3]], fill: '#E8EDF5', color: '#1B365D'}
      - {poly: [[6, 0], [12, 0], [6, 4.5]], fill: '#F6EEF1', color: '#8A1538'}
      - {label_seg: [[0, 0], [4, 0]], text: '40 cm', offset: -16}
      - {label_seg: [[0, 0], [0, 3]], text: '30 cm', offset: 12}
      - {label_seg: [[4, 0], [0, 3]], text: '50 cm', offset: -14}
      - {label_seg: [[6, 0], [6, 4.5]], text: '45 cm', offset: 12}
  answer: {value: 180, unit: "cm"}
  verify: "(30 + 40 + 50) * Rational(45, 30)"
  solution: |
    محيط الراية الصغيرة $30 + 40 + 50 = 120\,\text{cm}$.
    أقصر ضلع في الراية الصغيرة هو $30\,\text{cm}$ ويناظره أقصر ضلع في الكبيرة $45\,\text{cm}$،
    فمعامل التشابه $\frac{45}{30} = 1.5$.
    أضلاع الراية الكبيرة $45\,\text{cm}$ و$60\,\text{cm}$ و$75\,\text{cm}$،
    ومحيطها $45 + 60 + 75 = 180\,\text{cm}$ ، أو مباشرة $120 \times 1.5 = 180\,\text{cm}$.
  remediation: |
    اطلب من الطلاب مطابقة الضلعين المتناظرين أولاً (الأقصر مع الأقصر)، ثم حساب معامل التشابه بقسمة طول الضلع الجديد على طول الضلع المناظر له.
    بعد ذلك يضربون كل ضلع أو المحيط كله في معامل التشابه، وينبّههم المعلم إلى أن إضافة العدد نفسه إلى كل ضلع لا تعطي شكلاً مشابهاً.
  misconceptions: [additive-scaling, rate-inverted]
  hint: "قسمة طول أقصر ضلع في الراية الكبيرة على طول أقصر ضلع في الصغيرة تعطي معامل التشابه."
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-7 الأشكال المتشابهة (معامل التشابه ونسبة المحيطين)"

- id: M8-G3-013
  topic: G3
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: high
  format: mc
  context: real
  time: 80
  stem: |
    يمثّل المستوى الإحداثي عجلة دوّارة في مدينة ملاهٍ، ومركزها نقطة الأصل.
    يجلس مازن في مقعد عند النقطة $P(4, 3)$، ثم تدور العجلة بزاوية $90^\circ$ في عكس اتجاه عقارب الساعة حول مركزها.
    ما إحداثيا المقعد بعد الدوران؟
  figure:
    type: coord
    alt: عجلة دوّارة مركزها نقطة الأصل ومقعد عند النقطة P
    xmin: -6
    xmax: 6
    ymin: -6
    ymax: 6
    unit: 26
    polygons:
      - {points: [[5, 0], [4.83, 1.294], [4.33, 2.5], [3.536, 3.536], [2.5, 4.33], [1.294, 4.83], [0, 5], [-1.294, 4.83], [-2.5, 4.33], [-3.536, 3.536], [-4.33, 2.5], [-4.83, 1.294], [-5, 0], [-4.83, -1.294], [-4.33, -2.5], [-3.536, -3.536], [-2.5, -4.33], [-1.294, -4.83], [0, -5], [1.294, -4.83], [2.5, -4.33], [3.536, -3.536], [4.33, -2.5], [4.83, -1.294]], color: '#C2A649', opacity: 0}
    segments:
      - {points: [[0, 0], [4, 3]], color: '#8A1538', dash: '6 4'}
    points:
      - {x: 4, y: 3, label: 'P', pos: ne}
  options:
    - '$(3, -4)$'
    - '$(-4, -3)$'
    - '$(-3, 4)$'
    - '$(3, 4)$'
  key: C
  verify: "[(lambda a, b: (-b, a))(4, 3) == t for t in [(3, -4), (-4, -3), (-3, 4), (3, 4)]] == [False, False, True, False]"
  rationale:
    A: 'هذا الموقع ينتج عن دوران $90^\circ$ في اتجاه عقارب الساعة $(x, y) \rightarrow (y, -x)$ لا عكس اتجاهها.'
    B: 'هذا الموقع ينتج عن دوران $180^\circ$ حول المركز (تتغير إشارتا الإحداثيين)، وليس دوران $90^\circ$.'
    D: 'تبديل الإحداثيين فقط $(x, y) \rightarrow (y, x)$ يمثّل انعكاساً في المستقيم $y = x$ وليس دوراناً.'
  solution: |
    الدوران بزاوية $90^\circ$ عكس اتجاه عقارب الساعة حول نقطة الأصل يحوّل النقطة $(x, y)$ إلى $(-y, x)$.
    إذن $P(4, 3) \rightarrow P'(-3, 4)$.
    للتحقق: ينتقل المقعد من الربع الأول إلى الربع الثاني، ويبقى بُعده عن المركز 5 وحدات كما كان.
    الإجابة الصحيحة C.
  remediation: |
    اطلب من الطلاب تدوير ورقة شفافة مثبّتة عند نقطة الأصل بزاوية $90^\circ$ عكس عقارب الساعة ومتابعة النقطة $P$ ثم قراءة موقعها الجديد،
    ثم استنتاج القاعدة $(x, y) \rightarrow (-y, x)$ وتجربتها على نقاط أخرى، ومقارنتها بقاعدة الدوران مع عقارب الساعة $(x, y) \rightarrow (y, -x)$.
  misconceptions: [direction-confusion, rotation-angle-confusion, swap-coordinates]
  hint: 'الدوران $90^\circ$ عكس عقارب الساعة ينقل نقطة الربع الأول إلى الربع الثاني.'
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-3 الدوران"

- id: M8-G3-014
  topic: G3
  cognitive: reasoning
  area: analyze
  difficulty: medium
  benchmark: high
  format: dragdrop_categorize
  context: pure
  time: 110
  stem: |
    مستطيل عرضه $4\,\text{cm}$ وطوله $6\,\text{cm}$.
    غُيِّر بُعدا المستطيل بكل طريقة من الطرائق الآتية.
    اسحب كل طريقة إلى الفئة التي تصف المستطيل الجديد مقارنةً بالمستطيل الأصلي.
  categories: ['ينتج مستطيلاً مشابهاً للأصلي', 'ينتج مستطيلاً غير مشابه للأصلي']
  cards:
    - 'ضرب البعدين في $3$'
    - 'إضافة $3\,\text{cm}$ إلى كل بعد'
    - 'ضرب الطول فقط في $2$'
    - 'قسمة البعدين على $2$'
    - 'ضرب العرض في $2$ والطول في $3$'
    - 'ضرب البعدين في $1.5$'
  key:
    'ضرب البعدين في $3$': 'ينتج مستطيلاً مشابهاً للأصلي'
    'إضافة $3\,\text{cm}$ إلى كل بعد': 'ينتج مستطيلاً غير مشابه للأصلي'
    'ضرب الطول فقط في $2$': 'ينتج مستطيلاً غير مشابه للأصلي'
    'قسمة البعدين على $2$': 'ينتج مستطيلاً مشابهاً للأصلي'
    'ضرب العرض في $2$ والطول في $3$': 'ينتج مستطيلاً غير مشابه للأصلي'
    'ضرب البعدين في $1.5$': 'ينتج مستطيلاً مشابهاً للأصلي'
  verify: "[12 * 6 == 18 * 4, 7 * 6 == 9 * 4, 4 * 6 == 12 * 4, 2 * 6 == 3 * 4, 8 * 6 == 18 * 4, 6 * 6 == 9 * 4] == [True, False, False, True, False, True]"
  solution: |
    يكون المستطيلان متشابهين عندما تتساوى نسبة العرض إلى الطول فيهما. في المستطيل الأصلي $\frac{4}{6} = \frac{2}{3}$.
    ضرب البعدين في $3$ يعطي $12 \times 18$ ونسبته $\frac{12}{18} = \frac{2}{3}$، فهو مشابه.
    قسمة البعدين على $2$ تعطي $2 \times 3$ ونسبته $\frac{2}{3}$، وضرب البعدين في $1.5$ يعطي $6 \times 9$ ونسبته $\frac{6}{9} = \frac{2}{3}$، فكلاهما مشابه.
    إضافة $3\,\text{cm}$ إلى كل بعد تعطي $7 \times 9$ ونسبته $\frac{7}{9} \neq \frac{2}{3}$، فهو غير مشابه.
    ضرب الطول فقط في $2$ يعطي $4 \times 12$ ونسبته $\frac{1}{3} \neq \frac{2}{3}$، فهو غير مشابه.
    ضرب العرض في $2$ والطول في $3$ يعطي $8 \times 18$ ونسبته $\frac{4}{9} \neq \frac{2}{3}$، فهو غير مشابه.
    التشابه يتطلب ضرب البعدين في العدد نفسه؛ فلا تكفي إضافة العدد نفسه إلى البعدين ولا تغيير بُعد واحد.
  remediation: |
    اطلب من الطلاب حساب نسبة العرض إلى الطول بعد كل تغيير ومقارنتها بالنسبة $\frac{2}{3}$ للمستطيل الأصلي.
    ثم يرسمون المستطيلات على ورق مربعات ليلاحظوا أن الإضافة المتساوية تغيّر شكل المستطيل بينما الضرب بالعدد نفسه يحفظه.
  misconceptions: [additive-scaling, non-uniform-scaling-accepted]
  hint: 'احسب نسبة العرض إلى الطول بعد كل تغيير وقارنها بالنسبة $\frac{2}{3}$.'
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-7 الأشكال المتشابهة"

- id: M8-G3-015
  topic: G3
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: advanced
  format: mc
  context: real
  time: 120
  stem: |
    صمّمت شركة إعلانات لوحة مستطيلة عرضها $x\,\text{m}$ وطولها $(x + 4)\,\text{m}$،
    ثم صمّمت لوحة أكبر مشابهة لها عرضها $9\,\text{m}$ وطولها $15\,\text{m}$.
    ما قيمة $x$؟
  options:
    - '$6$'
    - '$10$'
    - '$5$'
    - '$1.5$'
  option_values: [6, 10, 5, 1.5]
  key: A
  verify: "solve(Eq(15 * x, 9 * (x + 4)), x)[0]"
  rationale:
    B: 'هذه قيمة الطول $x + 4$ لا العرض $x$؛ فقد حُلّت المعادلة بصورة صحيحة لكن اختير البُعد الخطأ.'
    C: 'كُتب $x + 4 = 9$ بمقارنة بُعدين غير متناظرين، فنتج $x = 5$. العرض $x$ يناظر العرض $9$، والطول $x + 4$ يناظر الطول $15$.'
    D: 'حدث خطأ عند النقل: كُتب $15x + 9x = 36$ بدل $15x - 9x = 36$، فنتج $x = 1.5$.'
  solution: |
    المستطيلان متشابهان، فنسبة العرض إلى العرض تساوي نسبة الطول إلى الطول: $\frac{x}{9} = \frac{x + 4}{15}$.
    بالضرب التبادلي: $15x = 9(x + 4)$ ومنها $15x = 9x + 36$.
    نطرح $9x$ من الطرفين فيكون $6x = 36$ ، إذن $x = 6$.
    للتحقق: بُعدا اللوحة الأولى $6\,\text{m}$ و$10\,\text{m}$ ومعامل التشابه $\frac{9}{6} = \frac{15}{10} = 1.5$.
    الإجابة الصحيحة A.
  remediation: |
    اطلب من الطلاب تسمية الضلعين المتناظرين أولاً (العرض مع العرض والطول مع الطول) وكتابة النسبة بالترتيب نفسه في الطرفين.
    ثم يحلّون المعادلة الناتجة خطوة خطوة ويتحققون بحساب البُعدين $6$ و$10$ ومقارنة معامل التشابه في الاتجاهين.
  misconceptions: [wrong-corresponding-pair, sign-error-transposition, answer-other-expression]
  hint: 'كوّن نسبة بين الضلعين المتناظرين: $\frac{x}{9} = \frac{x + 4}{15}$ ثم حلّها.'
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-7 الأشكال المتشابهة، والدرس 2-3 المعادلات متعددة الخطوات"

- id: M8-G3-016
