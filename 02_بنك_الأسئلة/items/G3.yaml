- id: M8-G3-005
  topic: G3
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: dragdrop_slots
  context: qatar
  time: 100
  stem: |
    في زخرفة بسوق واقف قطعتا بلاط مثلثتان متطابقتان: $\triangle ABC \cong \triangle PQR$.
    أي أن الرأس $A$ يناظر $P$، والرأس $B$ يناظر $Q$، والرأس $C$ يناظر $R$.
    اسحب العدد المناسب إلى كل خانة.
  figure:
    type: geo
    alt: مثلثان قائمان متطابقان ABC وPQR
    items:
      - {poly: [[0, 4.33], [0, 0], [2.5, 0]], fill: '#E8EDF5', color: '#1B365D'}
      - {poly: [[5.17, 0], [9.5, 0], [9.5, 2.5]], fill: '#E8EDF5', color: '#1B365D'}
      - {pt: [0, 4.33], label: 'A', pos: nw, dot: false}
      - {pt: [0, 0], label: 'B', pos: sw, dot: false}
      - {pt: [2.5, 0], label: 'C', pos: se, dot: false}
      - {pt: [5.17, 0], label: 'P', pos: sw, dot: false}
      - {pt: [9.5, 0], label: 'Q', pos: se, dot: false}
      - {pt: [9.5, 2.5], label: 'R', pos: ne, dot: false}
      - {label_seg: [[0, 0], [2.5, 0]], text: '5 cm', offset: -16}
      - {label_seg: [[0, 4.33], [2.5, 0]], text: '10 cm', offset: 16}
      - {angle: [[0, 0], [0, 4.33], [2.5, 0]], label: '30°', r: 30, label_r: 62}
      - {angle: [[0, 4.33], [2.5, 0], [0, 0]], label: '60°', label_r: 46}
      - {angle: [[0, 4.33], [0, 0], [2.5, 0]], right: true}
  cards: ['5', '10', '30', '60', '90']
  template: 'طول $QR$ يساوي [[1]] $\text{cm}$ ، وطول $PR$ يساوي [[2]] $\text{cm}$ ، وقياس $\angle R$ يساوي [[3]] $^\circ$ ، وقياس $\angle P$ يساوي [[4]] $^\circ$.'
  template_dir: rtl
  key: {1: '5', 2: '10', 3: '60', 4: '30'}
  check: "s1 == 5 && s2 == 10 && s3 == 60 && s4 == 30"
  solution: |
    في المثلثين المتطابقين تتساوى الأجزاء المتناظرة، ونحدد التناظر من ترتيب الحروف في $\triangle ABC \cong \triangle PQR$:
    $QR$ يناظر $BC$ فطوله $5\,\text{cm}$ ، و$PR$ يناظر $AC$ فطوله $10\,\text{cm}$ ،
    و$\angle R$ يناظر $\angle C$ فقياسه $60^\circ$ ، و$\angle P$ يناظر $\angle A$ فقياسه $30^\circ$.
    القيمة $90$ هي قياس الزاوية القائمة $\angle Q$ وليست مطلوبة هنا.
  remediation: |
    اطلب من الطلاب تلوين الرؤوس المتناظرة بلون واحد (A وP بالأحمر، B وQ بالأزرق، C وR بالأخضر)،
    ثم قراءة كل ضلع وكل زاوية بدلالة رؤوسه المناظرة بدل الاعتماد على موضعه في الرسم.
  misconceptions: [wrong-corresponding-pair]
  hint: "الحرف الأول في ABC يناظر الحرف الأول في PQR، وهكذا بالترتيب."
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-5 الأشكال المتطابقة"

- id: M8-G3-006
  topic: G3
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: qatar
  time: 60
  stem: |
    يُمثّل المثلث $ABC$ وحدة زخرفية على لوحة بلاط في متحف الفن الإسلامي بالدوحة،
    ويُمثّل المثلث $A'B'C'$ صورتها على المستوى الإحداثي كما في الشكل.
    ما التحويل الذي ينقل $ABC$ إلى $A'B'C'$؟
  figure:
    type: coord
    xmin: -6
    xmax: 6
    ymin: -1
    ymax: 5
    unit: 34
    polygons:
      - {points: [[1, 1], [5, 1], [1, 4]], labels: ['A', 'B', 'C']}
      - {points: [[-1, 1], [-5, 1], [-1, 4]], labels: ["A'", "B'", "C'"], color: '#8A1538', fill: '#8A1538'}
  options:
    - 'انعكاس في المحور $y$'
    - 'انعكاس في المحور $x$'
    - 'دوران $180^\circ$ حول نقطة الأصل'
    - 'إزاحة وحدتين إلى اليسار'
  key: A
  verify: "(-1 * 1, 1) == (-1, 1) and (-1 * 5, 1) == (-5, 1) and (-1 * 1, 4) == (-1, 4)"
  rationale:
    B: 'الانعكاس في المحور $x$ ينقل $A(1, 1)$ إلى $(1, -1)$، بينما صورة $A$ في الشكل هي $(-1, 1)$.'
    C: 'الدوران $180^\circ$ حول نقطة الأصل ينقل $A(1, 1)$ إلى $(-1, -1)$ لا إلى $(-1, 1)$.'
    D: 'الإزاحة وحدتين إلى اليسار تنقل $A$ إلى $(-1, 1)$ فعلاً، لكنها تنقل $B(5, 1)$ إلى $(3, 1)$ لا إلى $(-5, 1)$؛ فالتحقق من رأس واحد لا يكفي.'
  solution: |
    نقارن كل رأس بصورته: $A(1, 1) \rightarrow A'(-1, 1)$ ، $B(5, 1) \rightarrow B'(-5, 1)$ ، $C(1, 4) \rightarrow C'(-1, 4)$.
    تتغير إشارة الإحداثي $x$ فقط ويبقى الإحداثي $y$ كما هو: $(x, y) \rightarrow (-x, y)$.
    هذا انعكاس في المحور $y$؛ فكل رأس وصورته على البعد نفسه من المحور $y$ وفي جهتين متقابلتين منه. الإجابة الصحيحة A.
  remediation: |
    اطلب من الطلاب طيّ الورقة على المحور $y$ ليلاحظوا انطباق المثلث على صورته،
    ثم اختبار الخيارات الأخرى بتتبع رأس ثانٍ وثالث وليس رأساً واحداً فقط.
  misconceptions: [reflect-wrong-axis, move-one-vertex-only]
  hint: "قارن إحداثيي $A$ وإحداثيي $A'$، ثم تحقق من $B$ و$C$."
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-2 الانعكاس"

- id: M8-G3-007
  topic: G3
  cognitive: knowing
  area: identify
  difficulty: medium
  benchmark: high
  format: mc
  context: real
  time: 70
  stem: |
    صورة مستطيلة عرضها $8\,\text{cm}$ وطولها $12\,\text{cm}$ ستُكبَّر لتُطبع على ملصق، بحيث يبقى الملصق مشابهاً للصورة الأصلية.
    أي أبعاد الملصق الآتية تحقق ذلك؟
  options:
    - 'عرضه $14\,\text{cm}$ وطوله $18\,\text{cm}$'
    - 'عرضه $20\,\text{cm}$ وطوله $24\,\text{cm}$'
    - 'عرضه $16\,\text{cm}$ وطوله $36\,\text{cm}$'
    - 'عرضه $20\,\text{cm}$ وطوله $30\,\text{cm}$'
  key: D
  verify: "Rational(20, 8) == Rational(30, 12) and Rational(14, 8) != Rational(18, 12) and Rational(20, 8) != Rational(24, 12) and Rational(16, 8) != Rational(36, 12)"
  rationale:
    A: 'أُضيف $6\,\text{cm}$ إلى كل بُعد، وهذا لا يحفظ الشكل: $\frac{14}{8} = 1.75$ بينما $\frac{18}{12} = 1.5$.'
    B: 'أُضيف $12\,\text{cm}$ إلى كل بُعد، وهذا لا يحفظ الشكل: $\frac{20}{8} = 2.5$ بينما $\frac{24}{12} = 2$.'
    C: 'ضُرب العرض في $2$ والطول في $3$؛ فمعاملا التكبير مختلفان فلا يتشابه المستطيلان.'
  solution: |
    يتشابه المستطيلان إذا تساوت النسب بين أطوال أضلاعهما المتناظرة (معامل التشابه).
    في الخيار D: $\frac{20}{8} = 2.5$ و$\frac{30}{12} = 2.5$ ، فالنسبتان متساويتان ومعامل التشابه $2.5$.
    في الخيارات الأخرى لا تتساوى النسبتان: A: $1.75$ و$1.5$ ، B: $2.5$ و$2$ ، C: $2$ و$3$.
  remediation: |
    اطلب من الطلاب إيجاد معامل التكبير لكل بُعد على حدة ثم مقارنة النتيجتين،
    مع التأكيد أن إضافة العدد نفسه إلى الضلعين لا تحفظ الشكل بل يجب الضرب بمعامل واحد.
  misconceptions: [additive-scaling]
  hint: "احسب نسبة العرض الجديد إلى العرض القديم ونسبة الطول الجديد إلى الطول القديم."
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-7 الأشكال المتشابهة"

- id: M8-G3-008
  topic: G3
  cognitive: applying
  area: implement
  difficulty: easy
  benchmark: intermediate
  format: grid_plot
  context: pure
  time: 90
  stem: |
    المثلث ABC مرسوم على المستوى الإحداثي.
    ارسم صورة المثلث بعد انعكاسه في المحور $x$، وذلك بالنقر على مواقع رؤوس الصورة الثلاثة.
  grid: {xmin: -6, xmax: 6, ymin: -6, ymax: 6}
  given:
    polygons:
      - {points: [[1, 2], [5, 1], [3, 5]], labels: ['A', 'B', 'C']}
  mode: polygon
  count: 3
  key: [[1, -2], [5, -1], [3, -5]]
  verify: "sorted(P) == sorted([(1, -2), (5, -1), (3, -5)])"
  solution: |
    الانعكاس في المحور $x$ يُبقي الإحداثي $x$ كما هو ويغيّر إشارة الإحداثي $y$: $(x, y) \rightarrow (x, -y)$.
    $A(1, 2) \rightarrow A'(1, -2)$ ، $B(5, 1) \rightarrow B'(5, -1)$ ، $C(3, 5) \rightarrow C'(3, -5)$.
    كل رأس وصورته على البعد نفسه من المحور $x$ وفي جهتين متقابلتين منه.
  remediation: |
    اطلب من الطلاب عدّ المربعات من كل رأس إلى المحور $x$ ثم عدّ العدد نفسه من المربعات في الجهة الأخرى من المحور،
    ثم تعميم القاعدة $(x, y) \rightarrow (x, -y)$.
  misconceptions: [reflect-wrong-axis, move-one-vertex-only]
  hint: "عدّ المربعات من الرأس إلى المحور $x$ ثم عدّ العدد نفسه في الجهة المقابلة."
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-2 الانعكاس"

- id: M8-G3-009
  topic: G3
  cognitive: applying
  area: implement
  difficulty: easy
  benchmark: intermediate
  format: numeric
  context: qatar
  time: 60
  stem: |
    التقط ناصر صورة لكورنيش الدوحة عرضها $10\,\text{cm}$ وطولها $15\,\text{cm}$.
    يريد طباعتها على لوحة مشابهة للصورة الأصلية عرضها $40\,\text{cm}$.
    ما طول اللوحة بالسنتيمتر؟
  answer: {value: 60, unit: "cm"}
  verify: "15 * Rational(40, 10)"
  solution: |
    اللوحة مشابهة للصورة، فالنسبة بين العرضين تساوي النسبة بين الطولين.
    معامل التكبير: $\frac{40}{10} = 4$.
    طول اللوحة: $15 \times 4 = 60$ ، أي $60\,\text{cm}$.
  remediation: |
    اطلب من الطلاب إيجاد معامل التكبير من البُعد المعلوم أولاً، ثم ضرب البُعد الآخر فيه،
    ومقارنة ذلك بطريقة الجمع الخاطئة ($15 + 30 = 45$) لإظهار أنها لا تحفظ الشكل.
  misconceptions: [additive-scaling, rate-inverted]
  hint: "كم مرة كبرت العرض؟ كبّر الطول بالمعامل نفسه."
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-7 الأشكال المتشابهة"

- id: M8-G3-010
  topic: G3
  cognitive: applying
  area: formulate
  difficulty: medium
  benchmark: high
  format: mc
  context: qatar
  time: 100
  stem: |
    في اللحظة نفسها، كان طول ظل عمود إنارة ارتفاعه $5\,\text{m}$ على كورنيش الدوحة يساوي $4\,\text{m}$،
    وكان طول ظل برج في لوسيل يساوي $60\,\text{m}$ (بيانات افتراضية).
    أشعة الشمس متوازية، فالمثلثان القائمان المتكوّنان من كل جسم وظله متشابهان (الشكل ليس مرسوماً بمقياس رسم).
    أي معادلة تُستعمل لإيجاد ارتفاع البرج $h$؟
  figure:
    type: geo
    alt: عمود إنارة وبرج وظلاهما
    items:
      - {seg: [[-0.5, 0], [6.5, 0]], color: '#7A8699', width: 2}
      - {seg: [[0, 0], [0, 1.25]], color: '#1B365D', width: 5}
      - {seg: [[0, 1.25], [1, 0]], color: '#C2A649', width: 2, dash: '6 4'}
      - {seg: [[3, 0], [3, 3.75]], color: '#1B365D', width: 8}
      - {seg: [[3, 3.75], [6, 0]], color: '#C2A649', width: 2, dash: '6 4'}
      - {angle: [[0, 1.25], [0, 0], [1, 0]], right: true}
      - {angle: [[3, 3.75], [3, 0], [6, 0]], right: true}
      - {label_seg: [[0, 0], [0, 1.25]], text: '5 m', offset: 14}
      - {label_seg: [[0, 0], [1, 0]], text: '4 m', offset: -16}
      - {label_seg: [[3, 0], [3, 3.75]], text: 'h', offset: 14}
      - {label_seg: [[3, 0], [6, 0]], text: '60 m', offset: -16}
  options:
    - '$\frac{h}{60} = \frac{4}{5}$'
    - '$\frac{h}{5} = \frac{60}{4}$'
    - '$h - 5 = 60 - 4$'
    - '$\frac{h}{4} = \frac{60}{5}$'
  key: B
  verify: "solve(Eq(x / 5, Rational(60, 4)), x) == [75]"
  rationale:
    A: 'قُلبت إحدى النسبتين، فصارت (ظل : ارتفاع) في طرف و(ارتفاع : ظل) في الآخر، وتعطي $h = 48$.'
    C: 'استُعمل الطرح (الفرق ثابت) بدل النسبة، وتعطي $h = 61$.'
    D: 'قُرن ارتفاع البرج بظل العمود وارتفاع العمود بظل البرج، فلا تتناظر الأضلاع، وتعطي $h = 48$.'
  solution: |
    أشعة الشمس متوازية، فيتكوّن مثلثان قائمان متشابهان: أحدهما من العمود وظله، والآخر من البرج وظله.
    في المثلثين المتشابهين تتساوى نسبة الارتفاع إلى الظل المناظر له: $\frac{h}{5} = \frac{60}{4}$.
    ومنها $h = \frac{5 \times 60}{4} = 75$ ، أي أن ارتفاع البرج $75\,\text{m}$. الإجابة الصحيحة B.
  remediation: |
    اطلب من الطلاب رسم المثلثين منفصلين وتسمية الأضلاع المتناظرة (ارتفاع مع ارتفاع، وظل مع ظل)،
    ثم كتابة النسبة بالترتيب نفسه في الطرفين، وحل المعادلة والتحقق من أن النسبة $\frac{75}{60}$ تساوي $\frac{5}{4}$.
  misconceptions: [additive-ratio-reasoning, rate-inverted, wrong-corresponding-pair]
  hint: "اكتب نسبة (ارتفاع : ظل) للعمود ثم للبرج بالترتيب نفسه، وساوِ بينهما."
  qatar_link: "الصف الثامن — الوحدة 5: الدرس 5-7 الأشكال المتشابهة، والدرس 5-10 المحذوف (تشابه المثلثات) — بند جسري"

- id: M8-G3-011
  topic: G3
