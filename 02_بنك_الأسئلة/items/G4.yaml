- id: M8-G4-014
  topic: G4
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: intermediate
  format: numeric
  context: qatar
  time: 100
  stem: |
    كرة تذكارية صغيرة من كأس العالم لكرة القدم في قطر 2022، نصف قطرها $9\,\text{cm}$.
    ما حجم الهواء داخل الكرة بالسنتيمتر المكعب؟ (استعمل $\pi \approx 3.14$ وأهمل سمك جدار الكرة)
  figure: {type: sphere, r_label: '9 cm', alt: "كرة نصف قطرها 9 cm"}
  answer: {value: 3052.08, tol: 3, unit: 'cm³'}
  verify: "Rational(4, 3) * Rational(314, 100) * 9**3"
  hint: 'حجم الكرة يحتاج إلى مكعب نصف القطر لا إلى مربعه.'
  solution: |
    حجم الكرة $V = \frac{4}{3}\pi r^3$.
    $V \approx \frac{4}{3} \times 3.14 \times 9^3 = \frac{4}{3} \times 3.14 \times 729 = 4 \times 3.14 \times 243 = 3052.08\,\text{cm}^3$.
  remediation: |
    ذكّر الطالب بأن صيغة حجم الكرة تتضمن $r^3$ (ثلاث مرات ضرب نصف القطر) وليس $r^2$.
    ينصح باختصار $729 \div 3 = 243$ أولاً ثم الضرب في $4$ وفي $3.14$ لتقليل أخطاء الحساب.
  misconceptions: [sphere-radius-squared-not-cubed, sphere-surface-volume-confusion]
  qatar_link: "الصف الثامن — الوحدة 7: حجم الكرة (بند جسري)؛ والصف السابع — الدائرة"

