    - {id: sphere, text: 'كرة', value: 288}
    - {id: cyl6, text: 'أسطوانة ارتفاعها $6\,\text{cm}$', value: 216}
    - {id: cyl12, text: 'أسطوانة ارتفاعها $12\,\text{cm}$', value: 432}
  key: [cone, cyl6, sphere, cyl12]
  direction: asc
  order_labels: ["الأصغر حجماً", "الأكبر حجماً"]
  verify: "sorted([144, 216, 288, 432]) == [Rational(1, 3) * 36 * 12, 36 * 6, Rational(4, 3) * 216, 36 * 12]"
  hint: 'اكتب حجم كل قالب بدلالة $\pi$ ثم قارن الأعداد المضروبة في $\pi$.'
  solution: |
    نحسب حجم كل قالب بدلالة $\pi$:
    المخروط: $\frac{1}{3}\pi \times 6^2 \times 12 = 144\pi$.
    الأسطوانة التي ارتفاعها $6\,\text{cm}$: $\pi \times 6^2 \times 6 = 216\pi$.
    الكرة: $\frac{4}{3}\pi \times 6^3 = 288\pi$.
    الأسطوانة التي ارتفاعها $12\,\text{cm}$: $\pi \times 6^2 \times 12 = 432\pi$.
    الترتيب من الأصغر إلى الأكبر: المخروط، ثم الأسطوانة القصيرة، ثم الكرة، ثم الأسطوانة الطويلة.
  remediation: |
    ذكّر الطالب بأن المخروط ثلث الأسطوانة التي لها القاعدة والارتفاع نفساهما.
    وبأن الكرة التي نصف قطرها $r$ حجمها $\frac{2}{3}$ حجم الأسطوانة التي نصف قطرها $r$ وارتفاعها $2r$.
    تدرّب على المقارنة بكتابة كل حجم بدلالة $\pi$ بدل الاكتفاء بالنظر إلى الارتفاع.
  misconceptions: [cone-volume-forgot-third, sphere-radius-squared-not-cubed, compare-by-one-dimension]
  qatar_link: "الصف الثامن — الوحدة 7: حجم الأسطوانة والمخروط والكرة (بند جسري)"

- id: M8-G4-017
  topic: G4
  cognitive: reasoning
  area: analyze
  difficulty: hard
  benchmark: high
  format: cr_explain
  context: real
  time: 210
  points: 2
  stem: |
    أراد سلطان حساب حجم علبة تونة أسطوانية الشكل، قطر قاعدتها $8\,\text{cm}$ وارتفاعها $4\,\text{cm}$، فكتب الحل الآتي:

    $V = \pi r^2 h = \pi \times 8^2 \times 4 = 256\pi\,\text{cm}^3$

    1. اشرح الخطأ الذي وقع فيه سلطان.
    2. أوجد الحجم الصحيح للعلبة بدلالة $\pi$.
  figure: {type: cylinder, d_label: '8 cm', h_label: '4 cm', alt: "علبة تونة أسطوانية قطر قاعدتها 8 cm وارتفاعها 4 cm"}
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يبيّن أن $8\,\text{cm}$ هو قطر القاعدة لا نصف قطرها (أي أن $r = 4\,\text{cm}$)، ويعطي الحجم الصحيح $64\pi\,\text{cm}^3$ (أو ما يقارب $201\,\text{cm}^3$).'}
      - {code: 10, points: 1, desc: 'يحدّد الخطأ (استعمال القطر بدل نصف القطر) لكنه يخطئ في حساب الحجم الصحيح أو لا يحسبه؛ أو يعطي الحجم الصحيح $64\pi$ دون أن يبيّن الخطأ.'}
      - {code: 70, points: 0, desc: 'إجابة غير صحيحة، مثل: الخطأ في الارتفاع أو في الصيغة، أو لا يوجد خطأ، أو حجم خاطئ دون تحديد الخطأ.'}
    examples:
      correct:
        - 'استعمل سلطان $8$ على أنه نصف القطر، وهو القطر. نصف القطر $4$، فالحجم $\pi \times 4^2 \times 4 = 64\pi\,\text{cm}^3$.'
      incorrect:
        - 'الخطأ في الارتفاع، والحجم الصحيح $128\pi$.'
        - 'لا يوجد خطأ في الحل.'
        - 'نسي ضرب الناتج في $\frac{1}{3}$.'
  model_answer: 'الخطأ: استعمل سلطان القطر $8\,\text{cm}$ بدل نصف القطر. نصف القطر $r = 4\,\text{cm}$، فالحجم الصحيح $V = \pi \times 4^2 \times 4 = 64\pi\,\text{cm}^3$ (ويساوي تقريباً $201\,\text{cm}^3$ عند استعمال $\pi \approx 3.14$).'
  verify: "pi * 4**2 * 4 == 64 * pi and pi * 8**2 * 4 == 4 * (pi * 4**2 * 4)"
  hint: 'قارن بين ما يمثّله العدد 8 في الرسم وما يمثّله الرمز $r$ في الصيغة.'
  solution: |
    العدد $8\,\text{cm}$ هو قطر القاعدة، لكن سلطان عوّضه في الصيغة على أنه نصف القطر $r$.
    نصف القطر الصحيح: $r = 8 \div 2 = 4\,\text{cm}$.
    الحجم الصحيح: $V = \pi r^2 h = \pi \times 4^2 \times 4 = 64\pi\,\text{cm}^3$ (حوالي $201\,\text{cm}^3$).
    إجابة سلطان أكبر بأربعة أمثال من الصحيحة، لأن مضاعفة نصف القطر تضرب مساحة القاعدة في $4$.
  remediation: |
    ذكّر الطالب بأن الصيغة $V = \pi r^2 h$ تتطلب نصف القطر $r$، فإذا أُعطي القطر قسمه على $2$ أولاً.
    اطلب منه أن يرسم القطر ونصف القطر على الأسطوانة نفسها وأن يكتب قيمة كل منهما قبل التعويض.
  misconceptions: [square-diameter]
  qatar_link: "الصف الثامن — الوحدة 7: حجم الأسطوانة؛ والصف السابع — الدائرة"

- id: M8-G4-018
  topic: G4
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: high
  format: numeric
  context: qatar
  time: 150
  stem: |
    خزان ماء أسطواني في مزرعة بمدينة الخور، نصف قطر قاعدته $5\,\text{m}$ وارتفاعه $4\,\text{m}$.
    يحتوي الخزان الآن على ماء ارتفاعه $1\,\text{m}$، ثم تُشغَّل مضخة تملؤه بمعدل 3140 لتراً في الدقيقة.
    كم دقيقة تلزم لملء الخزان تماماً؟ (استعمل $\pi \approx 3.14$ و $1\,\text{m}^3 = 1000\,\text{L}$)
  figure: {type: cylinder, r_label: '5 m', h_label: '4 m', alt: "خزان أسطواني نصف قطر قاعدته 5 m وارتفاعه 4 m"}
  answer: {value: 75, tol: 0.5, unit: 'دقيقة'}
  verify: "Rational(314, 100) * 5**2 * (4 - 1) * 1000 / 3140"
  hint: 'احسب حجم الجزء الفارغ فقط، ثم حوّله إلى لترات قبل القسمة على معدل الضخ.'
  solution: |
    ارتفاع الجزء الفارغ من الخزان $= 4 - 1 = 3\,\text{m}$.
    حجم الماء اللازم: $V = \pi r^2 h \approx 3.14 \times 5^2 \times 3 = 235.5\,\text{m}^3$.
    نحوّل إلى لترات: $235.5 \times 1000 = 235500\,\text{L}$.
    الزمن $= 235500 \div 3140 = 75$ دقيقة.
  remediation: |
    قسّم المسألة إلى ثلاث مراحل: حجم الجزء الفارغ، ثم تحويله إلى لترات، ثم قسمته على معدل الضخ.
    اطلب من الطالب التحقق من أن وحدة الحجم ووحدة المعدل متطابقتان (لتر مع لتر) قبل القسمة.
  misconceptions: [total-instead-of-remaining-volume, unit-conversion-error, rate-inverted]
  qatar_link: "الصف الثامن — الوحدة 7: حجم الأسطوانة؛ والصف السابع — معدل الوحدة؛ والصفان السادس والسابع — السعة"

- id: M8-G4-019
  topic: G4
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: advanced
  format: mc
  context: qatar
  time: 150
  stem: |
    يبيع متجر نادي الدوحة للغولف كرات الغولف في أنبوب أسطواني يتّسع لثلاث كرات متماثلة بالضبط، كما في المقطع الطولي المرسوم.
    تلامس الكرات جدار الأنبوب، وتلامس كل كرتين متجاورتين، وتلامس الكرة العليا الغطاء والسفلى القاعدة.
    نصف قطر الكرة الواحدة $2\,\text{cm}$.
    ما حجم الفراغ داخل الأنبوب (غير المشغول بالكرات)؟
  figure:
    type: geo
    unit: 38
    pad: 30
    bounds: [0, 0, 2, 6]
    alt: "مقطع طولي في أنبوب أسطواني فيه ثلاث كرات متماثلة فوق بعضها تلامس الجدار والغطاء والقاعدة، ونصف قطر كل كرة 2 cm"
    items:
      - {circle: [[1, 1], 1], fill: '#E8EDF5', color: '#1B365D'}
      - {circle: [[1, 3], 1], fill: '#E8EDF5', color: '#1B365D'}
      - {circle: [[1, 5], 1], fill: '#E8EDF5', color: '#1B365D'}
      - {poly: [[0, 0], [2, 0], [2, 6], [0, 6]], color: '#1B365D', width: 3}
      - {seg: [[1, 5], [2, 5]], color: '#8A1538', width: 2.4}
      - {pt: [1, 5], color: '#8A1538'}
      - {text: [1.46, 5.36], s: '2 cm', size: 13, weight: bold, color: '#8A1538'}
  options: ['$16\pi\,\text{cm}^3$', '$32\pi\,\text{cm}^3$', '$48\pi\,\text{cm}^3$', '$80\pi\,\text{cm}^3$']
  option_values: ["16*pi", "32*pi", "48*pi", "80*pi"]
  key: A
  verify: "pi * 2**2 * (3 * 2 * 2) - 3 * Rational(4, 3) * pi * 2**3"
  hint: 'ارتفاع الأنبوب يساوي ثلاثة أقطار للكرة. احسب حجم الأنبوب وحجم الكرات الثلاث ثم اطرح.'
  rationale:
    B: 'حسب حجم الكرات الثلاث ($3 \times \frac{32}{3}\pi$)، وهو الحجم المشغول لا حجم الفراغ.'
    C: 'حسب حجم الأنبوب كله ولم يطرح حجم الكرات.'
    D: 'جمع حجم الأنبوب وحجم الكرات ($48\pi + 32\pi$) بدل طرحهما.'
  solution: |
    ارتفاع الأنبوب يساوي ثلاثة أقطار: $3 \times 4 = 12\,\text{cm}$.
    حجم الأنبوب: $V = \pi r^2 h = \pi \times 2^2 \times 12 = 48\pi\,\text{cm}^3$.
    حجم الكرة الواحدة: $\frac{4}{3}\pi r^3 = \frac{4}{3}\pi \times 2^3 = \frac{32}{3}\pi\,\text{cm}^3$، وحجم الكرات الثلاث $32\pi\,\text{cm}^3$.
    حجم الفراغ $= 48\pi - 32\pi = 16\pi\,\text{cm}^3$.
  remediation: |
    اطلب من الطالب أن يحدد ارتفاع الأنبوب بعدّ أقطار الكرات الثلاث على الرسم قبل أي حساب.
    ثم يحسب حجم الأنبوب وحجم الكرات كلاً على حدة، ويتأكد أن المطلوب هو الفراغ أي الفرق بينهما.
  misconceptions: [occupied-instead-of-empty-volume, operation-confusion, sphere-radius-squared-not-cubed]
  qatar_link: "الصف الثامن — الوحدة 7: حجم الأسطوانة والكرة (بند جسري)"

- id: M8-G4-020
  topic: G4
  cognitive: reasoning
  area: generalize
  difficulty: hard
  benchmark: high
  format: select_explain
  context: qatar
  time: 150
  points: 1
  stem: |
    تصمّم شركة في ميناء حمد حاوية جديدة بمضاعفة كل بُعد من أبعاد حاوية قديمة على شكل متوازي مستطيلات: الطول $l$ والعرض $w$ والارتفاع $h$.
    قال راشد: «ستتسع الحاوية الجديدة لضعف ما تتسع له القديمة، مهما كانت أبعاد القديمة».
    هل راشد على صواب؟ برّر إجابتك.
  figure: {type: cuboid, l: 4, h: 2, w: 2, l_label: 'l', h_label: 'h', w_label: 'w', alt: "حاوية على شكل متوازي مستطيلات: الطول l والعرض w والارتفاع h"}
  options: ["نعم، راشد على صواب", "لا، راشد ليس على صواب"]
  key: B
  verify: "all([(2 * l) * (2 * w) * (2 * h) == 8 * l * w * h for l in range(1, 5) for w in range(1, 4) for h in range(1, 4)])"
  rubric:
    full: 'يختار «لا، راشد ليس على صواب» ويبيّن أن الحجم يصبح ثمانية أمثال (لا مثلين)، بالرموز $2l \times 2w \times 2h = 8lwh$ أو بمثال عددي صحيح.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تبرير صحيح (مثل: يصبح الحجم أربعة أمثال، أو تعليل غير رياضي).'
    examples:
      correct:
        - 'الحجم $= l \times w \times h$. بعد المضاعفة $2l \times 2w \times 2h = 8 \times lwh$، فالحجم ثمانية أمثال.'
        - 'حاوية أبعادها $3$ و$2$ و$1$ حجمها $6$؛ والجديدة $6$ و$4$ و$2$ حجمها $48$، و$48 = 8 \times 6$.'
      incorrect:
        - 'لا، لأن الحجم يصبح أربعة أمثال.'
        - 'لا، لأن الحاوية الجديدة أكبر بكثير.'
        - 'نعم، لأن كل بُعد تضاعف فتضاعف الحجم.'
  hint: 'جرّب أبعاداً بسيطة، مثل حاوية أبعادها $1$ و$1$ و$1$، ثم ضاعف كل بُعد وقارن الحجمين.'
  solution: |
    الحجم الأصلي $V = l \times w \times h$.
    بعد مضاعفة كل بُعد يصبح الحجم $2l \times 2w \times 2h = 8 \times l \times w \times h = 8V$.
    إذن تتسع الحاوية الجديدة لثمانية أمثال ما تتسع له القديمة لا لضعفه، مهما كانت الأبعاد. راشد ليس على صواب.
  remediation: |
    اطلب من الطالب مقارنة مكعب طول حرفه $1$ بمكعب طول حرفه $2$ بعدّ مكعبات الوحدة في كل منهما ($1$ و$8$).
    ثم عمّم: عند ضرب كل بُعد في العدد $k$ يُضرب الحجم في $k^3$.
  misconceptions: [volume-scales-linearly, area-scale-factor-for-volume]
  qatar_link: "الصف السابع — حجم متوازي المستطيلات؛ الصف الثامن — الوحدة 7 (أثر تغيير الأبعاد في الحجم)"

- id: M8-G4-021
  topic: G4
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: high
  format: select_explain
  context: qatar
  time: 180
  points: 1
  stem: |
    تعرض شركة تمور في سوق واقف علبتين فارغتين للهدايا.
    الأولى أسطوانية قطر قاعدتها $12\,\text{cm}$ وارتفاعها $10\,\text{cm}$، والثانية على شكل متوازي مستطيلات قاعدته مربعة طول ضلعها $10\,\text{cm}$ وارتفاعه $12\,\text{cm}$.
    أي العلبتين تتسع لكمية تمور أكبر؟ برّر إجابتك بالحساب. (استعمل $\pi \approx 3.14$)
  figure:
    - {type: cylinder, d_label: '12 cm', h_label: '10 cm', caption: 'العلبة الأولى', alt: "علبة أسطوانية قطر قاعدتها 12 cm وارتفاعها 10 cm"}
    - {type: cuboid, l: 3, h: 3.6, w: 3, l_label: '10 cm', h_label: '12 cm', w_label: '10 cm', caption: 'العلبة الثانية', alt: "علبة على شكل متوازي مستطيلات قاعدتها مربعة ضلعها 10 cm وارتفاعها 12 cm"}
  options: ["العلبتان تتسعان للكمية نفسها", "العلبة الأولى (الأسطوانية)", "العلبة الثانية (ذات القاعدة المربعة)"]
  key: C
  verify: "Rational(314, 100) * 6**2 * 10 < 10 * 10 * 12"
  rubric:
    full: 'يختار العلبة الثانية ويبرّر بحساب الحجمين: الأسطوانة $\approx 1130.4\,\text{cm}^3$ (أو $360\pi$) ومتوازي المستطيلات $1200\,\text{cm}^3$، ثم يقارن بينهما.'
    zero: 'يختار علبة أخرى، أو يختار الصحيحة بلا حساب أو بحساب خاطئ (مثل استعمال القطر $12$ بدل نصف القطر $6$).'
    examples:
      correct:
        - 'الأسطوانة: $3.14 \times 6^2 \times 10 = 1130.4$. الثانية: $10 \times 10 \times 12 = 1200$. إذن الثانية أكبر.'
      incorrect:
        - 'الأسطوانة لأن قاعدتها أعرض.'
        - 'الثانية لأنها أطول، دون حساب.'
        - 'الأسطوانة لأن $3.14 \times 12^2 \times 10 = 4521.6$ أكبر من $1200$.'
  hint: 'احسب حجم كل علبة ثم قارن؛ لا يكفي النظر إلى العرض وحده أو الارتفاع وحده.'
  solution: |
    نصف قطر العلبة الأولى $r = 12 \div 2 = 6\,\text{cm}$.
    حجم العلبة الأولى: $V = \pi r^2 h \approx 3.14 \times 6^2 \times 10 = 1130.4\,\text{cm}^3$.
    حجم العلبة الثانية: $V = 10 \times 10 \times 12 = 1200\,\text{cm}^3$.
    وبما أن $1200 > 1130.4$ فالعلبة الثانية تتسع لكمية تمور أكبر.
  remediation: |
    نبّه إلى أن عرض القاعدة وحده أو الارتفاع وحده لا يحدد السعة؛ يجب حساب حجم كل علبة ثم المقارنة.
    ذكّر بتحويل القطر إلى نصف قطر قبل استعمال $V = \pi r^2 h$، وبأن مساحة الدائرة التي قطرها $d$ أقل من مساحة المربع الذي ضلعه $d$.
  misconceptions: [compare-by-one-dimension, square-diameter]
  qatar_link: "الصف الثامن — الوحدة 7: حجم الأسطوانة؛ والصف السابع — حجم المنشور والمقارنة بين الأحجام"
