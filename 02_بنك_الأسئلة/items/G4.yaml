  benchmark: intermediate
  format: mc
  context: pure
  time: 90
  stem: |
    كل مربع في الشبكة يمثّل وجهاً من أوجه مكعب، وعلى كل وجه حرف.
    عند طيّ الشبكة لتكوين المكعب، أي حرف يقع على الوجه المقابل للوجه $P$؟
  figure:
    type: geo
    unit: 40
    pad: 16
    bounds: [0, 0, 4, 3]
    alt: "شبكة مكعب من ستة مربعات: في الصف العلوي الحرفان P ثم S، وفي الصف الأوسط Q ثم R ثم T، وتحت المربع Q المربع U"
    items:
      - {poly: [[0, 2], [1, 2], [1, 3], [0, 3]], fill: '#E8EDF5', color: '#1B365D'}
      - {poly: [[1, 2], [2, 2], [2, 3], [1, 3]], fill: '#E8EDF5', color: '#1B365D'}
      - {poly: [[1, 1], [2, 1], [2, 2], [1, 2]], fill: '#E8EDF5', color: '#1B365D'}
      - {poly: [[2, 1], [3, 1], [3, 2], [2, 2]], fill: '#E8EDF5', color: '#1B365D'}
      - {poly: [[3, 1], [4, 1], [4, 2], [3, 2]], fill: '#E8EDF5', color: '#1B365D'}
      - {poly: [[1, 0], [2, 0], [2, 1], [1, 1]], fill: '#E8EDF5', color: '#1B365D'}
      - {text: [0.5, 2.5], s: 'P', size: 22, weight: bold, color: '#8A1538'}
      - {text: [1.5, 2.5], s: 'S', size: 22, weight: bold, color: '#8A1538'}
      - {text: [1.5, 1.5], s: 'Q', size: 22, weight: bold, color: '#8A1538'}
      - {text: [2.5, 1.5], s: 'R', size: 22, weight: bold, color: '#8A1538'}
      - {text: [3.5, 1.5], s: 'T', size: 22, weight: bold, color: '#8A1538'}
      - {text: [1.5, 0.5], s: 'U', size: 22, weight: bold, color: '#8A1538'}
  options: ['$Q$', '$R$', '$S$', '$T$']
  key: B
  verify: "(lambda opp: opp['P'] == 'R' and sorted(list(opp.keys()) + list(opp.values())) == ['P', 'Q', 'R', 'S', 'T', 'U'])({'P': 'R', 'Q': 'T', 'S': 'U'})"
  hint: 'تخيّل أحد الوجوه قاعدة للمكعب، ثم اطوِ الوجوه المجاورة له إلى أعلى واحداً بعد آخر.'
  rationale:
    A: 'يتلامس الوجهان $P$ و$Q$ على ضلع مشترك بعد الطيّ، فهما متجاوران لا متقابلان.'
    C: 'الوجه $S$ ملاصق للوجه $P$ في الشبكة نفسها، فلا يمكن أن يقابله.'
    D: 'الوجه $T$ أبعد وجه عن $P$ في الشبكة، لكنه مجاور له بعد الطيّ؛ فالبعد في الشبكة لا يعني التقابل.'
  solution: |
    نتخيّل الوجه $Q$ قاعدة للمكعب. عند الطيّ يصبح $R$ الجدار الأيمن، و$T$ الغطاء العلوي، و$S$ و$U$ الجدارين الخلفي والأمامي.
    الوجه $P$ ملاصق للوجه $S$ من اليسار، فيصبح الجدار الأيسر، وهو يقابل الجدار الأيمن $R$.
    إذن الوجه المقابل للوجه $P$ هو $R$.
  remediation: |
    اطلب من الطالب قصّ الشبكة من ورق مربعات وكتابة الحروف عليها ثم طيّها فعلاً.
    نبّه إلى أن الوجهين المقابلين لا يشتركان في أي ضلع، وأن قربهما أو بعدهما في الشبكة لا يحدد تقابلهما.
  misconceptions: [adjacent-faces-taken-as-opposite, far-in-net-means-opposite]
