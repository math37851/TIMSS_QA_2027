- id: M8-G4-006
  topic: G4
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: low
  format: mc
  context: real
  time: 60
  stem: |
    يمثّل الشكل شبكة علبة هدايا. أي مجسم تتكوّن منه هذه الشبكة عند طيّها؟
  figure:
    type: geo
    unit: 26
    pad: 14
    alt: "شبكة: ثلاثة مستطيلات متجاورة في صف، ومثلثان متطابقان أحدهما فوق المستطيل الأوسط والآخر تحته"
    items:
      - {poly: [[0, 0], [2, 0], [2, 4], [0, 4]], fill: '#E8EDF5', color: '#1B365D'}
      - {poly: [[2, 0], [4, 0], [4, 4], [2, 4]], fill: '#E8EDF5', color: '#1B365D'}
      - {poly: [[4, 0], [6, 0], [6, 4], [4, 4]], fill: '#E8EDF5', color: '#1B365D'}
      - {poly: [[2, 4], [4, 4], [3, 5.732]], fill: '#C2A649', opacity: 0.35, color: '#1B365D'}
      - {poly: [[2, 0], [4, 0], [3, -1.732]], fill: '#C2A649', opacity: 0.35, color: '#1B365D'}
  options: ['هرم رباعي', 'متوازي مستطيلات', 'هرم ثلاثي', 'منشور ثلاثي']
  key: D
  verify: "3 + 2 == 5 and 3 == 3"
  rationale:
    A: 'الهرم الرباعي له قاعدة مربعة وأربعة أوجه جانبية مثلثة، ولا مستطيلات في شبكته.'
    B: 'متوازي المستطيلات له ستة أوجه مستطيلة، أما الشبكة ففيها ثلاثة مستطيلات ومثلثان فقط.'
    C: 'الهرم الثلاثي أوجهه الأربعة كلها مثلثات، ولا مستطيلات في شبكته.'
  solution: |
    في الشبكة ثلاثة مستطيلات ومثلثان متطابقان.
    المثلثان هما القاعدتان، والمستطيلات الثلاثة هي الأوجه الجانبية (بعدد أضلاع المثلث).
    هذه مواصفات المنشور الثلاثي، وله $5$ أوجه.
  remediation: |
    ساعد الطالب على ربط الشبكة بالمجسم: في المنشور قاعدتان متطابقتان وأوجه جانبية مستطيلة بعدد أضلاع القاعدة، وفي الهرم أوجه جانبية مثلثة تلتقي في قمة.
    يمكن قصّ الشبكة وطيّها للتأكد.
  misconceptions: [prism-pyramid-confusion]
  qatar_link: "الصفان السادس والسابع — الشبكات والمجسمات"

- id: M8-G4-007
  topic: G4
  cognitive: knowing
  area: compute
  difficulty: easy
  benchmark: low
  format: numeric
  context: real
  time: 50
  stem: |
    عُبّئت علبة مكعبات سكر على شكل متوازي مستطيلات بمكعبات صغيرة، حرف كل مكعب منها $1\,\text{cm}$، كما في الشكل.
    كم مكعباً في العلبة؟
  figure: {type: cuboid, l: 5, h: 3, w: 2, unit_cubes: true, l_label: '5 cm', h_label: '3 cm', w_label: '2 cm', alt: "متوازي مستطيلات مقسّم إلى مكعبات وحدة: الطول 5 cm والارتفاع 3 cm والعرض 2 cm"}
  answer: {value: 30, unit: 'مكعباً'}
  verify: "5 * 3 * 2"
  solution: |
    في الطبقة الواحدة (القاعدة) $5 \times 2 = 10$ مكعبات، وعدد الطبقات $3$.
    عدد المكعبات $= 10 \times 3 = 30$، أي أن حجم العلبة $30\,\text{cm}^3$.
  remediation: |
    اطلب من الطالب بناء طبقة واحدة بمكعبات حقيقية ثم تكرارها: حجم متوازي المستطيلات $=$ مساحة القاعدة $\times$ الارتفاع.
    نبّه إلى خطأ عدّ المكعبات الظاهرة فقط، وإلى جمع الأبعاد بدل ضربها.
  misconceptions: [count-visible-cubes-only, operation-confusion]
  qatar_link: "الصف السادس — حجم متوازي المستطيلات بمكعبات الوحدة"

- id: M8-G4-008
  topic: G4
  cognitive: applying
  area: formulate
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: real
  time: 50
  stem: |
    يريد سلطان تغليف صندوق هدية على شكل مكعب، طول حرفه $8\,\text{cm}$، بالورق تغليفاً كاملاً دون تداخل.
    أي عبارة تمثّل مساحة الورق اللازمة؟
  figure: {type: cuboid, l: 3, h: 3, w: 3, unit: 30, l_label: '8 cm', h_label: '8 cm', w_label: '8 cm', alt: "مكعب طول حرفه 8 cm"}
  options: ['$6 \times 8^2$', '$8^3$', '$4 \times 8^2$', '$6 \times 8$']
  option_values: [384, 512, 256, 48]
  key: A
  verify: "6 * 8**2"
  hint: 'كم وجهاً للمكعب؟ وما مساحة كل وجه؟'
  rationale:
    B: 'حسب الحجم $8^3$ بدلاً من مساحة السطح.'
    C: 'غطّى أربعة أوجه جانبية فقط، ونسي الوجهين العلوي والسفلي.'
    D: 'ضرب عدد الأوجه في طول الحرف، فلم يحسب مساحة كل وجه.'
  solution: |
    للمكعب $6$ أوجه متطابقة، مساحة كل منها $8 \times 8 = 8^2 = 64\,\text{cm}^2$.
    مساحة الورق $= 6 \times 8^2 = 384\,\text{cm}^2$.
  remediation: |
    اعرض شبكة المكعب: ستة مربعات متطابقة. المساحة السطحية للمكعب $= 6 \times$ مساحة الوجه الواحد.
    فرّق بين المساحة (وحدات مربعة) والحجم (وحدات مكعبة).
  misconceptions: [area-volume-confusion, forgot-faces-in-surface-area]
  qatar_link: "الصفان السادس والسابع — المساحة السطحية للمكعب"

- id: M8-G4-009
  topic: G4
  cognitive: applying
  area: implement
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: real
  time: 60
  stem: |
    كوب آيس كريم على شكل مخروط، نصف قطر قاعدته $3\,\text{cm}$ وارتفاعه $8\,\text{cm}$.
    ما حجم الكوب؟
  figure: {type: cone, r_label: '3 cm', h_label: '8 cm', alt: "مخروط نصف قطر قاعدته 3 cm وارتفاعه 8 cm"}
  options: ['$8\pi\,\text{cm}^3$', '$24\pi\,\text{cm}^3$', '$36\pi\,\text{cm}^3$', '$72\pi\,\text{cm}^3$']
  option_values: ["8*pi", "24*pi", "36*pi", "72*pi"]
  key: B
  verify: "Rational(1, 3) * pi * 3**2 * 8"
  hint: 'حجم المخروط هو ثلث حجم الأسطوانة التي لها القاعدة والارتفاع نفسهما.'
  rationale:
    A: 'نسي تربيع نصف القطر، فحسب $\frac{1}{3} \times \pi \times 3 \times 8$.'
    C: 'استعمل $\frac{1}{2}$ بدل $\frac{1}{3}$.'
    D: 'نسي الضرب في $\frac{1}{3}$، فحسب حجم أسطوانة لها القاعدة والارتفاع نفسهما.'
  solution: |
    حجم المخروط $V = \frac{1}{3}\pi r^2 h$.
    $V = \frac{1}{3} \times \pi \times 3^2 \times 8 = \frac{1}{3} \times 72\pi = 24\pi\,\text{cm}^3$.
  remediation: |
    جرّب عملياً: املأ مخروطاً مجوفاً بالرمل وأفرغه في أسطوانة لها القاعدة والارتفاع نفسهما؛ يملأ ثلثها فقط.
    ثم تدرّب على كتابة الصيغة مع تربيع نصف القطر قبل الضرب.
  misconceptions: [cone-volume-forgot-third, forgot-to-square-radius, half-instead-of-third]
