- id: M8-G4-001
  topic: G4
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: intermediate
  format: numeric
  context: qatar
  time: 100
  stem: |
    خزان مياه في محطة لتحلية المياه على شكل أسطوانة، نصف قطر قاعدتها $3\,\text{m}$ وارتفاعها $5\,\text{m}$.
    ما حجم الماء اللازم لملء الخزان تماماً؟ (استعمل $\pi \approx 3.14$)
  figure: {type: cylinder, r_label: '3 m', h_label: '5 m', alt: "أسطوانة نصف قطرها 3 m وارتفاعها 5 m"}
  answer: {value: 141.3, tol: 0.1, unit: 'm³'}
  verify: "Rational(314, 100) * 3**2 * 5"
  solution: |
    حجم الأسطوانة $V = \pi r^2 h$.
    $V \approx 3.14 \times 3^2 \times 5 = 3.14 \times 9 \times 5 = 141.3\,\text{m}^3$.
  remediation: |
    اربط الحجم بفكرة «مساحة القاعدة × الارتفاع» كما في المنشور: مساحة الدائرة $\pi r^2$ ثم الضرب في الارتفاع.
    نبّه إلى الخطأ الشائع: استعمال $2\pi r$ (المحيط) بدلاً من $\pi r^2$ (المساحة).
  misconceptions: [circumference-instead-of-area, square-diameter]
  qatar_link: "الصف الثامن — حجم الأسطوانة"


- id: M8-G4-002
  topic: G4
  cognitive: knowing
  area: recall
  difficulty: foundation
  benchmark: low
  format: mc
  context: real
  time: 35
  stem: |
    علبة حليب سعتها $1\,\text{L}$. كم سنتيمتراً مكعباً يساوي هذا الحجم؟
  options: ['$10\,\text{cm}^3$', '$100\,\text{cm}^3$', '$1000\,\text{cm}^3$', '$10000\,\text{cm}^3$']
  option_values: [10, 100, 1000, 10000]
  key: C
  verify: "10 * 10 * 10"
  rationale:
    A: 'ضرب في $10$ مرة واحدة فقط، فعامل الحجم كأنه طول.'
    B: 'حسب $10 \times 10$، وهذه مساحة مربع حرفه $10\,\text{cm}$ وليست حجماً.'
    D: 'أضاف صفراً زائداً، فحسب $10 \times 10 \times 10 \times 10$.'
  hint: 'تخيّل مكعباً حرفه $10\,\text{cm}$.'
  solution: |
    اللتر الواحد يساوي حجم مكعب حرفه $10\,\text{cm}$.
    $V = 10 \times 10 \times 10 = 1000\,\text{cm}^3$، إذن $1\,\text{L} = 1000\,\text{cm}^3$.
  remediation: |
    اجعل الطالب يتخيّل مكعباً حرفه $10\,\text{cm}$ مملوءاً بمكعبات وحدة حرف كل منها $1\,\text{cm}$: عشرة في كل صف، وعشرة صفوف في الطبقة، وعشر طبقات.
    ثبّت العلاقة $1\,\text{L} = 1000\,\text{mL} = 1000\,\text{cm}^3$، ونبّه إلى أن تحويل وحدات الحجم يشمل ثلاثة أبعاد لا بعداً واحداً.
  misconceptions: [unit-conversion-error, area-volume-confusion]
  qatar_link: "الصفان السادس والسابع — الحجم وسعة الأوعية"

- id: M8-G4-003
  topic: G4
  cognitive: knowing
  area: identify
  difficulty: foundation
  benchmark: low
  format: dragdrop_categorize
  context: pure
  time: 60
  stem: |
    صنّف كل مجسم حسب سطحه: اسحب كل بطاقة إلى الفئة المناسبة.
  categories: ['كل أوجهه مستوية', 'له سطح منحنٍ']
  cards: ['المكعب', 'الهرم الرباعي', 'المنشور الثلاثي', 'الأسطوانة', 'المخروط', 'الكرة']
  key:
    'المكعب': 'كل أوجهه مستوية'
    'الهرم الرباعي': 'كل أوجهه مستوية'
    'المنشور الثلاثي': 'كل أوجهه مستوية'
    'الأسطوانة': 'له سطح منحنٍ'
    'المخروط': 'له سطح منحنٍ'
    'الكرة': 'له سطح منحنٍ'
  verify: "sum([0, 0, 0, 1, 1, 1]) == 3 and len([0, 0, 0, 1, 1, 1]) == 6"
  solution: |
    المكعب والهرم الرباعي والمنشور الثلاثي أوجهها كلها مضلعات مستوية.
    الأسطوانة والمخروط لكل منهما سطح جانبي منحنٍ (مع قاعدة أو قاعدتين مستويتين)، والكرة سطحها كله منحنٍ.
  remediation: |
    اطلب من الطالب أن يلمس نماذج حقيقية: أي جزء لا تلتصق به المسطرة المستقيمة فهو سطح منحنٍ.
    نبّه إلى أن للأسطوانة والمخروط قاعدة مستوية، لكن وجود السطح المنحني يضعهما في الفئة الثانية.
  misconceptions: [curved-surface-ignored]
  qatar_link: "الصفان السادس والسابع — المجسمات وخصائصها"

- id: M8-G4-004
  topic: G4
  cognitive: knowing
  area: recall
  difficulty: easy
  benchmark: low
  format: multi_numeric
  context: pure
  time: 60
  stem: |
    الشكل هرم قاعدته مربعة. أكمل: عدد أوجهه (بما فيها القاعدة)، وعدد أحرفه، وعدد رؤوسه.
  figure: {type: pyramid, alt: "هرم قاعدته مربعة، وأحرفه الخلفية مرسومة بخطوط متقطعة"}
  fields:
    - {label: 'عدد الأوجه', value: 5}
    - {label: 'عدد الأحرف', value: 8}
    - {label: 'عدد الرؤوس', value: 5}
  scoring: {mode: all}
  verify: "[4 + 1, 4 + 4, 4 + 1]"
  solution: |
    الأوجه: قاعدة مربعة واحدة وأربعة أوجه جانبية مثلثة، فالمجموع $5$.
    الأحرف: أربعة حول القاعدة وأربعة تصل القمة برؤوس القاعدة، فالمجموع $8$.
    الرؤوس: أربعة رؤوس للقاعدة ورأس القمة، فالمجموع $5$.
  remediation: |
    اطلب من الطالب أن يعدّ الأحرف المتقطعة (الخفية) أيضاً، وأن يعدّ على نموذج حقيقي بوضع علامة على كل حرف.
    للتحقق: عدد الرؤوس $-$ عدد الأحرف $+$ عدد الأوجه $= 2$، أي $5 - 8 + 5 = 2$.
  misconceptions: [hidden-edges-ignored, faces-edges-vertices-confusion]
  qatar_link: "الصفان السادس والسابع — الأوجه والأحرف والرؤوس"

