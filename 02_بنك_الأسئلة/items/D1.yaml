- id: M8-D1-009
  topic: D1
  cognitive: applying
  area: formulate
  difficulty: medium
  benchmark: intermediate
  format: mc
  context: pure
  time: 60
  stem: |
    في مجموعة بيانات عدد قيمها $240$ قيمة، تكرار إحدى الفئات $66$ قيمة. نريد تمثيل البيانات بالقطاعات الدائرية. أي عبارة تعطي قياس الزاوية المركزية للقطاع الذي يمثل هذه الفئة؟
  hint: 'ما الجزء الذي تمثله هذه الفئة من كل البيانات؟ وكم درجة تمثل الدائرة كلها؟'
  options: ['$\frac{240}{66} \times 360$', '$\frac{66}{360} \times 240$', '$\frac{66}{240} \times 360$', '$\frac{66}{240} \times 100$']
  option_values: ['240/66*360', '66/360*240', '66/240*360', '66/240*100']
  key: C
  verify: "Rational(66, 240) * 360"
  rationale:
    A: 'قلب الكسر: الجزء الذي تمثله الفئة من البيانات هو $\frac{66}{240}$ وليس $\frac{240}{66}$.'
    B: 'خلط بين العددين $360$ و$240$؛ الجزء يُحسب بقسمة تكرار الفئة على عدد كل القيم.'
    D: 'هذه العبارة تعطي النسبة المئوية للفئة وليس قياس الزاوية المركزية.'
  solution: |
    الجزء الذي تمثله الفئة من كل البيانات هو $\frac{66}{240}$، والدائرة كلها $360^\circ$.
    الزاوية المركزية $= \frac{66}{240} \times 360 = 99^\circ$.
    الإجابة الصحيحة: C.
  remediation: 'اجعل الطالب يكتب أولاً الكسر «تكرار الفئة ÷ مجموع التكرارات»، ثم يضربه في $360$ للزاوية أو في $100$ للنسبة المئوية؛ وليتحقق أن مجموع زوايا القطاعات $360^\circ$.'
  misconceptions: [rate-inverted, percent-wrong-base, angle-percent-confusion]
  qatar_link: 'الصف السابع: النسبة المئوية؛ الصف السادس: التمثيل بالقطاعات الدائرية'

