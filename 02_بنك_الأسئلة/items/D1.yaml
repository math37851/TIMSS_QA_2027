  options: ['ترابط سالب', 'ترابط موجب', 'لا يوجد ترابط', 'ترابط غير خطي']
  key: A
  verify: "(lambda c: [c < 0, c > 0, c == 0, False] == [True, False, False, False])(sum([(p[0] - 4.7) * (p[1] - 32.8) for p in [(1, 52), (2, 46), (2, 49), (3, 40), (4, 36), (5, 30), (6, 27), (7, 20), (8, 17), (9, 11)]]))"
