- id: M8-D1-016
  topic: D1
  cognitive: reasoning
  area: analyze
  difficulty: medium
  benchmark: high
  format: mc
  context: real
  time: 120
  stem: |
    يبيّن التمثيل بالأعمدة المجمّعة عدد الكتب التي استعارها طلاب إحدى المدارس من مكتبتها في فصلين دراسيين، بحسب نوع الكتاب (بيانات افتراضية). أي العبارات الآتية صحيحة؟
  figure:
    type: bar
    categories: ['القصص', 'العلوم', 'التاريخ', 'الرياضيات']
    series:
      - {name: 'الفصل الأول', values: [60, 45, 30, 25]}
      - {name: 'الفصل الثاني', values: [75, 40, 50, 30]}
    y_label: 'عدد الكتب المستعارة'
    title: 'الكتب المستعارة من مكتبة المدرسة (بيانات افتراضية)'
    value_labels: true
    y_max: 90
    y_step: 10
  options:
    - 'كانت أكبر زيادة في عدد الكتب المستعارة في كتب التاريخ.'
    - 'ازداد عدد الكتب المستعارة في كل نوع من الأنواع الأربعة.'
    - 'كانت أكبر زيادة في عدد الكتب المستعارة في كتب القصص لأنها الأكثر استعارة.'
    - 'كان مجموع الكتب المستعارة في الفصل الثاني أقل منه في الفصل الأول.'
  key: A
  verify: "(lambda a, b: [max([b[i] - a[i] for i in range(4)]) == b[2] - a[2], all([b[i] > a[i] for i in range(4)]), max([b[i] - a[i] for i in range(4)]) == b[0] - a[0], sum(b) < sum(a)] == [True, False, False, False])([60, 45, 30, 25], [75, 40, 50, 30])"
  rationale:
    B: 'عدد كتب العلوم انخفض من 45 إلى 40، فلم يزدد في كل الأنواع.'
    C: 'القصص الأعلى استعارة في الفصلين، لكن زيادتها 15 فقط وهي أقل من زيادة التاريخ (20)؛ الأكبر قيمة ليس بالضرورة الأكبر زيادة.'
    D: 'المجموع في الفصل الأول $60 + 45 + 30 + 25 = 160$ وفي الفصل الثاني $75 + 40 + 50 + 30 = 195$، فالمجموع ازداد ولم يقل.'
  solution: |
    نحسب التغير في كل نوع (الفصل الثاني مطروحاً منه الفصل الأول):
    القصص: $75 - 60 = 15$ (زيادة). العلوم: $40 - 45 = -5$ (نقصان).
    التاريخ: $50 - 30 = 20$ (زيادة). الرياضيات: $30 - 25 = 5$ (زيادة).
    أكبر زيادة في كتب التاريخ، فالعبارة A صحيحة.
    B خاطئة لأن العلوم نقصت، وC خاطئة لأن $15 < 20$، وD خاطئة لأن المجموعين 160 و195.
  remediation: 'درّب الطالب على حساب الفرق لكل نوع بين عمودين متجاورين قبل الحكم على أي عبارة، وعلى التمييز بين «الأكبر قيمة» و«الأكبر زيادة».'
  misconceptions: [highest-value-vs-largest-increase, generalize-from-some-categories]
