  stem: |
    يبيّن التمثيل بالصور عدد علب التمور التي باعها أحد المحال في سوق واقف خلال أربعة أيام (بيانات افتراضية). كم علبة باع المحل يومي الخميس والجمعة معاً؟
  figure:
    type: pictograph
    rows:
      - {label: 'الأربعاء', count: 3.5}
      - {label: 'الخميس', count: 5}
      - {label: 'الجمعة', count: 6.5}
      - {label: 'السبت', count: 4}
    key_value: 20
    key_unit: 'علبة'
    title: 'مبيعات علب التمور في سوق واقف (بيانات افتراضية)'
  answer: {value: 230, unit: 'علبة'}
  verify: "(5 + Rational(13, 2)) * 20"
  solution: |
    الخميس: 5 رموز، والجمعة: 6 رموز ونصف أي $6.5$ رمز.
    مجموع الرموز $5 + 6.5 = 11.5$.
    كل رمز يمثل 20 علبة، فعدد العلب $11.5 \times 20 = 230$.
  remediation: 'ذكّر الطالب بقراءة مفتاح الرسم أولاً، وأن نصف الرمز يمثل نصف قيمة المفتاح (10 علب هنا). تدرّب على جمع الرموز ثم الضرب في قيمة المفتاح.'
  misconceptions: [half-symbol-ignored, symbols-not-multiplied-by-key]
  qatar_link: 'الصف السادس: التمثيل بالصور والأعمدة (مراجعة تنظيم البيانات وتمثيلها)'

- id: M8-D1-006
  topic: D1
  cognitive: knowing
  area: compute
  difficulty: easy
  benchmark: intermediate
  format: numeric
  context: pure
  time: 45
  stem: |
    في تمثيل بالقطاعات الدائرية، قياس الزاوية المركزية لأحد القطاعات $72^\circ$. ما النسبة المئوية للبيانات التي يمثلها هذا القطاع؟
  answer: {value: 20, unit: '%'}
  verify: "Rational(72, 360) * 100"
  solution: |
    الدائرة كلها زاويتها المركزية $360^\circ$ وتمثل $100\%$ من البيانات.
    النسبة المئوية للقطاع $= \frac{72}{360} \times 100\% = 20\%$.
  remediation: 'اربط الدائرة الكاملة بالقيمتين $360^\circ$ و$100\%$؛ كل $1\%$ يقابل $3.6^\circ$. جرّب $25\%$ ثم $50\%$ ثم $10\%$ لتثبيت العلاقة.'
  misconceptions: [angle-percent-confusion]
  qatar_link: 'الصف السابع: النسبة المئوية؛ الصف السادس: التمثيل بالقطاعات الدائرية'

- id: M8-D1-007
  topic: D1
  cognitive: applying
  area: implement
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: qatar
  time: 60
  stem: |
    يبيّن مخطط النقاط عدد الأهداف المسجلة في كل مباراة من 20 مباراة في بطولة كرة القدم المدرسية بقطر (بيانات افتراضية). كل نقطة تمثل مباراة واحدة. ما عدد المباريات التي سُجّل فيها 3 أهداف أو أكثر؟
  figure:
    type: dot_plot
    min: 0
    max: 6
    step: 1
    counts: {0: 2, 1: 5, 2: 6, 3: 4, 4: 2, 5: 1}
    x_label: 'عدد الأهداف في المباراة'
    title: 'الأهداف في 20 مباراة مدرسية (بيانات افتراضية)'
  options: ['$4$', '$3$', '$13$', '$7$']
  option_values: [4, 3, 13, 7]
  key: D
  verify: "4 + 2 + 1"
  rationale:
    A: 'عدّ نقاط القيمة 3 فقط (4 مباريات) وأهمل القيمتين 4 و5.'
    B: 'عدّ المباريات التي سُجّل فيها أكثر من 3 أهداف ($2 + 1$) واستبعد القيمة 3 نفسها.'
    C: 'عدّ المباريات التي سُجّل فيها أقل من 3 أهداف ($2 + 5 + 6$) فعكس الاتجاه.'
  solution: |
    «3 أهداف أو أكثر» تعني القيم 3 و4 و5.
    عدد النقاط فوق القيمة 3 هو 4، وفوق القيمة 4 هو 2، وفوق القيمة 5 هو 1.
    المجموع $4 + 2 + 1 = 7$ مباريات.
    الإجابة الصحيحة: D.
  remediation: 'درّب الطالب على ترجمة عبارات «أو أكثر» و«أكثر من» و«أقل من» إلى القيم المطلوبة على خط الأعداد قبل العدّ، ثم عدّ النقاط فوق كل قيمة وجمعها.'
  misconceptions: [count-single-value-only, at-least-vs-more-than-confusion, inequality-direction-reversed]
  qatar_link: 'الصف السادس: مخطط النقاط'

