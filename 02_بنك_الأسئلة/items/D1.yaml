- id: M8-D1-004
  topic: D1
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: dragdrop_categorize
  context: real
  time: 90
  stem: |
    صنّف كل حالة من الحالات الآتية بحسب نوع الترابط المتوقع بين متغيريها لو مُثّلت ببيانات في مخطط انتشار.
  hint: 'اسأل نفسك: عندما يزيد المتغير الأول، هل يزيد الثاني أم يقل أم لا يتأثر؟'
  categories: ['ترابط موجب', 'ترابط سالب', 'لا يوجد ترابط']
  cards:
    - {id: c1, text: 'عمر الهاتف وسعر إعادة بيعه'}
    - {id: c2, text: 'درجة حرارة الجو واستهلاك الكهرباء للتبريد'}
    - {id: c3, text: 'طول الطالب وعدد أحرف اسمه'}
    - {id: c4, text: 'عدد ساعات المذاكرة ودرجة الاختبار'}
    - {id: c5, text: 'سرعة الدراجة والزمن اللازم لقطع مسافة ثابتة'}
    - {id: c6, text: 'يوم ميلاد الطالب في الشهر ودرجته في الاختبار'}
  key: {c1: 'ترابط سالب', c2: 'ترابط موجب', c3: 'لا يوجد ترابط', c4: 'ترابط موجب', c5: 'ترابط سالب', c6: 'لا يوجد ترابط'}
  verify: "True"
  solution: |
    ترابط موجب: يزيد المتغيران معاً. درجة الحرارة واستهلاك الكهرباء للتبريد، وساعات المذاكرة ودرجة الاختبار.
    ترابط سالب: يزيد أحدهما ويقل الآخر. عمر الهاتف وسعر إعادة بيعه، وسرعة الدراجة والزمن اللازم لقطع مسافة ثابتة.
    لا يوجد ترابط: لا علاقة بين المتغيرين. طول الطالب وعدد أحرف اسمه، ويوم ميلاده ودرجته.
  remediation: 'ناقش مع الطالب كل حالة بجملة «كلما زاد ... فإن ...»، ثم يرسم مخططاً تقريبياً لنقاط كل حالة ليرى اتجاهها: صاعد أم هابط أم مبعثر.'
  misconceptions: [correlation-sign-reversed, unrelated-variables-seen-as-related]
  qatar_link: 'الصف الثامن، الدرس 8-1 (مخططات الانتشار ونوع الترابط) — بند جسري'

- id: M8-D1-005
