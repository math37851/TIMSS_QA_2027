- id: M8-D1-017
  topic: D1
  cognitive: reasoning
  area: analyze
  difficulty: hard
  benchmark: advanced
  format: mc
  context: real
  time: 150
  stem: |
    يبيّن مخطط الانتشار عدد ساعات المذاكرة الأسبوعية لـ 11 طالباً ودرجة كل منهم في اختبار من 10 درجات (بيانات افتراضية). ما أثر حذف النقطة $(8, 2)$ من المخطط على الترابط بين المتغيرين؟
  figure:
    type: scatter
    points: [[1, 3], [2, 3], [2, 5], [3, 5], [4, 6], [5, 6], [5, 8], [6, 8], [7, 9], [8, 9], [8, 2]]
    x_min: 0
    x_max: 10
    y_min: 0
    y_max: 10
    x_step: 1
    y_step: 1
    x_label: 'ساعات المذاكرة الأسبوعية'
    y_label: 'الدرجة (من 10)'
    title: 'المذاكرة والدرجة (بيانات افتراضية)'
    alt: 'مخطط الانتشار لساعات المذاكرة والدرجة'
  options:
    - 'يتحول الترابط من موجب إلى سالب.'
    - 'يبقى الترابط موجباً ويصبح أضعف.'
    - 'يبقى الترابط موجباً ويصبح أقوى، لأن بقية النقاط أقرب إلى خط مستقيم.'
    - 'لا يتغير الترابط، لأن النقطة المحذوفة واحدة من 11 نقطة.'
  key: C
  verify: "(lambda cv, vx, vy, P: (lambda Q: [cv(Q) < 0, cv(Q) > 0 and cv(Q) ** 2 * vx(P) * vy(P) < cv(P) ** 2 * vx(Q) * vy(Q), cv(Q) > 0 and cv(Q) ** 2 * vx(P) * vy(P) > cv(P) ** 2 * vx(Q) * vy(Q), cv(Q) ** 2 * vx(P) * vy(P) == cv(P) ** 2 * vx(Q) * vy(Q)] == [False, False, True, False])([p for p in P if p != (8, 2)]))(lambda L: len(L) * sum([p[0] * p[1] for p in L]) - sum([p[0] for p in L]) * sum([p[1] for p in L]), lambda L: len(L) * sum([p[0] * p[0] for p in L]) - sum([p[0] for p in L]) ** 2, lambda L: len(L) * sum([p[1] * p[1] for p in L]) - sum([p[1] for p in L]) ** 2, [(1, 3), (2, 3), (2, 5), (3, 5), (4, 6), (5, 6), (5, 8), (6, 8), (7, 9), (8, 9), (8, 2)])"
  rationale:
    A: 'بقية النقاط ترتفع من اليسار إلى اليمين؛ فالنقطة المحذوفة تُضعف الترابط الموجب لكنها لا تعكس اتجاهه.'
    B: 'النقطة $(8, 2)$ بعيدة عن نمط بقية النقاط؛ حذفها يقرّب النقاط من خط مستقيم فيقوى الترابط ولا يضعف.'
    D: 'نقطة واحدة بعيدة عن النمط قد تؤثر كثيراً في قوة الترابط، لذلك يختلف الوصف بعد حذفها.'
  solution: |
    النقاط العشر الباقية تتجه من أسفل اليسار إلى أعلى اليمين وتقع قرب خط مستقيم: ترابط موجب قوي.
    النقطة $(8, 2)$ تقع بعيداً أسفل هذا النمط (قيمة متطرفة)، فتجعل النقاط أكثر تشتتاً وتضعف الترابط.
    عند حذفها يبقى الترابط موجباً ويصبح أقوى.
    الإجابة الصحيحة: C.
  remediation: 'اطلب من الطالب أن يغطي النقطة البعيدة بورقة ويصف النقاط الباقية، ثم يرفع الورقة ويقارن: هل أصبحت النقاط أقرب إلى خط مستقيم أم أبعد؟ ثم يصف الأثر بجملة.'
  misconceptions: [outlier-effect-ignored, weak-strong-association-confusion, correlation-sign-reversed]
  qatar_link: 'الصف الثامن، الدرس 8-1 (مخططات الانتشار: القيمة المتطرفة وقوة الترابط) — بند جسري'

- id: M8-D1-018
  topic: D1
  cognitive: reasoning
  area: analyze
  difficulty: hard
  benchmark: high
  format: select_explain
  context: qatar
  time: 150
  stem: |
    نشرت إدارة قرية كتارا الثقافية الرسم البياني الآتي لعدد زوارها (بالآلاف) في خمسة أشهر (بيانات افتراضية)، وكتبت تحته: «عدد الزوار تضاعف تقريباً بين يناير ومايو». هل العبارة صحيحة؟ اختر الإجابة، ثم برّر باستعمال أرقام من الرسم.
  figure:
    type: line
    x: ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو']
    values: [900, 915, 930, 945, 960]
    y_min: 880
    y_max: 980
    y_step: 20
    x_label: 'الشهر'
    y_label: 'عدد الزوار (بالآلاف)'
    title: 'زوار كتارا (بيانات افتراضية)'
  options: ['نعم، العبارة صحيحة.', 'لا، العبارة غير صحيحة.']
  key: B
  points: 1
  verify: "[Rational(960, 900) >= 2, Rational(960, 900) < 2] == [False, True]"
  rubric:
    full: 'يختار «لا» ويعلّل بأن المحور الرأسي يبدأ من $880$ لا من الصفر فتبدو الزيادة كبيرة، أو يبيّن أن الزيادة الفعلية $60$ ألف زائر فقط من $900$ ألف (نحو $6.7\%$) وليست مضاعفة.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تعليل مرتبط بالمحور الرأسي أو بأرقام الرسم.'
    examples:
      correct: ['المحور الرأسي يبدأ من 880 وليس من 0 فتبدو الزيادة كبيرة', 'الزيادة 60 ألف فقط من 900 ألف أي نحو 7% وليست الضعف']
      incorrect: ['نعم لأن الخط يرتفع كثيراً', 'لا لأن الخط ليس مستقيماً']
  solution: |
    يبدأ المحور الرأسي من $880$ لا من الصفر، فيبدو ارتفاع الخط كبيراً.
    عدد الزوار $900$ ألف في يناير و$960$ ألفاً في مايو، فالزيادة $960 - 900 = 60$ ألفاً.
    النسبة $\frac{60}{900} \approx 6.7\%$ فقط، وليست مضاعفة (التضاعف يعني $1800$ ألف).
    العبارة غير صحيحة: B.
  remediation: 'درّب الطالب على قراءة أرقام المحور الرأسي قبل الحكم على شكل الخط، وعلى سؤال «هل يبدأ المحور من الصفر؟»، ثم حساب التغير الفعلي (الفرق والنسبة المئوية) بدل الاعتماد على انطباع ارتفاع الخط.'
  misconceptions: [truncated-axis-exaggeration, visual-impression-over-values]
  qatar_link: 'الصف الثامن: قراءة التمثيلات البيانية وتحليلها (التمثيل بالخطوط)؛ الصف السابع: التغير المئوي'

- id: M8-D1-019
  topic: D1
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: advanced
  format: numeric
  context: qatar
  time: 180
  stem: |
    يعرض الإنفوجرافيك الآتي عدد المسافرين عبر مطار حمد الدولي في شهرين، ونسبة المسافرين إلى كل وجهة في كل شهر (بيانات افتراضية). ما الفرق بين عدد المسافرين إلى أوروبا في فبراير وعددهم في يناير، بالآلاف؟
  table:
    headers: ['الشهر', 'عدد المسافرين (بالآلاف)']
    rows:
      - ['يناير', '2400']
      - ['فبراير', '3000']
    row_headers: true
  figure:
    - type: pie
      title: 'وجهات المسافرين في يناير'
      sectors: [{label: 'آسيا', value: 40}, {label: 'أوروبا', value: 30}, {label: 'أفريقيا', value: 20}, {label: 'أمريكا', value: 10}]
      width: 400
      height: 280
    - type: pie
      title: 'وجهات المسافرين في فبراير'
      sectors: [{label: 'آسيا', value: 40}, {label: 'أوروبا', value: 25}, {label: 'أفريقيا', value: 25}, {label: 'أمريكا', value: 10}]
      width: 400
      height: 280
  answer: {value: 30, unit: 'ألف مسافر'}
  verify: "Rational(25, 100) * 3000 - Rational(30, 100) * 2400"
  solution: |
    يناير: $30\%$ من $2400$ ألف $= 0.3 \times 2400 = 720$ ألف مسافر إلى أوروبا.
    فبراير: $25\%$ من $3000$ ألف $= 0.25 \times 3000 = 750$ ألف مسافر إلى أوروبا.
    الفرق $750 - 720 = 30$ ألف مسافر.
    انخفضت النسبة المئوية لكن ارتفع العدد لأن المجموع الكلي في فبراير أكبر.
  remediation: 'اطلب من الطالب أن يحوّل كل نسبة مئوية إلى عدد باستعمال مجموع الشهر نفسه قبل المقارنة، فالنسبتان في شهرين مختلفين تخصان مجموعين مختلفين.'
  misconceptions: [compare-percents-not-counts, percent-wrong-base]
  qatar_link: 'الصف السابع: النسبة المئوية؛ الصف الثامن: دمج المعلومات من تمثيلين (إنفوجرافيك)'

- id: M8-D1-020
  topic: D1
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: high
  format: select_explain
  context: real
  time: 150
  stem: |
    يبيّن الجدول التكراري المزدوج نتائج مسح لاختيار النادي المدرسي بين طلاب وطالبات الصف الثامن في إحدى المدارس (بيانات افتراضية). قال خالد: «اختار الروبوت عدد أكبر من الطلاب مقارنة بالطالبات (30 مقابل 18)، إذن نادي الروبوت أكثر شعبية بين الطلاب منه بين الطالبات.» هل خالد على صواب؟ اختر الإجابة، ثم برّر باستعمال النسب المئوية.
  table:
    headers: ['', 'نادي الروبوت', 'نادي الفنون', 'المجموع']
    rows:
      - ['الطلاب', '30', '20', '50']
      - ['الطالبات', '18', '12', '30']
      - ['المجموع', '48', '32', '80']
    row_headers: true
  options: ['نعم، خالد على صواب.', 'لا، خالد ليس على صواب.']
  key: B
  points: 1
  verify: "[Rational(30, 50) > Rational(18, 30), not (Rational(30, 50) > Rational(18, 30))] == [False, True]"
  rubric:
    full: 'يختار «لا» ويقارن النسبتين المئويتين لا العددين: $\frac{30}{50} = 60\%$ من الطلاب و$\frac{18}{30} = 60\%$ من الطالبات فالنسبتان متساويتان؛ أو يذكر أن عدد الطلاب الكلي (50) يختلف عن عدد الطالبات (30) فلا تصح مقارنة العددين مباشرة.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تعليل بالنسب المئوية أو باختلاف عدد المجموعتين.'
    examples:
      correct: ['60% من الطلاب و60% من الطالبات اختاروا الروبوت فهما متساويتان', 'عدد الطلاب أكبر من عدد الطالبات فلا نقارن العددين بل النسب']
      incorrect: ['نعم لأن 30 أكبر من 18', 'لا لأن الطالبات أكثر']
  solution: |
    لا تصح مقارنة العددين مباشرة لأن عدد الطلاب (50) يختلف عن عدد الطالبات (30).
    نقارن النسبة المئوية داخل كل مجموعة: الطلاب $\frac{30}{50} = 60\%$ والطالبات $\frac{18}{30} = 60\%$.
    النسبتان متساويتان، فنادي الروبوت ليس أكثر شعبية بين الطلاب منه بين الطالبات.
    خالد ليس على صواب: B.
  remediation: 'درّب الطالب على أن يسأل قبل المقارنة: هل المجموعتان متساويتان في العدد؟ وإن لم تكونا كذلك فليحوّل كل تكرار إلى نسبة مئوية من مجموع صفه (أو عموده) ثم يقارن النسب.'
  misconceptions: [compare-counts-not-percents, percent-wrong-base]
  qatar_link: 'الصف الثامن: الدرسان المحذوفان 8-4/8-5 (الجداول التكرارية المزدوجة) — بند جسري؛ الصف السابع: النسب المئوية'

- id: M8-D1-021
  topic: D1
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: advanced
  format: cr_explain
  context: qatar
  time: 240
  stem: |
    يجمع نادي العلوم في إحدى مدارس الدوحة ثلاث مجموعات من البيانات (بيانات افتراضية):
    أولاً: متوسط درجة الحرارة في الدوحة في كل شهر من أشهر السنة.
    ثانياً: نسبة مساهمة كل مصدر طاقة (الغاز، والطاقة الشمسية، ومصادر أخرى) في إنتاج الكهرباء.
    ثالثاً: عدد ساعات تشغيل المكيّف يومياً وقيمة فاتورة الكهرباء الشهرية في 12 منزلاً.
    التمثيلات المتاحة: التمثيل بالخطوط، والتمثيل بالقطاعات الدائرية، ومخطط الانتشار، والمدرج التكراري.
    اختر لكل مجموعة بيانات التمثيل الأنسب لها، واكتب سبباً واحداً لكل اختيار.
  verify: "True"
  points: 2
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يختار التمثيل الأنسب للمجموعات الثلاث كلها (التمثيل بالخطوط للحرارة، والقطاعات الدائرية لنسب المصادر، ومخطط الانتشار للعلاقة بين ساعات التشغيل والفاتورة)، ويعلّل اثنين منها على الأقل تعليلاً صحيحاً (تغير مع الزمن، أجزاء من كل، علاقة بين متغيرين).'}
      - {code: 10, points: 1, desc: 'يختار الثلاثة صحيحة مع تعليل صحيح لواحد فقط أو دون تعليل صحيح، أو يختار اثنين صحيحين مع تعليل صحيح لواحد منهما على الأقل.'}
      - {code: 70, points: 0, desc: 'غير ذلك: أقل من اختيارين صحيحين، أو اختياران صحيحان دون أي تعليل صحيح.'}
    examples:
      correct: ['الحرارة تتغير مع الأشهر فأستعمل التمثيل بالخطوط', 'مصادر الطاقة أجزاء من كل مجموعه 100% فأستعمل القطاعات الدائرية', 'الساعات والفاتورة متغيران عدديان فأستعمل مخطط الانتشار']
      incorrect: ['المدرج التكراري للحرارة لأنه الأفضل', 'القطاعات الدائرية للعلاقة بين الساعات والفاتورة']
  model_answer: 'أولاً: التمثيل بالخطوط، لأن درجة الحرارة تتغير مع الزمن (الأشهر) والخط يُظهر الارتفاع والانخفاض. ثانياً: التمثيل بالقطاعات الدائرية، لأن النسب تمثل أجزاء من كل مجموعه $100\%$. ثالثاً: مخطط الانتشار، لأنه يبيّن العلاقة بين متغيرين عدديين (ساعات التشغيل والفاتورة) وكل منزل يمثل نقطة. أما المدرج التكراري فيعرض توزيع متغير واحد في فئات، فلا يناسب أياً من المجموعات الثلاث.'
  solution: |
    نسأل عن طبيعة كل مجموعة بيانات:
    تغير مع الزمن ← التمثيل بالخطوط. أجزاء من كل ← التمثيل بالقطاعات الدائرية. علاقة بين متغيرين عدديين ← مخطط الانتشار.
    المدرج التكراري يناسب توزيع متغير واحد في فئات متساوية، وليس مناسباً لأي من المجموعات الثلاث.
  remediation: 'أعدّ مع الطالب جدولاً يربط نوع السؤال بالتمثيل المناسب: تغير مع الزمن (خطوط)، أجزاء من كل (قطاعات)، علاقة بين متغيرين (انتشار)، توزيع متغير واحد (مدرج أو نقاط). ثم يصنّف أمثلة جديدة ويكتب سبب كل اختيار.'
  misconceptions: [graph-type-purpose-confusion, pie-chart-for-trend]
  qatar_link: 'الصف الثامن، الدرس 8-1 (مخططات الانتشار) — بند جسري؛ الصف السادس: اختيار التمثيل المناسب للبيانات'
