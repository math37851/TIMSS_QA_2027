  stem: |
    اسحب كل مقدار إلى المجموعة المناسبة.
  categories: ['مكافئ للمقدار $3(x + 2)$', 'غير مكافئ للمقدار $3(x + 2)$']
  cards: ['$3x + 6$', '$3x + 2$', '$6 + 3x$', '$x + x + x + 6$', '$2(x + 3)$', '$3(2 + x)$']
  key:
    '$3x + 6$': 'مكافئ للمقدار $3(x + 2)$'
    '$6 + 3x$': 'مكافئ للمقدار $3(x + 2)$'
    '$x + x + x + 6$': 'مكافئ للمقدار $3(x + 2)$'
    '$3(2 + x)$': 'مكافئ للمقدار $3(x + 2)$'
    '$3x + 2$': 'غير مكافئ للمقدار $3(x + 2)$'
    '$2(x + 3)$': 'غير مكافئ للمقدار $3(x + 2)$'
  verify: "all([simplify(e - 3*(x + 2)) == 0 for e in [3*x + 6, 6 + 3*x, x + x + x + 6, 3*(2 + x)]]) and all([simplify(e - 3*(x + 2)) != 0 for e in [3*x + 2, 2*(x + 3)]])"
  solution: |
    بتوزيع الضرب: $3(x + 2) = 3x + 6$.
    المقادير $6 + 3x$ و $x + x + x + 6$ و $3(2 + x)$ تساوي جميعها $3x + 6$.
    أما $3x + 2$ فنسي ضرب $2$ في $3$، و $2(x + 3) = 2x + 6$ مختلف عنه.
  remediation: |
    اختبر التكافؤ بالتعويض بعدد (مثل $x = 1$): إذا اختلفت القيمتان فالمقداران غير متكافئين.
    ثم استعمل نموذج المساحة (مستطيل عرضه 3 وطوله $x + 2$) لتوضيح خاصية التوزيع.
  misconceptions: [distribute-first-term-only, swap-factor-and-constant]
  qatar_link: "الصف السابع — المقادير الجبرية وخاصية التوزيع"

