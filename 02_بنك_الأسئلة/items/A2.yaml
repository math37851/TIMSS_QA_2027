- id: M8-A2-004
  topic: A2
  cognitive: applying
  area: implement
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: real
  time: 60
  stem: |
    بلاطة مربعة الشكل طول ضلعها $2x\,\text{cm}$.
    أي مقدار يمثل مساحتها بالسنتيمتر المربع؟
  options: ['$4x^2$', '$2x^2$', '$8x$', '$4x$']
  option_values: ['4*x**2', '2*x**2', '8*x', '4*x']
  key: A
  verify: "(2*x)**2"
  rationale:
    B: 'ربّع $x$ فقط وترك المعامل $2$ كما هو: $2 \times x^2$.'
    C: 'حسب المحيط ($4 \times 2x = 8x$) بدل المساحة.'
    D: 'ضرب $2x$ في $2$ بدل ضربه في نفسه: $2x \times 2 = 4x$.'
  solution: |
    مساحة المربع هي الضلع مضروباً في نفسه:
    $(2x)^2 = 2x \times 2x = (2 \times 2) \times (x \times x) = 4x^2$
    فالأس $2$ يشمل العدد $2$ والمتغير $x$ معاً.
  remediation: |
    اطلب من الطالب كتابة $(2x)^2$ على صورة $2x \times 2x$ ثم ضرب المعاملين والمتغيرين كلاً على حدة.
    وللتحقق عوّض $x = 3$: الضلع $6$ والمساحة $36$ ، و $4 \times 3^2 = 36$.
  misconceptions: [exponent-ignores-coefficient, area-perimeter-confusion, power-as-multiplication]
  qatar_link: "الصف الثامن 1-6/1-7 خواص الأسس · الصف السابع — المقادير الجبرية والمساحة (الفصل الثاني)"

- id: M8-A2-005
  topic: A2
  cognitive: applying
  area: formulate
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: qatar
  time: 75
  stem: |
    حديقة مستطيلة في منطقة أسباير بالدوحة، عرضها $x$ متراً وطولها $(2x + 3)$ متراً (بيانات افتراضية).
    أي مقدار يمثل محيطها بالمتر بأبسط صورة؟
  options: ['$3x + 3$', '$6x + 3$', '$6x + 6$', '$2x^2 + 3x$']
  option_values: ['3*x + 3', '6*x + 3', '6*x + 6', '2*x**2 + 3*x']
  key: C
  verify: "2*x + 2*(2*x + 3)"
  rationale:
    A: 'جمع العرض والطول مرة واحدة فقط ($x + 2x + 3$) فحصل على نصف المحيط.'
    B: 'وزّع الضرب في $2$ على $2x$ فقط: $2(2x + 3) = 4x + 3$ ثم أضاف $2x$.'
    D: 'حسب المساحة $x(2x + 3)$ بدل المحيط.'
  solution: |
    المحيط هو مجموع أطوال الأضلاع الأربعة، أي ضعف العرض مضافاً إليه ضعف الطول:
    $2x + 2(2x + 3) = 2x + 4x + 6 = 6x + 6$
  remediation: |
    اطلب من الطالب رسم المستطيل وكتابة طول كل ضلع عليه، ثم جمع الأضلاع الأربعة وتجميع الحدود المتشابهة.
    وللتحقق عوّض $x = 5$: الأبعاد $5$ و $13$ والمحيط $36$ ، و $6 \times 5 + 6 = 36$.
  misconceptions: [perimeter-half-only, distribute-first-term-only, area-perimeter-confusion]
  qatar_link: "الصف السابع — المقادير الجبرية (الفصل الثاني) · الصف الثامن 2-1 تجميع الحدود المتشابهة"

- id: M8-A2-006
  topic: A2
  cognitive: applying
  area: represent
  difficulty: medium
  benchmark: intermediate
