- id: M8-A2-007
  topic: A2
  cognitive: reasoning
  area: analyze
  difficulty: hard
  benchmark: high
  format: mc
  context: pure
  time: 120
  stem: |
    المقداران $3(x + k) - 2x$ و $x + 12$ متكافئان لجميع قيم $x$.
    ما قيمة $k$؟
  options: ['$4$', '$9$', '$12$', '$36$']
  option_values: [4, 9, 12, 36]
  key: A
  verify: "solve(Eq(3*(x + y) - 2*x, x + 12), y)[0]"
  rationale:
    B: 'وصل إلى $3k = 12$ ثم طرح $3$ من $12$ بدل القسمة عليه: $12 - 3 = 9$.'
    C: 'وزّع $3$ على $x$ فقط فصار المقدار $x + k$ ، فكتب $k = 12$.'
    D: 'ضرب $12$ في $3$ بدل قسمته عليه: $12 \times 3 = 36$.'
  solution: |
    نفكّ القوسين بالتوزيع: $3(x + k) - 2x = 3x + 3k - 2x = x + 3k$.
    لكي يتكافأ مع $x + 12$ يجب أن يتساوى الحدان الثابتان: $3k = 12$ ، فيكون $k = 4$.
    التحقق: $3(x + 4) - 2x = 3x + 12 - 2x = x + 12$.
  remediation: |
    اطلب من الطالب تجربة $k = 4$ بالتعويض بعدة قيم للمتغير $x$ (مثل $x = 1$ و $x = 2$) ومقارنة قيمتي المقدارين.
    ثم فكّ القوسين وتجميع الحدود المتشابهة لإيجاد $k$ مباشرة.
  misconceptions: [distribute-first-term-only, operation-confusion]
  qatar_link: "الصف السابع — المقادير الجبرية وخاصية التوزيع (الفصل الثاني) · الصف الثامن 2-1 تجميع الحدود المتشابهة"

- id: M8-A2-008
  topic: A2
  cognitive: reasoning
  area: justify
  difficulty: medium
  benchmark: intermediate
  format: mc
  context: pure
  time: 90
  stem: |
    أي تبرير مما يأتي صحيح في كل خطوة من خطواته، ويبيّن أن $x^3 \cdot x^2 = x^5$؟
  options:
    - '$x^3 \cdot x^2 = x^{3 \times 2} = x^6$ ، لأن الأسس تُضرب'
    - '$x^3 \cdot x^2 = x^3 + x^2 = x^5$ ، لأن الضرب يصبح جمعاً'
    - '$x^3 \cdot x^2 = (x \cdot x \cdot x)(x \cdot x) = x^5$ ، لأن عدد عوامل $x$ يصبح $5$'
    - '$x^3 \cdot x^2 = 3x \cdot 2x = 6x^2$ ، لأن $x^3$ تعني $3x$ و $x^2$ تعني $2x$'
  key: C
  verify: "simplify(x**3*x**2 - x**5) == 0 and simplify(x**3 + x**2 - x**5) != 0 and simplify(x**3*x**2 - x**6) != 0 and simplify(3*x*2*x - x**5) != 0"
  rationale:
    A: 'ضرب الأسس ($3 \times 2 = 6$) مع أن الأسس تُجمع عند ضرب قوى متساوية الأساس.'
    B: 'الناتج الأخير صحيح لكن الخطوة الوسطى خاطئة: $x^3 + x^2$ ليس حاصل ضرب القوتين ولا يساوي $x^5$.'
    D: 'عدّ $x^3$ مساوياً $3x$ و $x^2$ مساوياً $2x$ ، مع أن القوة تعني ضرب الأساس في نفسه لا ضربه في الأس.'
  solution: |
    $x^3$ تعني $x \cdot x \cdot x$ ، و $x^2$ تعني $x \cdot x$.
    $x^3 \cdot x^2 = (x \cdot x \cdot x)(x \cdot x) = x^5$ ، فعدد عوامل $x$ هو $3 + 2 = 5$.
    لذلك نجمع الأسس عند ضرب قوى متساوية الأساس.
  remediation: |
    اطلب من الطالب كتابة القوتين على صورة ضرب متكرر ثم عدّ عوامل $x$.
    ثم اختبار كل تبرير بالتعويض $x = 2$: $2^3 \cdot 2^2 = 8 \times 4 = 32$ ، و $2^5 = 32$ بينما $2^6 = 64$.
  misconceptions: [multiply-exponents, power-as-multiplication]
  qatar_link: "الصف الثامن 1-6/1-7 خواص الأسس"

- id: M8-A2-009
  topic: A2
  cognitive: applying
  area: implement
  difficulty: hard
  benchmark: high
  format: multi_numeric
  context: real
  time: 120
  stem: |
    شريط زينة طوله $3(2x - 5)$ سنتيمتراً قُصّ منه جزء طوله $2(x - 4)$ سنتيمتراً (حيث $x > 4$).
    بسّط الطول المتبقي إلى الصورة $ax + b$ ، ثم أدخل قيمة كل من $a$ و $b$.
  fields: [{label: '$a$', value: 4}, {label: '$b$', value: -7}]
  scoring: {mode: all}
  verify: "[expand(3*(2*x - 5) - 2*(x - 4)).coeff(x, 1), expand(3*(2*x - 5) - 2*(x - 4)).coeff(x, 0)]"
  solution: |
    الطول المتبقي هو الطول الأصلي مطروحاً منه الجزء المقصوص:
    $3(2x - 5) - 2(x - 4) = 6x - 15 - 2x + 8$
    (الطرح قبل القوس يغيّر إشارة كل حد داخله: $-2(x - 4) = -2x + 8$)
    $= (6x - 2x) + (-15 + 8) = 4x - 7$
    إذن $a = 4$ و $b = -7$.
  remediation: |
    ذكّر الطالب بأن الطرح قبل القوس يغيّر إشارة كل حد داخله: $-2(x - 4) = -2x + 8$ وليس $-2x - 8$.
    وللتحقق عوّض $x = 5$: الطول $15$ والمقصوص $2$ والمتبقي $13$ ، و $4 \times 5 - 7 = 13$.
  misconceptions: [negative-sign-not-distributed, distribute-first-term-only]
  qatar_link: "الصف السابع — المقادير الجبرية وخاصية التوزيع (الفصل الثاني) · الصف الثامن 2-1 تجميع الحدود المتشابهة"

