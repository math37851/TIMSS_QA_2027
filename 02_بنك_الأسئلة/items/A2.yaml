  stem: |
    بسّط المقدار $(x^3)^4$ إلى الصورة $x^n$.
    ما قيمة $n$؟
  answer: {value: 12}
  verify: "((x**3)**4).as_coeff_exponent(x)[1]"
  solution: |
    عند رفع قوة إلى قوة نضرب الأسس:
    $(x^3)^4 = x^{3 \times 4} = x^{12}$
    إذن $n = 12$.
  remediation: |
    اطلب من الطالب كتابة $(x^3)^4 = x^3 \cdot x^3 \cdot x^3 \cdot x^3$ ثم عدّ عوامل $x$: ثلاثة في كل مجموعة وأربع مجموعات، أي $12$ عاملاً.
    الخطأ الشائع هو جمع الأسس ($3 + 4 = 7$) بدل ضربها.
  misconceptions: [add-exponents-in-power-of-power]
  qatar_link: "الصف الثامن 1-6/1-7 خواص الأسس"

- id: M8-A2-011
  topic: A2
  cognitive: applying
  area: represent
  difficulty: medium
  benchmark: intermediate
  format: dragdrop_slots
  context: qatar
  time: 80
  stem: |
    مساحة حديقة مستطيلة في كتارا تساوي $6x + 18$ متراً مربعاً (بيانات افتراضية).
    أخرج القاسم المشترك الأكبر للحدّين لكتابة المساحة على صورة حاصل ضرب، ثم اسحب بطاقة إلى كل خانة.
  cards: ['2', '3', '6', '9', '18']
  template: '$6x + 18 =$ [[1]] $\times (x +$ [[2]] $)$'
  key: {1: '6', 2: '3'}
  verify: "s1 == 6 and s1 * s2 == 18"
  solution: |
    القاسم المشترك الأكبر للعددين $6$ و $18$ هو $6$.
    $6x + 18 = 6 \times x + 6 \times 3 = 6(x + 3)$
    فتكون الخانة الأولى $6$ والخانة الثانية $3$.
  remediation: |
    اطلب من الطالب فكّ القوسين بالتوزيع للتحقق: $6(x + 3) = 6x + 18$.
    ثم استعمل نموذج المساحة: مستطيل عرضه $6$ مقسوم إلى جزأين طولاهما $x$ و $3$.
  misconceptions: [factor-only-first-term, incomplete-factorization]
  qatar_link: "الصف السابع — المقادير الجبرية وإخراج عامل مشترك بسيط (الفصل الثاني)"

- id: M8-A2-012
  topic: A2
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: low
  format: dragdrop_categorize
  context: pure
  time: 100
  stem: |
    اسحب كل مساواة إلى المجموعة المناسبة بحسب صحة التبسيط لجميع قيم $x$.
  categories: ['تبسيط صحيح', 'تبسيط خاطئ']
  cards: ['$x^2 \cdot x^3 = x^6$', '$3x \cdot 4x = 12x^2$', '$2x + 3x = 5x^2$', '$(3x)^2 = 9x^2$', '$(2x)^3 = 2x^3$', '$x^2 + x^2 = 2x^2$']
  key:
    '$x^2 \cdot x^3 = x^6$': 'تبسيط خاطئ'
    '$3x \cdot 4x = 12x^2$': 'تبسيط صحيح'
    '$2x + 3x = 5x^2$': 'تبسيط خاطئ'
    '$(3x)^2 = 9x^2$': 'تبسيط صحيح'
    '$(2x)^3 = 2x^3$': 'تبسيط خاطئ'
    '$x^2 + x^2 = 2x^2$': 'تبسيط صحيح'
  verify: "all([simplify(p[0] - p[1]) == 0 for p in [(3*x*4*x, 12*x**2), ((3*x)**2, 9*x**2), (x**2 + x**2, 2*x**2)]]) and all([simplify(p[0] - p[1]) != 0 for p in [(x**2*x**3, x**6), (2*x + 3*x, 5*x**2), ((2*x)**3, 2*x**3)]])"
  solution: |
    الصحيحة: $3x \cdot 4x = 12x^2$ و $(3x)^2 = 9x^2$ و $x^2 + x^2 = 2x^2$.
    $x^2 \cdot x^3 = x^{2 + 3} = x^5$ (نجمع الأسس) وليس $x^6$.
    $2x + 3x = 5x$ (نجمع المعاملين فقط) وليس $5x^2$.
    $(2x)^3 = 2^3 \cdot x^3 = 8x^3$ وليس $2x^3$.
  remediation: |
    اطلب من الطالب اختبار كل مساواة بالتعويض (مثل $x = 2$)؛ فالمساواة الخاطئة تعطي قيمتين مختلفتين.
    ثم كتابة القوة على صورة ضرب متكرر: $x^2 \cdot x^3 = (x \cdot x)(x \cdot x \cdot x) = x^5$.
  misconceptions: [multiply-exponents, like-terms-add-exponent, exponent-ignores-coefficient]
  qatar_link: "الصف الثامن 1-6/1-7 خواص الأسس · 2-1 تجميع الحدود المتشابهة"

- id: M8-A2-013
  topic: A2
  cognitive: applying
  area: implement
  difficulty: easy
  benchmark: intermediate
  format: dragdrop_order
  context: pure
  time: 80
  stem: |
    بسّط كل مقدار، ثم رتّب المقادير من الأصغر إلى الأكبر بحسب الأس الذي يظهر على $x$ في الناتج.
  cards:
    - {id: e3, text: '$x^2 \cdot x^3$', value: 5}
    - {id: e1, text: '$x \cdot x^2$', value: 3}
    - {id: e4, text: '$(x^3)^2$', value: 6}
    - {id: e2, text: '$(x^2)^2$', value: 4}
  key: [e1, e2, e3, e4]
  direction: asc
  order_labels: ['الأس الأصغر', 'الأس الأكبر']
  solution: |
    $x \cdot x^2 = x^{1 + 2} = x^3$
    $(x^2)^2 = x^{2 \times 2} = x^4$
    $x^2 \cdot x^3 = x^{2 + 3} = x^5$
    $(x^3)^2 = x^{3 \times 2} = x^6$
    الترتيب من الأصغر إلى الأكبر: $x \cdot x^2$ ثم $(x^2)^2$ ثم $x^2 \cdot x^3$ ثم $(x^3)^2$.
  remediation: |
    اطلب من الطالب كتابة القوى على صورة ضرب متكرر وعدّ عوامل $x$ في كل مقدار.
    القاعدة: عند ضرب قوى متساوية الأساس نجمع الأسس، وعند رفع قوة إلى قوة نضرب الأسس.
    وتذكير: $x$ وحدها تعني $x^1$.
  misconceptions: [multiply-exponents, add-exponents-in-power-of-power, invisible-exponent-one]
  qatar_link: "الصف الثامن 1-6/1-7 خواص الأسس"

- id: M8-A2-014
  topic: A2
  cognitive: reasoning
  area: analyze
  difficulty: medium
  benchmark: intermediate
  format: select_explain
  context: real
  time: 120
  stem: |
    اشترى سالم قميصين، وسعر القميص الواحد $(x + 5)$ ريالاً. كتب سالم المبلغ الذي دفعه هكذا:
    $2(x + 5) = 2x + 5$
    هل تبسيط سالم صحيح؟ اختر الإجابة ثم اشرح سبب اختيارك.
  options: ['نعم، التبسيط صحيح', 'لا، التبسيط غير صحيح']
  key: B
  points: 1
  rubric:
    full: 'يختار «لا» ويوضح أن العدد $2$ يجب أن يضرب كلا الحدّين داخل القوسين فيكون $2(x + 5) = 2x + 10$ ، أو يبيّن الخطأ بالتعويض (مثل $x = 10$: ثمن القميصين $2 \times 15 = 30$ بينما $2x + 5 = 25$).'
    zero: 'يختار «نعم»، أو يختار «لا» دون تفسير صحيح (مثل «لأن الجواب خطأ» أو إعادة المقدار دون تبرير).'
    examples:
      correct: ['لا، لأن العدد $2$ يضرب في $x$ وفي $5$ معاً ، فالصحيح $2x + 10$.', 'لا، فعند $x = 10$ يكون ثمن القميصين $30$ ريالاً لكن $2x + 5$ يساوي $25$.']
      incorrect: ['نعم، لأنه ضرب $2$ في $x$.', 'لا، لأن المقدار طويل.', 'لا، لأن الجواب خطأ.']
  verify: "simplify(2*(x + 5) - (2*x + 5)) != 0 and simplify(2*(x + 5) - (2*x + 10)) == 0"
  solution: |
    ثمن القميصين هو $2(x + 5)$. بالتوزيع نضرب $2$ في كل حد داخل القوسين:
    $2(x + 5) = 2 \times x + 2 \times 5 = 2x + 10$
    أخطأ سالم لأنه ضرب $x$ فقط في $2$ وترك $5$ كما هو، فالتبسيط الصحيح $2x + 10$.
  remediation: |
    اطلب من الطالب التعويض: إذا كان سعر القميص $15$ ريالاً ($x = 10$) فثمن القميصين $30$ ريالاً، لكن $2x + 5 = 25$.
    ثم استعمل نموذج المساحة: مستطيل عرضه $2$ وطوله $x + 5$ مقسوم إلى جزأين.
  misconceptions: [distribute-first-term-only]
  qatar_link: "الصف السابع — المقادير الجبرية وخاصية التوزيع (الفصل الثاني)"

- id: M8-A2-015
  topic: A2
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: high
  format: select_explain
  context: real
  time: 150
  stem: |
    تعرض شركتا اتصالات رسم الاشتراك الشهري في خدمة الإنترنت بحسب عدد الساعات الإضافية $x$ (بيانات افتراضية):
    الشركة الأولى: $(x + 4)$ ريالاً ، والشركة الثانية: $(2x + 3)$ ريالاً.
    جرّب خالد $x = 1$ فوجد أن الرسم $5$ ريالات في الشركتين، فقال: «الرسم متساوٍ في الشركتين دائماً».
    هل خالد على صواب؟ اختر الإجابة ثم برّر.
  options: ['لا، خالد ليس على صواب', 'نعم، خالد على صواب']
  key: A
  points: 1
  rubric:
    full: 'يختار «لا» ويوضح أن تساوي القيمتين عند $x = 1$ لا يكفي، ويعطي مثالاً مضاداً (مثل $x = 2$: $6$ مقابل $7$ ، أو $x = 0$: $4$ مقابل $3$) أو يبيّن أن المقدارين يتساويان عند $x = 1$ فقط.'
    zero: 'يختار «نعم»، أو يختار «لا» دون مثال مضاد أو سبب صحيح.'
    examples:
      correct: ['لا، فعند $x = 2$ يكون الرسم $6$ ريالات في الشركة الأولى و $7$ ريالات في الثانية، فهما مختلفان.', 'لا، المقداران متساويان عند $x = 1$ فقط، وعند $x = 0$ يكون الرسم $4$ و $3$.']
      incorrect: ['نعم، لأن القيمتين متساويتان عند $x = 1$.', 'لا، لأنهما مختلفان.', 'لا، لأن خالد جرّب قيمة واحدة فقط.']
  verify: "simplify((x + 4) - (2*x + 3)) != 0 and (1 + 4) == (2*1 + 3) and (2 + 4) != (2*2 + 3) and (0 + 4) != (2*0 + 3)"
  solution: |
    اختبار قيمة واحدة لا يكفي لإثبات التكافؤ، لكن مثالاً مضاداً واحداً يكفي لنفيه.
    عند $x = 2$: الشركة الأولى $2 + 4 = 6$ ريالات والثانية $2 \times 2 + 3 = 7$ ريالات، فالرسمان مختلفان.
    وعند $x = 0$: $4$ مقابل $3$. إذن المقداران غير متكافئين، ويتساويان عند $x = 1$ فقط.
  remediation: |
    وضّح للطالب أن مثالاً واحداً لا يثبت التكافؤ، وأن مثالاً مضاداً واحداً يكفي لنفيه.
    واطلب منه بناء جدول قيم للمقدارين عند $x = 0$ و $1$ و $2$ و $3$ ومقارنة الصفوف.
  misconceptions: [examples-prove-general, reasoning-by-coincidence]
  qatar_link: "الصف السابع — المقادير الجبرية (الفصل الثاني) · الصف الثامن 2-1 (مقارنة المقادير بالتعويض)"

- id: M8-A2-016
  topic: A2
  cognitive: reasoning
  area: generalize
  difficulty: hard
  benchmark: advanced
  format: cr_explain
  context: qatar
  time: 240
  stem: |
    في استاد لوسيل، أرقام ثلاثة مقاعد متجاورة في الصف الواحد هي ثلاثة أعداد صحيحة متتالية، وأصغرها $n$ (بيانات افتراضية).
    أولاً: اكتب مقداراً لمجموع أرقام المقاعد الثلاثة، ثم بسّطه.
    ثانياً: هل يقبل هذا المجموع القسمة على $3$ دائماً مهما كان $n$؟ برّر إجابتك باستعمال الجبر.
  points: 2
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يكتب المجموع $n + (n + 1) + (n + 2)$ ويبسّطه إلى $3n + 3$ ، ثم يبرّر بالجبر أن $3n + 3 = 3(n + 1)$ مضاعف للعدد $3$ دائماً (أو أنه يساوي ثلاثة أمثال العدد الأوسط).'}
      - {code: 10, points: 1, desc: 'يكتب المقدار ويبسّطه إلى $3n + 3$ بصورة صحيحة دون تبرير جبري كافٍ للقسمة على $3$ (مثل الاكتفاء بالإجابة «نعم» أو بأمثلة عددية)، أو يبرّر تبريراً صحيحاً بعد خطأ بسيط في التبسيط.'}
      - {code: 70, points: 0, desc: 'مقدار غير صحيح للمجموع، أو أمثلة عددية فقط دون أي تعبير جبري، أو إجابة غير مكتملة.'}
    examples:
      correct: ['المجموع $n + (n + 1) + (n + 2) = 3n + 3 = 3(n + 1)$ ، وهو مضاعف للعدد $3$ لأن $n + 1$ عدد صحيح، فالجواب نعم دائماً.']
      incorrect: ['$5 + 6 + 7 = 18$ و $10 + 11 + 12 = 33$ وكلاهما يقبل القسمة على $3$ ، إذن نعم دائماً.', 'المجموع $3n + 2$ ، لذلك لا يقبل القسمة على $3$ دائماً.']
  model_answer: 'أولاً: المجموع $n + (n + 1) + (n + 2) = 3n + 3$. ثانياً: $3n + 3 = 3(n + 1)$ ، وبما أن $n + 1$ عدد صحيح فإن المجموع مضاعف للعدد $3$ دائماً، أي يقبل القسمة على $3$ مهما كان $n$ (وهو يساوي ثلاثة أمثال رقم المقعد الأوسط).'
  verify: "simplify(x + (x + 1) + (x + 2) - (3*x + 3)) == 0 and simplify(3*x + 3 - 3*(x + 1)) == 0 and (5 + 6 + 7) % 3 == 0 and (10 + 11 + 12) % 3 == 0"
  solution: |
    أولاً: أرقام المقاعد الثلاثة هي $n$ و $n + 1$ و $n + 2$ ، ومجموعها:
    $n + (n + 1) + (n + 2) = 3n + 3$
    ثانياً: بإخراج العامل المشترك $3n + 3 = 3(n + 1)$.
    وبما أن $n + 1$ عدد صحيح فالمجموع مضاعف للعدد $3$ دائماً، أي يقبل القسمة على $3$ مهما كان $n$.
  remediation: |
    اطلب من الطالب أن يجرب أمثلة (مثل $4 + 5 + 6$ و $7 + 8 + 9$) ثم يعمّم بالرمز $n$.
    وضّح أن الأمثلة تُوحي بالقاعدة، أما الجبر ($3n + 3 = 3(n + 1)$) فيثبتها لجميع الحالات.
  misconceptions: [examples-prove-general, pattern-not-extended]
  qatar_link: "الصف السابع — المقادير الجبرية (الفصل الثاني) · الصف الثامن 2-1 تجميع الحدود المتشابهة"
