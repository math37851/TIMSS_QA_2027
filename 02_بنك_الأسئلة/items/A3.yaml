# ---------------------------------------------------------------------------
# 001 | معرفة/تذكّر | تأسيسي | mc | pure | المفتاح C
# ---------------------------------------------------------------------------
- id: M8-A3-001
  topic: A3
  cognitive: knowing
  area: recall
  difficulty: foundation
  benchmark: low
  format: mc
  context: pure
  time: 30
  stem: |
    أي متباينة تعبّر عن العبارة: «العدد $x$ على الأكثر 15»؟
  options: ['$x < 15$', '$x \ge 15$', '$x \le 15$', '$x > 15$']
  key: C
  verify: "[all(o(v) == (v <= 15) for v in range(10, 21)) for o in [lambda v: v < 15, lambda v: v >= 15, lambda v: v <= 15, lambda v: v > 15]] == [False, False, True, False]"
  rationale:
    A: 'استعمل $<$ فاستبعد العدد 15 نفسه، مع أن «على الأكثر» تسمح بأن يساوي $x$ العدد 15.'
    B: 'عكس الاتجاه: $x \ge 15$ تعني «على الأقل 15».'
    D: 'عكس الاتجاه واستبعد العدد 15 معاً.'
  solution: |
    «على الأكثر 15» تعني أن $x$ لا يتجاوز 15، أي يساوي 15 أو يقل عنه.
    الرمز المناسب هو $\le$ ، فتكون المتباينة $x \le 15$.
  remediation: |
    اربط كل عبارة برمزها: «على الأكثر» ↔ $\le$ ، «على الأقل» ↔ $\ge$ ، «أقل من» ↔ $<$ ، «أكثر من» ↔ $>$. اطلب من الطالب تجربة الأعداد 14 و15 و16 في كل متباينة ليرى أيها يقبل العدد 15.
  misconceptions: [strict-vs-inclusive-inequality, at-most-at-least-confusion]
  qatar_link: 'الصف السابع، الفصل الثاني: المتباينات (ترجمة «على الأكثر» و«على الأقل»)؛ الصف الثامن، الوحدة 2: المعادلات الخطية'

# ---------------------------------------------------------------------------
# 002 | معرفة/تعرّف | تأسيسي | mc | qatar | المفتاح A
# ---------------------------------------------------------------------------
- id: M8-A3-002
  topic: A3
  cognitive: knowing
  area: identify
  difficulty: foundation
  benchmark: low
  format: mc
  context: qatar
  time: 45
  stem: |
    أصبح رصيد بطاقة مترو الدوحة لدى سارة 30 ريالاً بعد الشحن، ويقلّ الرصيد 4 ريالات عن كل رحلة. بعد $n$ رحلة بقي في البطاقة 18 ريالاً. أي معادلة تمثل الموقف؟ (بيانات افتراضية)
  options: ['$30 - 4n = 18$', '$4n - 30 = 18$', '$30 + 4n = 18$', '$30n - 4 = 18$']
  key: A
  verify: "Rational(30 - 18, 4) == 3 and [o(3) for o in [lambda n: 30 - 4*n == 18, lambda n: 4*n - 30 == 18, lambda n: 30 + 4*n == 18, lambda n: 30*n - 4 == 18]] == [True, False, False, False]"
  rationale:
    B: 'عكس ترتيب الطرح: الرصيد يبدأ بـ 30 ثم يُطرح منه $4n$، لا العكس.'
    C: 'جمع $4n$ إلى الرصيد، مع أن الرصيد يقلّ بعد كل رحلة.'
    D: 'ضرب 30 في عدد الرحلات، مع أن الذي يتكرر مع كل رحلة هو 4.'
  solution: |
    الرصيد في البداية 30 ريالاً، ويقلّ بمقدار 4 ريالات عن كل رحلة.
    بعد $n$ رحلة يقلّ الرصيد بمقدار $4n$، فيصبح $30 - 4n$.
    هذا الرصيد يساوي 18، فالمعادلة هي $30 - 4n = 18$ (وحلها $n = 3$).
  remediation: |
    اطلب من الطالب كتابة الرصيد بعد رحلة واحدة ثم رحلتين بالأعداد ($30 - 4$ ثم $30 - 8$) قبل التعميم إلى $n$ رحلة. ثم قراءة المعادلة بالكلمات: «30 ناقص 4 في عدد الرحلات يساوي 18».
  misconceptions: [subtraction-order-reversed, operation-confusion, variable-attached-to-wrong-term]
  qatar_link: 'الصف السابع، الفصل الثاني: كتابة المعادلات من مواقف؛ الصف الثامن، الوحدة 2: المعادلات الخطية'

