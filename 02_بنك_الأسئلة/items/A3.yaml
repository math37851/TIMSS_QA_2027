# ---------------------------------------------------------------------------
# 015 | استدلال/برّر | صعب | select_explain | pure
# ---------------------------------------------------------------------------
- id: M8-A3-015
  topic: A3
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: advanced
  format: select_explain
  context: pure
  time: 150
  stem: |
    أراد سعيد ورنا كتابة معادلة تمثل العبارة: «مجموع ثلاثة أعداد صحيحة متتالية يساوي 48». كتب سعيد المعادلة $x + (x + 1) + (x + 2) = 48$ ، وكتبت رنا المعادلة $(y - 1) + y + (y + 1) = 48$. أي العبارات الآتية صحيحة؟ اختر الإجابة ثم برّر اختيارك.
  options: ['كلتا المعادلتين تمثل الموقف.', 'معادلة سعيد فقط تمثل الموقف.', 'معادلة رنا فقط تمثل الموقف.']
  key: A
  points: 2
  verify: "[solve(Eq(x + (x + 1) + (x + 2), 48), x)[0] + k for k in (0, 1, 2)] == [solve(Eq((y - 1) + y + (y + 1), 48), y)[0] + k for k in (-1, 0, 1)]"
  rubric:
    full: 'يختار الإجابة الأولى ويوضح أن $x$ تمثل أصغر الأعداد الثلاثة وأن $y$ تمثل العدد الأوسط، وأن كلاً من المعادلتين تصف ثلاثة أعداد متتالية مجموعها 48 (أو يحل المعادلتين ويجد الأعداد 15 و16 و17 نفسها).'
    partial: 'يختار الإجابة الأولى بتبرير ناقص أو عام (مثل: «كلتاهما صحيحة» أو «كلتاهما تساوي 48») دون ربط الرمز بالعدد الذي يمثله.'
    zero: 'يختار إجابة أخرى، أو لا يقدّم تبريراً مقبولاً.'
    examples:
      correct: ['سعيد جعل $x$ أصغر عدد، فالأعداد $x$ و$x + 1$ و$x + 2$. ورنا جعلت $y$ العدد الأوسط، فالأعداد $y - 1$ و$y$ و$y + 1$. كلاهما ثلاثة أعداد متتالية.', 'بحل الأولى $x = 15$ وبحل الثانية $y = 16$ ، والأعداد في الحالتين 15 و16 و17.']
      incorrect: ['معادلة سعيد فقط لأن العدد الأول فيها هو $x$.', 'كلتاهما صحيحة لأن الطرف الأيمن 48 في المعادلتين.']
  solution: |
    في معادلة سعيد يمثل $x$ أصغر الأعداد الثلاثة، فالأعداد $x$ و$x + 1$ و$x + 2$.
    في معادلة رنا يمثل $y$ العدد الأوسط، فالأعداد $y - 1$ و$y$ و$y + 1$.
    كل معادلة تصف ثلاثة أعداد صحيحة متتالية مجموعها 48.
    بحل الأولى: $3x + 3 = 48$ فيكون $x = 15$. وبحل الثانية: $3y = 48$ فيكون $y = 16$. والأعداد في الحالتين 15 و16 و17.
  remediation: |
    وضّح أن الرمز يمكن أن يمثل أي عدد من الأعداد الثلاثة ما دامت الأعداد الأخرى مكتوبة بالنسبة إليه. اطلب من الطالب كتابة الأعداد الثلاثة بدلالة العدد الأوسط، ثم بدلالة الأكبر، ليرى أن أكثر من معادلة صحيحة تمثل الموقف نفسه.
  misconceptions: [single-valid-model-belief]
  qatar_link: 'الصف السابع، الفصل الثاني: كتابة المعادلات من مواقف؛ الصف الثامن، الوحدة 2 (2-1 تجميع الحدود المتشابهة)'

# ---------------------------------------------------------------------------
# 016 | استدلال/برّر | صعب | cr_explain | qatar
# ---------------------------------------------------------------------------
- id: M8-A3-016
  topic: A3
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: advanced
  format: cr_explain
  context: qatar
  time: 240
  stem: |
    تنظّم مدرسة حفلاً بمناسبة اليوم الوطني. تكلفة تنظيم الحفل 600 ريال، وتُباع التذكرة بـ 15 ريالاً. تريد المدرسة أن يكون الربح، وهو المبلغ المتبقي بعد دفع تكلفة التنظيم، 1800 ريال على الأقل. (بيانات افتراضية)
    (1) اكتب متباينة تمثل عدد التذاكر $n$ التي يجب بيعها.
    (2) قال أحد المعلمين: «تكفي 150 تذكرة». هل هو محق؟ برّر إجابتك باستعمال المتباينة.
  points: 2
  verify: "all((15*v - 600 >= 1800) == (v >= 160) for v in range(0, 300)) and 15*150 - 600 < 1800 and solve(Eq(15*x - 600, 1800), x) == [160]"
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يكتب متباينة صحيحة (مثل $15n - 600 \ge 1800$ أو ما يكافئها $15n \ge 2400$) ويبرّر أن المعلم غير محق: عند $n = 150$ يكون الربح 1650 وهو أقل من 1800، أو يحل المتباينة فيجد $n \ge 160$.'}
      - {code: 10, points: 1, desc: 'يكتب متباينة صحيحة مع تبرير ناقص أو غير صحيح (أو بلا تبرير)، أو يقدّم تبريراً حسابياً صحيحاً (ربح 150 تذكرة أقل من 1800) دون كتابة متباينة صحيحة.'}
      - {code: 70, points: 0, desc: 'متباينة غير صحيحة (مثل عكس الاتجاه أو إهمال تكلفة التنظيم) مع استنتاج خاطئ، أو إجابة غير ذات صلة.'}
    examples:
      correct: ['$15n - 600 \ge 1800$. عند 150 تذكرة: $15 \times 150 - 600 = 1650$ وهو أقل من 1800، فالمعلم غير محق.', '$15n \ge 2400$ فيكون $n \ge 160$ ، و150 أقل من 160 فلا تكفي.']
      incorrect: ['$15n \ge 1800$ فتكفي 150 تذكرة.', 'نعم، تكفي 150 تذكرة لأن ثمنها كبير.']
  model_answer: |
    (1) $15n - 600 \ge 1800$.
    (2) المعلم غير محق: عند $n = 150$ يكون الربح $15 \times 150 - 600 = 1650$ وهو أقل من 1800. وبحل المتباينة نجد $15n \ge 2400$ أي $n \ge 160$ ، فيلزم بيع 160 تذكرة على الأقل.
  solution: |
    الربح = ثمن التذاكر المباعة ناقص تكلفة التنظيم = $15n - 600$.
    «1800 ريال على الأقل» تعني أن الربح أكبر من 1800 أو يساويها، فالمتباينة: $15n - 600 \ge 1800$.
    بحلها: $15n \ge 2400$ أي $n \ge 160$.
    عند 150 تذكرة: $15 \times 150 - 600 = 1650$ وهو أقل من 1800، فالمعلم غير محق. ويلزم بيع 160 تذكرة على الأقل (عندها الربح 1800 بالضبط ويحقق الشرط).
  remediation: |
    اطلب من الطالب كتابة الربح بكلمات (ثمن التذاكر ناقص تكلفة التنظيم) قبل الرموز، ثم ترجمة «على الأقل» إلى $\ge$. ثم يعوّض $n = 150$ و$n = 160$ في المتباينة ليقارن النتيجتين ويفسر أن 160 مقبولة لأن الربح يساوي 1800 بالضبط.
  misconceptions: [strict-vs-inclusive-inequality, at-most-at-least-confusion]
