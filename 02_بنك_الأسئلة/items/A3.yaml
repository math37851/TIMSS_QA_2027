  stem: |
    في متحف قطر الوطني اشترت مجموعة 12 تذكرة: $a$ تذكرة للكبار و$c$ تذكرة للصغار. سعر تذكرة الكبير 30 ريالاً، وسعر تذكرة الصغير 15 ريالاً، ومجموع ما دُفع 285 ريالاً. كوّن نظام معادلتين للموقف بسحب البطاقات إلى الخانات، علماً أن المعادلة (1) تمثل عدد التذاكر، والمعادلة (2) تمثل المبلغ المدفوع. (بيانات افتراضية)
  cards:
    - {id: k1, text: '$a$', value: 'a'}
    - {id: k2, text: '$c$', value: 'c'}
    - {id: k3, text: '$12$', value: 12}
    - {id: k4, text: '$30a$', value: '30a'}
    - {id: k5, text: '$15c$', value: '15c'}
    - {id: k6, text: '$285$', value: 285}
    - {id: k7, text: '$15a$', value: '15a'}
    - {id: k8, text: '$30c$', value: '30c'}
  template: |-
    (1) [[1]] $+$ [[2]] $=$ [[3]]
    (2) [[4]] $+$ [[5]] $=$ [[6]]
  key: {1: k1, 2: k2, 3: k3, 4: k4, 5: k5, 6: k6}
  check: "((s1 == 'a' && s2 == 'c') || (s1 == 'c' && s2 == 'a')) && s3 == 12 && ((s4 == '30a' && s5 == '15c') || (s4 == '15c' && s5 == '30a')) && s6 == 285"
  hint: 'المعادلة الأولى تعدّ التذاكر، والثانية تحسب المال: سعر الكبير يُضرب في عدد الكبار.'
