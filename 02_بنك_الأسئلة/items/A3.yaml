# 006 | تطبيق/صُغ | متوسط | mc | real | المفتاح C
# ---------------------------------------------------------------------------
- id: M8-A3-006
  topic: A3
  cognitive: applying
  area: formulate
  difficulty: medium
  benchmark: high
  format: mc
  context: real
  time: 75
  stem: |
    ميزانية رحلة مدرسية لا تزيد على 1500 ريال. تكلفة استئجار الحافلة 400 ريال، وسعر تذكرة الدخول 55 ريالاً لكل طالب. إذا شارك $n$ طالباً في الرحلة، فأي متباينة تمثل الموقف؟
  options: ['$55n + 400 \ge 1500$', '$400n + 55 \le 1500$', '$55n + 400 \le 1500$', '$55(n + 400) \le 1500$']
  key: C
  verify: "[all(o(v) == (400 + 55*v <= 1500) for v in range(0, 40)) for o in [lambda v: 55*v + 400 >= 1500, lambda v: 400*v + 55 <= 1500, lambda v: 55*v + 400 <= 1500, lambda v: 55*(v + 400) <= 1500]] == [False, False, True, False]"
  rationale:
    A: 'عكس الاتجاه: «لا تزيد على» تعني $\le$ ، أما $\ge$ فتعني «على الأقل».'
    B: 'بدّل بين المبلغ الثابت 400 وسعر تذكرة الطالب 55؛ الذي يُضرب في $n$ هو 55.'
    D: 'وضع $n$ مع 400 داخل القوس فضُرب ثمن الحافلة في 55؛ والحافلة تُدفع مرة واحدة.'
  solution: |
    ثمن تذاكر $n$ طالباً: $55n$. وتُضاف إليه تكلفة الحافلة 400، فتكون التكلفة الكلية $55n + 400$.
    «لا تزيد على 1500» تعني أن التكلفة الكلية أقل من 1500 أو تساويها: $55n + 400 \le 1500$.
  remediation: |
    اطلب من الطالب كتابة التكلفة الكلية بكلمات أولاً (الحافلة + تذاكر الطلاب)، ثم ترجمة «لا تزيد على» إلى $\le$. بعدها يختبر $n = 20$ ($55 \times 20 + 400 = 1500$) و$n = 21$ ليتحقق من الحد الأقصى.
  misconceptions: [at-most-at-least-confusion, rate-and-fixed-cost-swapped, misplaced-parentheses]
  qatar_link: 'الصف السابع، الفصل الثاني: المتباينات؛ الصف الثامن، الوحدة 2: المعادلات الخطية'

# ---------------------------------------------------------------------------
# 007 | تطبيق/صُغ | صعب | multi_numeric | qatar
# ---------------------------------------------------------------------------
- id: M8-A3-007
  topic: A3
  cognitive: applying
  area: formulate
  difficulty: hard
  benchmark: high
  format: multi_numeric
  context: qatar
  time: 120
  stem: |
    تحسب إحدى شركات سيارات الأجرة في الدوحة الأجرة كما يأتي: 12 ريالاً تغطي أول $2\,\text{km}$ ، ثم 3 ريالات عن كل $1\,\text{km}$ إضافي. إذا قطع راكب مسافة $d$ كيلومتراً حيث $d > 2$ ، فتُكتب الأجرة $C$ بالريال على الصورة $C = ad + b$. أوجد قيمة كل من $a$ و$b$. (بيانات افتراضية)
  fields:
    - {label: '$a$', value: 3}
    - {label: '$b$', value: 6}
  scoring: {mode: all}
  verify: "[expand(12 + 3*(x - 2)).coeff(x, 1), expand(12 + 3*(x - 2)).coeff(x, 0)]"
  hint: 'كم كيلومتراً تُدفع أجرتها بسعر 3 ريالات للكيلومتر الواحد؟'
  solution: |
    عدد الكيلومترات التي تُحسب أجرتها بعد أول $2\,\text{km}$ هو $d - 2$.
    الأجرة: $C = 12 + 3(d - 2)$.
    بالتوزيع: $C = 12 + 3d - 6 = 3d + 6$.
    إذن $a = 3$ و$b = 6$.
  remediation: |
    اطلب من الطالب حساب الأجرة لمسافة $5\,\text{km}$ خطوة بخطوة: $12 + 3 \times 3 = 21$ ريالاً، ثم اختبار المقدار $3d + 6$ عند $d = 5$ ($3 \times 5 + 6 = 21$). وضّح أن 12 ليس الحد الثابت بعد التبسيط لأن أول $2\,\text{km}$ مشمولة فيه.
  misconceptions: [included-distance-ignored, distribute-first-term-only]
  qatar_link: 'الصف الثامن، الوحدة 2: المعادلات الخطية (2-3 المعادلات متعددة الخطوات، 2-9 الصيغة $y = mx + b$)؛ الصف السابع، الفصل الثاني'

