# 011 | تطبيق/مثّل | سهل | mc | real | المفتاح B | رسم: مستطيل
# ---------------------------------------------------------------------------
- id: M8-A3-011
  topic: A3
  cognitive: applying
  area: represent
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: real
  time: 70
  stem: |
    قطعة أرض مستطيلة عرضها $x$ متراً، وطولها يزيد 4 أمتار على عرضها، ومحيطها $36\,\text{m}$. أي معادلة تمثل الموقف؟
  figure:
    type: polygon
    points: [[0, 0], [5, 0], [5, 3], [0, 3]]
    side_labels: ['x + 4', 'x', '', '']
    unit: 34
    alt: 'مستطيل عرضه x وطوله x + 4'
  options: ['$x + (x + 4) = 36$', '$2x + 2(x + 4) = 36$', '$x(x + 4) = 36$', '$4x + 4 = 36$']
  key: B
  verify: "2*(7 + 11) == 36 and 11 - 7 == 4 and [o(7) for o in [lambda t: t + (t + 4) == 36, lambda t: 2*t + 2*(t + 4) == 36, lambda t: t*(t + 4) == 36, lambda t: 4*t + 4 == 36]] == [False, True, False, False]"
  rationale:
    A: 'حسب نصف المحيط فقط: جمع الطول والعرض مرة واحدة بدل الأضلاع الأربعة.'
    C: 'استعمل صيغة المساحة (الطول × العرض) بدل المحيط.'
    D: 'جمع $x$ أربع مرات ثم أضاف 4 مرة واحدة، مع أن ضلعين يزيد كل منهما 4.'
  solution: |
    المحيط = مجموع أطوال الأضلاع الأربعة: $x + (x + 4) + x + (x + 4)$ ، أي $2x + 2(x + 4)$.
    فتكون المعادلة $2x + 2(x + 4) = 36$ (وحلها $x = 7$: العرض $7\,\text{m}$ والطول $11\,\text{m}$).
  remediation: |
    اطلب من الطالب رسم المستطيل وكتابة طول كل ضلع عليه ثم جمع الأضلاع الأربعة. وللتحقق يجرب $x = 7$: المحيط $2 \times 7 + 2 \times 11 = 36$. وبيّن الفرق بين المحيط (مجموع الأضلاع) والمساحة (حاصل ضرب البعدين).
  misconceptions: [area-perimeter-confusion, perimeter-half-only, perimeter-extra-added-once]
  qatar_link: 'الصف السابع، الفصل الثاني: المعادلات من مواقف هندسية؛ الصف الثامن، الوحدة 2 (2-1 تجميع الحدود المتشابهة)'

# ---------------------------------------------------------------------------
# 012 | استدلال/حلّل | متوسط | select_explain | real
# ---------------------------------------------------------------------------
- id: M8-A3-012
  topic: A3
  cognitive: reasoning
  area: analyze
  difficulty: medium
  benchmark: high
  format: select_explain
  context: real
  time: 120
  stem: |
    سعر قميص أقل من ثلاثة أمثال سعر كتاب بمقدار 5 ريالات. رمز ماجد إلى سعر الكتاب بالرمز $x$ ريالاً، وكان سعر القميص 22 ريالاً، فكتب المعادلة $5 - 3x = 22$. هل كتب ماجد المعادلة بصورة صحيحة؟ اختر الإجابة ثم اشرح اختيارك.
  options: ['نعم، المعادلة صحيحة.', 'لا، المعادلة غير صحيحة.']
  key: B
  points: 1
  verify: "solve(Eq(3*x - 5, 22), x) == [9] and solve(Eq(5 - 3*x, 22), x) != [9]"
  rubric:
    full: 'يختار «لا» ويبيّن أن الطرح كُتب بترتيب معكوس: سعر القميص هو $3x$ مطروحاً منه 5، فالمعادلة الصحيحة $3x - 5 = 22$.'
    zero: 'يختار «نعم»، أو يختار «لا» بتبرير غير صحيح أو بلا تبرير.'
    examples:
      correct: ['القميص أقل من $3x$ بـ 5، إذن تُطرح 5 من $3x$ وتكون المعادلة $3x - 5 = 22$.', 'ماجد عكس الطرح؛ الصحيح $3x - 5 = 22$.']
      incorrect: ['نعم، لأن العددين 5 و$3x$ موجودان في المعادلة.', 'لا، لأن 22 أكبر من 5.']
  solution: |
    «أقل من ثلاثة أمثال سعر الكتاب بمقدار 5 ريالات» تعني أن 5 تُطرح من $3x$، فسعر القميص $3x - 5$.
    المعادلة الصحيحة: $3x - 5 = 22$ (وحلها $x = 9$).
    كتب ماجد $5 - 3x$ فعكس ترتيب الطرح، ومعادلته تعطي $x = -\frac{17}{3}$ وهو سعر غير ممكن.
  remediation: |
    اطلب من الطالب تجريب عدد: إذا كان سعر الكتاب 10 ريالات فسعر القميص $3 \times 10 - 5 = 25$ ريالاً، وليس $5 - 3 \times 10$. ثم يربط كل «أقل من» بأن الذي يُطرح منه هو الكمية الأكبر.
  misconceptions: [less-than-order-reversed]
  qatar_link: 'الصف السابع، الفصل الثاني: ترجمة العبارات اللفظية إلى معادلات؛ الصف الثامن، الوحدة 2: المعادلات الخطية'

