# 005 | معرفة/تعرّف | سهل | mc | qatar | المفتاح B
# ---------------------------------------------------------------------------
- id: M8-A3-005
  topic: A3
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: qatar
  time: 60
  stem: |
    حمولة مصعد في أحد أبراج لوسيل على الأكثر $600\,\text{kg}$. إذا كانت كتلة كل راكب $75\,\text{kg}$، فأي متباينة تمثل الموقف، حيث $n$ عدد الركاب؟
  options: ['$75n < 600$', '$75n \le 600$', '$75n \ge 600$', '$n + 75 \le 600$']
  key: B
  verify: "[all(o(v) == (75*v <= 600) for v in range(0, 14)) for o in [lambda v: 75*v < 600, lambda v: 75*v <= 600, lambda v: 75*v >= 600, lambda v: v + 75 <= 600]] == [False, True, False, False]"
  rationale:
    A: 'استعمل $<$ فاستبعد حالة 8 ركاب (كتلتهم $600\,\text{kg}$ بالضبط)، مع أن «على الأكثر» تسمح بها.'
    C: 'عكس الاتجاه: $\ge$ تعني أن الكتلة تبلغ 600 أو أكثر، لا أنها لا تتجاوزها.'
    D: 'جمع عدد الركاب إلى كتلة الراكب بدل ضربه فيها.'
  solution: |
    كتلة $n$ راكباً = $75 \times n = 75n$.
    «الحمولة على الأكثر 600» تعني أن الكتلة الكلية لا تتجاوز 600، أي أقل من 600 أو تساويه: $75n \le 600$.
  remediation: |
    اطلب من الطالب كتابة الكتلة الكلية بكلمات (كتلة الراكب × عدد الركاب) ثم ترجمة «على الأكثر» إلى $\le$. ثم يختبر $n = 8$ ($75 \times 8 = 600$) ليرى أنه مقبول.
  misconceptions: [strict-vs-inclusive-inequality, at-most-at-least-confusion, operation-confusion]
  qatar_link: 'الصف السابع، الفصل الثاني: كتابة المتباينات من مواقف حياتية؛ الصف الثامن، الوحدة 2: المعادلات الخطية'

