# 009 | تطبيق/مثّل | سهل | dragdrop_slots | real
# ---------------------------------------------------------------------------
- id: M8-A3-009
  topic: A3
  cognitive: applying
  area: represent
  difficulty: easy
  benchmark: intermediate
  format: dragdrop_slots
  context: real
  time: 70
  stem: |
    يملك ناصر 25 ريالاً، ويدّخر 15 ريالاً في كل أسبوع. إذا كان $w$ عدد الأسابيع التي يصبح بعدها مجموع ما يملكه 130 ريالاً، فأكمل المعادلة التي تمثل الموقف بسحب الأعداد إلى الخانات.
  cards: ['25', '15', '130', '105', '40', '155']
  template: '[[1]] $+$ [[2]] $w =$ [[3]]'
  key: {1: '25', 2: '15', 3: '130'}
  verify: "s1 == 25 and s2 == 15 and s3 == 130 and s1 + s2 * 7 == s3"
  hint: 'ابدأ بما يملكه ناصر الآن، ثم أضف ما يدّخره في كل أسبوع مضروباً في عدد الأسابيع.'
  solution: |
    المبلغ بعد $w$ أسبوع = المبلغ الحالي + ما يدّخره في $w$ أسبوع = $25 + 15w$.
    وهذا المبلغ يساوي 130، فالمعادلة: $25 + 15w = 130$ (وحلها $w = 7$).
  remediation: |
    اطلب من الطالب أن يحدد ما يتغير مع الزمن (15 ريالاً في كل أسبوع، فيُضرب في $w$) وما يبقى ثابتاً (25 ريالاً). ثم يقرأ المعادلة بالكلمات ويجرب $w = 1$ و$w = 2$.
  misconceptions: [rate-and-fixed-cost-swapped, total-vs-remaining-confusion]
