- id: M8-A3-003
  topic: A3
  cognitive: knowing
  area: identify
  difficulty: medium
  benchmark: intermediate
  format: dragdrop_categorize
  context: pure
  time: 100
  stem: |
    اسحب كل عبارة لفظية إلى المقدار الجبري الذي يمثلها.
  categories: ['$2n - 5$', '$5 - 2n$', '$2(n - 5)$']
  cards:
    - {id: p1, text: 'ضعف العدد الذي يقل عن $n$ بـ 5'}
    - {id: p2, text: 'أقل من ضعف العدد $n$ بـ 5'}
    - {id: p3, text: '5 ناقص ضعف العدد $n$'}
    - {id: p4, text: 'ضعف ناتج طرح 5 من العدد $n$'}
    - {id: p5, text: '5 مطروحة من ضعف العدد $n$'}
    - {id: p6, text: 'ما يتبقى من 5 بعد طرح ضعف العدد $n$'}
  key:
    p1: '$2(n - 5)$'
    p2: '$2n - 5$'
    p3: '$5 - 2n$'
    p4: '$2(n - 5)$'
    p5: '$2n - 5$'
    p6: '$5 - 2n$'
  verify: "(lambda C, P: all(all(f(v) == C[k](v) for v in range(1, 10)) for (f, k) in P) and all(len(set([c(v) for c in C])) == 3 for v in range(1, 10)))([lambda n: 2*n - 5, lambda n: 5 - 2*n, lambda n: 2*(n - 5)], [(lambda n: 2*(n - 5), 2), (lambda n: 2*n - 5, 0), (lambda n: 5 - 2*n, 1), (lambda n: 2*(n - 5), 2), (lambda n: 2*n - 5, 0), (lambda n: 5 - 2*n, 1)])"
  hint: 'حدّد في كل عبارة ما الذي يُطرح من ماذا، وهل يسبق الطرحَ ضربٌ في 2.'
  solution: |
    نترجم كل عبارة بالترتيب الذي تُقرأ به:
    • «أقل من ضعف العدد $n$ بـ 5» و«5 مطروحة من ضعف العدد $n$»: نطرح 5 من $2n$ فيكون $2n - 5$.
    • «5 ناقص ضعف العدد $n$» و«ما يتبقى من 5 بعد طرح ضعف العدد $n$»: نطرح $2n$ من 5 فيكون $5 - 2n$.
    • «ضعف ناتج طرح 5 من العدد $n$» و«ضعف العدد الذي يقل عن $n$ بـ 5»: نطرح 5 من $n$ أولاً ثم نضاعف الناتج فيكون $2(n - 5)$.
  remediation: |
    انقل كل عبارة إلى خطوات مرتبة: ماذا يُحسب أولاً؟ ثم ماذا يُطرح من ماذا؟ جرّب $n = 10$ في العبارة اللفظية وفي كل مقدار (فمثلاً «أقل من ضعف العدد بـ 5» تعطي $20 - 5 = 15$) لتتحقق من التطابق.
  misconceptions: [less-than-order-reversed, misplaced-parentheses]
