  stem: |
    قُسّم خط الأعداد من 0 إلى 1 إلى أجزاء متساوية. ما العدد الذي تمثله النقطة P؟
    اكتب إجابتك كسراً أو عدداً عشرياً. لإدخال كسر مثل $\frac{3}{5}$ اضغط 3 ثم / ثم 5.
  figure: {type: number_line, min: 0, max: 1, step: 0.125, tick_labels: ['0', '', '', '', '', '', '', '', '1'], points: [{x: 0.375, label: 'P'}], width: 520, alt: "خط أعداد من 0 إلى 1 مقسم إلى 8 أجزاء والنقطة P عند الجزء الثالث"}
