- id: M8-N3-016
  topic: N3
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: high
  format: cr_explain
  context: real
  time: 130
  stem: |
    قالت مريم: «الكسر $\frac{3}{7}$ أصغر من $\frac{1}{2}$».
    وضّح كيف تعرف أن مريم على صواب دون استعمال الحاسبة.
  rubric:
    codes:
      - {code: 10, points: 1, desc: 'تبرير صحيح، مثل: نصف $7$ هو $3.5$ و $3 < 3.5$؛ أو $\frac{3}{7} = \frac{6}{14}$ و $\frac{1}{2} = \frac{7}{14}$؛ أو $3 \times 2 = 6 < 7$.'}
      - {code: 70, points: 0, desc: 'تبرير غير صحيح أو غير كافٍ، مثل «لأن $3 < 7$» أو «لأن $7$ أكبر من $2$».'}
      - {code: 79, points: 0, desc: 'إجابة أخرى غير صحيحة.'}
    examples:
      correct: ['نصف 7 هو 3.5، و 3 أقل من 3.5 فالكسر أقل من النصف.', '$\frac{3}{7} = \frac{6}{14}$ و $\frac{1}{2} = \frac{7}{14}$ و $6 < 7$.']
      incorrect: ['لأن 3 أصغر من 7.', 'لأن مقام $\frac{3}{7}$ أكبر.']
  model_answer: 'نصف $7$ هو $3.5$، وبما أن البسط $3$ أقل من $3.5$ فإن $\frac{3}{7}$ أقل من النصف. (أو: $\frac{3}{7} = \frac{6}{14}$ و $\frac{1}{2} = \frac{7}{14}$.)'
  verify: "Rational(3, 7) < Rational(1, 2)"
  solution: |
    لكي يساوي الكسر النصف يجب أن يكون البسط نصف المقام، ونصف $7$ هو $3.5$.
    بما أن $3 < 3.5$ فإن $\frac{3}{7} < \frac{1}{2}$. أو بمقام مشترك: $\frac{6}{14} < \frac{7}{14}$.
  remediation: |
    علّم استعمال «النصف» مرجعاً للمقارنة: قارن البسط بنصف المقام.
  misconceptions: [compare-denominators-only]
