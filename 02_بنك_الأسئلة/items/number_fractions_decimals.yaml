- id: M8-N3-012
  topic: N3
  cognitive: reasoning
  area: justify
  difficulty: medium
  benchmark: high
  format: select_explain
  context: real
  time: 120
  stem: |
    قالت هند: «العدد $0.75$ أكبر من العدد $0.8$ ، لأن 75 أكبر من 8».
    هل هند على صواب؟ اختر، ثم برّر إجابتك.
  options: ["نعم، على صواب", "لا، ليست على صواب"]
  key: B
  points: 1
  rubric:
    full: 'يختار «لا» ويبرّر بالقيمة المكانية، مثل: $0.8 = 0.80$ و $80$ جزءاً من مئة أكبر من $75$ جزءاً من مئة، أو: في $0.8$ ثمانية أجزاء من عشرة وفي $0.75$ سبعة فقط، أو باستعمال خط الأعداد أو نموذج صحيح.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تبرير صحيح.'
    examples:
      correct: ['لا، لأن $0.8 = 0.80$ و $0.80 > 0.75$.']
      incorrect: ['نعم، لأن العدد الأطول أكبر.', 'لا، لأن 8 أكبر من 7.']
  verify: "num('0.8') > num('0.75')"
  solution: |
    نكتب $0.8 = 0.80$ ، فنقارن $80$ جزءاً من مئة مع $75$ جزءاً من مئة: $0.80 > 0.75$.
    إذن هند ليست على صواب.
  remediation: |
    استعمل شبكة $10 \times 10$ لتظليل $0.8$ و $0.75$ ومقارنتهما بصرياً، ودرّب الطلاب على إضافة أصفار لتوحيد عدد المنازل العشرية.
  misconceptions: [longer-decimal-is-larger]
  qatar_link: "مقارنة الأعداد العشرية — الصفان 5 و 6"

