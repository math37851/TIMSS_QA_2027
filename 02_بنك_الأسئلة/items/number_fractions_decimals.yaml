  stem: |
    خزان مياه في مزرعة بمنطقة الشمال سعته 1200 لتر، وكان ممتلئاً.
    استُعمل $\frac{3}{8}$ من سعته يوم السبت، واستُعمل $0.25$ من سعته يوم الأحد.
    كم لتراً بقي في الخزان؟
  answer: {value: 450, unit: "لتراً"}
  verify: "1200 * (1 - Rational(3, 8) - num('0.25'))"
  solution: |
    يوم السبت: $\frac{3}{8} \times 1200 = 450$ لتراً، ويوم الأحد: $0.25 \times 1200 = 300$ لتر.
    المتبقي $= 1200 - 450 - 300 = 450$ لتراً.
    (أو: المتبقي كسر $1 - \frac{3}{8} - \frac{2}{8} = \frac{3}{8}$ من السعة، و $\frac{3}{8} \times 1200 = 450$.)
  remediation: |
    نبّه إلى أن الكسرين من السعة الأصلية نفسها، ولا تُحسب النسبة الثانية من المتبقي. ارسم شريطاً مقسماً إلى 8 أجزاء.
  misconceptions: [fraction-of-remainder-confusion, mixed-forms-error]
  qatar_link: "العمليات على الأعداد النسبية — الصف السابع"

- id: M8-N4-015
  topic: N4
  cognitive: reasoning
  area: generalize
  difficulty: hard
  benchmark: advanced
  format: mc
  context: pure
  time: 110
  stem: |
    ضُرب كسران، كل منهما أكبر من 0 وأصغر من 1.
    أيّ العبارات الآتية صحيحة **دائماً** عن ناتج الضرب؟
  options: ["أكبر من كل من الكسرين", "أصغر من كل من الكسرين", "يقع بين الكسرين", "أكبر من 1"]
  key: B
  verify: "all(Rational(a, b) * Rational(c, d) < min(Rational(a, b), Rational(c, d)) for b in range(2, 12) for a in range(1, b) for d in range(2, 12) for c in range(1, d))"
  rationale:
    A: "عمّم من الأعداد الكلية أن الضرب يكبّر."
    C: 'صحيحة أحياناً لكن ليس دائماً؛ مثلاً $\frac{1}{2} \times \frac{1}{2} = \frac{1}{4}$ أصغر من كليهما.'
    D: "ناتج ضرب عددين أصغر من 1 لا يمكن أن يتجاوز 1."
  solution: |
    ضرب عدد في كسر أصغر من $1$ يأخذ «جزءاً» منه فيصغّره. لذلك $\frac{a}{b} \times \frac{c}{d}$ أصغر من $\frac{a}{b}$ لأن $\frac{c}{d} < 1$، وأصغر من $\frac{c}{d}$ لأن $\frac{a}{b} < 1$.
    مثال: $\frac{2}{3} \times \frac{3}{4} = \frac{1}{2}$ ، وهو أصغر من $\frac{2}{3}$ ومن $\frac{3}{4}$.
  remediation: |
    استعمل نموذج المساحة: ضرب كسرين = مساحة جزء من جزء، وهي دائماً أصغر من كل جزء على حدة.
  misconceptions: [multiplication-makes-bigger]
  qatar_link: "الصف السابع — الدرس 1-7"

- id: M8-N4-016
  topic: N4
  cognitive: reasoning
  area: justify
  difficulty: medium
  benchmark: high
  format: cr_explain
  context: real
  time: 140
  stem: |
    كتب طالب: $\frac{1}{2} + \frac{1}{3} = \frac{2}{5}$.
    اشرح لماذا إجابة الطالب غير صحيحة، ثم اكتب الناتج الصحيح.
  points: 2
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يوضح الخطأ (جمع البسطين والمقامين، أو: $\frac{2}{5}$ أصغر من $\frac{1}{2}$ مع أننا أضفنا إليه عدداً موجباً) ويكتب الناتج الصحيح $\frac{5}{6}$.'}
      - {code: 10, points: 1, desc: 'يكتب $\frac{5}{6}$ دون توضيح الخطأ، أو يوضح الخطأ دون الوصول إلى $\frac{5}{6}$.'}
      - {code: 70, points: 0, desc: 'يوافق على إجابة الطالب، أو توضيح غير صحيح وناتج غير صحيح.'}
    examples:
      correct: ['جمع البسطين والمقامين وهذا خطأ؛ $\frac{3}{6} + \frac{2}{6} = \frac{5}{6}$.', '$\frac{2}{5}$ أصغر من $\frac{1}{2}$ وهذا غير منطقي؛ الناتج $\frac{5}{6}$.']
      incorrect: ['الإجابة صحيحة.', 'الناتج $\frac{2}{6}$.']
  model_answer: 'الطالب جمع البسطين والمقامين، وهذا غير صحيح لأن الأجزاء غير متساوية. بتوحيد المقام: $\frac{3}{6} + \frac{2}{6} = \frac{5}{6}$.'
  verify: "Rational(1, 2) + Rational(1, 3) == Rational(5, 6) and Rational(2, 5) < Rational(1, 2)"
  solution: |
    لا نجمع المقامات لأن الأجزاء ليست من الحجم نفسه. نوحّد المقام $6$: $\frac{1}{2} = \frac{3}{6}$ و $\frac{1}{3} = \frac{2}{6}$ ، فالمجموع $\frac{5}{6}$.
    التحقق بالتقدير: الناتج يجب أن يكون أكبر من $\frac{1}{2}$، لكن $\frac{2}{5}$ أصغر منه.
  remediation: |
    استعمل التقدير للتحقق من المعقولية، وشرائط الكسور لتوضيح المقام المشترك.
  misconceptions: [add-numerators-denominators]
  qatar_link: "الصف السابع — الدرس 1-5"
