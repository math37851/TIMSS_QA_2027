  points: 1
  rubric:
    full: 'يختار «لا» ويقدّم مثالاً صحيحاً، مثل $10 \times 0.5 = 5$ و $5 < 10$، أو يوضح أن الضرب في عدد بين $0$ و $1$ يعطي ناتجاً أصغر.'
    zero: 'يختار «نعم»، أو يختار «لا» دون مثال أو تبرير صحيح.'
    examples:
      correct: ['لا، لأن $8 \times 0.25 = 2$ وهو أصغر من $8$.']
      incorrect: ['نعم، لأن الضرب يكبّر الأعداد.', 'لا، لأن $2 \times 1.5 = 3$.']
  verify: "10 * num('0.5') < 10"
  solution: |
