- id: M8-G2-013
  topic: G2
  cognitive: applying
  area: represent
  difficulty: medium
  benchmark: high
  format: grid_plot
  context: real
  time: 120
  stem: |
    يمثل المخطط قطعة أرض مثلثية على شبكة، وطول ضلع المربع الواحد $1\,\text{m}$. النقطتان $A$ و $B$ رأسان في الأرض.
    عيّن الرأس الثالث $C$ فوق القطعة $AB$ بحيث يكون المثلث $ABC$ متطابق الضلعين ($AC = BC$) ومساحته $12\,\text{m}^2$.
  grid: {xmin: -4, xmax: 6, ymin: -1, ymax: 6}
  given:
    points: [{x: -2, y: 1, label: 'A'}, {x: 4, y: 1, label: 'B'}]
    segments: [{points: [[-2, 1], [4, 1]]}]
  mode: points
  count: 1
  key: [[1, 5]]
  verify: "len(P) == 1 and P[0][1] > 1 and (P[0][0] + 2)**2 + (P[0][1] - 1)**2 == (P[0][0] - 4)**2 + (P[0][1] - 1)**2 and Abs(P[0][1] - 1) * 3 == 12"
  solution: |
    طول $AB$ يساوي $6$ وحدات.
    لأن $AC = BC$ يقع $C$ على المستقيم الرأسي المار بمنتصف $AB$، أي عند $x = 1$.
    المساحة $= \frac{1}{2} \times 6 \times h = 12$ ومنها $h = 4$، فتكون $C = (1, 5)$.
  remediation: |
    اطلب من الطلاب إيجاد منتصف $AB$ أولاً لتحديد موقع $C$ أفقياً، ثم استعمال قانون المساحة لإيجاد الارتفاع.
    من الأخطاء الشائعة نسيان $\frac{1}{2}$ في قانون مساحة المثلث، أو اختيار نقطة لا تقع فوق منتصف القاعدة.
  misconceptions: [area-formula-missing-half, apex-not-on-perpendicular-bisector]
  qatar_link: "الصفان السادس والسابع — مساحة المثلث والمستوى الإحداثي"

- id: M8-G2-014
  topic: G2
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: high
  format: numeric
  context: qatar
  time: 100
  stem: |
    يبيّن المخطط الإحداثي المبسط موقعي محطتين في مترو الدوحة: $A(-2, 3)$ و $B(10, -2)$، وكل وحدة على الشبكة تمثل $1\,\text{km}$ (بيانات افتراضية).
    ما المسافة المستقيمة بين المحطتين بالكيلومتر؟
  figure:
    type: coord
    xmin: -3
    xmax: 11
    ymin: -3
    ymax: 5
    unit: 26
    points: [{x: -2, y: 3, label: 'A', pos: 'nw'}, {x: 10, y: -2, label: 'B', pos: 'se'}]
    segments: [{points: [[-2, 3], [10, -2]], color: '#8A1538'}]
    alt: "مستوى إحداثي فيه النقطتان A عند (−2, 3) و B عند (10, −2) يصل بينهما قطعة مستقيمة"
  answer: {value: 13, unit: 'km'}
  verify: "sqrt((10 - (-2))**2 + (3 - (-2))**2)"
  solution: |
    الفرق الأفقي $= 10 - (-2) = 12$ والفرق الرأسي $= 3 - (-2) = 5$.
    هذان الفرقان ضلعا القائمة في مثلث قائم وتره هو المسافة بين المحطتين:
    $d^2 = 12^2 + 5^2 = 144 + 25 = 169$ إذن $d = 13\,\text{km}$.
  remediation: |
    اطلب من الطلاب رسم مثلث قائم أضلاعه موازية للمحورين وإيجاد طولي ضلعي القائمة بطرح الإحداثيات مع الانتباه للإشارة السالبة.
    ثم يطبّقون نظرية فيثاغورس لإيجاد الوتر.
  misconceptions: [ignore-negative-sign, pythagoras-sum-of-sides]
  qatar_link: "الصف الثامن 6-1 — فيثاغورس والمسافة في المستوى (بديل الدرس 6-4 المحذوف)"

- id: M8-G2-015
  topic: G2
  cognitive: applying
  area: formulate
  difficulty: hard
  benchmark: advanced
  format: numeric
  context: qatar
  time: 180
  stem: |
    حديقة مستطيلة الشكل في أسباير بُعداها $240\,\text{m}$ و $70\,\text{m}$ (بيانات افتراضية). يريد سالم الانتقال من الزاوية $A$ إلى الزاوية المقابلة $C$.
    يستطيع المشي على حافتي الحديقة مروراً بالنقطة $B$، أو السير في ممر مستقيم يصل $A$ بالنقطة $C$ مباشرة.
    كم متراً يوفّر سالم إذا سار في الممر المستقيم بدل السير على الحافتين؟
  figure:
    type: polygon
    points: [[0, 0], [6.9, 0], [6.9, 2], [0, 2]]
    vertex_labels: ['A', 'B', 'C', 'D']
    side_labels: ['240 m', '70 m', '', '']
    right_angles: [0, 1, 2, 3]
    extra:
      - {seg: [[0, 0], [6.9, 2]], dash: '6 4', color: '#8A1538'}
    unit: 44
    pad: 56
    alt: "حديقة مستطيلة بُعداها 240 m و70 m ويظهر الممر القطري من A إلى C"
  answer: {value: 60, unit: 'm'}
  verify: "(240 + 70) - sqrt(240**2 + 70**2)"
  solution: |
    المسار على الحافتين: $240 + 70 = 310\,\text{m}$.
    الممر المستقيم $AC$ هو وتر المثلث القائم $ABC$:
    $AC^2 = 240^2 + 70^2 = 57600 + 4900 = 62500$ إذن $AC = 250\,\text{m}$.
    التوفير $= 310 - 250 = 60\,\text{m}$.
  remediation: |
    اطلب من الطلاب رسم المثلث القائم وتحديد الوتر (الممر المستقيم) وضلعي القائمة (الحافتين).
    ذكّرهم بأن المطلوب الفرق بين المسارين لا طول الممر المستقيم وحده.
  misconceptions: [pythagoras-sum-of-sides, stop-at-intermediate-result]
  qatar_link: "الصف الثامن 6-1 — تطبيقات نظرية فيثاغورس (بند جسري)"

- id: M8-G2-016
  topic: G2
  cognitive: reasoning
  area: analyze
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: real
  time: 75
  stem: |
    أراد مزارع تسييج حديقة مستطيلة بُعداها $12\,\text{m}$ و $8\,\text{m}$ بسلك يحيط بها من جميع الجهات. لحساب طول السلك اللازم كتب: $12 \times 8 = 96\,\text{m}$.
    ما الخطأ في حساب المزارع؟
  options:
    - 'لا خطأ، فطول السلك يساوي حاصل ضرب بُعدي الحديقة.'
    - 'الصواب جمع البعدين فقط: $12 + 8 = 20\,\text{m}$.'
    - 'الناتج صحيح لكن وحدته يجب أن تكون $\text{m}^2$.'
    - 'حسب مساحة الحديقة بدل محيطها؛ الصواب $2 \times (12 + 8) = 40\,\text{m}$.'
  key: D
  verify: "12 * 8 == 96 and 2 * (12 + 8) == 40 and 12 + 8 != 40"
  rationale:
    A: "يخلط بين المحيط والمساحة؛ حاصل الضرب هو مساحة المستطيل لا طول السلك المحيط به."
    B: "نسي أن السلك يمر بالأضلاع الأربعة، فاكتفى بنصف المحيط."
    C: 'تغيير الوحدة إلى $\text{m}^2$ لا يجعل المساحة طولاً؛ المطلوب طول السلك ووحدته $\text{m}$.'
  solution: |
    السلك يحيط بالحديقة من جميع الجهات، فالمطلوب محيط المستطيل لا مساحته.
    المحيط $= 2 \times (12 + 8) = 40\,\text{m}$، أما $12 \times 8 = 96\,\text{m}^2$ فهي مساحة الحديقة.
  remediation: |
    اربط المحيط بطول الحدود أو السياج (وحدته $\text{m}$) والمساحة بتغطية السطح (وحدتها $\text{m}^2$).
    اطلب من الطلاب رسم الحديقة وتتبّع أضلاعها الأربعة بالإصبع عند حساب المحيط.
  misconceptions: [area-perimeter-confusion, perimeter-half-only]
  qatar_link: "الصفان السادس والسابع — المحيط والمساحة"

- id: M8-G2-017
  topic: G2
  cognitive: reasoning
  area: analyze
  difficulty: medium
  benchmark: high
  format: select_explain
  context: real
  time: 150
  stem: |
    تصنع شهد دعامة معدنية لرفّ حائط على شكل مثلث قائم الزاوية، طولا ضلعيه القائمين $20\,\text{cm}$ و $48\,\text{cm}$.
    لحساب طول الضلع المائل (الوتر) كتبت: $c = 20 + 48 = 68\,\text{cm}$.
    هل حل شهد صحيح؟ اختر الإجابة ثم اكتب تبريرك.
  figure:
    type: polygon
    points: [[0, 0], [4.8, 0], [0, 2]]
    side_labels: ['48 cm', '?', '20 cm']
    right_angles: [0]
    unit: 44
    pad: 66
    alt: "مثلث قائم ضلعاه القائمان 48 cm و20 cm ووتره مجهول"
  options: ['نعم، حلها صحيح', 'لا، حلها غير صحيح']
  key: B
  points: 1
  verify: "20**2 + 48**2 == 52**2 and 20 + 48 != 52"
  rubric:
    full: 'يختار «لا» ويبيّن أن الوتر يُحسب بجمع المربعين لا الطولين: $c^2 = 20^2 + 48^2 = 2704$ فـ $c = 52\,\text{cm}$، أو يوضح أن العلاقة هي $a^2 + b^2 = c^2$ وليست $a + b = c$.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تبرير رياضي صحيح (مثل «لأنها أخطأت» دون بيان السبب).'
    examples:
      correct:
        - 'لا، الصواب $20^2 + 48^2 = 2704$ فالوتر $52\,\text{cm}$ وليس $68\,\text{cm}$.'
        - 'لا، في المثلث القائم $a^2 + b^2 = c^2$ ولا نجمع الطولين مباشرة.'
      incorrect:
        - 'نعم، لأن الوتر هو الضلع الأطول فيساوي مجموع الضلعين.'
        - 'لا، لأنها أخطأت في الجمع.'
  solution: |
    في المثلث القائم يُحسب الوتر بنظرية فيثاغورس لا بجمع الضلعين.
    $c^2 = 20^2 + 48^2 = 400 + 2304 = 2704$ إذن $c = 52\,\text{cm}$.
    حل شهد $68\,\text{cm}$ غير صحيح.
  remediation: |
    اطلب من الطلاب مقارنة $68$ بالوتر الفعلي $52$ وملاحظة أن الوتر أقصر من مجموع الضلعين.
    ثم يكتبون العلاقة $a^2 + b^2 = c^2$ ويطبقونها.
  misconceptions: [pythagoras-sum-of-sides]
  qatar_link: "الصف الثامن 6-1 — نظرية فيثاغورس (بند جسري)"

- id: M8-G2-018
  topic: G2
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: advanced
  format: multi_numeric
  context: real
  time: 150
  stem: |
    يمثل المثلث $ABC$ واجهة سقف مظلة مواقف، وفيه $AB = AC$. مُدّ الضلع $BC$ من جهة $C$ إلى النقطة $D$، وقياس الزاوية $\angle ACD$ يساوي $110^\circ$.
    أوجد قياس كل من الزاويتين $B$ و $A$.
  figure:
    type: polygon
    points: [[2.5, 6.87], [0, 0], [5, 0]]
    vertex_labels: ['A', 'B', '']
    ticks: {0: 1, 2: 1}
    extra:
      - {seg: [[5, 0], [7.4, 0]]}
      - {pt: [5, 0], label: 'C', dot: false, pos: 's'}
      - {pt: [7.4, 0], label: 'D', dot: false, pos: 's'}
      - {angle: [[2.5, 6.87], [5, 0], [7.4, 0]], label: '110°'}
    unit: 30
    alt: "مثلث ABC متطابق الضلعين AB = AC ممدود ضلعه BC إلى النقطة D وزاوية خارجية عند C قياسها 110 درجات"
  fields:
    - {label: '$\angle B$', value: 70, unit: '°'}
    - {label: '$\angle A$', value: 40, unit: '°'}
  scoring: {mode: partial, partial_min: 1}
  verify: "[180 - 110, 180 - 2 * (180 - 110)]"
  solution: |
    $\angle ACB = 180^\circ - 110^\circ = 70^\circ$ لأن الزاويتين $\angle ACB$ و $\angle ACD$ على مستقيم واحد.
    بما أن $AB = AC$ فإن زاويتي القاعدة متساويتان: $\angle B = \angle ACB = 70^\circ$.
    $\angle A = 180^\circ - 70^\circ - 70^\circ = 40^\circ$، أو $\angle A = 110^\circ - 70^\circ = 40^\circ$ (الزاوية الخارجية تساوي مجموع الزاويتين البعيدتين).
  remediation: |
    اطلب من الطلاب تسجيل كل زاوية يعرفونها على الشكل خطوة بخطوة.
    الخطأ الشائع اعتبار الزاوية الخارجية $110^\circ$ هي زاوية القاعدة نفسها، أو التوقف بعد إيجاد زاوية واحدة.
  misconceptions: [exterior-equals-adjacent-interior, incomplete-angle-chain]
  qatar_link: "الصف الثامن 5-9 — زوايا المثلث الداخلية والخارجية"

- id: M8-G2-019
  topic: G2
  cognitive: reasoning
  area: generalize
  difficulty: hard
  benchmark: high
  format: mc
  context: real
  time: 90
  stem: |
    تريد إدارة مقهى تكبير الموائد الدائرية بمضاعفة نصف قطر كل مائدة.
    ماذا يحدث لمحيط المائدة ولمساحتها عند مضاعفة نصف قطرها (لأي مائدة دائرية)؟
  options:
    - 'يتضاعف المحيط وتتضاعف المساحة.'
    - 'يتضاعف المحيط وتصبح المساحة 4 أمثالها.'
    - 'يصبح المحيط 4 أمثاله وتصبح المساحة 4 أمثالها.'
    - 'يصبح المحيط 4 أمثاله وتتضاعف المساحة.'
  key: B
  verify: "simplify(pi * (2*x)**2 - 4 * (pi * x**2)) == 0 and simplify(2 * pi * (2*x) - 2 * (2 * pi * x)) == 0"
  rationale:
    A: "افترض أن المساحة تتغير بالنسبة نفسها التي يتغير بها نصف القطر، مع أن المساحة تتناسب مع مربع نصف القطر."
    C: "افترض أن المحيط يتغير مثل المساحة، مع أن المحيط يتناسب مع نصف القطر فيتضاعف فقط."
    D: "عكس أثر التغيير: المحيط هو الذي يتضاعف والمساحة هي التي تصبح 4 أمثالها."
  solution: |
    إذا كان نصف القطر $r$ فالمحيط $2\pi r$ والمساحة $\pi r^2$.
    عند مضاعفة نصف القطر يصبح $2r$، فيكون المحيط $2\pi(2r) = 2 \times (2\pi r)$ أي يتضاعف.
    وتكون المساحة $\pi(2r)^2 = 4\pi r^2$ أي تصبح 4 أمثالها.
  remediation: |
    اطلب من الطلاب تجربة أنصاف أقطار مثل $1$ و $2$ و $4$ وتنظيم النتائج في جدول للمحيط والمساحة.
    ثم يعمّمون النمط: المحيط يتناسب طردياً مع $r$ والمساحة مع $r^2$.
  misconceptions: [linear-scaling-of-quadratic, perimeter-scales-as-area]
  qatar_link: "الصف السابع — الدائرة: أثر تغيير نصف القطر في المحيط والمساحة"

- id: M8-G2-020
  topic: G2
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: high
  format: select_explain
  context: pure
  time: 150
  stem: |
    قال سالم: «يمكن رسم مثلث له زاويتان منفرجتان».
    هل سالم على صواب؟ اختر الإجابة ثم اكتب تبريرك.
  options: ['نعم، على صواب', 'لا، ليس على صواب']
  key: B
  points: 1
  verify: "all([a + b > 180 for a in range(91, 180) for b in range(91, 180)])"
  rubric:
    full: 'يختار «لا» ويبرّر بأن الزاوية المنفرجة أكبر من $90^\circ$، فمجموع زاويتين منفرجتين أكبر من $180^\circ$ بينما مجموع زوايا المثلث $180^\circ$ فقط.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تبرير يستند إلى مجموع الزوايا، أو يكتفي بمثال عددي واحد دون تعميم.'
    examples:
      correct:
        - 'كل زاوية منفرجة أكبر من $90^\circ$ فمجموع زاويتين منها أكبر من $180^\circ$ ولا يبقى قياس للزاوية الثالثة.'
        - 'لا، لأن مجموع زوايا المثلث $180^\circ$ وزاويتان منفرجتان مجموعهما أكثر من $180^\circ$.'
      incorrect:
        - 'لا، لأن المثلث لا يكون هكذا.'
        - 'لا، لأن $100^\circ + 100^\circ = 200^\circ$ (مثال واحد فقط لا يثبت أن ذلك مستحيل دائماً).'
  solution: |
    الزاوية المنفرجة قياسها أكبر من $90^\circ$.
    إذن مجموع زاويتين منفرجتين أكبر من $90^\circ + 90^\circ = 180^\circ$، أما مجموع الزوايا الثلاث في المثلث فهو $180^\circ$ بالضبط.
    لذلك لا يمكن أن يكون للمثلث زاويتان منفرجتان، وسالم ليس على صواب.
  remediation: |
    اطلب من الطلاب محاولة رسم مثلث بزاويتين منفرجتين وملاحظة أن الضلعين لا يلتقيان.
    ثم يبرّرون الاستحالة باستعمال مجموع زوايا المثلث، مع التمييز بين المثال والبرهان العام.
  misconceptions: [triangle-sum-ignored-in-justification, examples-prove-general]
  qatar_link: "الصف الثامن 5-9 — زوايا المثلث الداخلية"

- id: M8-G2-021
  topic: G2
