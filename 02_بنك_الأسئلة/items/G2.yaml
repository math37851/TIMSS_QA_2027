- id: M8-G2-006
  topic: G2
  cognitive: knowing
  area: recall
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: pure
  time: 60
  stem: |
    في الشكل، مُدّ الضلع $BC$ من جهة $C$ إلى النقطة $D$ فنتجت الزاوية الخارجية $\angle ACD$ للمثلث $ABC$.
    قياس هذه الزاوية الخارجية يساوي دائماً:
  figure:
    type: polygon
    points: [[3.2, 3], [0, 0], [5, 0]]
    vertex_labels: ['A', 'B', '']
    extra:
      - {seg: [[5, 0], [7.4, 0]]}
      - {pt: [5, 0], label: 'C', dot: false, pos: 's'}
      - {pt: [7.4, 0], label: 'D', dot: false, pos: 's'}
      - {angle: [[3.2, 3], [5, 0], [7.4, 0]]}
    unit: 40
    alt: "مثلث ABC مُدّ ضلعه BC من جهة C إلى النقطة D وتظهر الزاوية الخارجية ACD عند C"
  options:
    - 'مجموع قياسي الزاويتين $A$ و $B$'
    - 'قياس الزاوية $C$'
    - 'مجموع قياسات الزوايا $A$ و $B$ و $C$'
    - 'الفرق بين قياسي الزاويتين $A$ و $B$'
  key: A
  verify: "180 - 59 == 78 + 43 and 180 - 59 != 59 and 180 - 59 != 78 + 43 + 59 and 180 - 59 != 78 - 43"
  rationale:
    B: 'الزاوية $C$ والزاوية الخارجية متجاورتان على مستقيم ومجموعهما $180^\circ$، فلا تتساويان إلا في حالة خاصة.'
    C: 'مجموع الزوايا الداخلية الثلاث هو $180^\circ$، أما الزاوية الخارجية فهي أصغر من $180^\circ$.'
    D: "الزاوية الخارجية تساوي مجموع الزاويتين البعيدتين عنها لا الفرق بينهما."
  solution: |
    الزاويتان $\angle ACD$ و $\angle C$ على مستقيم واحد، فمجموعهما $180^\circ$.
    ومجموع زوايا المثلث $\angle A + \angle B + \angle C = 180^\circ$.
    إذن $\angle ACD = \angle A + \angle B$.
  remediation: |
    اطلب من الطلاب قياس الزاوية الخارجية والزاويتين الداخليتين البعيدتين في عدة مثلثات ومقارنة النتائج.
    ثم برهن العلاقة بزاويتين على مستقيم ومجموع زوايا المثلث.
  misconceptions: [exterior-equals-adjacent-interior, exterior-angle-sum-confusion]
  qatar_link: "الصف الثامن 5-9 — زوايا المثلث الخارجية"

- id: M8-G2-007
  topic: G2
  cognitive: knowing
  area: compute
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: qatar
  time: 60
  stem: |
    في أحد دوّارات لوسيل جزيرة دائرية مغطاة بالعشب الصناعي، قطرها $12\,\text{m}$ (بيانات افتراضية).
    ما مساحة العشب بدلالة $\pi$؟
  options: ['$6\pi\,\text{m}^2$', '$12\pi\,\text{m}^2$', '$144\pi\,\text{m}^2$', '$36\pi\,\text{m}^2$']
  option_values: ["6*pi", "12*pi", "144*pi", "36*pi"]
  key: D
  verify: "pi * Rational(12, 2)**2"
  rationale:
    A: 'ضرب $\pi$ في نصف القطر فقط دون تربيعه.'
    B: 'هذا محيط الدائرة ($\pi d$) وليس مساحتها.'
    C: 'استعمل القطر $12$ بدل نصف القطر $6$ في القانون $\pi r^2$.'
  solution: |
    نصف القطر $r = 12 \div 2 = 6\,\text{m}$.
    المساحة $= \pi r^2 = \pi \times 6^2 = 36\pi\,\text{m}^2$.
  remediation: |
    وضّح الفرق بين القطر ونصف القطر، وبين قانون المحيط $2\pi r$ وقانون المساحة $\pi r^2$ (وحدة المساحة مربعة).
  misconceptions: [forget-to-square, circumference-instead-of-area, square-diameter]
  qatar_link: "الصف السابع — الدائرة: المحيط والمساحة"

- id: M8-G2-008
  topic: G2
  cognitive: applying
  area: formulate
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: qatar
  time: 75
  stem: |
    شراع مثلثي الشكل لقارب تراثي في الدوحة (بيانات افتراضية)، وقياسات زواياه $x^\circ$ و $(x + 20)^\circ$ و $(2x)^\circ$.
    أي معادلة تُستعمل لإيجاد قيمة $x$؟
  figure:
    type: polygon
    points: [[0, 0], [6, 0], [4.04, 3.39]]
    angle_labels: {0: 'x°', 1: '(x+20)°', 2: '2x°'}
    unit: 40
    alt: "مثلث زواياه x و x+20 و 2x درجة"
  options: ['$x + (x + 20) + 2x = 180$', '$x + (x + 20) + 2x = 360$', '$x + (x + 20) + 2x = 90$', '$(x + 20) + 2x = 180$']
  option_values: [40, 85, "35/2", "160/3"]
  key: A
  verify: "solve(Eq(x + (x + 20) + 2*x, 180), x)[0]"
  rationale:
    B: 'استعمل $360^\circ$ وهو مجموع زوايا الرباعي بدل $180^\circ$.'
    C: 'استعمل $90^\circ$ بدل $180^\circ$ فجعل المثلث قائماً.'
    D: 'أهمل الزاوية $x^\circ$ فلم تدخل في المجموع.'
  solution: |
    مجموع زوايا المثلث $180^\circ$ فتكون المعادلة $x + (x + 20) + 2x = 180$.
    ومنها $4x + 20 = 180$ أي $x = 40$، فتكون الزوايا $40^\circ$ و $60^\circ$ و $80^\circ$.
  remediation: |
    اطلب من الطلاب كتابة مجموع الزوايا الثلاث أولاً ثم مساواته بـ $180$.
    تحقق من الحل بجمع الزوايا الناتجة والتأكد أن المجموع $180^\circ$.
  misconceptions: [triangle-sum-wrong-total, angle-omitted-from-sum]
  qatar_link: "الصف الثامن 5-9 — مجموع زوايا المثلث، والوحدة 2 — المعادلات الخطية"

- id: M8-G2-009
  topic: G2
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: high
  format: numeric
  context: real
  time: 100
  stem: |
    شاشة حاسوب مستطيلة الشكل، طول قطرها $65\,\text{cm}$ وارتفاعها $33\,\text{cm}$.
    ما عرض الشاشة بالسنتيمتر؟
  figure:
    type: polygon
    points: [[0, 0], [5.6, 0], [5.6, 3.3], [0, 3.3]]
    side_labels: ['?', '33 cm', '', '']
    right_angles: [0, 1, 2, 3]
    extra:
      - {seg: [[0, 0], [5.6, 3.3]], dash: '6 4', color: '#8A1538'}
      - {label_seg: [[0, 0], [5.6, 3.3]], text: '65 cm', offset: 18}
    unit: 44
    pad: 66
    alt: "مستطيل يمثل الشاشة: ارتفاعه 33 cm وقطره 65 cm وعرضه مجهول"
  answer: {value: 56, unit: 'cm'}
  verify: "sqrt(65**2 - 33**2)"
  solution: |
    القطر هو وتر المثلث القائم الذي ضلعاه القائمان عرض الشاشة $w$ وارتفاعها.
    $w^2 + 33^2 = 65^2$ ومنها $w^2 = 4225 - 1089 = 3136$.
    إذن $w = \sqrt{3136} = 56\,\text{cm}$.
  remediation: |
    حدّد الوتر أولاً (القطر)، ثم اكتب $a^2 + b^2 = c^2$ وضع الوتر في الطرف الأيمن، واحسب الضلع المجهول بطرح مربع الضلع المعلوم من مربع الوتر.
  misconceptions: [pythagoras-add-instead-of-subtract, subtract-lengths]
  qatar_link: "الصف الثامن 6-1 — نظرية فيثاغورس (بند جسري)"

- id: M8-G2-010
  topic: G2
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: intermediate
  format: dragdrop_order
  context: real
  time: 150
  stem: |
    في حديقة مدرسة أربعة أحواض زراعية بأشكال مختلفة، أبعادها مبيّنة في البطاقات.
    احسب مساحة كل حوض، ثم رتّب الأحواض من الأصغر مساحة إلى الأكبر. استعمل $\pi \approx 3.14$.
  cards:
    - {id: tri, text: 'حوض مثلثي: القاعدة $10\,\text{m}$ والارتفاع $6\,\text{m}$', value: 30}
    - {id: par, text: 'حوض على شكل متوازي أضلاع: القاعدة $8\,\text{m}$ والارتفاع $5\,\text{m}$', value: 40}
    - {id: trap, text: 'حوض على شكل شبه منحرف: القاعدتان $7\,\text{m}$ و $5\,\text{m}$ والارتفاع $4\,\text{m}$', value: 24}
    - {id: circ, text: 'حوض دائري: نصف القطر $3\,\text{m}$', value: 28.26}
  key: [trap, circ, tri, par]
  direction: asc
  order_labels: ['الأصغر مساحة', 'الأكبر مساحة']
  verify: "Rational(1, 2) * 10 * 6 == 30 and 8 * 5 == 40 and Rational(1, 2) * (7 + 5) * 4 == 24 and num('3.14') * 3**2 == Rational(2826, 100)"
  solution: |
    المثلث: $\frac{1}{2} \times 10 \times 6 = 30\,\text{m}^2$.
    متوازي الأضلاع: $8 \times 5 = 40\,\text{m}^2$.
    شبه المنحرف: $\frac{1}{2} \times (7 + 5) \times 4 = 24\,\text{m}^2$.
    الدائرة: $3.14 \times 3^2 = 28.26\,\text{m}^2$.
    الترتيب من الأصغر إلى الأكبر: شبه المنحرف ($24$)، ثم الدائرة ($28.26$)، ثم المثلث ($30$)، ثم متوازي الأضلاع ($40$).
  remediation: |
    اطلب من الطلاب كتابة قانون مساحة كل شكل قبل التعويض.
    ركّز على الأخطاء الشائعة: نسيان $\frac{1}{2}$ في المثلث وشبه المنحرف، واستعمال محيط الدائرة بدل مساحتها.
  misconceptions: [area-formula-missing-half, circumference-instead-of-area]
  qatar_link: "الصفان السادس والسابع — مساحة المثلث ومتوازي الأضلاع وشبه المنحرف والدائرة"

