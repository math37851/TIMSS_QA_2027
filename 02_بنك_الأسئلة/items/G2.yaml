  stem: |
    يستند سُلَّم طوله $5\,\text{m}$ إلى جدار رأسي في أحد مباني لوسيل، وتبعد قاعدة السلم عن الجدار $3\,\text{m}$ على أرض مستوية.
    ما ارتفاع النقطة التي يلامس فيها السلم الجدار عن الأرض؟
  figure:
    type: polygon
    points: [[0, 0], [3, 0], [0, 4]]
    side_labels: ['3 m', '5 m', '?']
    right_angles: [0]
    unit: 48
    alt: "مثلث قائم: الأرض 3 m، السلم 5 m، والارتفاع مجهول"
  options: ['$2\,\text{m}$', '$4\,\text{m}$', '$8\,\text{m}$', '$\sqrt{34}\,\text{m}$']
  option_values: [2, 4, 8, "sqrt(34)"]
  key: B
  verify: "sqrt(5**2 - 3**2)"
  rationale:
    A: "طرح الطولين مباشرة ($5 - 3$) بدلاً من استعمال نظرية فيثاغورس."
    C: "جمع الطولين ($5 + 3$)."
    D: "جمع المربعين ($3^2 + 5^2$) مع أن السلم هو الوتر فيجب الطرح."
  solution: |
    السلم هو الوتر في المثلث القائم. بنظرية فيثاغورس: $h^2 + 3^2 = 5^2$.
    $h^2 = 25 - 9 = 16$ إذن $h = 4\,\text{m}$.
  remediation: |
    حدّد مع الطلاب الوتر أولاً (الضلع المقابل للزاوية القائمة وهو الأطول).
    ذكّرهم بالثلاثية $3, 4, 5$ وأن الوتر مربعه يساوي مجموع مربعي الضلعين الآخرين.
  misconceptions: [pythagoras-add-instead-of-subtract, subtract-lengths]
  qatar_link: "الصف الثامن — نظرية فيثاغورس"

- id: M8-G2-002
  topic: G2
  cognitive: knowing
  area: recall
  difficulty: foundation
  benchmark: low
  format: mc
  context: pure
  time: 30
  stem: |
    ما مجموع قياسات الزوايا الداخلية لأي شكل رباعي؟
  options: ['$180^\circ$', '$270^\circ$', '$360^\circ$', '$540^\circ$']
  option_values: [180, 270, 360, 540]
  key: C
  verify: "(4 - 2) * 180"
  rationale:
    A: "هذا مجموع زوايا المثلث وليس الرباعي."
    B: "هذا مجموع ثلاث زوايا قائمة فقط، والرباعي له أربع زوايا."
    D: "هذا مجموع زوايا الخماسي وليس الرباعي."
  solution: |
    نقسم الرباعي بقطر إلى مثلثين، ومجموع زوايا كل مثلث $180^\circ$.
    إذن مجموع زوايا الرباعي $= 2 \times 180^\circ = 360^\circ$.
  remediation: |
    اطلب من الطلاب رسم رباعي وتقسيمه بقطر إلى مثلثين ثم جمع زوايا المثلثين.
    تحقق من النتيجة بالمستطيل: $4 \times 90^\circ = 360^\circ$.
  misconceptions: [triangle-sum-applied-to-quadrilateral]
  qatar_link: "الصف السابع — زوايا الأشكال الرباعية · الصف الثامن 5-9 (مجموع زوايا المثلث)"

