    side_labels: ['24 m', '25 m', '10 m']
    angle_labels: {0: '?'}
    unit: 44
    alt: "مثلث أضلاعه 24 m و25 m و10 m والزاوية عند A مجهولة"
  points: 2
  verify: "10**2 + 24**2 != 25**2 and 10**2 + 24**2 == 26**2"
  rubric:
    codes:
      - code: 20
        points: 2
        desc: 'يجيب بأن الزاوية ليست قائمة ويبرّر بحساب صحيح: $10^2 + 24^2 = 676$ يختلف عن $25^2 = 625$ (أو يحسب الوتر المتوقع $26\,\text{m}$ ويقارنه بـ $25\,\text{m}$) مستنداً إلى عكس نظرية فيثاغورس.'
      - code: 10
        points: 1
        desc: 'يجيب بأن الزاوية ليست قائمة مع حساب ناقص أو غير مكتمل (مثل حساب $10^2 + 24^2$ دون مقارنته بـ $25^2$ صراحةً)، أو يحسب المربعات بدقة دون استنتاج واضح.'
      - code: 70
        points: 0
        desc: 'يجيب بأن الزاوية قائمة، أو يبرّر بجمع الأطوال أو بالنظر إلى الشكل، أو لا يقدّم تبريراً.'
    examples:
      correct:
        - '$10^2 + 24^2 = 100 + 576 = 676$ و $25^2 = 625$ وهما غير متساويين، إذن الزاوية ليست قائمة.'
        - 'لو كانت الزاوية قائمة لكان $BC = \sqrt{676} = 26\,\text{m}$ لكنه $25\,\text{m}$، فالزاوية ليست قائمة.'
      incorrect:
        - 'نعم، لأن $10 + 24 = 34$ وهو قريب من $25$.'
        - 'نعم، لأن الشكل يبدو قائماً.'
  model_answer: '$10^2 + 24^2 = 100 + 576 = 676$ بينما $25^2 = 625$. بما أن $676 \neq 625$ فالمثلث ليس قائم الزاوية بحسب عكس نظرية فيثاغورس، إذن زاوية الركن $A$ ليست قائمة (لتكون قائمة يجب أن تكون المسافة $\sqrt{676} = 26\,\text{m}$).'
  solution: |
    لو كانت الزاوية $A$ قائمة لتحققت العلاقة $AB^2 + AC^2 = BC^2$ (عكس نظرية فيثاغورس).
    $24^2 + 10^2 = 576 + 100 = 676$ بينما $25^2 = 625$.
    بما أن $676 \neq 625$ فالزاوية $A$ ليست قائمة.
  remediation: |
    اطلب من الطلاب كتابة شرط عكس النظرية: إذا حقق أطول ضلع $a^2 + b^2 = c^2$ فالمثلث قائم.
    ثم يحسبون مربعات الأطوال ويقارنون بدقة، دون الاعتماد على شكل الرسم أو الأطوال المتقاربة.
  misconceptions: [pythagoras-sum-of-sides, near-equality-accepted-as-equal]
  qatar_link: "الصف الثامن 6-2 — عكس نظرية فيثاغورس (بند جسري)"
