  stem: |
    المستقيم $L$ معادلته $y = 2x + 1$.
    أي الأشكال الآتية يبيّن مستقيماً يوازي $L$ ومقطعه $y$ يساوي $-2$؟
  options:
    - text: 'مستقيم ميله $2$ ومقطعه $y$ يساوي $2$'
      figure: {type: coord, xmin: -3, xmax: 3, ymin: -4, ymax: 4, unit: 20, lines: [{m: 2, b: 2}], alt: 'مستقيم ميله 2 ومقطعه y يساوي 2'}
