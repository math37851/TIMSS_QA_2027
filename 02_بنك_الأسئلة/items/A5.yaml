- id: M8-A5-004
  topic: A5
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: dragdrop_categorize
  context: qatar
  time: 80
  stem: |
    تبيع محلات في سوق واقف منتجات مختلفة. تمثّل كل بطاقة معادلة تكلفة شراء $x$ كيلوغراماً من منتج، حيث $y$ التكلفة بالريال (بيانات افتراضية).
    اسحب كل معادلة إلى الفئة المناسبة.
  categories: ['علاقة تناسبية', 'علاقة غير تناسبية']
  cards: ['$y = 12x$', '$y = 12x + 8$', '$y = 5(x + 2)$', '$y = 9x$', '$y = x + 15$', '$y = 3.5x$']
  key:
    '$y = 12x$': 'علاقة تناسبية'
    '$y = 12x + 8$': 'علاقة غير تناسبية'
    '$y = 5(x + 2)$': 'علاقة غير تناسبية'
    '$y = 9x$': 'علاقة تناسبية'
    '$y = x + 15$': 'علاقة غير تناسبية'
    '$y = 3.5x$': 'علاقة تناسبية'
  verify: "[expand(e).subs(x, 0) == 0 for e in [12 * x, 12 * x + 8, 5 * (x + 2), 9 * x, x + 15, Rational(7, 2) * x]] == [True, False, False, True, False, True]"
  solution: |
    العلاقة التناسبية تُكتب على الصورة $y = mx$: لا يوجد فيها حد ثابت، ويمر مستقيمها بنقطة الأصل $(0, 0)$.
    تناسبية: $y = 12x$ و $y = 9x$ و $y = 3.5x$.
    غير تناسبية: $y = 12x + 8$ و $y = x + 15$ لوجود حد ثابت، و $y = 5(x + 2)$ لأنها تساوي $5x + 10$ بعد فك الأقواس.
  remediation: |
    اجعل المعادلة على الصورة $y = mx + b$ أولاً (فك الأقواس إن لزم). إذا كان $b = 0$ فالعلاقة تناسبية، وإلا فهي غير تناسبية.
    اختبر بالتعويض: عند $x = 0$ تكون $y = 0$ في العلاقة التناسبية فقط.
  misconceptions: [proportional-not-through-origin, distribute-first-term-only]
  qatar_link: 'الصف الثامن، الوحدة 2، الدرس 2-7'

- id: M8-A5-005
  topic: A5
  cognitive: knowing
  area: compute
  difficulty: easy
  benchmark: intermediate
  format: numeric
  context: pure
  time: 50
  stem: |
    ما ميل المستقيم المار بالنقطتين $(1, 8)$ و $(4, 2)$؟
  answer: {value: -2}
  verify: "Rational(2 - 8, 4 - 1)"
  solution: |
    نستعمل قانون الميل: $m = \frac{y_2 - y_1}{x_2 - x_1}$.
    نعوّض: $m = \frac{2 - 8}{4 - 1} = \frac{-6}{3} = -2$.
    الميل سالب لأن المستقيم ينزل من اليسار إلى اليمين: ينقص $y$ بمقدار $6$ عندما يزداد $x$ بمقدار $3$.
  hint: |
    ابدأ بالنقطة الثانية في البسط والمقام معاً.
  remediation: |
    اطرح الإحداثيات بالترتيب نفسه في البسط والمقام: $\frac{y_2 - y_1}{x_2 - x_1}$.
    تحقق من الإشارة: إذا نزل المستقيم من اليسار إلى اليمين فميله سالب.
  misconceptions: [mixed-order-subtraction, ignore-negative-sign, slope-rise-run-inverted]
  qatar_link: 'الصف الثامن، الوحدة 2، الدرس 2-6 (التناسب وميل المستقيم)'

- id: M8-A5-006
  topic: A5
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: low
  format: mc
  context: qatar
  time: 60
  stem: |
    يبيّن الشكل منسوب الماء $y$ بالمتر في خزان لتحلية المياه خلال $x$ ساعة بعد منتصف الليل (بيانات افتراضية).
    في أي فترة من الفترات الآتية يتناقص منسوب الماء؟
  figure:
    type: coord
    xmin: 0
    xmax: 8
    ymin: 0
    ymax: 8
    segments:
      - {points: [[0, 2], [2, 6]]}
      - {points: [[2, 6], [4, 6]]}
      - {points: [[4, 6], [7, 3]]}
    points: [{x: 0, y: 2}, {x: 2, y: 6}, {x: 4, y: 6}, {x: 7, y: 3}]
    alt: 'منسوب الماء في خزان خلال سبع ساعات'
  options: ['من $x = 0$ إلى $x = 2$', 'من $x = 2$ إلى $x = 4$', 'من $y = 6$ إلى $y = 3$', 'من $x = 4$ إلى $x = 7$']
  key: D
  verify: "[Rational(6 - 2, 2 - 0), Rational(6 - 6, 4 - 2), Rational(3 - 6, 7 - 4)] == [2, 0, -1]"
  rationale:
    A: 'في هذه الفترة يرتفع الرسم، أي إن المنسوب يتزايد.'
    B: 'في هذه الفترة يبقى الرسم أفقياً، أي إن المنسوب ثابت ولا يتناقص.'
    C: 'خلط بين المحورين: التناقص يُحدَّد بفترة على المحور الأفقي ($x$) لا بقيم $y$.'
  solution: |
    نقرأ الرسم من اليسار إلى اليمين:
    من $x = 0$ إلى $x = 2$ يرتفع المنسوب (يتزايد).
    من $x = 2$ إلى $x = 4$ يبقى ثابتاً عند $6$ أمتار.
    من $x = 4$ إلى $x = 7$ ينخفض المنسوب من $6$ إلى $3$ أمتار (يتناقص).
    إذن يتناقص المنسوب في الفترة من $x = 4$ إلى $x = 7$.
  remediation: |
    فترة التزايد أو التناقص تُحدَّد على المحور الأفقي. اقرأ الرسم من اليسار إلى اليمين: إذا صعد الرسم فالدالة متزايدة، وإذا نزل فمتناقصة، وإذا بقي أفقياً فثابتة.
  misconceptions: [x-y-axis-confusion, constant-as-decreasing]
  qatar_link: 'الصف الثامن، الوحدة 3، الدرس 3-5 (فترات التزايد والتناقص)'

- id: M8-A5-007
  topic: A5
  cognitive: applying
  area: represent
  difficulty: easy
  benchmark: intermediate
  format: grid_plot
  context: pure
  time: 80
  stem: |
    عيّن على الشبكة نقطتين من المستقيم الذي معادلته $y = 2x - 1$، هما النقطة التي $x = 0$ والنقطة التي $x = 3$.
    سيُرسم المستقيم بين النقطتين.
  grid: {xmin: -2, xmax: 4, ymin: -3, ymax: 6}
  mode: segment
  count: 2
  key: [[0, -1], [3, 5]]
  verify: "len(P) == 2 and all(q[1] == 2 * q[0] - 1 for q in P) and sorted(q[0] for q in P) == [0, 3]"
  solution: |
    نعوّض في المعادلة $y = 2x - 1$:
    عند $x = 0$: $y = 2(0) - 1 = -1$، فالنقطة $(0, -1)$.
    عند $x = 3$: $y = 2(3) - 1 = 5$، فالنقطة $(3, 5)$.
    نعيّن النقطتين ثم نصل بينهما بمستقيم؛ ميله $\frac{5 - (-1)}{3 - 0} = 2$ ومقطعه $y$ يساوي $-1$ كما في المعادلة.
  hint: |
    عوّض قيمة $x$ في المعادلة لتحصل على $y$ المقابلة.
  remediation: |
    لرسم مستقيم يكفي نقطتان: اختر قيمتين لـ $x$ وعوّضهما في المعادلة لإيجاد $y$، ثم عيّن الزوجين المرتبين.
    انتبه للإشارة عند التعويض: $2(0) - 1 = -1$ وليس $1$.
  misconceptions: [x-y-coordinates-swapped, ignore-negative-sign, slope-intercept-confusion]
  qatar_link: 'الصف الثامن، الوحدة 2، الدرس 2-9'

- id: M8-A5-008
  topic: A5
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: intermediate
  format: multi_numeric
  context: qatar
  time: 110
  stem: |
    تتبّع باحثون في محمية الذخيرة نمو شتلة من أشجار القرم، ويبيّن الجدول ارتفاعها $y$ بالسنتيمتر بعد $x$ شهراً من بدء القياس (بيانات افتراضية).
    العلاقة بين $x$ و $y$ خطية. أوجد الميل $m$ (معدل النمو في الشهر) والمقطع $y$ وهو $b$ (الارتفاع عند بدء القياس) في المعادلة $y = mx + b$.
  table:
    headers: ['عدد الأشهر $x$', '$2$', '$4$', '$6$', '$8$']
    rows: [['الارتفاع $y$ بالسنتيمتر', '$13$', '$21$', '$29$', '$37$']]
    row_headers: true
  fields:
    - {label: 'الميل $m$', value: 4}
    - {label: 'المقطع $y$ ($b$)', value: 5}
  scoring: {mode: partial, partial_min: 1}
  verify: "[Rational(21 - 13, 4 - 2), 13 - Rational(21 - 13, 4 - 2) * 2]"
  solution: |
    نحسب الميل من نقطتين في الجدول: $m = \frac{21 - 13}{4 - 2} = \frac{8}{2} = 4$، أي ينمو ارتفاع الشتلة $4$ سنتيمترات كل شهر.
    نعوّض النقطة $(2, 13)$ في $y = 4x + b$: $13 = 4(2) + b$ ومنها $b = 5$.
    المعادلة $y = 4x + 5$، والمقطع $y$ يساوي $5$، وهو ارتفاع الشتلة عند بدء القياس.
  remediation: |
    الجدول لا يحوي $x = 0$، فلا نقرأ المقطع $y$ منه مباشرة: نحسب الميل أولاً، ثم نعوّض زوجاً مرتباً من الجدول في $y = mx + b$ لإيجاد $b$.
  misconceptions: [first-value-as-intercept, slope-rise-run-inverted]
  qatar_link: 'الصف الثامن، الوحدة 2، الدرسان 2-8 و2-9'

- id: M8-A5-009
  topic: A5
  cognitive: applying
  area: implement
