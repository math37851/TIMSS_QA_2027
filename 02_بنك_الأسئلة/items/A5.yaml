    عيّن على الشبكة النقاط الثلاث الممثلة للجدول.
  table:
    headers: ['عدد الأسابيع $x$', '$1$', '$2$', '$3$']
    rows: [['الارتفاع $y$ بالسنتيمتر', '$3$', '$5$', '$7$']]
