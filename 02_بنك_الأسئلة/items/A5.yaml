- id: M8-A5-011
  topic: A5
  cognitive: applying
  area: represent
  difficulty: medium
  benchmark: intermediate
  format: grid_plot
  context: real
  time: 100
  stem: |
    تنخفض درجة حرارة غرفة تبريد بعد تشغيل المبرّد وفق العلاقة $y = -2x + 4$، حيث $y$ درجة الحرارة بالدرجات المئوية بعد $x$ ساعة (بيانات افتراضية).
    عيّن على الشبكة النقاط الثلاث التي تمثل درجة الحرارة عند $x = 0$ و $x = 2$ و $x = 4$.
  grid: {xmin: -1, xmax: 5, ymin: -5, ymax: 5}
  mode: points
  count: 3
  key: [[0, 4], [2, 0], [4, -4]]
  verify: "len(P) == 3 and all(q[1] == -2 * q[0] + 4 for q in P) and sorted(q[0] for q in P) == [0, 2, 4]"
  solution: |
    نعوّض كل قيمة لـ $x$ في المعادلة $y = -2x + 4$:
    عند $x = 0$: $y = -2(0) + 4 = 4$.
    عند $x = 2$: $y = -2(2) + 4 = 0$.
    عند $x = 4$: $y = -2(4) + 4 = -4$.
    النقاط هي $(0, 4)$ و $(2, 0)$ و $(4, -4)$، وتقع على مستقيم هابط ميله $-2$ لأن درجة الحرارة تنخفض بمقدار $2$ في كل ساعة.
  hint: |
    اكتب جدولاً بقيم $x$ المطلوبة وعوّض في المعادلة لإيجاد $y$ المقابلة، وانتبه لإشارة الناتج.
  remediation: |
    عند ضرب عدد سالب في عدد موجب يكون الناتج سالباً: $-2 \times 4 = -8$. بعد إيجاد كل $y$ اكتب الزوج المرتب $(x, y)$ ثم عيّنه.
    الميل السالب يعني أن الرسم ينزل من اليسار إلى اليمين.
  misconceptions: [ignore-negative-sign, x-y-coordinates-swapped]
  qatar_link: 'الصف الثامن، الوحدة 3، الدرس 3-1 (بند جسري: تمثيل الدالة بجدول ورسم، والدرس 3-2 محذوف من الخطة)'

- id: M8-A5-012
  topic: A5
  cognitive: applying
  area: formulate
  difficulty: medium
  benchmark: high
  format: cr_explain
  context: qatar
  time: 200
  stem: |
    تُحتسب أجرة سيارة أجرة (كروة) في الدوحة بإضافة رسم فتح عداد ثابت قدره 4 ريالات إلى 2 ريال عن كل كيلومتر (بيانات افتراضية).
    1) اكتب معادلة تمثل الأجرة $y$ بالريال لمشوار طوله $x$ كيلومتراً على الصورة $y = mx + b$.
    2) ما طول المشوار الذي أجرته 30 ريالاً؟ وضّح خطوات الحل.
  points: 2
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يكتب المعادلة $y = 2x + 4$ (أو ما يكافئها مثل $y = 4 + 2x$) ويجد أن طول المشوار $13$ كيلومتراً بطريقة صحيحة.'}
      - {code: 10, points: 1, desc: 'يكتب المعادلة الصحيحة فقط، أو يجد $13$ كيلومتراً بحساب صحيح دون كتابة المعادلة بالصورة المطلوبة.'}
      - {code: 70, points: 0, desc: 'يبدّل الميل والمقطع فيكتب $y = 4x + 2$.'}
      - {code: 71, points: 0, desc: 'يهمل الرسم الثابت فيكتب $y = 2x$، أو يجمع العددين فيكتب $y = 6x$.'}
      - {code: 79, points: 0, desc: 'إجابة خاطئة أخرى أو غير ذات صلة.'}
    examples:
      correct:
        - '$y = 2x + 4$ ثم $30 = 2x + 4$ ومنها $x = 13$ كيلومتراً.'
        - '$y = 4 + 2x$ وطول المشوار $(30 - 4) \div 2 = 13$ كيلومتراً.'
      incorrect:
        - '$y = 4x + 2$'
        - '$y = 6x$ ومنها $x = 5$ كيلومترات.'
        - '$y = 2x$ ومنها $x = 15$ كيلومتراً.'
  model_answer: '$y = 2x + 4$ حيث $m = 2$ و $b = 4$. نضع $y = 30$ فنحصل على $2x + 4 = 30$ ومنها $2x = 26$ و $x = 13$. طول المشوار $13$ كيلومتراً.'
  verify: "solve(Eq(2 * x + 4, 30), x) == [13]"
  solution: |
    ميل المعادلة هو سعر الكيلومتر $m = 2$، والمقطع $y$ هو رسم فتح العداد $b = 4$ (الأجرة عند $x = 0$).
    المعادلة: $y = 2x + 4$.
    لإيجاد طول المشوار نضع $y = 30$: $2x + 4 = 30$ فيكون $2x = 26$ ومنها $x = 13$.
    طول المشوار $13$ كيلومتراً.
  remediation: |
    الكمية التي تتغير مع المسافة (سعر الكيلومتر) هي الميل $m$ وتُضرب في $x$، والكمية الثابتة (رسم فتح العداد) هي المقطع $y$ وتُجمع.
    اختبر معادلتك: عند $x = 0$ يجب أن تعطي $y$ رسم الفتح.
  misconceptions: [slope-intercept-confusion, ignore-fixed-fee, operation-confusion]
  qatar_link: 'الصف الثامن، الوحدة 2، الدرس 2-9'

- id: M8-A5-013
  topic: A5
  cognitive: reasoning
  area: analyze
  difficulty: hard
  benchmark: advanced
  format: mc
  context: real
  time: 150
  stem: |
    تعرض شركة اتصالات باقتي إنترنت شهريتين، وتتكون تكلفة كل باقة من رسم ثابت إضافة إلى مبلغ عن كل جيجابايت مستهلك (بيانات افتراضية).
    ما أقل عدد صحيح من الجيجابايت يجعل تكلفة الباقة الثانية أقل من تكلفة الباقة الأولى؟
  table:
    headers: ['الباقة', 'الرسم الثابت بالريال', 'السعر لكل جيجابايت بالريال']
    rows: [['الأولى', '$20$', '$5$'], ['الثانية', '$50$', '$2$']]
    row_headers: true
  options: ['$10$', '$11$', '$15$', '$30$']
  option_values: [10, 11, 15, 30]
  key: B
  verify: "min(g for g in range(0, 200) if 50 + 2 * g < 20 + 5 * g)"
  rationale:
    A: 'عند $10$ جيجابايت تتساوى التكلفتان ($70$ ريالاً لكل منهما)، فلا تكون الثانية أقل.'
    C: 'قسم فرق الرسمين الثابتين $30$ على $2$ فقط، دون استعمال فرق السعرين $5 - 2$.'
    D: 'اكتفى بفرق الرسمين الثابتين ($50 - 20$) دون أن يأخذ سعر الجيجابايت في الحسبان.'
  solution: |
    نفرض أن $g$ عدد الجيجابايت. تكلفة الباقة الأولى $20 + 5g$ وتكلفة الثانية $50 + 2g$.
    نريد $50 + 2g < 20 + 5g$ أي $30 < 3g$ ومنها $g > 10$.
    عند $g = 10$ تتساوى التكلفتان ($70$ ريالاً)، وعند $g = 11$ تكون الأولى $75$ والثانية $72$.
    إذن أقل عدد صحيح هو $11$.
  remediation: |
    اكتب معادلة تكلفة كل باقة $y = mx + b$ ثم قارن بينهما، أو أنشئ جدولاً بتكلفة كل باقة عند $5$ و $10$ و $15$ جيجابايت وابحث عن نقطة التساوي.
    الباقة ذات الميل الأصغر تصبح أرخص عندما يتجاوز الاستهلاك نقطة التقاء المستقيمين.
  misconceptions: [compare-fixed-fee-only, equality-point-vs-inequality, rate-difference-ignored]
