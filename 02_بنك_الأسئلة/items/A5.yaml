      figure: {type: coord, xmin: -3, xmax: 3, ymin: -4, ymax: 4, unit: 20, lines: [{m: 2, b: -2}], alt: 'مستقيم ميله 2 ومقطعه y يساوي سالب 2'}
    - text: 'مستقيم ميله $\frac{1}{2}$ ومقطعه $y$ يساوي $-2$'
      figure: {type: coord, xmin: -3, xmax: 3, ymin: -4, ymax: 4, unit: 20, lines: [{m: 0.5, b: -2}], alt: 'مستقيم ميله نصف ومقطعه y يساوي سالب 2'}
  key: C
  verify: "[m == 2 and b == -2 for m, b in [(2, 2), (-2, -2), (2, -2), (Rational(1, 2), -2)]] == [False, False, True, False]"
  rationale:
    A: 'ميله $2$ صحيح (موازٍ لـ $L$) لكنه يقطع المحور $y$ عند $2$ لا عند $-2$.'
    B: 'يقطع المحور $y$ عند $-2$ لكن ميله $-2$ (هابط)، فليس موازياً لـ $L$.'
    D: 'يقطع المحور $y$ عند $-2$ لكن ميله $\frac{1}{2}$ لا $2$ (قلب الميل).'
  solution: |
    المستقيمان المتوازيان لهما الميل نفسه، فميل المستقيم المطلوب $2$ (ميل $L$).
    ومقطعه $y$ يساوي $-2$، إذن معادلته $y = 2x - 2$.
    الشكل C هو الذي يصعد وحدتين رأسيتين لكل وحدة أفقية ويقطع المحور $y$ عند $-2$.
  remediation: |
    المستقيمان المتوازيان ميلهما واحد ومقطعاهما $y$ مختلفان. اكتب معادلة المستقيم المطلوب $y = mx + b$ أولاً، ثم اختر الرسم الذي يوافق قيمتي $m$ و $b$.
  misconceptions: [ignore-negative-sign, slope-rise-run-inverted]
  qatar_link: 'الصف الثامن، الوحدة 2، الدرسان 2-6 و2-9'

- id: M8-A5-010
  topic: A5
