  rubric:
    full: 'يختار «لا، ناصر ليس على صواب» ويبرّر تبريراً رياضياً صحيحاً، مثل: النسبة $\frac{y}{x}$ غير ثابتة ($7$ ثم $4.5$ ثم $\frac{11}{3}$)، أو المستقيم لا يمر بنقطة الأصل (عند $x = 0$ تكون $y = 5$ لا $0$)، أو مضاعفة $x$ لا تضاعف $y$.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تبرير رياضي صحيح (مثل تكرار أن $y$ يزداد بمقدار ثابت، أو أن الأعداد مختلفة).'
    examples:
      correct:
        - 'لا؛ لأن $\frac{7}{1} \neq \frac{9}{2}$ فالنسبة بين $y$ و $x$ غير ثابتة.'
        - 'لا؛ لو كانت تناسبية لكانت تكلفة صورتين ضعف تكلفة صورة واحدة أي $14$ ريالاً، لكنها $9$ ريالات.'
        - 'لا؛ العلاقة هي $y = 2x + 5$ وفيها حد ثابت $5$ فلا يمر مستقيمها بنقطة الأصل.'
      incorrect:
        - 'نعم؛ لأن $y$ يزداد بمقدار $2$ في كل مرة.'
        - 'لا؛ لأن الأعداد في الجدول مختلفة.'
  solution: |
    في العلاقة التناسبية يكون $\frac{y}{x}$ ثابتاً. هنا: $\frac{7}{1} = 7$ و $\frac{9}{2} = 4.5$ و $\frac{11}{3} \approx 3.67$ وهي غير متساوية.
    الزيادة الثابتة في $y$ تدل على علاقة خطية فقط. معادلة العلاقة $y = 2x + 5$، وفيها حد ثابت $b = 5$ (رسم التجهيز) فلا يمر مستقيمها بنقطة الأصل.
    إذن العلاقة غير تناسبية وناصر ليس على صواب.
  remediation: |
    العلاقة التناسبية $y = mx$ تتطلب أن تكون النسبة $\frac{y}{x}$ ثابتة وأن يمر مستقيمها بنقطة الأصل. الزيادة الثابتة في $y$ وحدها لا تكفي، فهي صفة كل علاقة خطية.
    اختبر دائماً: ماذا تكون قيمة $y$ عندما $x = 0$؟
  misconceptions: [additive-ratio-reasoning, proportional-not-through-origin, examples-prove-general]
  qatar_link: 'الصف الثامن، الوحدة 2، الدرسان 2-7 و2-9'

- id: M8-A5-016
  topic: A5
  cognitive: reasoning
  area: analyze
  difficulty: hard
  benchmark: high
  format: select_explain
  context: qatar
  time: 140
  stem: |
    يمثل المستقيم في الشكل رصيد بطاقة مترو الدوحة $y$ بالريال بعد $x$ رحلة (بيانات افتراضية).
    أي العبارات الآتية تفسّر ميل المستقيم تفسيراً صحيحاً؟ اختر الإجابة ثم برّر اختيارك باستعمال نقطتين من الرسم.
  figure:
    type: coord
    xmin: 0
    xmax: 6
    ymin: 0
    ymax: 12
    unit: 26
    lines: [{m: -2, b: 12}]
    points: [{x: 0, y: 12}, {x: 2, y: 8}, {x: 4, y: 4}, {x: 6, y: 0}]
    alt: 'مستقيم هابط يمثل رصيد بطاقة مترو بعد عدد من الرحلات'
  options:
    - 'الميل $12$؛ أي إن رصيد البطاقة عند الشراء $12$ ريالاً'
    - 'الميل $2$؛ أي إن الرصيد يزيد بمقدار $2$ ريال مع كل رحلة'
    - 'الميل $-2$؛ أي إن الرصيد ينقص بمقدار $2$ ريال مع كل رحلة'
    - 'الميل $6$؛ أي إن البطاقة تكفي $6$ رحلات'
  key: C
  points: 1
  verify: "[Rational(8 - 12, 2 - 0), Rational(0 - 12, 6 - 0)] == [-2, -2]"
  rationale:
    A: 'خلط بين الميل والمقطع $y$: العدد $12$ هو المقطع $y$ (الرصيد الابتدائي) وليس الميل.'
    B: 'أهمل إشارة الميل: المستقيم هابط فميله سالب.'
    D: 'العدد $6$ هو قيمة $x$ عندما $y = 0$ (عدد الرحلات)، وليس الميل.'
  rubric:
    full: 'يختار العبارة C ويبرّر بحساب الميل من نقطتين على المستقيم (مثل $\frac{8 - 12}{2 - 0} = -2$) أو بأن الرصيد ينقص $2$ ريال عند كل رحلة إضافية.'
    zero: 'يختار عبارة أخرى، أو يختار C دون تبرير رياضي (مثل: «لأنها الأنسب»، أو ذكر المقطع $y$ فقط).'
    examples:
      correct:
        - 'النقطتان $(0, 12)$ و $(2, 8)$: الميل $\frac{8 - 12}{2 - 0} = -2$، فالرصيد ينقص $2$ ريال مع كل رحلة.'
        - 'كلما زادت الرحلات رحلة واحدة نزل المستقيم وحدتين، فالميل $-2$.'
      incorrect:
        - 'الميل $12$ لأن المستقيم يبدأ من $12$.'
        - 'الميل $2$ لأن الرصيد يتغير بمقدار $2$ دون ذكر الاتجاه.'
  solution: |
    نأخذ نقطتين على المستقيم: $(0, 12)$ و $(2, 8)$.
    الميل $= \frac{8 - 12}{2 - 0} = \frac{-4}{2} = -2$.
    الميل سالب لأن الرصيد ينقص مع زيادة عدد الرحلات: ينقص الرصيد بمقدار $2$ ريال عن كل رحلة.
    أما العدد $12$ فهو المقطع $y$ (الرصيد قبل أي رحلة)، والعدد $6$ هو عدد الرحلات التي يصبح عندها الرصيد صفراً.
  remediation: |
    الميل هو التغير في $y$ مقسوماً على التغير في $x$، وإشارته تدل على الاتجاه: سالب يعني نقصاً. فرّق بين الميل (معدل التغير) والمقطع $y$ (القيمة الابتدائية).
  misconceptions: [slope-intercept-confusion, ignore-negative-sign, x-intercept-as-slope]
  qatar_link: 'الصف الثامن، الوحدة 2، الدرسان 2-6 و2-8'
