- id: M8-A5-001
  topic: A5
  cognitive: knowing
  area: compute
  difficulty: foundation
  benchmark: low
  format: mc
  context: pure
  time: 45
  stem: |
    يبيّن الشكل مستقيماً في المستوى الإحداثي يمر بالنقطتين المعيَّنتين عليه.
    ما ميل المستقيم؟
  figure:
    type: coord
    xmin: -2
    xmax: 4
    ymin: -2
    ymax: 6
    lines: [{m: 2, b: 1}]
    points: [{x: 0, y: 1}, {x: 2, y: 5}]
    alt: 'مستقيم يمر بنقطتين معيَّنتين في المستوى الإحداثي'
  options: ['$\frac{1}{2}$', '$1$', '$2$', '$4$']
  option_values: ['1/2', 1, 2, 4]
  key: C
  verify: "Rational(5 - 1, 2 - 0)"
  rationale:
    A: 'قسم التغير الأفقي $2$ على التغير الرأسي $4$، أي حسب الميل مقلوباً.'
    B: 'هذه قيمة المقطع $y$ (نقطة التقاء المستقيم بالمحور $y$) وليست الميل.'
    D: 'اكتفى بالتغير الرأسي $4$ دون قسمته على التغير الأفقي $2$.'
  solution: |
    نختار نقطتين واضحتين على المستقيم: $(0, 1)$ و $(2, 5)$.
    التغير الرأسي $5 - 1 = 4$ والتغير الأفقي $2 - 0 = 2$.
    الميل يساوي التغير الرأسي مقسوماً على التغير الأفقي: $\frac{4}{2} = 2$.
  hint: |
    اختر نقطتين تقعان على تقاطعات خطوط الشبكة، ثم عدّ الوحدات الرأسية والأفقية بينهما.
  remediation: |
    ارسم مثلثاً قائماً بين نقطتين على المستقيم، وعدّ الوحدات الرأسية ثم الأفقية، ثم اقسم الرأسي على الأفقي.
    تذكّر: المستقيم الصاعد نحو اليمين ميله موجب، والهابط ميله سالب.
  misconceptions: [slope-rise-run-inverted, slope-intercept-confusion, slope-as-rise-only]
  qatar_link: 'الصف الثامن، الوحدة 2، الدرس 2-6 (التناسب وميل المستقيم)'

- id: M8-A5-002
  topic: A5
  cognitive: knowing
  area: identify
  difficulty: foundation
  benchmark: low
  format: mc
  context: qatar
  time: 50
  stem: |
    يتقاضى نادي سباحة في أسباير رسماً ثابتاً للتسجيل، ثم مبلغاً ثابتاً عن كل حصة تدريب (بيانات افتراضية).
    يبيّن المستقيم في الشكل التكلفة الكلية $y$ بالريال بعد $x$ حصة.
    ما معنى النقطة التي يقطع فيها المستقيم المحور $y$؟
  figure:
    type: coord
    xmin: 0
    xmax: 6
    ymin: 0
    ymax: 16
    unit: 22
    lines: [{m: 2, b: 4}]
    alt: 'مستقيم يمثل التكلفة الكلية بعد عدد من الحصص'
  options:
    - '$4$ ريالات: رسم التسجيل الثابت قبل أي حصة'
    - '$4$ ريالات: سعر الحصة الواحدة'
    - '$2$ ريال: رسم التسجيل الثابت قبل أي حصة'
    - '$2$ ريال: سعر الحصة الواحدة'
  key: A
  verify: "[2 * 0 + 4, Rational(16 - 4, 6 - 0)] == [4, 2]"
  rationale:
    B: 'قرأ المقطع $y$ صحيحاً لكنه فسّره بأنه سعر الحصة، وسعر الحصة هو الميل.'
    C: 'العدد $2$ هو الميل (سعر الحصة) وليس المقطع $y$؛ أما التفسير فمناسب للمقطع.'
    D: 'هذا تفسير الميل ($2$ ريال عن كل حصة) وليس تفسير المقطع $y$.'
  solution: |
    المقطع $y$ هو قيمة $y$ عندما $x = 0$، أي قبل أن يحضر المشترك أي حصة.
    يقطع المستقيم المحور $y$ عند $4$، فالتكلفة قبل أي حصة هي $4$ ريالات، وهي رسم التسجيل الثابت.
    أما الميل $\frac{6 - 4}{1 - 0} = 2$ فهو سعر الحصة الواحدة.
  remediation: |
    المقطع $y$ هو قيمة $y$ عند $x = 0$ (القيمة الابتدائية أو الرسم الثابت)، أما الميل فهو مقدار التغير في $y$ عند زيادة $x$ بمقدار $1$.
    اقرأ نقطة تقاطع المستقيم مع المحور $y$ أولاً ثم فسّرها في سياق المسألة.
  misconceptions: [slope-intercept-confusion]
  qatar_link: 'الصف الثامن، الوحدة 2، الدرس 2-8 (المقطع)'

