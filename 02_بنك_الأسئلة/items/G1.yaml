  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يجد $\angle XCD = 68^\circ$ ويذكر العلاقتين: مجموع زوايا المثلث $ABX$ يساوي $180^\circ$ (فتكون $\angle XBA = 68^\circ$)، وتساوي الزاويتين المتبادلتين داخلياً لأن $AB \parallel CD$.'}
      - {code: 10, points: 1, desc: 'يجد $68^\circ$ دون تبرير كافٍ؛ أو يذكر العلاقتين صحيحتين مع خطأ حسابي؛ أو يجد $\angle XBA = 68^\circ$ فقط دون ربطها بالزاوية $\angle XCD$.'}
      - {code: 70, points: 0, desc: 'إجابة غير صحيحة مثل $62^\circ$ أو $50^\circ$ أو $130^\circ$، أو لا يوجد حل.'}
    examples:
      correct:
        - 'في المثلث $ABX$: $\angle XBA = 180^\circ - 62^\circ - 50^\circ = 68^\circ$ (مجموع زوايا المثلث). وبما أن $AB \parallel CD$ فإن $\angle XCD = \angle XBA = 68^\circ$ لأنهما متبادلتان داخلياً.'
      incorrect:
        - '$x = 62^\circ$ لأن الزاويتين متناظرتان.'
        - '$x = 130^\circ$ لأن $180^\circ - 50^\circ = 130^\circ$.'
  model_answer: 'في المثلث $ABX$: $\angle XBA = 180^\circ - 62^\circ - 50^\circ = 68^\circ$ (مجموع زوايا المثلث $180^\circ$). بما أن $AB \parallel CD$ والقاطع $BC$ فإن $\angle XCD = \angle XBA = 68^\circ$ (زاويتان متبادلتان داخلياً متساويتان). إذن $x = 68^\circ$.'
  verify: "180 - 62 - 50 == 68"
  solution: |
    الخطوة 1: في المثلث $ABX$ مجموع الزوايا $180^\circ$، فـ $\angle XBA = 180^\circ - 62^\circ - 50^\circ = 68^\circ$.
    الخطوة 2: $AB \parallel CD$ والقاطع $BC$، فالزاويتان $\angle XBA$ و$\angle XCD$ متبادلتان داخلياً ومتساويتان: $x = 68^\circ$.
  remediation: |
    ابدأ بالمثلث الذي تعرف زاويتين فيه لتجد الثالثة، ثم انقل القياس إلى الزاوية المطلوبة بالعلاقة بين المستقيمين المتوازيين. اكتب بجانب كل خطوة اسم العلاقة (مجموع زوايا المثلث، المتبادلتان داخلياً).
  misconceptions: [wrong-corresponding-pair, incomplete-angle-chain, vertical-angle-supplement-confusion]
  qatar_link: 'الصف الثامن 5-8 و5-9: القواطع وزوايا المثلث'
