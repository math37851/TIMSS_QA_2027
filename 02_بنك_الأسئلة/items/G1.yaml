    bounds: [-4.5, -1.5, 4.8, 4.1]
    items:
      - {seg: [[-4, 0], [4, 0]], width: 3}
      - {seg: [[-4, 2.2], [4, 2.2]], width: 3}
      - {seg: [[-1.5, -1.2], [-1.5, 3.4]], width: 3}
      - {seg: [[1.42, -1.0], [3.96, 3.4]], width: 3}
      - {arrows: [[-4, 0], [-3, 0]], n: 1}
      - {arrows: [[-4, 2.2], [-3, 2.2]], n: 1}
      - {angle: [[-0.5, 0], [-1.5, 0], [-1.5, 1]], right: true}
      - {angle: [[-0.5, 2.2], [-1.5, 2.2], [-1.5, 3.2]], right: true}
      - {text: [4.4, 0], s: 'a', size: 17, weight: bold}
      - {text: [4.4, 2.2], s: 'b', size: 17, weight: bold}
      - {text: [-1.5, 3.75], s: 'c', size: 17, weight: bold}
      - {text: [4.25, 3.65], s: 'd', size: 17, weight: bold}
  options:
    - 'الشارعان $a$ و$b$ متعامدان'
    - 'الشارعان $c$ و$d$ متوازيان'
    - 'الشارعان $a$ و$d$ متعامدان'
    - 'الشارعان $b$ و$c$ متعامدان'
  key: D
  verify: "(1*0 + 0*1 == 0) and (1*1 + 0*0 != 0) and (1*254 + 0*440 != 0) and (0*440 - 1*254 != 0)"
  rationale:
    A: 'الشارعان $a$ و$b$ متوازيان (علامتا التوازي)؛ والمتوازيان لا يتقاطعان فلا يكونان متعامدين.'
    B: 'الشارع $c$ رأسي والشارع $d$ مائل؛ اتجاهاهما مختلفان فليسا متوازيين.'
    C: 'الشارع $d$ يقطع $a$ بزاوية حادة وليست قائمة؛ التقاطع لا يعني التعامد.'
  solution: |
    الزاوية القائمة المرسومة عند تقاطع $b$ و$c$ تعني أنهما متعامدان. أما $a$ و$b$ فمتوازيان، و$d$ يقطع $a$ بزاوية غير قائمة، و$c$ و$d$ اتجاهاهما مختلفان. الإجابة الصحيحة D.
  remediation: |
    صنّف أزواج الشوارع في الشكل ثلاثة أنواع: متوازية (لا تتقاطع)، متعامدة (تتقاطع بزاوية قائمة)، متقاطعة وغير متعامدة. ابحث عن علامات الشكل قبل الحكم بالنظر فقط.
  misconceptions: [intersecting-means-perpendicular, parallel-perpendicular-confusion]
  qatar_link: 'الصف السابع، الفصل الثاني: المستقيمات المتوازية والمتعامدة والمتقاطعة'

- id: M8-G1-004
  topic: G1
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: low
  format: dragdrop_categorize
  context: real
  time: 60
  stem: |
    ينقسم قرص الساعة إلى 12 جزءاً متساوياً، وقياس الزاوية بين كل رقمين متتاليين $30^\circ$.
    صنّف كل وقت بحسب نوع الزاوية التي يصنعها عقربا الساعة.
  categories: ['زاوية حادة', 'زاوية قائمة', 'زاوية منفرجة', 'زاوية مستقيمة']
  cards: ['الساعة 1:00', 'الساعة 2:00', 'الساعة 3:00', 'الساعة 4:00', 'الساعة 5:00', 'الساعة 6:00']
  key:
    'الساعة 1:00': 'زاوية حادة'
    'الساعة 2:00': 'زاوية حادة'
    'الساعة 3:00': 'زاوية قائمة'
    'الساعة 4:00': 'زاوية منفرجة'
    'الساعة 5:00': 'زاوية منفرجة'
    'الساعة 6:00': 'زاوية مستقيمة'
  verify: "all([30*1 < 90, 30*2 < 90, 30*3 == 90, 90 < 30*4 < 180, 90 < 30*5 < 180, 30*6 == 180])"
  solution: |
    الزاوية بين العقربين = (عدد الأجزاء بين الرقمين) $\times 30^\circ$:
    الساعة 1:00 ← $30^\circ$ حادة؛ 2:00 ← $60^\circ$ حادة؛ 3:00 ← $90^\circ$ قائمة؛ 4:00 ← $120^\circ$ منفرجة؛ 5:00 ← $150^\circ$ منفرجة؛ 6:00 ← $180^\circ$ مستقيمة.
  remediation: |
    ارسم قرص ساعة وسمِّ الزاوية عند كل وقت: أقل من $90^\circ$ حادة، و$90^\circ$ قائمة، وبين $90^\circ$ و$180^\circ$ منفرجة، و$180^\circ$ مستقيمة.
  misconceptions: [angle-type-boundary-confusion, straight-angle-vs-obtuse]
  qatar_link: 'الصف السابع، الفصل الثاني: أنواع الزوايا (حادة، قائمة، منفرجة، مستقيمة)'

- id: M8-G1-005
  topic: G1
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: qatar
  time: 40
  stem: |
    يبيّن الشكل خريطة شبكية مبسطة لمرسى القوارب في الميناء القديم بالدوحة، وكل نقطة تمثل قارباً (بيانات افتراضية).
    ما إحداثيا النقطة $C$؟
  figure:
    type: coord
    alt: 'مستوى إحداثي عليه أربع نقاط A وB وC وD في الأرباع الأربعة'
    xmin: -5
    xmax: 5
    ymin: -5
    ymax: 5
    unit: 32
    points:
      - {x: 3, y: 4, label: 'A', pos: 'ne'}
      - {x: -3, y: 2, label: 'B', pos: 'nw'}
      - {x: -4, y: -3, label: 'C', pos: 'sw'}
      - {x: 2, y: -4, label: 'D', pos: 'se'}
  options:
    - '$(-4, -3)$'
    - '$(-3, -4)$'
    - '$(4, -3)$'
    - '$(-4, 3)$'
  key: A
  verify: "(-4 < 0) and (-3 < 0) and ((-4, -3) != (-3, -4)) and ((-4, -3) != (4, -3)) and ((-4, -3) != (-4, 3))"
  rationale:
    B: 'عُكس ترتيب الإحداثيين؛ يُكتب الإحداثي $x$ (الأفقي) أولاً ثم $y$ (الرأسي).'
    C: 'خطأ في إشارة الإحداثي $x$؛ النقطة $C$ تقع يسار المحور $y$ فإحداثيها $x$ سالب.'
    D: 'خطأ في إشارة الإحداثي $y$؛ النقطة $C$ تقع أسفل المحور $x$ فإحداثيها $y$ سالب.'
  solution: |
    النقطة $C$ تقع على بعد $4$ وحدات يسار المحور $y$ فإحداثيها $x$ يساوي $-4$، وعلى بعد $3$ وحدات أسفل المحور $x$ فإحداثيها $y$ يساوي $-3$. إذن $C(-4, -3)$ وتقع في الربع الثالث.
  remediation: |
    انطلق من نقطة الأصل: حرّك أفقياً أولاً (يميناً موجب ويساراً سالب) ثم رأسياً (للأعلى موجب وللأسفل سالب). وتذكّر الترتيب: $(x, y)$.
  misconceptions: [coordinates-order-swapped, quadrant-sign-error]
  qatar_link: 'الصف السادس: المستوى الإحداثي (الأرباع الأربعة)'

- id: M8-G1-006
  topic: G1
  cognitive: knowing
  area: compute
  difficulty: medium
  benchmark: intermediate
  format: numeric
  context: qatar
  time: 60
  stem: |
    على خريطة شبكية لكتارا، تمثل كل وحدة في المستوى الإحداثي مسافة $25\,\text{m}$ في الواقع (بيانات افتراضية).
    يقع مطعم عند النقطة $A(-3, 4)$ ومقهى عند النقطة $B(5, 4)$ على الشارع نفسه. ما المسافة الحقيقية بين المطعم والمقهى بالمتر؟
  answer: {value: 200, unit: 'متر'}
  verify: "(5 - (-3)) * 25"
  solution: |
    للنقطتين الإحداثي $y = 4$ نفسه، فالقطعة $AB$ أفقية وطولها يساوي الفرق بين الإحداثيين $x$: $|5 - (-3)| = 8$ وحدات.
    كل وحدة تمثل $25\,\text{m}$، فالمسافة الحقيقية $8 \times 25 = 200\,\text{m}$.
  remediation: |
    ارسم المحور الأفقي وعُدَّ الوحدات من $-3$ إلى $5$ مروراً بالصفر: $3$ ثم $5$. وبعد إيجاد الطول على المستوى الإحداثي اضرب في مقياس الرسم.
  misconceptions: [ignore-negative-sign, scale-not-applied]
  qatar_link: 'الصف السادس: المستوى الإحداثي؛ الصف السابع: الأعداد الصحيحة (المسافة بين عددين)'

- id: M8-G1-007
  topic: G1
