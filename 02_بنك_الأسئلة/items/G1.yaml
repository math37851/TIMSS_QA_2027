- id: M8-G1-001
  topic: G1
  cognitive: knowing
  area: recall
  difficulty: foundation
  benchmark: low
  format: mc
  context: pure
  time: 25
  stem: |
    الزاويتان $\angle A$ و$\angle B$ متكاملتان. أي العبارات الآتية صحيحة؟
  options:
    - 'مجموع قياسيهما $90^\circ$'
    - 'مجموع قياسيهما $180^\circ$'
    - 'مجموع قياسيهما $360^\circ$'
    - 'قياساهما متساويان'
  option_values: [90, 180, 360, null]
  key: B
  verify: "65 + (180 - 65)"
  rationale:
    A: 'هذا مجموع قياسي الزاويتين المتتامتين؛ خلط بين المتتامتين والمتكاملتين.'
    C: 'القياس $360^\circ$ هو مجموع الزوايا حول نقطة (دورة كاملة)، لا مجموع زاويتين متكاملتين.'
    D: 'لا يُشترط تساوي القياسين؛ فالزاويتان $50^\circ$ و$130^\circ$ متكاملتان وغير متساويتين.'
  solution: |
    الزاويتان المتكاملتان مجموع قياسيهما $180^\circ$؛ فهما معاً تكوّنان زاوية مستقيمة. أما المتتامتان فمجموع قياسيهما $90^\circ$. الإجابة الصحيحة B.
  remediation: |
    ارسم مستقيماً وشعاعاً ينطلق من نقطة عليه: الزاويتان على المستقيم متكاملتان ($180^\circ$). ثم ارسم زاوية قائمة وقسّمها بشعاع: الزاويتان الناتجتان متتامتان ($90^\circ$).
  misconceptions: [complementary-supplementary-confusion, full-turn-vs-straight-angle, equal-angles-assumption]
  qatar_link: 'الصف السابع، الفصل الثاني: علاقات الزوايا (المتتامتان والمتكاملتان)'

- id: M8-G1-002
  topic: G1
  cognitive: knowing
  area: compute
  difficulty: foundation
  benchmark: low
  format: numeric
  context: real
  time: 40
  stem: |
    يبيّن الشكل مقصاً مفتوحاً؛ شفرتاه في الأعلى ومقبضاه في الأسفل، وتتقاطعان عند محور الدوران. قياس الزاوية بين الشفرتين $38^\circ$.
    ما قياس الزاوية $x$ بالدرجات؟
  figure:
    type: geo
    alt: 'مقص مفتوح: الزاوية بين الشفرتين 38 درجة، والزاوية x إلى يسار محور الدوران'
    unit: 40
    pad: 36
    bounds: [-1.6, -3.1, 1.6, 2.8]
    items:
      - {seg: [[-0.814, 2.364], [0.814, -2.364]], width: 3}
      - {seg: [[0.814, 2.364], [-0.814, -2.364]], width: 3}
      - {circle: [[0.912, -2.648], 0.3]}
      - {circle: [[-0.912, -2.648], 0.3]}
      - {pt: [0, 0]}
      - {angle: [[-0.814, 2.364], [0, 0], [0.814, 2.364]], label: '38°', label_r: 58}
      - {angle: [[-0.814, 2.364], [0, 0], [-0.814, -2.364]], label: 'x'}
  answer: {value: 142, unit: '°'}
  verify: "180 - 38"
  solution: |
    الشفرة العليا اليمنى والمقبض السفلي الأيسر يقعان على مستقيم واحد، فالزاوية $x$ والزاوية $38^\circ$ متجاورتان على هذا المستقيم، أي متكاملتان:
    $x = 180^\circ - 38^\circ = 142^\circ$.
  remediation: |
    ارسم مستقيمين متقاطعين وسمِّ الزوايا الأربع: المتجاورتان مجموعهما $180^\circ$، والمتقابلتان بالرأس متساويتان. اختبر ذلك بالمنقلة على مقص حقيقي.
  misconceptions: [complementary-supplementary-confusion, adjacent-equals-vertical-confusion]
  qatar_link: 'الصف السابع، الفصل الثاني: الزاويتان المتقابلتان بالرأس والمتكاملتان'

- id: M8-G1-003
  topic: G1
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: low
