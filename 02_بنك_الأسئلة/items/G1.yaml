  verify: "(2 - 2 == 0) and (4 - (-3) != 0) and (4 - 4 == 0) and (-3 - 2 != 0) and ((4 - (-3)) * (4 - 4) + (2 - 2) * (-3 - 2) == 0)"
  rationale:
    A: 'للنقطتين $A$ و$B$ الإحداثي $y$ نفسه ($2$)، فالقطعة $AB$ أفقية لا رأسية.'
    C: 'للنقطتين $B$ و$C$ الإحداثي $x$ نفسه ($4$)، فالقطعة $BC$ رأسية لا أفقية.'
    D: 'إحدى القطعتين أفقية والأخرى رأسية، فهما متعامدتان لا متوازيتان.'
  solution: |
    للنقطتين $A$ و$B$ الإحداثي $y$ نفسه ($2$) فالقطعة $AB$ أفقية، وللنقطتين $B$ و$C$ الإحداثي $x$ نفسه ($4$) فالقطعة $BC$ رأسية.
    القطعة الأفقية تتعامد مع القطعة الرأسية، فالزاوية $\angle ABC$ قائمة. الإجابة B.
  remediation: |
    ارسم النقاط على ورق مربعات: القطعة التي تشترك نقطتاها في الإحداثي $y$ أفقية، والتي تشترك نقطتاها في الإحداثي $x$ رأسية، والمحوران متعامدان.
  misconceptions: [horizontal-vertical-swapped, parallel-perpendicular-confusion]
  qatar_link: 'الصف السادس: المستوى الإحداثي؛ الصف السابع: المستقيمات المتعامدة والمتوازية'

- id: M8-G1-018
  topic: G1
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: high
  format: mc
  context: real
  time: 110
  stem: |
    يبيّن الشكل جزءاً من هيكل سقف على شكل مثلث $ABC$، وفيه عارضة $DE$ موازية للقاعدة $BC$. قياس $\angle A$ يساوي $52^\circ$ وقياس $\angle B$ يساوي $61^\circ$.
    ما قياس الزاوية $x = \angle DEC$؟
  figure:
    type: geo
    alt: 'مثلث ABC فيه عارضة DE موازية للقاعدة BC؛ الزاوية A تساوي 52 درجة والزاوية B تساوي 61 درجة والمطلوب الزاوية DEC'
    unit: 44
    pad: 40
    bounds: [-0.7, -0.6, 3.7, 3.6]
    items:
      - {poly: [[0, 0], [3.0, 0], [1.699, 3.065]], width: 3}
      - {seg: [[0.942, 1.7], [2.278, 1.7]], width: 3}
      - {arrows: [[1.0, 0], [2.0, 0]], n: 1}
      - {arrows: [[1.2, 1.7], [2.0, 1.7]], n: 1}
      - {pt: [1.699, 3.065], label: 'A', pos: 'n'}
      - {pt: [0, 0], label: 'B', pos: 'sw'}
      - {pt: [3.0, 0], label: 'C', pos: 'se'}
      - {pt: [0.942, 1.7], label: 'D', pos: 'w'}
      - {pt: [2.278, 1.7], label: 'E', pos: 'e'}
      - {angle: [[0, 0], [1.699, 3.065], [3.0, 0]], label: '52°', label_r: 46}
      - {angle: [[3.0, 0], [0, 0], [1.699, 3.065]], label: '61°'}
      - {angle: [[0.942, 1.7], [2.278, 1.7], [3.0, 0]], label: 'x'}
  options: ['$61^\circ$', '$67^\circ$', '$113^\circ$', '$119^\circ$']
  option_values: [61, 67, 113, 119]
  key: C
  verify: "180 - (180 - 52 - 61)"
  rationale:
    A: 'ساوى $\angle DEC$ بالزاوية $B$؛ لكن $\angle B$ تناظر $\angle ADE$ وليس $\angle DEC$.'
    B: 'وجد $\angle AED = \angle C = 67^\circ$ ولم يكمل بإيجاد الزاوية المجاورة لها على المستقيم $AC$.'
    D: 'أكمل الخطوة الأخيرة بالزاوية $B$ بدل الزاوية $C$: $180^\circ - 61^\circ = 119^\circ$.'
  solution: |
    (1) في المثلث $ABC$: $\angle C = 180^\circ - 52^\circ - 61^\circ = 67^\circ$.
    (2) $DE \parallel BC$ والقاطع $AC$، فالزاويتان المتناظرتان $\angle AED$ و$\angle ACB$ متساويتان: $\angle AED = 67^\circ$.
    (3) النقاط $A$ و$E$ و$C$ على استقامة واحدة، فالزاويتان $\angle AED$ و$\angle DEC$ متكاملتان: $\angle DEC = 180^\circ - 67^\circ = 113^\circ$. الإجابة C.
  remediation: |
    حلّ الشكل على خطوات مكتوبة: زوايا المثلث، ثم الزوايا المتناظرة بين المتوازيين، ثم الزاويتان المتجاورتان على مستقيم. وضّح بسهم كل علاقة استعملتها.
  misconceptions: [wrong-corresponding-pair, incomplete-angle-chain]
  qatar_link: 'الصف الثامن 5-8 و5-9: الزوايا والقواطع وزوايا المثلث'

- id: M8-G1-019
  topic: G1
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: advanced
  format: mc
  context: qatar
  time: 120
  stem: |
    تتكوّن زخرفة مشربية من أربعة قضبان خشبية تشكّل متوازي أضلاع $ABCD$ كما في الشكل. قياس الزاوية $A$ يساوي $(3x + 5)^\circ$ وقياس الزاوية $B$ يساوي $(2x + 10)^\circ$.
    ما قياس الزاوية $C$؟
  figure:
    type: geo
    alt: 'متوازي أضلاع ABCD في زخرفة مشربية؛ الزاوية A تساوي (3x+5) درجة والزاوية B تساوي (2x+10) درجة والمطلوب الزاوية C'
    unit: 40
    pad: 36
    bounds: [-1.5, -0.9, 5.0, 3.0]
    items:
      - {seg: [[-0.8, 0], [4.8, 0]], width: 3}
      - {seg: [[-1.3, 2.135], [4.3, 2.135]], width: 3}
      - {seg: [[0.121, -0.485], [-0.653, 2.62]], width: 3}
      - {seg: [[4.121, -0.485], [3.347, 2.62]], width: 3}
      - {arrows: [[1.5, 0], [2.3, 0]], n: 1}
      - {arrows: [[1.0, 2.135], [1.8, 2.135]], n: 1}
      - {arrows: [[0, 0], [-0.532, 2.135]], n: 2}
      - {arrows: [[4, 0], [3.468, 2.135]], n: 2}
      - {pt: [0, 0], label: 'A', pos: 'sw'}
      - {pt: [4, 0], label: 'B', pos: 'se'}
      - {pt: [3.468, 2.135], label: 'C', pos: 'ne'}
      - {pt: [-0.532, 2.135], label: 'D', pos: 'nw'}
      - {angle: [[1.0, 0], [0, 0], [-0.242, 0.97]]}
      - {angle: [[3.0, 0], [4.0, 0], [3.758, 0.97]]}
      - {angle: [[2.468, 2.135], [3.468, 2.135], [3.71, 1.165]], label: '?', label_r: 34, size: 17}
      - {text: [0.923, 1.182], s: '(3x+5)°', size: 15, color: '#8A1538'}
      - {text: [2.85, 0.78], s: '(2x+10)°', size: 15, color: '#8A1538'}
  options: ['$20^\circ$', '$33^\circ$', '$76^\circ$', '$104^\circ$']
  option_values: [20, 33, 76, 104]
  key: D
  verify: "3 * solve(Eq((3*x + 5) + (2*x + 10), 180), x)[0] + 5"
  rationale:
    A: 'ساوى الزاويتين المتجاورتين $A$ و$B$ فوجد $x = 5$ ثم $3 \times 5 + 5 = 20$؛ لكنهما متكاملتان لا متساويتان.'
    B: 'وجد قيمة $x = 33$ فقط ولم يحسب قياس الزاوية المطلوبة.'
    C: 'حسب قياس الزاوية $B$ ($2 \times 33 + 10 = 76$) بدل الزاوية $C$.'
  solution: |
    $AD \parallel BC$ والقاطع $AB$، فالزاويتان $A$ و$B$ داخليتان في جهة واحدة، أي متكاملتان: $(3x + 5) + (2x + 10) = 180$ ومنها $x = 33$، فتكون $\angle B = 2 \times 33 + 10 = 76^\circ$.
    $AB \parallel DC$ والقاطع $BC$، فالزاويتان $B$ و$C$ داخليتان في جهة واحدة: $\angle C = 180^\circ - 76^\circ = 104^\circ$. الإجابة D.
  remediation: |
    في متوازي الأضلاع كل زاويتين متجاورتين مجموعهما $180^\circ$ (مستقيمان متوازيان وقاطع)، وكل زاويتين متقابلتين متساويتان. حدّد أي ضلعين متوازيين وأي ضلع قاطع في كل خطوة.
  misconceptions: [co-interior-must-be-equal, answer-x-not-angle, wrong-vertex-angle]
  qatar_link: 'الصف الثامن 5-8: الزوايا والمستقيمات والقواطع'

- id: M8-G1-020
  topic: G1
  cognitive: reasoning
  area: justify
  difficulty: medium
  benchmark: high
  format: select_explain
  context: qatar
  time: 120
  stem: |
    يقطع شارع مائل $t$ شارعين $p$ و$q$ في لوسيل كما في الشكل. قياسا الزاويتين الداخليتين المبيّنتين في جهة واحدة من الشارع $t$ هما $68^\circ$ و$112^\circ$.
    قالت نورة: «الشارعان $p$ و$q$ متوازيان». هل نورة على صواب؟ اختر الإجابة ثم برّر.
  figure:
    type: geo
    alt: 'شارع مائل t يقطع الشارعين p وq؛ الزاويتان الداخليتان في جهة واحدة 68 و112 درجة'
    unit: 40
    pad: 34
    bounds: [-2.4, -1.2, 3.5, 3.9]
    items:
      - {seg: [[-2.0, 0], [2.9, 0]], width: 3}
      - {seg: [[-2.0, 2.4], [2.9, 2.4]], width: 3}
      - {seg: [[0.375, -0.927], [-1.344, 3.327]], width: 3}
      - {angle: [[0.03, 2.4], [-0.97, 2.4], [-0.595, 1.473]]}
      - {angle: [[1.0, 0], [0, 0], [-0.375, 0.927]]}
      - {text: [-0.14, 1.84], s: '68°', size: 15, color: '#8A1538', weight: bold}
      - {text: [0.65, 0.91], s: '112°', size: 15, color: '#8A1538', weight: bold}
      - {text: [3.2, 2.4], s: 'p', size: 17, weight: bold}
      - {text: [3.2, 0], s: 'q', size: 17, weight: bold}
      - {text: [-1.6, 3.55], s: 't', size: 17, weight: bold}
  options: ['نعم، الشارعان متوازيان', 'لا، الشارعان غير متوازيين']
  key: A
  points: 1
  rubric:
    full: 'يختار «نعم» ويبرّر بأن الزاويتين الداخليتين في جهة واحدة من القاطع متكاملتان ($68^\circ + 112^\circ = 180^\circ$)، وهذا يعني أن المستقيمين متوازيان.'
    zero: 'يختار «لا»؛ أو يختار «نعم» بتبرير غير صحيح مثل «يبدوان متوازيين في الشكل» أو «لأن الزاويتين متساويتان».'
    examples:
      correct:
        - 'مجموع الزاويتين $68^\circ + 112^\circ = 180^\circ$ وهما داخليتان في جهة واحدة، إذن الشارعان متوازيان.'
        - 'الزاويتان متكاملتان فالمستقيمان متوازيان.'
      incorrect:
        - 'نعم، لأنهما يبدوان متوازيين في الرسم.'
        - 'لا، لأن الزاويتين غير متساويتين.'
  verify: "(68 + 112 == 180) and (68 != 112)"
  solution: |
    الزاويتان $68^\circ$ و$112^\circ$ داخليتان في جهة واحدة من القاطع $t$، ومجموعهما $68^\circ + 112^\circ = 180^\circ$ أي متكاملتان. وإذا كانت الزاويتان الداخليتان في جهة واحدة متكاملتين كان المستقيمان متوازيين. إذن نورة على صواب.
  remediation: |
    تذكّر عكس الخاصية: إذا كانت الزاويتان المتناظرتان أو المتبادلتان متساويتين، أو الداخليتان في جهة واحدة متكاملتين، فالمستقيمان متوازيان. لا تحكم بالنظر وحده، واكتب العلاقة التي استعملتها.
  misconceptions: [co-interior-must-be-equal, visual-judgment-parallel]
  qatar_link: 'الصف الثامن 5-8: إثبات توازي مستقيمين بقياسات الزوايا'

- id: M8-G1-021
  topic: G1
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: advanced
  format: cr_explain
  context: real
  time: 240
  stem: |
    يبيّن الشكل كرسياً قابلاً للطي؛ ساقاه $AD$ و$BC$ تتقاطعان عند النقطة $X$، والمقعد $AB$ موازٍ للأرض $CD$. قياس $\angle XAB$ يساوي $62^\circ$ وقياس $\angle AXB$ يساوي $50^\circ$.
    أوجد قياس الزاوية $x = \angle XCD$، واكتب العلاقة الهندسية التي استعملتها في كل خطوة.
  figure:
    type: geo
    alt: 'كرسي قابل للطي: المقعد AB أعلى والأرض CD أسفل والساقان AD وBC تتقاطعان عند X؛ الزاوية XAB تساوي 62 درجة والزاوية AXB تساوي 50 درجة'
