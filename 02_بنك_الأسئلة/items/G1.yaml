  time: 90
  stem: |
    المربع $ABCD$ قطره $AC$، حيث $A(-2, 1)$ و$C(4, 1)$.
    عيّن الرأسين $B$ و$D$.
  grid: {xmin: -4, xmax: 6, ymin: -3, ymax: 5}
  given:
    points:
      - {x: -2, y: 1, label: 'A', pos: 'nw'}
      - {x: 4, y: 1, label: 'C', pos: 'ne'}
