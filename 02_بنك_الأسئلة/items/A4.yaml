  stem: |
    ما التمثيل على خط الأعداد الذي يبيّن مجموعة حلول المتباينة $3 - 2x \geq 11$؟
  options:
    - text: '$x \geq -4$'
      figure: {type: number_line, min: -6, max: 6, step: 1, label_every: 1, rays: [{from: -4, dir: right, closed: true}], alt: 'دائرة مغلقة عند -4 وسهم نحو اليمين'}
