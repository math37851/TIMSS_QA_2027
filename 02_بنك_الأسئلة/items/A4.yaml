    - text: '$x \leq -4$'
      figure: {type: number_line, min: -6, max: 6, step: 1, label_every: 1, rays: [{from: -4, dir: left, closed: true}], alt: 'دائرة مغلقة عند -4 وسهم نحو اليسار'}
    - text: '$x \leq 4$'
      figure: {type: number_line, min: -6, max: 6, step: 1, label_every: 1, rays: [{from: 4, dir: left, closed: true}], alt: 'دائرة مغلقة عند 4 وسهم نحو اليسار'}
