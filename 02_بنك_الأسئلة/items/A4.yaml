- id: M8-A4-007
  topic: A4
  cognitive: applying
  area: implement
  difficulty: easy
  benchmark: intermediate
  format: dragdrop_order
  context: pure
  time: 75
  stem: |
    حلّ ياسر المعادلة $3(x - 2) + 4 = 19$ في أربع خطوات، لكن ترتيب الخطوات اختلط.
    رتّب الخطوات من الأولى إلى الأخيرة.
  cards:
    - {id: s3, text: 'نضيف $2$ إلى الطرفين فنحصل على $3x = 21$', value: 3}
    - {id: s1, text: 'نوزّع $3$ على الحدّين داخل القوسين فنحصل على $3x - 6 + 4 = 19$', value: 1}
    - {id: s4, text: 'نقسم الطرفين على $3$ فنحصل على $x = 7$', value: 4}
    - {id: s2, text: 'نجمع الحدّين الثابتين $-6$ و $4$ فنحصل على $3x - 2 = 19$', value: 2}
  key: [s1, s2, s3, s4]
  direction: asc
  order_labels: ['الخطوة الأولى', 'الخطوة الأخيرة']
  verify: "solve(Eq(3*(x - 2) + 4, 19), x)[0] == 7"
  solution: |
    الخطوة 1: نوزّع 3 على كل حد داخل القوسين: $3x - 6 + 4 = 19$.
    الخطوة 2: نجمع الحدّين الثابتين $-6$ و $4$: $3x - 2 = 19$.
    الخطوة 3: نضيف 2 إلى الطرفين: $3x = 21$.
    الخطوة 4: نقسم الطرفين على 3: $x = 7$.
    تحقق: $3(7 - 2) + 4 = 19$ ✓.
  remediation: |
    اطلب من الطلاب كتابة المعادلة بعد كل خطوة مع تسمية العملية المستعملة (توزيع، جمع حدود متشابهة، عملية عكسية). نبّههم إلى أن التوزيع وجمع الحدود المتشابهة يسبقان العمليات العكسية، وأن الحل ينتهي بعزل المتغير.
  misconceptions: [distribute-first-term-only, order-of-operations-ignored]
  hint: "أي خطوة تُزيل الأقواس أولاً؟"
  qatar_link: "الصف الثامن — الوحدة 2: الدرس 2-3 (حل معادلات متعددة الخطوات باستعمال خاصية التوزيع)"

- id: M8-A4-008
  topic: A4
  cognitive: applying
  area: formulate
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: qatar
  time: 75
  stem: |
    في متحف قطر الوطني اشترت عائلة 5 تذاكر: $a$ تذكرة للكبار بسعر 20 ريالاً للتذكرة، و $c$ تذكرة للأطفال بسعر 10 ريالات للتذكرة، ودفعت 80 ريالاً في المجموع (بيانات افتراضية).
    أي نظام معادلات يمثّل هذا الموقف؟
  options:
    - '$a + c = 80$ و $20a + 10c = 5$'
    - '$a + c = 5$ و $20a + 10c = 80$'
    - '$a + c = 5$ و $10a + 20c = 80$'
    - '$a - c = 5$ و $20a + 10c = 80$'
  key: B
  verify: "solve([Eq(x + y, 5), Eq(20*x + 10*y, 80)], [x, y]) == {x: 3, y: 2}"
  rationale:
    A: 'بدّل بين عدد التذاكر والمبلغ المدفوع، فجعل مجموع التذاكر 80 والمبلغ 5.'
    C: 'بدّل سعري التذكرتين، فضرب عدد تذاكر الكبار في 10 وتذاكر الأطفال في 20.'
    D: 'فهم أن العدد 5 هو الفرق بين عدد تذاكر الكبار والأطفال لا مجموعهما.'
  solution: |
    مجموع عدد التذاكر 5، إذن $a + c = 5$.
    ثمن تذاكر الكبار $20a$ وثمن تذاكر الأطفال $10c$، ومجموعهما 80 ريالاً، إذن $20a + 10c = 80$.
    النظام الصحيح هو الخيار B. يمكن التحقق: $a = 3$ و $c = 2$ تحققان المعادلتين: $3 + 2 = 5$ و $60 + 20 = 80$.
  remediation: |
    درّب الطلاب على تحديد المجهولين أولاً ثم كتابة معادلة لكل كمية معطاة: معادلة للعدد الكلي ومعادلة للمبلغ الكلي (السعر × العدد). اطلب التحقق بتجربة قيم مثل $3$ و $2$ في كل خيار.
  misconceptions: [count-total-confusion, price-count-swapped, operation-confusion]
  hint: "اكتب معادلة للعدد الكلي للتذاكر ومعادلة للمبلغ الكلي."
  qatar_link: "الصف الثامن — الوحدة 4: الدرسان 4-3 و 4-4 (كتابة نظام المعادلات من موقف حياتي)"

- id: M8-A4-009
  topic: A4
  cognitive: applying
  area: represent
  difficulty: easy
  benchmark: intermediate
  format: grid_plot
  context: real
  time: 75
  stem: |
    يُملأ الخزان A بالماء ويُفرَّغ الخزان B في الوقت نفسه. يمثّل المستقيمان المرسومان مستوى الماء $y$ بالأمتار في كل خزان بعد $x$ ساعة، ومعادلتاهما:
    $y = x + 2$ للخزان A، و $y = -2x + 8$ للخزان B.
    عيّن على الشبكة النقطة التي تمثّل حل النظام، أي اللحظة التي يتساوى عندها مستوى الماء في الخزانين.
  grid: {xmin: 0, xmax: 6, ymin: 0, ymax: 8}
  given: {segments: [{points: [[0, 2], [6, 8]]}, {points: [[0, 8], [4, 0]]}]}
  mode: points
  count: 1
  key: [[2, 4]]
  verify: "P == [(2, 4)] and [solve([Eq(y, x + 2), Eq(y, -2*x + 8)], [x, y])[s] for s in (x, y)] == [2, 4]"
  solution: |
    حل النظام بيانياً هو نقطة تقاطع المستقيمين، وهي النقطة التي تقع على المستقيمين معاً.
    من الرسم يتقاطع المستقيمان عند $(2, 4)$.
    تحقق في المعادلتين: $2 + 2 = 4$ ✓ و $-2 \times 2 + 8 = 4$ ✓.
    إذن يتساوى مستوى الماء في الخزانين بعد ساعتين، ويبلغ $4\,\text{m}$ في كل منهما.
  remediation: |
    ذكّر الطلاب بأن حل النظام زوج مرتب $(x, y)$ يحقق المعادلتين، وأنه يُقرأ من نقطة تقاطع المستقيمين. اطلب التحقق بالتعويض في المعادلتين، ونبّههم إلى قراءة الإحداثي $x$ أولاً ثم $y$.
  misconceptions: [x-y-coordinates-swapped, read-single-coordinate-as-solution]
  hint: "ابحث عن النقطة التي يلتقي عندها المستقيمان."
  qatar_link: "الصف الثامن — الوحدة 4: الدرس 4-2 (حل نظام من معادلتين بيانياً)"

- id: M8-A4-010
  topic: A4
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: high
  format: multi_numeric
  context: qatar
  time: 110
  stem: |
    شاركت مدرستان في دوري كرة القدم المدرسية في أسباير، وكان مجموع لاعبيهما 36 لاعباً (بيانات افتراضية). أرسلت المدرسة الثانية 3 لاعبين أكثر من ضعف ما أرسلته المدرسة الأولى.
    إذا كان $x$ عدد لاعبي المدرسة الأولى و $y$ عدد لاعبي المدرسة الثانية، فإن:
    $\begin{cases} x + y = 36 \\ y = 2x + 3 \end{cases}$
    حلّ النظام بالتعويض، ثم أدخل قيمة كل متغير.
  fields:
    - {label: 'عدد لاعبي المدرسة الأولى $x$', value: 11}
    - {label: 'عدد لاعبي المدرسة الثانية $y$', value: 25}
  scoring: {mode: all}
  verify: "[solve([Eq(x + y, 36), Eq(y, 2*x + 3)], [x, y])[s] for s in (x, y)]"
  solution: |
    نعوّض $y = 2x + 3$ في المعادلة الأولى: $x + (2x + 3) = 36$.
    نجمع الحدود المتشابهة: $3x + 3 = 36$ ثم $3x = 33$ إذن $x = 11$.
    نعوّض في $y = 2x + 3$: $y = 2 \times 11 + 3 = 25$.
    تحقق: $11 + 25 = 36$ ✓. إذن للمدرسة الأولى 11 لاعباً وللمدرسة الثانية 25 لاعباً.
  remediation: |
    درّب الطلاب على اختيار المعادلة المحلولة لأحد المتغيرين (هنا $y = 2x + 3$) وتعويضها بين قوسين في المعادلة الأخرى للحصول على معادلة بمتغير واحد. ذكّرهم بإيجاد المتغير الثاني بعد حساب الأول، وبالتحقق في المعادلتين معاً.
  misconceptions: [stop-after-first-variable, check-one-equation-only]
  hint: "عوّض $y = 2x + 3$ مكان $y$ في المعادلة الأولى."
  qatar_link: "الصف الثامن — الوحدة 4: الدرس 4-3 (حل نظام من معادلتين بالتعويض)"

- id: M8-A4-011
  topic: A4
  cognitive: applying
  area: implement
  difficulty: hard
  benchmark: advanced
  format: multi_numeric
  context: real
  time: 150
  stem: |
    اشترى سعيد 3 أقلام و 4 دفاتر بمبلغ 23 ريالاً، واشترى فهد 5 أقلام و 3 دفاتر من المتجر نفسه بمبلغ 31 ريالاً.
    إذا كان $x$ سعر القلم الواحد و $y$ سعر الدفتر الواحد بالريال، فإن:
    $\begin{cases} 3x + 4y = 23 \\ 5x + 3y = 31 \end{cases}$
    حلّ النظام بالحذف، ثم أدخل سعر القلم وسعر الدفتر.
  fields:
    - {label: 'سعر القلم $x$ (بالريال)', value: 5}
    - {label: 'سعر الدفتر $y$ (بالريال)', value: 2}
  scoring: {mode: all}
  verify: "[solve([Eq(3*x + 4*y, 23), Eq(5*x + 3*y, 31)], [x, y])[s] for s in (x, y)]"
  solution: |
    للتخلص من $y$ نضرب المعادلة الأولى في 3 والثانية في 4 (الضرب يشمل كل حدود المعادلة):
    $9x + 12y = 69$ و $20x + 12y = 124$.
    نطرح المعادلة الأولى من الثانية: $11x = 55$ إذن $x = 5$.
    نعوّض في $3x + 4y = 23$: $15 + 4y = 23$ ثم $4y = 8$ إذن $y = 2$.
    تحقق في المعادلة الثانية: $5 \times 5 + 3 \times 2 = 31$ ✓. إذن سعر القلم 5 ريالات وسعر الدفتر ريالان.
  remediation: |
    للتخلص من أحد المتغيرين اجعل معاملَيه متساويين بضرب كل معادلة في عدد مناسب، على أن يشمل الضرب جميع حدود المعادلة بما فيها الطرف الثابت. اطرح المعادلتين إذا تساوت إشارتا المعاملين، واجمعهما إذا اختلفتا، ثم تحقق من الحل في المعادلتين.
  misconceptions: [distribute-first-term-only, sign-error-elimination]
  hint: "اضرب المعادلة الأولى في 3 والثانية في 4 لتتساوى معاملات $y$."
  qatar_link: "الصف الثامن — الوحدة 4: الدرس 4-4 (حل نظام من معادلتين بالحذف)"

- id: M8-A4-012
  topic: A4
  cognitive: reasoning
  area: analyze
  difficulty: medium
  benchmark: high
  format: mc
  context: pure
  time: 100
  stem: |
    أي الأنظمة الآتية له حل واحد فقط؟
  options:
    - '$y = 2x + 1$ و $y = 2x - 3$'
    - '$y = 2x + 1$ و $2y = 4x + 2$'
    - '$y = 2x + 1$ و $-4x + 2y = 6$'
    - '$y = 2x + 1$ و $y = 3x + 1$'
  key: D
  verify: "[a1 * b2 - a2 * b1 != 0 for (a1, b1, a2, b2) in [(2, -1, 2, -1), (2, -1, 4, -2), (2, -1, -4, 2), (2, -1, 3, -1)]] == [False, False, False, True]"
  rationale:
    A: 'ظنّ أن اختلاف المقطعين $1$ و $-3$ يكفي لتقاطع المستقيمين، متجاهلاً أن الميلين متساويان (2 و 2) فهما متوازيان ولا حل.'
    B: 'لم يبسّط المعادلة الثانية؛ فهي تكافئ $y = 2x + 1$ أي أن المستقيمين منطبقان وللنظام عدد لا نهائي من الحلول.'
    C: 'لم يكتب المعادلة الثانية بالصيغة $y = mx + b$؛ فهي تكافئ $y = 2x + 3$ أي أن المستقيمين متوازيان ولا حل.'
  solution: |
    نكتب كل معادلة بالصيغة $y = mx + b$ ثم نقارن الميل والمقطع $y$ في كل نظام:
    A: الميلان 2 و 2 والمقطعان $1$ و $-3$ مختلفان، فالمستقيمان متوازيان ولا حل.
    B: $2y = 4x + 2$ تكافئ $y = 2x + 1$، فالمستقيمان منطبقان وعدد الحلول لا نهائي.
    C: $-4x + 2y = 6$ تكافئ $y = 2x + 3$، فالمستقيمان متوازيان ولا حل.
    D: الميلان 2 و 3 مختلفان، فيتقاطع المستقيمان في نقطة واحدة هي $(0, 1)$.
    إذن النظام الوحيد الذي له حل واحد هو D.
  remediation: |
    درّب الطلاب على كتابة كل معادلة بالصيغة $y = mx + b$ ومقارنة الميلين: ميلان مختلفان يعنيان حلاً واحداً؛ ميلان متساويان ومقطعان $y$ مختلفان يعنيان عدم وجود حل؛ ميلان ومقطعان $y$ متساويان يعنيان عدداً لا نهائياً من الحلول.
  misconceptions: [parallel-lines-intersect, slope-intercept-confusion]
  hint: "اكتب كل معادلة بالصيغة $y = mx + b$ ثم قارن الميلين."
  qatar_link: "الصف الثامن — الوحدة 4: الدرس 4-1 (عدد حلول نظام من معادلتين خطيتين)"

- id: M8-A4-013
  topic: A4
  cognitive: reasoning
  area: justify
  difficulty: medium
  benchmark: high
  format: select_explain
  context: real
  time: 120
  stem: |
    لدى علي 50 ريالاً مدّخرة، ويضيف إليها 10 ريالات كل أسبوع. ولدى بدر 80 ريالاً مدّخرة، ويضيف إليها 10 ريالات كل أسبوع.
    بعد $w$ أسبوعاً يكون مع علي $50 + 10w$ ريالاً، ومع بدر $80 + 10w$ ريالاً.
    يقول علي: «بعد عدد من الأسابيع سيصبح مبلغي مساوياً لمبلغ بدر».
    هل علي على صواب؟ اختر الإجابة ثم فسّر إجابتك.
  options: ['نعم، سيتساوى المبلغان بعد عدد من الأسابيع', 'لا، لن يتساوى المبلغان أبداً']
  key: B
  points: 1
  rubric:
    full: 'يختار «لا» ويبرر ذلك بأحد التبريرين: كلاهما يزيد 10 ريالات كل أسبوع فيبقى الفرق بينهما 30 ريالاً ثابتاً؛ أو المعادلة $50 + 10w = 80 + 10w$ تؤول إلى $50 = 80$ وهي عبارة خاطئة فلا حل لها.'
    zero: 'يختار «نعم» أياً كان التبرير، أو يختار «لا» دون تبرير رياضي مقبول (مثل: «لأن بدر لديه مبلغ أكبر» فقط).'
    examples:
      correct: ['الفرق بينهما 30 ريالاً دائماً لأن كلاً منهما يضيف 10 ريالات كل أسبوع.', 'عند طرح $10w$ من الطرفين أحصل على $50 = 80$ وهذا مستحيل، فلا حل.']
      incorrect: ['لا، لأن بدر لديه مبلغ أكبر.', 'نعم، بعد 3 أسابيع.']
  verify: "solve(Eq(50 + 10*x, 80 + 10*x), x) == []"
  solution: |
    يتساوى المبلغان عندما $50 + 10w = 80 + 10w$.
    نطرح $10w$ من الطرفين فنحصل على $50 = 80$، وهي عبارة خاطئة دائماً، فلا توجد قيمة لـ $w$ تحقق المعادلة.
    فكرة أخرى: كلاهما يزيد 10 ريالات كل أسبوع، فيبقى الفرق بين المبلغين 30 ريالاً ثابتاً ولا يتلاشى.
    إذن علي غير مصيب، ولن يتساوى المبلغان أبداً.
  remediation: |
    وضّح أن المعادلة التي تؤول إلى عبارة خاطئة مثل $50 = 80$ لا حل لها، وأن المعادلة التي تؤول إلى عبارة صحيحة دائماً مثل $5 = 5$ لها عدد لا نهائي من الحلول. اربط ذلك بالمستقيمين المتوازيين (لا يتقاطعان) والمنطبقين (يشتركان في كل النقاط).
  misconceptions: [assume-solution-exists, no-solution-misread-as-zero]
  hint: "ماذا يحدث للفرق بين المبلغين كل أسبوع؟"
  qatar_link: "الصف الثامن — الوحدة 2: الدرس 2-4 (معادلات لا حل لها أو لها عدد لا نهائي من الحلول)"

- id: M8-A4-014
  topic: A4
  cognitive: reasoning
  area: analyze
  difficulty: hard
  benchmark: advanced
  format: select_explain
  context: qatar
  time: 150
  stem: |
    في رحلة مدرسية إلى متحف قطر الوطني، تدفع كل طالبة $x$ ريالاً ثمن التذكرة، ويُضاف 6 ريالات رسماً للنقل عن كل طالبة. دفعت 3 طالبات معاً 60 ريالاً (بيانات افتراضية). كتبت ريم المعادلة $3(x + 6) = 60$ وحلّتها كما يأتي:
    الخطوة 1: $3(x + 6) = 60$
    الخطوة 2: $3x + 6 = 60$
    الخطوة 3: $3x = 54$
    الخطوة 4: $x = 18$
    هل حلّ ريم صحيح؟ اختر الإجابة ثم فسّر إجابتك.
  options: ['نعم، حلّ ريم صحيح', 'لا، حلّ ريم غير صحيح']
  key: B
  points: 1
  rubric:
    full: 'يختار «لا» ويحدّد الخطأ: ضربت ريم 3 في $x$ فقط ولم تضربها في 6 عند التوزيع (الصحيح $3x + 18 = 60$ ثم $x = 14$)؛ أو يثبت أن الحل خاطئ بالتعويض: $3(18 + 6) = 72 \neq 60$.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تحديد الخطأ أو التحقق بالتعويض (مثل: «الحل غير صحيح» فقط).'
    examples:
      correct: ['الخطأ في الخطوة 2؛ يجب أن يصبح $3(x + 6)$ مساوياً $3x + 18$ لا $3x + 6$.', 'أعوّض $x = 18$ فأجد $3 \times 24 = 72$ وليس 60.']
      incorrect: ['نعم، لأن الخطوات مرتبة وصحيحة.', 'لا، لأن العدد 18 كبير.']
  verify: "solve(Eq(3*(x + 6), 60), x)[0] == 14 and 3*(18 + 6) != 60"
  solution: |
    أخطأت ريم في الخطوة 2: ضربت 3 في $x$ فقط ولم تضربها في 6، والصحيح $3(x + 6) = 3x + 18$.
    الحل الصحيح: $3x + 18 = 60$ ثم $3x = 42$ إذن $x = 14$.
    تحقق: $3(14 + 6) = 60$ ✓، بينما $3(18 + 6) = 72 \neq 60$.
    إذن حلّ ريم غير صحيح، وثمن التذكرة الصحيح 14 ريالاً.
  remediation: |
    ذكّر الطلاب بخاصية التوزيع: العدد خارج القوسين يُضرب في كل حد داخلهما. استعمل نموذج المساحة (مستطيل مقسوم إلى جزأين) أو التحقق بالتعويض في المعادلة الأصلية لاكتشاف الخطأ.
  misconceptions: [distribute-first-term-only]
  hint: "عوّض $x = 18$ في المعادلة الأصلية."
  qatar_link: "الصف الثامن — الوحدة 2: الدرس 2-3 (حل معادلات متعددة الخطوات باستعمال خاصية التوزيع)"

- id: M8-A4-015
  topic: A4
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: advanced
  format: cr_explain
  context: qatar
  time: 200
  stem: |
    يعرض مترو الدوحة على الطالب الذي يسافر يومياً خيارين لدفع الأجرة الأسبوعية (بيانات افتراضية):
    الخيار 1: دفع 3 ريالات عن كل رحلة.
    الخيار 2: شراء بطاقة أسبوعية بسعر 12 ريالاً، ثم دفع ريالاً واحداً عن كل رحلة.
    تقول مريم: «إذا سافرتُ 6 رحلات في الأسبوع فإن الخيار 2 أرخص».
    هل مريم على صواب؟ فسّر إجابتك بالرياضيات، ثم اكتب أقل عدد من الرحلات الأسبوعية يكون عنده الخيار 2 أرخص من الخيار 1.
  points: 2
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يحدّد أن مريم غير مصيبة مع تبرير صحيح (تساوي الأجرتين 18 ريالاً عند 6 رحلات، أو حل المتباينة $12 + t < 3t$ الذي يعطي $t > 6$)، ويكتب 7 رحلات أقل عدد.'}
      - {code: 10, points: 1, desc: 'إجابة جزئية: يحدّد أن مريم غير مصيبة مع تبرير صحيح لكنه لا يذكر العدد 7 أو يذكر عدداً آخر؛ أو يكتب 7 رحلات (أو $t > 6$) دون تبرير كافٍ لحكمه على قول مريم.'}
      - {code: 70, points: 0, desc: 'إجابة خاطئة أو غير كافية (مثل: «مريم على صواب»، أو حسابات لا تقود إلى استنتاج).'}
    examples:
      correct: ['مريم غير مصيبة؛ عند 6 رحلات يكلّف الخيار 1 مبلغ 18 ريالاً والخيار 2 مبلغ 18 ريالاً فهما متساويان. وعند 7 رحلات يكلّف الخيار 1 مبلغ 21 ريالاً والخيار 2 مبلغ 19 ريالاً، فأقل عدد هو 7.']
      incorrect: ['مريم على صواب لأن الخيار 2 يكلّف ريالاً واحداً فقط عن كل رحلة.', 'الخيار 2 أرخص عندما $t > 6$ أي 6 رحلات.']
  model_answer: 'مريم غير مصيبة. عند 6 رحلات يكلّف الخيار 1 مبلغ $3 \times 6 = 18$ ريالاً ويكلّف الخيار 2 مبلغ $12 + 6 = 18$ ريالاً، فالأجرتان متساويتان وليس الخيار 2 أرخص. يكون الخيار 2 أرخص عندما $12 + t < 3t$ أي $t > 6$، فأقل عدد من الرحلات هو 7 (يكلّف الخيار 1 مبلغ 21 ريالاً ويكلّف الخيار 2 مبلغ 19 ريالاً).'
  verify: "all((12 + t < 3 * t) == (t >= 7) for t in range(0, 30)) and 12 + 6 == 3 * 6"
  solution: |
    نفرض أن عدد الرحلات في الأسبوع $t$. تكلفة الخيار 1 هي $3t$ وتكلفة الخيار 2 هي $12 + t$.
    عند $t = 6$: الخيار 1 يكلّف $3 \times 6 = 18$ ريالاً والخيار 2 يكلّف $12 + 6 = 18$ ريالاً. الأجرتان متساويتان، فمريم غير مصيبة.
    يكون الخيار 2 أرخص عندما $12 + t < 3t$. نطرح $t$ من الطرفين: $12 < 2t$ ثم نقسم على 2: $6 < t$.
    إذن يجب أن يزيد عدد الرحلات على 6، وأقل عدد صحيح هو 7 رحلات (21 ريالاً مقابل 19 ريالاً).
  remediation: |
    درّب الطلاب على كتابة تكلفة كل خيار بدلالة عدد الرحلات، ثم كتابة متباينة (أقل من) بدل المعادلة وتفسير حلها في السياق. نبّههم إلى أنه عند نقطة التساوي لا يكون أي خيار أرخص من الآخر، وإلى أن عدد الرحلات عدد صحيح. اطلب اختبار قيمتين على جانبي نقطة التساوي.
  misconceptions: [equality-point-vs-inequality, strict-vs-inclusive-inequality, compare-fixed-fee-only]
  hint: "قارن تكلفة الخيارين عند 6 رحلات بالضبط."
  qatar_link: "الصف السابع — حل المتباينات الخطية ومسائلها اللفظية؛ والصف الثامن — الوحدة 2 (المعادلات الخطية وتطبيقاتها)"

- id: M8-A4-016
  topic: A4
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: advanced
  format: numeric
  context: pure
  time: 130
  stem: |
    للنظام الآتي عدد لا نهائي من الحلول:
    $\begin{cases} 4x - 6y = 10 \\ -6x + ky = -15 \end{cases}$
    ما قيمة $k$؟
  answer: {value: 9}
  verify: "Rational(-6, 4) * (-6) if Rational(-6, 4) * 10 == -15 else None"
  solution: |
    يكون للنظام عدد لا نهائي من الحلول عندما تمثّل المعادلتان المستقيم نفسه، أي عندما تكون إحداهما مضاعفاً للأخرى.
    نجد العدد الذي نضرب فيه المعادلة الأولى: من $4x$ إلى $-6x$ نضرب في $-\frac{3}{2}$.
    نتحقق من الطرف الثابت: $10 \times \left(-\frac{3}{2}\right) = -15$ ✓ فالعدد صحيح.
    نضرب معامل $y$ في المعادلة الأولى بالعدد نفسه: $k = -6 \times \left(-\frac{3}{2}\right) = 9$.
    طريقة أخرى: تتساوى النسب $\frac{4}{-6} = \frac{-6}{k} = \frac{10}{-15}$ فنجد $k = 9$.
  remediation: |
    وضّح أن عدد الحلول اللانهائي يعني أن المعادلتين تمثلان المستقيم نفسه، فمعاملات إحداهما وطرفها الثابت مضاعفات معاملات الأخرى وطرفها الثابت بالعدد نفسه. درّب الطلاب على إيجاد عامل الضرب من معاملي $x$ ثم التحقق منه على الطرف الثابت قبل إيجاد المجهول.
  misconceptions: [ignore-negative-sign, proportional-equations-not-recognized]
  hint: "ما العدد الذي نضرب فيه المعادلة الأولى لنحصل على الثانية؟"
  qatar_link: "الصف الثامن — الوحدة 4: الدرسان 4-1 (عدد الحلول) و 4-4 (الحذف)"
