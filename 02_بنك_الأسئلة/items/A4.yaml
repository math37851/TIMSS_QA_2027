- id: M8-A4-002
  topic: A4
  cognitive: knowing
  area: compute
  difficulty: foundation
  benchmark: low
  format: mc
  context: real
  time: 45
  stem: |
    اشترت لمى 3 دفاتر متماثلة وعلبة أقلام سعرها 9 ريالات، فدفعت 27 ريالاً في المجموع.
    إذا كان سعر الدفتر الواحد $x$ ريالاً فإن $3x + 9 = 27$.
    ما سعر الدفتر الواحد بالريال؟
  options: ['$0$', '$6$', '$12$', '$18$']
  option_values: [0, 6, 12, 18]
  key: B
  verify: "Rational(27 - 9, 3)"
  rationale:
    A: 'قسم 27 على 3 دون أن يقسم 9 على 3، فحصل على $x + 9 = 9$ ثم $x = 0$.'
    C: 'جمع 9 إلى 27 بدلاً من طرحها ثم قسم على 3: $36 \div 3 = 12$.'
    D: 'طرح 9 من 27 فحصل على $3x = 18$ ثم توقف دون القسمة على 3.'
  solution: |
    نطرح 9 من طرفي المعادلة: $3x = 18$.
    نقسم الطرفين على 3: $x = 6$.
    تحقق: $3 \times 6 + 9 = 27$ ✓. إذن سعر الدفتر الواحد 6 ريالات.
  remediation: |
    شبّه المعادلة بميزان متوازن: ما نفعله بأحد الطرفين نفعله بالآخر. ابدأ بالعملية العكسية للحد الثابت (الطرح) ثم المعامل (القسمة)، واطلب من الطلاب التحقق دائماً بالتعويض في المعادلة الأصلية.
  misconceptions: [distribute-first-term-only, operation-confusion, stop-before-isolating-variable]
  hint: "ابدأ بطرح 9 من الطرفين."
  qatar_link: "الصف الثامن — الوحدة 2: تمهيد للدروس 2-2 إلى 2-4 (حل المعادلة ذات الخطوتين)؛ والصف السابع — المقادير والمعادلات"

- id: M8-A4-003
  topic: A4
  cognitive: knowing
  area: compute
  difficulty: foundation
  benchmark: low
  format: mc
  context: real
  time: 60
  stem: |
    ارتفاع نبتة الريحان الآن $12\,\text{cm}$ وتنمو $3\,\text{cm}$ كل أسبوع، وارتفاع نبتة النعناع الآن $6\,\text{cm}$ وتنمو $5\,\text{cm}$ كل أسبوع.
    يتساوى ارتفاعا النبتتين بعد $w$ أسبوعاً، حيث $12 + 3w = 6 + 5w$.
    أي قيمة لـ $w$ تحقق هذه المعادلة؟
  options: ['$18$', '$9$', '$6$', '$3$']
  option_values: [18, 9, 6, 3]
  key: D
  verify: "solve(Eq(12 + 3*x, 6 + 5*x), x)[0]"
  rationale:
    A: 'جمع 12 و 6 بدلاً من طرحهما فحصل على $18 = 2w$، ثم نسي القسمة على 2.'
    B: 'جمع 12 و 6 بدلاً من طرحهما فحصل على $18 = 2w$ ثم $w = 9$.'
    C: 'طرح الثوابت فحصل على $6 = 2w$ ثم توقف دون القسمة على 2.'
  solution: |
    نطرح $3w$ من الطرفين: $12 = 6 + 2w$.
    نطرح 6 من الطرفين: $6 = 2w$.
    نقسم على 2: $w = 3$.
    تحقق: $12 + 3 \times 3 = 21$ و $6 + 5 \times 3 = 21$ ✓. إذن يتساوى الارتفاعان بعد 3 أسابيع.
  remediation: |
    درّب الطلاب على التحقق بالتعويض: يعوّضون القيمة في الطرفين ويقارنون الناتجين. ثم انتقل إلى جمع المتغيرات في طرف واحد والثوابت في الطرف الآخر مع تغيير الإشارة عند النقل، وإنهاء الحل بالقسمة على معامل المتغير.
  misconceptions: [operation-confusion, stop-before-isolating-variable]
  hint: "عوّض كل قيمة في الطرفين وقارن الناتجين."
  qatar_link: "الصف الثامن — الوحدة 2: الدرس 2-2 (المعادلات ذات المتغيرات في الطرفين والتحقق من الحل)"

- id: M8-A4-004
  topic: A4
  cognitive: knowing
  area: compute
  difficulty: easy
  benchmark: intermediate
  format: numeric
  context: qatar
  time: 75
  stem: |
    تحسب شركتان لسيارات الأجرة في الدوحة الأجرة كما يأتي (بيانات افتراضية):
    الشركة الأولى: 3 ريالات رسماً ابتدائياً و 1.5 ريال عن كل كيلومتر.
    الشركة الثانية: 5 ريالات رسماً ابتدائياً وريالاً واحداً عن كل كيلومتر.
    تتساوى الأجرتان عند مسافة $x$ كيلومتراً، حيث $3 + 1.5x = 5 + x$.
    أوجد قيمة $x$.
  answer: {value: 4, unit: "كم", tol: 0.01}
  verify: "Rational(5 - 3) / (num('1.5') - 1)"
  solution: |
    نطرح $x$ من الطرفين: $3 + 0.5x = 5$.
    نطرح 3 من الطرفين: $0.5x = 2$.
    نقسم الطرفين على $0.5$: $x = 4$.
    تحقق: $3 + 1.5 \times 4 = 9$ و $5 + 4 = 9$ ✓. إذن تتساوى الأجرتان عند مسافة 4 كيلومترات.
  remediation: |
    إذا تعثر الطلاب في الأعداد العشرية فاضرب طرفي المعادلة في 10 لتصبح $30 + 15x = 50 + 10x$ ثم حلّها بالخطوات المعتادة. ذكّرهم بأن $1.5x - x = 0.5x$ وليس $1.5$، وبالتحقق بالتعويض في الطرفين.
  misconceptions: [like-terms-coefficient-error, operation-confusion]
  hint: "اجمع الحدود التي فيها $x$ في طرف واحد."
  qatar_link: "الصف الثامن — الوحدة 2: الدرس 2-2 (متغيرات في الطرفين) مع أعداد عشرية؛ والصف السابع — المعادلات"

- id: M8-A4-005
  topic: A4
