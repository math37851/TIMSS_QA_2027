  stem: |
    في تعرفة سيارات الأجرة بالدوحة (بيانات افتراضية) تُحسب تكلفة الرحلة $C$ بالريال من الصيغة:
    $C = 8 + 1.5k$
    حيث $k$ طول الرحلة بالكيلومترات.
    ما تكلفة رحلة طولها $16\,\text{km}$ من مطار حمد الدولي؟
  answer: {value: 32, unit: "ريالاً"}
  verify: "8 + Rational(3, 2) * 16"
  solution: |
    نعوّض $k = 16$ في الصيغة:
    $C = 8 + 1.5 \times 16 = 8 + 24 = 32$
    إذن تكلفة الرحلة $32$ ريالاً.
  remediation: 'الرسم الثابت $8$ يُضاف مرة واحدة، أما $1.5$ فتُضرب في عدد الكيلومترات. احسب الضرب قبل الجمع. تمرّن على $C = 5 + 2k$ عندما $k = 12$.'
  misconceptions: [fixed-charge-omitted, order-of-operations-ignored, operation-confusion]
  qatar_link: 'الصف الثامن — الوحدة 2: الدرس 2-9 (المعادلة الخطية: مقدار ثابت + معدل)؛ الصف السابع — الفصل الثاني: المقادير الجبرية'

