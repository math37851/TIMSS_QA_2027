- id: M8-A1-001
  topic: A1
  cognitive: knowing
  area: compute
  difficulty: foundation
  benchmark: low
  format: mc
  context: real
  time: 40
  stem: |
    يشتري سعد $x$ قلماً و$y$ دفتراً، وتُحسب تكلفة مشترياته بالريال من المقدار $2x + 3y$.
    ما التكلفة بالريال عندما $x = 4$ و$y = 5$؟
  options: ['$14$', '$16$', '$23$', '$59$']
  option_values: [14, 16, 23, 59]
  key: C
  verify: "2 * 4 + 3 * 5"
  rationale:
    A: 'جمع الأعداد كلها $2 + 4 + 3 + 5 = 14$ دون ضرب المعامل في قيمة المتغير.'
    B: 'ضرب $2$ في $4$ فقط ثم جمع $3$ و$5$: $8 + 3 + 5 = 16$.'
    D: 'عدّ $2x$ العدد $24$ و$3y$ العدد $35$ (كتابة رقمين متجاورين) ثم جمعهما: $24 + 35 = 59$.'
  solution: |
    نعوّض $x = 4$ و$y = 5$ في المقدار $2x + 3y$:
    $2x + 3y = 2 \times 4 + 3 \times 5 = 8 + 15 = 23$
    إذن التكلفة $23$ ريالاً.
  remediation: 'تذكّر أن $2x$ تعني $2 \times x$. ضع قيمة كل متغير مكانه واحسب الضرب قبل الجمع. تمرّن على $3a + 2b$ عندما $a = 2$ و$b = 6$.'
  misconceptions: [operation-confusion, juxtaposition-as-concatenation]
  qatar_link: 'الصف السابع — الفصل الثاني: المقادير الجبرية (التعويض بقيم المتغيرات)'

