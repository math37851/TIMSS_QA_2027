- id: M8-A1-008
  topic: A1
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: intermediate
  format: mc
  context: real
  time: 75
  stem: |
    قطعة أرض في حديقة عامة على شكل شبه منحرف، وتُحسب مساحتها $A$ من الصيغة:
    $A = \frac{1}{2}(a + b)h$
    حيث $a$ و$b$ طولا القاعدتين و$h$ الارتفاع.
    إذا كان $a = 14\,\text{m}$ و$b = 10\,\text{m}$ و$h = 8\,\text{m}$، فما مساحة القطعة بالمتر المربع؟
  options: ['$47$', '$54$', '$87$', '$96$']
  option_values: [47, 54, 87, 96]
  key: D
  verify: "Rational(1, 2) * (14 + 10) * 8"
  rationale:
    A: 'حسب الضرب $b \times h$ قبل الجمع داخل القوس: $\frac{1}{2}(14 + 10 \times 8) = 47$.'
    B: 'طبّق $\frac{1}{2}$ على $b \times h$ فقط وأضاف $a$: $14 + \frac{1}{2} \times 10 \times 8 = 54$.'
    C: 'طبّق $\frac{1}{2}$ على $a$ فقط: $\frac{1}{2} \times 14 + 10 \times 8 = 87$.'
  solution: |
    نحسب ما بين القوسين أولاً:
    $A = \frac{1}{2}(14 + 10) \times 8 = \frac{1}{2} \times 24 \times 8$
    $A = 12 \times 8 = 96$
    إذن المساحة $96\,\text{m}^2$.
  remediation: 'ابدأ بما داخل القوسين $(a + b)$ ثم اضرب في $h$ ثم في $\frac{1}{2}$. تمرّن على $a = 6$ و$b = 4$ و$h = 5$.'
  misconceptions: [order-of-operations-ignored, parentheses-ignored-in-substitution]
  qatar_link: 'الصف السابع — الفصل الثاني: المقادير الجبرية (الصيغ الهندسية)'

- id: M8-A1-009
  topic: A1
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: intermediate
  format: dragdrop_order
  context: pure
  time: 120
  stem: |
    رتّب البطاقات بحسب قيمة المقدار $x^2 - 2x$ عند كل قيمة لـ $x$، من الأصغر قيمةً إلى الأكبر.
  cards:
    - {id: xm3, text: '$x = -3$', value: 15}
    - {id: xm1, text: '$x = -1$', value: 3}
    - {id: x0, text: '$x = 0$', value: 0}
    - {id: x1, text: '$x = 1$', value: -1}
    - {id: x4, text: '$x = 4$', value: 8}
  key: [x1, x0, xm1, x4, xm3]
  direction: asc
  order_labels: ['الأصغر قيمة', 'الأكبر قيمة']
  verify: "[x ** 2 - 2 * x for x in [1, 0, -1, 4, -3]] == [-1, 0, 3, 8, 15]"
  solution: |
    نحسب $x^2 - 2x$ عند كل قيمة:
    $x = -3$: $9 + 6 = 15$
    $x = -1$: $1 + 2 = 3$
    $x = 0$: $0 - 0 = 0$
    $x = 1$: $1 - 2 = -1$
    $x = 4$: $16 - 8 = 8$
    الترتيب من الأصغر: $-1$ ثم $0$ ثم $3$ ثم $8$ ثم $15$،
    أي $x = 1$ ثم $x = 0$ ثم $x = -1$ ثم $x = 4$ ثم $x = -3$.
  hint: 'احسب قيمة المقدار عند كل بطاقة أولاً، ثم رتّب القيم الناتجة لا قيم $x$.'
  remediation: 'عند $x$ سالبة ضعها بين قوسين: $(-3)^2 = 9$ و$-2 \times (-3) = 6$. رتّب بحسب قيمة المقدار لا بحسب قيمة $x$. تمرّن على $x^2 + x$ عند $x = -2$ و$x = 1$ و$x = 3$.'
  misconceptions: [order-by-input-value, square-of-negative-is-negative, ignore-negative-sign]
  qatar_link: 'الصف الثامن — الوحدة 1: الدرسان 1-6 و1-7 (خواص الأسس)؛ الصف السابع — الفصل الثاني: المقادير الجبرية'

- id: M8-A1-010
  topic: A1
  cognitive: applying
  area: formulate
  difficulty: medium
  benchmark: high
  format: numeric
  context: qatar
  time: 100
  stem: |
    تحتسب شركة الكهرباء فاتورة منزل في الدوحة (بيانات افتراضية) كما يأتي:
    رسم ثابت $15$ ريالاً شهرياً، وأول $100\,\text{kWh}$ مجانية،
    ثم $0.30$ ريال عن كل $1\,\text{kWh}$ إضافية.
    استهلك منزل $450\,\text{kWh}$ في شهر. ما قيمة فاتورته بالريال؟
  answer: {value: 120, unit: "ريالاً"}
  verify: "15 + Rational(3, 10) * (450 - 100)"
  solution: |
    نكتب الصيغة: $B = 15 + 0.30(u - 100)$ حيث $u$ الاستهلاك بوحدة $\text{kWh}$.
    نعوّض $u = 450$:
    $B = 15 + 0.30 \times (450 - 100) = 15 + 0.30 \times 350$
    $B = 15 + 105 = 120$
    إذن قيمة الفاتورة $120$ ريالاً.
  remediation: 'حدّد أولاً ما يُحسب عليه السعر: الاستهلاك بعد خصم الكمية المجانية، ثم أضف الرسم الثابت. اكتب الصيغة قبل التعويض. تمرّن على رسم ثابت $10$ ريالات وأول $50\,\text{kWh}$ مجانية و$0.20$ ريال لكل $1\,\text{kWh}$ إضافية عند استهلاك $250\,\text{kWh}$.'
  misconceptions: [free-allowance-ignored, order-of-operations-ignored, fixed-charge-omitted]
  qatar_link: 'الصف السابع — الفصل الثاني: المقادير الجبرية (كتابة مقدار وتقدير قيمته)؛ الصف الثامن — الوحدة 2: الدرس 2-9'

- id: M8-A1-011
  topic: A1
  cognitive: applying
  area: implement
  difficulty: hard
  benchmark: high
  format: mc
  context: real
  time: 120
  stem: |
    يُحسب مؤشر كتلة الجسم $B$ من الصيغة:
    $B = \frac{w}{h^2}$
    حيث $w$ الكتلة بالكيلوجرام و$h$ الطول بالمتر.
    كتلة طالب $64\,\text{kg}$ وطوله $160\,\text{cm}$. ما قيمة $B$؟
  options: ['$0.0025$', '$20$', '$25$', '$40$']
  option_values: ["0.0025", 20, 25, 40]
  key: C
  verify: "Rational(64) / Rational(16, 10) ** 2"
  rationale:
    A: 'لم يحوّل الطول إلى متر فعوّض $h = 160$: $\frac{64}{160^2} = \frac{64}{25600} = 0.0025$.'
    B: 'عدّ $h^2$ مساوياً $2h = 3.2$: $\frac{64}{3.2} = 20$.'
    D: 'نسي تربيع الطول: $\frac{64}{1.6} = 40$.'
  solution: |
    نحوّل الطول إلى متر: $160\,\text{cm} = 1.6\,\text{m}$.
    $B = \frac{w}{h^2} = \frac{64}{1.6^2} = \frac{64}{2.56} = 25$
  hint: 'الصيغة تطلب الطول بالمتر.'
  remediation: 'تحقّق من وحدة كل متغير قبل التعويض، ثم احسب القوة أولاً: $1.6^2 = 1.6 \times 1.6 = 2.56$ وليس $3.2$. تمرّن على $w = 48\,\text{kg}$ و$h = 120\,\text{cm}$.'
  misconceptions: [unit-conversion-error, power-as-multiplication, exponent-omitted]
  qatar_link: 'الصف الثامن — الوحدة 1: الدرسان 1-6 و1-7 (الأسس الصحيحة)؛ الصف السابع — الفصل الثاني: المقادير الجبرية'

