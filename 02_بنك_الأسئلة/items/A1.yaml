  solution: |
    $d = vt$
    $d = 80 \times 3 = 240$
    المسافة $240\,\text{km}$.
  remediation: 'عوّض قيمتي $v$ و$t$ في الصيغة ثم اضرب؛ فالكتابة $vt$ تعني $v \times t$. تمرّن على $v = 60\,\text{km/h}$ و$t = 2.5\,\text{h}$.'
  misconceptions: [operation-confusion, rate-inverted]
