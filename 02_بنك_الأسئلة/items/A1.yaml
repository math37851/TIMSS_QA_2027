- id: M8-A1-003
  topic: A1
  cognitive: knowing
  area: compute
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: real
  time: 60
  stem: |
    يُعطى ارتفاع الماء $y$ بالسنتيمتر في خزان بعد $x$ دقيقة بالمعادلة:
    $y = -\frac{3}{4}x + 60$
    ما ارتفاع الماء بالسنتيمتر بعد $20$ دقيقة؟
  options: ['$45$', '$60$', '$75$', '$80$']
  option_values: [45, 60, 75, 80]
  key: A
  verify: "Rational(-3, 4) * 20 + 60"
  rationale:
    B: 'اكتفى بالحد الثابت $60$ ولم يحسب الحد $-\frac{3}{4}x$.'
    C: 'تجاهل إشارة الميل السالبة فأضاف $\frac{3}{4} \times 20 = 15$ إلى $60$.'
    D: 'أضاف قيمة $x$ مباشرة إلى $60$ دون استعمال الميل: $20 + 60 = 80$.'
  solution: |
    المعادلة بالصورة $y = mx + b$ حيث الميل $m = -\frac{3}{4}$ والمقطع $y$ هو $b = 60$.
    نعوّض $x = 20$:
    $y = -\frac{3}{4} \times 20 + 60 = -15 + 60 = 45$
    إذن ارتفاع الماء $45\,\text{cm}$.
  remediation: 'احسب $mx$ أولاً مع مراعاة إشارة الميل $m$ ثم أضف $b$. تمرّن على $y = -\frac{1}{2}x + 30$ عندما $x = 10$.'
  misconceptions: [ignore-negative-sign, operation-confusion]
  qatar_link: 'الصف الثامن — الوحدة 2: الدرس 2-9 (المعادلة الخطية y = mx + b)'

- id: M8-A1-004
  topic: A1
  cognitive: knowing
  area: compute
  difficulty: medium
  benchmark: intermediate
  format: mc
  context: pure
  time: 60
  stem: |
    ما قيمة المقدار $3a^2 - 2b$ عندما $a = -2$ و$b = 5$؟
  options: ['$-22$', '$2$', '$22$', '$26$']
  option_values: [-22, 2, 22, 26]
  key: B
  verify: "3 * (-2) ** 2 - 2 * 5"
  rationale:
    A: 'عدّ $a^2$ مساوياً $-4$ (تربيع العدد السالب يعطي سالباً): $3 \times (-4) - 10 = -22$.'
    C: 'أهمل إشارة الطرح في $-2b$ فجمع $10$: $12 + 10 = 22$.'
    D: 'ربّع $3a$ كله بدل $a$ وحدها: $(3 \times (-2))^2 - 10 = 36 - 10 = 26$.'
  solution: |
    نعوّض $a = -2$ و$b = 5$ ونضع العدد السالب بين قوسين:
    $a^2 = (-2)^2 = 4$
    $3a^2 - 2b = 3 \times 4 - 2 \times 5 = 12 - 10 = 2$
  hint: 'تذكّر أن $a^2 = a \times a$ وأن الأس يُحسب قبل الضرب.'
  remediation: 'عند التعويض بعدد سالب ضعه بين قوسين، واحسب القوة أولاً ثم الضرب ثم الجمع أو الطرح. تمرّن على $2x^2 - 3y$ عندما $x = -3$ و$y = 4$.'
  misconceptions: [square-of-negative-is-negative, exponent-applied-to-coefficient, ignore-negative-sign]
  qatar_link: 'الصف الثامن — الوحدة 1: الدرسان 1-6 و1-7 (خواص الأسس)؛ الصف السابع — الفصل الثاني: المقادير الجبرية'

- id: M8-A1-005
  topic: A1
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: low
  format: mc
  context: pure
  time: 45
  stem: |
    عند وضع $m = -4$ في المقدار $7 - 3m$، أي عبارة عددية تمثّل التعويض الصحيح؟
  options: ['$7 - 3(-4)$', '$7 - 3 - 4$', '$7 - 3 \times 4$', '$(7 - 3)(-4)$']
  option_values: [19, 0, -5, -16]
  key: A
  verify: "7 - 3 * (-4)"
  rationale:
    B: 'كتب $-4$ دون أقواس فصار الطرح متتالياً: $7 - 3 - 4 = 0$.'
    C: 'أسقط إشارة السالب من $-4$ فحسب $7 - 3 \times 4 = -5$.'
    D: 'جمع $7 - 3$ في قوس واحد ثم ضرب الناتج في $-4$: $4 \times (-4) = -16$.'
  solution: |
    يحلّ العدد $-4$ محل $m$ ويوضع بين قوسين لأنه سالب:
    $7 - 3m = 7 - 3(-4)$
    وقيمتها $7 + 12 = 19$.
  remediation: 'عند التعويض بعدد سالب اكتبه بين قوسين حتى لا تختلط إشارته بعملية الطرح. تمرّن على $5 - 2n$ عندما $n = -3$.'
  misconceptions: [parentheses-ignored-in-substitution, ignore-negative-sign, order-of-operations-ignored]
  qatar_link: 'الصف السابع — الفصل الثاني: المقادير الجبرية (التعويض بأعداد سالبة)'

