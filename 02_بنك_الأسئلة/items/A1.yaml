  remediation: 'احسب $12n$ ثم اطرح $150$ وانظر إلى إشارة الناتج. لاحظ أن $P$ تصبح موجبة عندما يتجاوز $12n$ العدد $150$. تمرّن على $P = 8n - 60$ عند $n = 7$ و$n = 8$.'
  misconceptions: [guess-without-checking, ignore-negative-sign]
  qatar_link: 'الصف السابع — الفصل الثاني: المقادير الجبرية؛ الصف السابع: الأعداد الصحيحة (الموجبة والسالبة)'

- id: M8-A1-013
  topic: A1
  cognitive: reasoning
  area: analyze
  difficulty: medium
  benchmark: high
  format: mc
  context: real
  time: 100
  stem: |
    تُقذف كرة إلى أعلى، ويُعطى ارتفاعها $h$ بالمتر بعد $t$ ثانية بالصيغة $h = 20t - 5t^2$ (بيانات افتراضية).
    عند أي زمن من الأزمنة الآتية يكون ارتفاع الكرة أكبر ما يمكن؟
  options: ['$t = 1\,\text{s}$', '$t = 2\,\text{s}$', '$t = 3\,\text{s}$', '$t = 4\,\text{s}$']
  option_values: [15, 20, 15, 0]
  key: B
  verify: "max([20 * t - 5 * t ** 2 for t in [1, 2, 3, 4]])"
  rationale:
    A: 'ارتفاع الكرة عند $t = 1$ يساوي $15\,\text{m}$ فقط، وهو أقل من $20\,\text{m}$.'
    C: 'ارتفاع الكرة عند $t = 3$ يساوي $60 - 45 = 15\,\text{m}$، أي أقل من $20\,\text{m}$.'
    D: 'اختار أكبر زمن ظناً أن الارتفاع يزداد دائماً مع $t$، لكنها عند $t = 4$ تعود إلى الأرض: $h = 0$.'
  solution: |
    نحسب $h = 20t - 5t^2$ عند كل زمن:
    $t = 1$: $h = 20 - 5 = 15$
    $t = 2$: $h = 40 - 20 = 20$
    $t = 3$: $h = 60 - 45 = 15$
    $t = 4$: $h = 80 - 80 = 0$
    أكبر ارتفاع $20\,\text{m}$ عند $t = 2\,\text{s}$.
  hint: 'احسب $h$ عند كل زمن ثم قارن القيم.'
  remediation: 'قيمة المقدار لا تزداد دائماً بزيادة المتغير. احسب القيمة عند كل عدد ثم قارن. احسب $5t^2$ بتربيع $t$ أولاً ثم الضرب في $5$. تمرّن على $h = 30t - 5t^2$ عند $t = 2$ و$t = 3$ و$t = 4$.'
  misconceptions: [larger-input-larger-output, power-as-multiplication]
  qatar_link: 'الصف الثامن — الوحدة 1: الدرسان 1-6 و1-7 (خواص الأسس)؛ الصف السابع — الفصل الثاني: المقادير الجبرية'

- id: M8-A1-014
  topic: A1
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: advanced
  format: select_explain
  context: pure
  time: 150
  stem: |
    عوّض سلمان $x = -3$ في المقدار $x^2 + 5$ وكتب الحل الآتي:
    $x^2 + 5 = -3^2 + 5 = -9 + 5 = -4$
    هل حلّ سلمان صحيح؟ اختر الإجابة ثم برّر.
  options: ['نعم، الحل صحيح', 'لا، الحل غير صحيح']
  key: B
  points: 1
  verify: "(-3) ** 2 + 5 == 14 and -3 ** 2 + 5 == -4"
  rubric:
    full: 'يختار «لا، الحل غير صحيح» ويبيّن أن $x = -3$ يجب وضعها بين قوسين عند التربيع، فتكون $(-3)^2 = 9$ لا $-9$، وأن القيمة الصحيحة $9 + 5 = 14$.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تبرير رياضي صحيح (مثل: «الجواب خاطئ» فقط، أو حساب خاطئ آخر).'
    examples:
      correct:
        - 'الخطأ في $-3^2$؛ الصحيح $(-3)^2 = (-3) \times (-3) = 9$ فتكون القيمة $14$.'
        - 'التربيع يشمل الإشارة السالبة لأن $x = -3$، وحاصل ضرب عددين سالبين موجب.'
      incorrect:
        - 'نعم، لأن $3^2 = 9$ وتبقى الإشارة السالبة.'
        - 'لا، لأن العدد $5$ يجب أن يُطرح لا أن يُجمع.'
  solution: |
    لأن $x = -3$ يجب وضع $-3$ بين قوسين عند التربيع:
    $x^2 = (-3)^2 = (-3) \times (-3) = 9$
    إذن $x^2 + 5 = 9 + 5 = 14$.
    أما $-3^2$ فتعني $-(3^2) = -9$، وهي مقدار آخر؛ لذلك حلّ سلمان غير صحيح.
  remediation: 'الفرق بين $-3^2 = -9$ و$(-3)^2 = 9$: الأس يتعلق بالعدد الذي يليه مباشرة ما لم توجد أقواس. عند التعويض بعدد سالب في $x^2$ اكتب $(-3)^2$. تمرّن على $x^2 - 4$ عندما $x = -5$.'
  misconceptions: [square-of-negative-is-negative, parentheses-ignored-in-substitution]
  qatar_link: 'الصف الثامن — الوحدة 1: الدرسان 1-6 و1-7 (خواص الأسس)؛ الصف السابع: الأعداد الصحيحة'

- id: M8-A1-015
  topic: A1
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: high
  format: select_explain
  context: real
  time: 180
  stem: |
    تعرض شركة اتصالات باقتين شهريتين (بيانات افتراضية).
    تكلفة الباقة الأولى بالريال $A = 30 + 4g$، وتكلفة الباقة الثانية $B = 10 + 8g$،
    حيث $g$ عدد الجيجابايت المستعملة في الشهر.
    أي العبارات الآتية صحيحة؟ اختر الإجابة ثم برّر بحساب قيمة $A$ وقيمة $B$ لقيمتين مناسبتين من $g$.
  options:
    - 'الباقة الأولى أرخص دائماً.'
    - 'الباقة الثانية أرخص دائماً.'
    - 'تعتمد الباقة الأرخص على قيمة $g$.'
  key: C
  points: 1
  verify: "(30 + 4 * 2 > 10 + 8 * 2) and (30 + 4 * 10 < 10 + 8 * 10)"
  rubric:
    full: 'يختار العبارة الثالثة ويحسب قيمتي $A$ و$B$ عند قيمتين من $g$ تُظهران أن الباقة الأرخص تتغير، مثل $g = 2$: $A = 38$ و$B = 26$ (الثانية أرخص)، و$g = 10$: $A = 70$ و$B = 90$ (الأولى أرخص).'
    zero: 'يختار العبارة الأولى أو الثانية، أو يختار الثالثة دون حساب قيمتين مناسبتين أو بحسابات خاطئة.'
    examples:
      correct:
        - 'عند $g = 2$ تكون $A = 38$ و$B = 26$ فالثانية أرخص، وعند $g = 10$ تكون $A = 70$ و$B = 90$ فالأولى أرخص.'
        - 'عند $g = 1$: $A = 34$ و$B = 18$، وعند $g = 20$: $A = 110$ و$B = 170$؛ فتتغير الأرخص.'
      incorrect:
        - 'الأولى أرخص لأن $4$ أصغر من $8$.'
        - 'عند $g = 10$ تكون $A = 70$ و$B = 90$، إذن الأولى أرخص دائماً.'
  solution: |
    نحسب قيمتي المقدارين عند أكثر من قيمة لـ $g$:
    عند $g = 2$: $A = 30 + 4 \times 2 = 38$ و$B = 10 + 8 \times 2 = 26$، فالثانية أرخص.
    عند $g = 10$: $A = 30 + 4 \times 10 = 70$ و$B = 10 + 8 \times 10 = 90$، فالأولى أرخص.
    وعند $g = 5$ تتساوى القيمتان: $A = B = 50$.
    إذن الباقة الأرخص تعتمد على قيمة $g$.
  remediation: 'لا يكفي اختبار قيمة واحدة للحكم على كل القيم. قارن قيمتي المقدارين عند عدة قيم، وانتبه إلى أن الرسم الثابت الأكبر قد يعوّضه سعر أقل لكل جيجابايت. تمرّن على $A = 20 + 3g$ و$B = 5 + 6g$ عند $g = 2$ و$g = 8$.'
  misconceptions: [examples-prove-general, compare-one-term-only]
  qatar_link: 'الصف السابع — الفصل الثاني: المقادير الجبرية (مقارنة مقدارين)؛ الصف الثامن — الوحدة 2: الدرس 2-9'

- id: M8-A1-016
  topic: A1
  cognitive: reasoning
  area: generalize
  difficulty: hard
  benchmark: advanced
  format: cr_explain
  context: qatar
  time: 240
  stem: |
    احتفالاً باليوم الوطني (18 ديسمبر) تُرتَّب أعلام قطر في صفوف.
    عدد الأعلام في الصف رقم $n$ يُعطى بالصيغة $T = 3n + 1$.
    (1) كم علماً في الصف رقم $50$؟
    (2) كم علماً يزيد كل صف على الصف الذي قبله؟ اشرح لماذا تكون الزيادة نفسها لجميع الصفوف.
  verify: "3 * 50 + 1 == 151 and all([(3 * (n + 1) + 1) - (3 * n + 1) == 3 for n in range(1, 60)])"
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يجيب (1) بالقيمة $151$ ويجيب (2) بأن الزيادة $3$ أعلام مع تفسير عام: كل زيادة في $n$ بمقدار $1$ تزيد $3n$ بمقدار $3$ ولا يتغير الحد $+1$ (أو يبيّن أن $T(n+1) - T(n) = 3$).'}
      - {code: 10, points: 1, desc: 'يجيب (1) بالقيمة $151$ و(2) بأن الزيادة $3$ دون تفسير عام (أمثلة عددية فقط)، أو يقدّم تفسيراً عاماً صحيحاً لـ (2) مع خطأ حسابي في (1).'}
      - {code: 70, points: 0, desc: 'إجابة غير صحيحة، مثل: $T = 150$ (إهمال $+1$)، أو الزيادة غير ثابتة، أو الزيادة $1$.'}
    examples:
      correct:
        - '(1) $3 \times 50 + 1 = 151$. (2) الزيادة $3$؛ لأن $n$ تُضرب في $3$ فكلما زاد $n$ بمقدار $1$ زاد الناتج $3$ والحد $+1$ لا يتغير.'
      incorrect:
        - '(1) $150$. (2) الزيادة $1$ لأن الصفوف تزداد واحداً واحداً.'
        - '(1) $151$. (2) الزيادة $3$ لأن الصف الأول $4$ والثاني $7$.'
  model_answer: '(1) $T = 3 \times 50 + 1 = 151$ علماً. (2) كل صف يزيد على السابق $3$ أعلام: عندما يزيد $n$ بمقدار $1$ يزيد الحد $3n$ بمقدار $3$ ويبقى الحد الثابت $+1$ كما هو؛ أي $T(n+1) - T(n) = 3(n+1) + 1 - (3n + 1) = 3$ لكل قيمة $n$.'
  solution: |
    (1) $T = 3n + 1$ عند $n = 50$:
    $T = 3 \times 50 + 1 = 150 + 1 = 151$ علماً.
    (2) نقارن الصف رقم $n + 1$ بالصف رقم $n$:
    $T(n+1) - T(n) = (3(n+1) + 1) - (3n + 1) = 3$
    فالزيادة $3$ أعلام لكل صف مهما كانت قيمة $n$، لأن معامل $n$ هو $3$ والحد $+1$ ثابت.
  remediation: 'عند إيجاد قيمة صيغة مثل $T = 3n + 1$ اضرب $n$ في $3$ ثم أضف $1$. وللتعميم قارن قيمتين متتاليتين: ما يتغير عند زيادة $n$ بمقدار $1$ هو الحد $3n$ فقط. تمرّن على $T = 5n + 2$.'
  misconceptions: [examples-prove-general, proportional-not-through-origin]
  qatar_link: 'الصف الثامن — الوحدة 2: الدرس 2-9 (المعادلة الخطية والنمط)؛ الصف السابع — الفصل الثاني: المقادير الجبرية'
