  verify: "Rational(54, 75) * 100 - Rational(42, 60) * 100"
  solution: |
    الاختبار الأول: $\frac{42}{60} = 70\%$ ، والاختبار الثاني: $\frac{54}{75} = 72\%$.
    الفرق $72 - 70 = 2$ نقطة مئوية.
  remediation: |
    حوّل كل درجة إلى نسبة مئوية قبل المقارنة، وميّز بين «نقطة مئوية» (فرق بين نسبتين) و«نسبة مئوية للتغير».
  misconceptions: [compare-raw-scores]
  qatar_link: "النسبة المئوية — الصف السابع"

- id: M8-N6-015
  topic: N6
  cognitive: reasoning
  area: analyze
  difficulty: hard
  benchmark: advanced
  format: mc
  context: pure
  time: 120
  stem: |
    العدد $a$ أكبر من العدد $b$ بنسبة $50\%$.
    بأيّ نسبة مئوية يكون $b$ أصغر من $a$ ؟
  options: ['$50\%$', '$33\frac{1}{3}\%$', '$25\%$', '$150\%$']
  option_values: ["50", "100/3", "25", "150"]
  key: B
  verify: "(1 - 1 / Rational(3, 2)) * 100"
  rationale:
    A: "افترض أن النسبة واحدة في الاتجاهين."
    C: "خمّن نصف النسبة الأولى."
    D: 'حسب $a$ نسبةً من $b$.'
  solution: |
    إذا كان $b = 100$ فإن $a = 150$. الفرق $50$ ، ونسبته من $a$: $\frac{50}{150} = \frac{1}{3} \approx 33.3\%$.
    إذن $b$ أصغر من $a$ بنسبة $33\frac{1}{3}\%$.
  remediation: |
    اختر قيمة سهلة لـ $b$ (مثل 100) واحسب، ثم انتبه إلى أن الأساس (القيمة التي نقسم عليها) تغيّر.
  misconceptions: [percent-wrong-base, percent-symmetry]
  qatar_link: "الصف السابع — الدرس 3-4"

- id: M8-N6-016
  topic: N6
  cognitive: reasoning
  area: justify
  difficulty: hard
  benchmark: high
  format: cr_explain
  context: qatar
  time: 150
  stem: |
    يقدّم متجر العرض: «اشترِ 3 قطع واحصل على الرابعة مجاناً»، ويقدّم متجر آخر حسماً $25\%$ على كل القطع.
    أراد عبدالله شراء 4 قطع سعر كل منها 20 ريالاً. هل العرضان متساويان؟ وضّح إجابتك.
  points: 2
  rubric:
    codes:
      - {code: 20, points: 2, desc: 'يحسب المبلغ في العرضين ($3 \times 20 = 60$ ريالاً، و $4 \times 20 \times 0.75 = 60$ ريالاً) ويستنتج أنهما متساويان، أو يوضح أن دفع ثمن 3 من 4 يعني دفع $75\%$ أي حسماً $25\%$.'}
      - {code: 10, points: 1, desc: 'يحسب أحد المبلغين صحيحاً فقط، أو يستنتج التساوي بتبرير ناقص.'}
      - {code: 70, points: 0, desc: 'استنتاج غير صحيح أو دون أي حساب أو تبرير.'}
    examples:
      correct: ['متساويان: الأول 60 ريالاً والثاني 80 ناقص 20 = 60 ريالاً.']
      incorrect: ['الحسم أفضل لأن 25% كثير.', 'العرض الأول أفضل لأن القطعة مجانية.']
  model_answer: 'العرض الأول: يدفع ثمن 3 قطع $= 3 \times 20 = 60$ ريالاً. العرض الثاني: $4 \times 20 = 80$ ريالاً، والحسم $25\%$ منها $20$ ريالاً، فيدفع $60$ ريالاً. العرضان متساويان عند شراء 4 قطع.'
  verify: "3 * 20 == 4 * 20 * Rational(75, 100)"
  solution: |
    العرض الأول: $3 \times 20 = 60$ ريالاً. العرض الثاني: $4 \times 20 \times 0.75 = 60$ ريالاً. إذن العرضان متساويان.
    السبب: الحصول على قطعة مجانية من أربع يعني دفع $\frac{3}{4} = 75\%$ من ثمنها، أي حسماً $25\%$.
  remediation: |
    شجّع الطلاب على تحويل العروض التجارية إلى نسب مئوية للمقارنة، وجرّب معهم شراء 3 قطع فقط أو 5 قطع (يتغير الحكم).
  misconceptions: [free-item-vs-percent]
  qatar_link: "الصف السابع — الدرس 3-5"
