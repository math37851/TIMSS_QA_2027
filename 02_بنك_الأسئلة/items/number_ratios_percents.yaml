- id: M8-N5-011
  topic: N5
  cognitive: applying
  area: implement
  difficulty: medium
  benchmark: intermediate
  format: numeric
  context: real
  time: 90
  stem: |
    تقاسم أحمد وسالم مبلغ 360 ريالاً، بحيث تكون نسبة نصيب أحمد إلى نصيب سالم $5 : 4$. كم ريالاً نصيب أحمد؟
  answer: {value: 200, unit: "ريال"}
  verify: "360 * Rational(5, 9)"
  solution: |
    مجموع الأجزاء $5 + 4 = 9$ ، وقيمة الجزء الواحد $360 \div 9 = 40$ ريالاً.
    نصيب أحمد $5 \times 40 = 200$ ريال، ونصيب سالم $4 \times 40 = 160$ ريالاً.
  remediation: |
    استعمل نموذج الشريط: 9 أجزاء متساوية، منها 5 لأحمد و 4 لسالم.
  misconceptions: [ratio-part-as-whole, divide-by-part]
  qatar_link: "الصف السابع — الوحدة 2"

- id: M8-N5-012
  topic: N5
  cognitive: reasoning
  area: analyze
  difficulty: hard
  benchmark: high
  format: mc
  context: real
  time: 110
  stem: |
    خلطت نورة 3 أكواب من الطلاء الأزرق مع كوبين من الطلاء الأصفر.
    وخلطت مها 5 أكواب من الطلاء الأزرق مع 4 أكواب من الطلاء الأصفر.
    أيّ الخليطين لونه أكثر زرقة؟
  options: ["خليط نورة", "خليط مها", "اللونان متماثلان", "لا يمكن المعرفة"]
  key: A
  verify: "Rational(3, 5) > Rational(5, 9)"
  rationale:
    B: 'قارن عدد أكواب الأزرق فقط ($5 > 3$).'
    C: "لاحظ أن الأزرق يزيد على الأصفر بكوب واحد في الخليطين (تفكير جمعي)."
    D: "ظن أن الخليطين بكميات مختلفة لا يمكن مقارنتهما."
  solution: |
    نسبة الأزرق إلى الخليط كله: عند نورة $\frac{3}{5} = 0.6$ ، وعند مها $\frac{5}{9} \approx 0.56$.
    إذن خليط نورة أكثر زرقة.
  remediation: |
    قارن نسبة الأزرق إلى الكل (أو الأزرق إلى الأصفر: $1.5$ مقابل $1.25$) لا الفرق بين الكميتين.
  misconceptions: [additive-ratio-reasoning, compare-one-quantity]
  qatar_link: "الصف السابع — الدرس 2-6"

- id: M8-N5-013
  topic: N5
  cognitive: reasoning
  area: justify
  difficulty: medium
  benchmark: high
  format: select_explain
  context: real
  time: 120
  stem: |
    صورة أبعادها $4\,\text{cm} \times 6\,\text{cm}$ ، كُبّرت بحيث أصبح عرضها $8\,\text{cm}$ مع المحافظة على شكلها.
    قال عمر: «سيصبح طولها $10\,\text{cm}$ ، لأننا أضفنا 4 إلى العرض، فنضيف 4 إلى الطول».
    هل عمر على صواب؟ اختر، ثم برّر إجابتك.
  options: ["نعم، على صواب", "لا، ليس على صواب"]
  key: B
  points: 1
  rubric:
    full: 'يختار «لا» ويبرّر بأن العرض تضاعف (من $4$ إلى $8$) فيجب أن يتضاعف الطول أيضاً فيصبح $12\,\text{cm}$ ، أو يستعمل النسبة $\frac{6}{4} = \frac{12}{8}$.'
    zero: 'يختار «نعم»، أو يختار «لا» دون تبرير صحيح؛ وذكر الطول الصحيح وحده دون بيان التضاعف أو النسبة لا يكفي.'
    examples:
      correct: ['لا، العرض ضُرب في 2 فيُضرب الطول في 2 ويصبح 12 cm.']
      incorrect: ['نعم، لأننا أضفنا 4 للبعدين.', 'لا، لأن الطول يصبح 14 cm.']
  verify: "Rational(6, 4) * 8 == 12"
  solution: |
    التكبير مع المحافظة على الشكل يعني ضرب كل الأبعاد في العدد نفسه.
    العرض ضُرب في $2$ ($4 \times 2 = 8$)، فالطول $6 \times 2 = 12\,\text{cm}$ وليس $10\,\text{cm}$.
  remediation: |
    ارسم الصورتين على شبكة لتظهر أن إضافة 4 إلى البعدين تشوّه الشكل، بينما الضرب يحافظ عليه.
  misconceptions: [additive-scaling]
  qatar_link: "التشابه والتكبير — الصف الثامن"

- id: M8-N5-014
  topic: N5
  cognitive: reasoning
  area: integrate
  difficulty: hard
  benchmark: advanced
  format: numeric
  context: real
  time: 150
  stem: |
    على خريطة مقياس رسمها $1 : 500\,000$ ، المسافة بين مدينتين $12\,\text{cm}$.
    تسير سيارة بين المدينتين بسرعة ثابتة $80\,\text{km/h}$. كم دقيقة تستغرق الرحلة؟
  answer: {value: 45, unit: "دقيقة"}
  verify: "(12 * 500000 / 100000) / 80 * 60"
  solution: |
    المسافة الحقيقية $= 12 \times 500\,000 = 6\,000\,000\,\text{cm} = 60\,\text{km}$.
    الزمن $= 60 \div 80 = 0.75$ ساعة $= 0.75 \times 60 = 45$ دقيقة.
  remediation: |
    قسّم المسألة إلى خطوتين واكتب الوحدة بعد كل خطوة: من المقياس إلى km، ثم من المسافة والسرعة إلى الزمن، ثم إلى الدقائق.
  misconceptions: [unit-conversion-error, time-hours-minutes]
  qatar_link: "المعدلات والرسم بمقياس — الصفان 7 و 8"

