- id: M8-N5-005
  topic: N5
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: pure
  time: 80
  stem: |
    أيّ مجموعات الأزواج المرتبة $(x, y)$ الآتية تمثّل علاقة تناسب؟
  options: ['$(1, 4),\ (2, 8),\ (3, 12)$', '$(1, 3),\ (2, 5),\ (3, 7)$', '$(1, 2),\ (2, 4),\ (3, 7)$', '$(2, 1),\ (4, 3),\ (6, 5)$']
  key: A
  verify: "all(Rational(y, x) == 4 for x, y in [(1, 4), (2, 8), (3, 12)]) and len(set(Rational(y, x) for x, y in [(1, 3), (2, 5), (3, 7)])) > 1 and len(set(Rational(y, x) for x, y in [(1, 2), (2, 4), (3, 7)])) > 1 and len(set(Rational(y, x) for x, y in [(2, 1), (4, 3), (6, 5)])) > 1"
  rationale:
    B: 'القيم تزيد بمقدار ثابت (2)، لكن النسبة $\frac{y}{x}$ غير ثابتة.'
    C: "النسبة ثابتة في الزوجين الأولين فقط."
    D: 'الفرق بين $x$ و $y$ ثابت، لكن النسبة غير ثابتة.'
  solution: |
    في علاقة التناسب تكون النسبة $\frac{y}{x}$ ثابتة: $\frac{4}{1} = \frac{8}{2} = \frac{12}{3} = 4$.
    في المجموعات الأخرى تتغير هذه النسبة.
  remediation: |
    احسب $\frac{y}{x}$ لكل زوج؛ إذا تساوت كل النسب فالعلاقة تناسب، وتلك القيمة هي ثابت التناسب.
  misconceptions: [constant-difference-as-proportional]
  qatar_link: "الصف السابع — الدرسان 2-3 و 2-4 (ثابت التناسب)"

