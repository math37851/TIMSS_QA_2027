- id: M8-N5-001
  topic: N5
  cognitive: knowing
  area: compute
  difficulty: foundation
  benchmark: low
  format: numeric
  context: real
  time: 50
  stem: |
    في نادي الشطرنج بالمدرسة، النسبة بين عدد البنين وعدد البنات $3 : 2$.
    إذا كان عدد البنات 10، فكم عدد البنين؟
  answer: {value: 15, unit: "طالباً"}
  verify: "Rational(3, 2) * 10"
  solution: |
    كل بنتين يقابلهما 3 بنين. $10 = 2 \times 5$ ، إذن عدد البنين $3 \times 5 = 15$.
  remediation: |
    استعمل جدول نسب: $(3, 2) \rightarrow (6, 4) \rightarrow (9, 6) \rightarrow (12, 8) \rightarrow (15, 10)$.
  misconceptions: [additive-ratio-reasoning]
  qatar_link: "الصف السابع — الوحدة 2: الدرس 2-3 النسب المتكافئة (7.2.2)"

- id: M8-N5-002
  topic: N5
  cognitive: knowing
  area: identify
  difficulty: easy
  benchmark: intermediate
  format: dragdrop_categorize
  context: pure
  time: 100
  stem: |
    اسحب كل نسبة إلى المجموعة المناسبة.
  categories: ['تكافئ النسبة $4 : 6$', 'لا تكافئ النسبة $4 : 6$']
  cards: ['$2 : 3$', '$6 : 9$', '$8 : 10$', '$10 : 15$', '$6 : 8$', '$12 : 18$']
  key:
    '$2 : 3$': 'تكافئ النسبة $4 : 6$'
    '$6 : 9$': 'تكافئ النسبة $4 : 6$'
    '$10 : 15$': 'تكافئ النسبة $4 : 6$'
    '$12 : 18$': 'تكافئ النسبة $4 : 6$'
    '$8 : 10$': 'لا تكافئ النسبة $4 : 6$'
    '$6 : 8$': 'لا تكافئ النسبة $4 : 6$'
  verify: "all(Rational(a, b) == Rational(4, 6) for a, b in [(2, 3), (6, 9), (10, 15), (12, 18)]) and all(Rational(a, b) != Rational(4, 6) for a, b in [(8, 10), (6, 8)])"
  solution: |
    $4 : 6 = 2 : 3$ بقسمة الحدين على $2$. النسب المكافئة ناتجة عن ضرب الحدين في العدد نفسه: $6 : 9$ ، $10 : 15$ ، $12 : 18$.
    أما $8 : 10$ و $6 : 8$ فناتجتان عن إضافة العدد نفسه إلى الحدين، وهذا لا يحافظ على النسبة.
  remediation: |
    ميّز بين التفكير الضربي (صحيح) والتفكير الجمعي (خطأ): إضافة $2$ إلى الحدين ($6 : 8$) لا تحافظ على النسبة.
  misconceptions: [additive-ratio-reasoning]
  qatar_link: "الصف السابع — الدرس 2-3"

- id: M8-N5-003
  topic: N5
  cognitive: knowing
  area: recall
  difficulty: easy
  benchmark: intermediate
  format: mc
  context: real
  time: 60
  stem: |
    مقياس رسم خريطة هو $1 : 50\,000$. ماذا يعني ذلك؟
  options:
    - 'كل $1\,\text{cm}$ على الخريطة يمثل $50\,\text{m}$ على الأرض'
    - 'كل $1\,\text{cm}$ على الخريطة يمثل $500\,\text{m}$ على الأرض'
    - 'كل $1\,\text{cm}$ على الخريطة يمثل $5\,\text{km}$ على الأرض'
    - 'كل $1\,\text{cm}$ على الخريطة يمثل $50\,\text{km}$ على الأرض'
  key: B
  verify: "50000 / 100 == 500"
  rationale:
    A: 'قسم على $1000$ بدلاً من $100$ عند التحويل من cm إلى m.'
    C: "أخطأ في التحويل إلى الكيلومتر."
    D: 'اعتبر أن $50\,000\,\text{cm}$ تساوي $50\,\text{km}$.'
  solution: |
    $1\,\text{cm}$ على الخريطة يمثل $50\,000\,\text{cm}$ على الأرض.
    وبما أن $1\,\text{m} = 100\,\text{cm}$ ، فإن $50\,000\,\text{cm} = 500\,\text{m}$.
  remediation: |
    درّب على سلسلة التحويل: من cm إلى m بالقسمة على $100$، ومن m إلى km بالقسمة على $1000$، واستعمل جدولاً للوحدات.
  misconceptions: [unit-conversion-error]
  qatar_link: "الرسم بمقياس — الصفان 7 و 8"

