id: PSI1
title: 'رحلة إلى متحف قطر الوطني'
context: qatar
intro: |
  تنظّم مدرسة الوكرة الإعدادية رحلة لطلاب الصف الثامن إلى متحف قطر الوطني في الدوحة (بيانات افتراضية).
  سجّل 130 طالباً في الرحلة، وتتسع الحافلة الواحدة لـ 40 راكباً، وسعر تذكرة الدخول 40 ريالاً للطالب.
  يمنح المتحف حسماً جماعياً على سعر التذكرة بحسب عدد أفراد المجموعة، كما يوضح الجدول.
table:
  headers: ['عدد أفراد المجموعة', 'الحسم على سعر التذكرة']
  rows:
    - ['من 20 إلى 49 زائراً', '10%']
    - ['من 50 إلى 99 زائراً', '15%']
    - ['100 زائر أو أكثر', '20%']
items:
  # ------------------------------------------------------------ 01 معرفة · سهل
  - id: M8-PSI1-01
    topic: N1
    cognitive: knowing
    area: compute
    difficulty: easy
    benchmark: intermediate
    format: numeric
    context: qatar
    time: 45
    stem: |
      كم حافلة تحتاج المدرسة، على الأقل، لنقل جميع الطلاب المسجلين في الرحلة؟
    answer: {value: 4, unit: 'حافلات'}
    verify: "ceiling(Rational(130, 40))"
    hint: 'ماذا تفعل بالطلاب الذين يبقون بعد امتلاء الحافلات الكاملة؟'
    solution: |
      نقسم عدد الطلاب على سعة الحافلة: $130 \div 40 = 3.25$.
      لا يمكن استعمال جزء من حافلة، فنقرّب الناتج إلى العدد الصحيح الأكبر التالي.
      إذن تحتاج المدرسة إلى 4 حافلات (ثلاث حافلات تنقل 120 طالباً فقط، ويبقى 10 طلاب).
    remediation: |
      اطلب من الطالب حل مسألة مشابهة بأعداد أصغر (25 طالباً وسعة الحافلة 10) مع رسم المقاعد وعدّ الحافلات،
      ثم ناقش لماذا يُقرَّب ناتج القسمة إلى الأعلى عندما يمثّل الباقي أشخاصاً حقيقيين.
    misconceptions: [round-down-ignores-remainder]
    qatar_link: 'مراجعة من الصفوف السابقة: القسمة وتفسير الباقي في مسائل حياتية (أساس لحل المسائل في الصف السابع، الوحدة 1)'

  # ------------------------------------------------------------ 02 تطبيق · متوسط
  - id: M8-PSI1-02
    topic: N6
    cognitive: applying
    area: implement
    difficulty: medium
    benchmark: intermediate
    format: mc
    context: qatar
    time: 90
    stem: |
      تشتري المدرسة تذاكر لجميع الطلاب المسجلين مستفيدة من الحسم الجماعي.
      ما المبلغ الذي تدفعه المدرسة ثمناً للتذاكر؟
    options: ['1040 ريالاً', '4160 ريالاً', '4420 ريالاً', '5180 ريالاً']
    option_values: [1040, 4160, 4420, 5180]
    key: B
    verify: "130 * 40 * (1 - Rational(20, 100))"
    rationale:
      A: 'حسب مقدار الحسم فقط $5200 \times 0.20 = 1040$ ولم يطرحه من السعر الأصلي (خلط بين مقدار الحسم والسعر بعد الحسم).'
      C: 'قرأ صفاً خاطئاً في الجدول (حسم $15\%$ لفئة 50 إلى 99 زائراً) بدل فئة «100 زائر أو أكثر».'
      D: 'طرح 20 ريالاً من المبلغ الكلي $5200 - 20 = 5180$ بدل طرح $20\%$ منه.'
    solution: |
      عدد الطلاب 130، فهم ضمن فئة «100 زائر أو أكثر» والحسم $20\%$.
      سعر التذكرة بعد الحسم: $40 \times (1 - 0.20) = 32$ ريالاً.
      المبلغ الذي تدفعه المدرسة: $130 \times 32 = 4160$ ريالاً.
    remediation: |
      درّب الطالب على تحديد فئة الحسم من الجدول أولاً، ثم حساب سعر التذكرة الواحدة بعد الحسم ($40 \times 0.8$)
      قبل ضربه في عدد الطلاب، والتحقق من أن الناتج أقل من السعر قبل الحسم ($130 \times 40 = 5200$).
    misconceptions: [answer-discount-not-price, wrong-table-row, subtract-percent-as-riyals]
    qatar_link: 'الصف السابع، الوحدة 3: النسب المئوية (الحسم)'

  # ------------------------------------------------------------ 03 تطبيق · متوسط
  - id: M8-PSI1-03
    topic: A3
    cognitive: applying
    area: formulate
    difficulty: medium
    benchmark: high
    format: numeric
    context: qatar
    time: 120
    stem: |
      خصّصت المدرسة 5000 ريال لتذاكر الدخول ووجبات الغداء، وتكلفة وجبة الطالب الواحد 6 ريالات.
      إذا بقي عدد المشاركين 100 طالب أو أكثر، فما أكبر عدد من الطلاب تكفي الميزانية لتذاكرهم ووجباتهم؟
    answer: {value: 131, unit: 'طالباً'}
    verify: "floor(5000 / (40 * (1 - Rational(20, 100)) + 6))"
    hint: 'احسب أولاً تكلفة الطالب الواحد: التذكرة بعد الحسم مع الوجبة.'
    solution: |
      بما أن المجموعة 100 طالب أو أكثر فالحسم $20\%$، وسعر التذكرة $40 \times 0.8 = 32$ ريالاً.
      تكلفة الطالب الواحد: $32 + 6 = 38$ ريالاً.
      إذا كان عدد الطلاب $n$ فإن $38n \le 5000$ ، أي $n \le 131.57\ldots$
      عدد الطلاب صحيح ولا يجوز تجاوز الميزانية، فنأخذ العدد الصحيح الأصغر: 131 طالباً.
      تحقق: $38 \times 131 = 4978 \le 5000$ ، أما $38 \times 132 = 5016 > 5000$.
    remediation: |
      اطلب من الطالب كتابة تكلفة الطالب الواحد أولاً، ثم المتباينة $38n \le 5000$ ، وتفسير الناتج العشري:
      لا يمكن أخذ جزء من طالب، ولا يجوز تجاوز الميزانية، لذلك نقرّب إلى الأسفل لا إلى أقرب عدد صحيح.
    misconceptions: [per-unit-cost-omitted, round-up-exceeds-budget]
    qatar_link: 'الصف السابع، الفصل الثاني: كتابة المتباينات الخطية وحلها؛ الصف الثامن، الوحدة 2 (2-3): المعادلات متعددة الخطوات'

  # ------------------------------------------------------------ 04 استدلال · صعب
  - id: M8-PSI1-04
    topic: D2
    cognitive: reasoning
    area: integrate
    difficulty: hard
    benchmark: high
    format: dragdrop_slots
    context: qatar
    time: 150
    stem: |
      تبدأ جولة المجموعة عند الساعة 9:00 صباحاً، وتزور القاعات الثلاث بالترتيب المبيّن في الجدول.
      يلزم 10 دقائق للانتقال من القاعة الأولى إلى الثانية، وبعد انتهاء القاعة الثانية تستريح المجموعة 20 دقيقة (تشمل زمن الانتقال) قبل دخول القاعة الثالثة.
      أكمل الجملة بسحب الأوقات الصحيحة إلى الخانات.
    table:
      headers: ['الترتيب', 'القاعة', 'مدة الزيارة (بالدقائق)']
      rows:
        - ['الأولى', 'قاعة الصحراء', '35']
        - ['الثانية', 'قاعة البحر واللؤلؤ', '40']
        - ['الثالثة', 'قاعة النفط والغاز', '30']
    cards:
      - {id: t935, text: '9:35', value: 575}
      - {id: t945, text: '9:45', value: 585}
      - {id: t1025, text: '10:25', value: 625}
      - {id: t1045, text: '10:45', value: 645}
      - {id: t1105, text: '11:05', value: 665}
      - {id: t1115, text: '11:15', value: 675}
    template: 'تبدأ زيارة القاعة الثانية عند الساعة [[1]]، وتبدأ زيارة القاعة الثالثة عند الساعة [[2]]، وتنتهي الجولة عند الساعة [[3]].'
    template_dir: rtl
    key: {1: t945, 2: t1045, 3: t1115}
    verify: "s1 == 9 * 60 + 35 + 10 and s2 == s1 + 40 + 20 and s3 == s2 + 30"
    solution: |
      القاعة الأولى من 9:00 إلى 9:35 (35 دقيقة)، ثم 10 دقائق انتقال، فتبدأ القاعة الثانية عند 9:45.
      القاعة الثانية من 9:45 إلى 10:25 (40 دقيقة)، ثم استراحة 20 دقيقة، فتبدأ القاعة الثالثة عند 10:45.
      القاعة الثالثة من 10:45 إلى 11:15 (30 دقيقة)، فتنتهي الجولة عند 11:15.
      الوقتان 9:35 و 10:25 هما وقتا انتهاء القاعتين الأولى والثانية، أما 11:05 فينتج عن إهمال زمن الانتقال الأول.
    remediation: |
      ارسم مع الطالب خطاً زمنياً يبيّن بداية كل قاعة ونهايتها وزمن الانتقال والاستراحة،
      ودرّبه على الانتقال إلى الساعة التالية عند تجاوز 60 دقيقة (مثلاً بعد 9:45 بأربعين دقيقة تصبح الساعة 10:25).
    misconceptions: [transition-time-omitted, time-hours-minutes]
    qatar_link: 'مراجعة: العمليات على الأعداد والزمن؛ حل المسائل متعددة الخطوات وقراءة الجداول (الصف السابع)'

  # ------------------------------------------------------------ 05 استدلال · صعب (مفتوح)
  - id: M8-PSI1-05
    topic: A5
    cognitive: reasoning
    area: justify
    difficulty: hard
    benchmark: advanced
    format: cr_explain
    context: qatar
    time: 240
    points: 2
    stem: |
      تلقّت المدرسة عرضين لنقل الطلاب، كما في الجدول.
      اختر العرض الأقل تكلفة لنقل الطلاب المسجلين جميعاً (130 طالباً)، وبرّر اختيارك بالحساب.
      ثم بيّن هل يبقى اختيارك صحيحاً إذا انخفض عدد الطلاب إلى 80 طالباً.
    table:
      headers: ['العرض', 'تسعيرة النقل']
      rows:
        - ['العرض الأول', 'رسم ثابت 600 ريال، إضافةً إلى 8 ريالات عن كل طالب']
        - ['العرض الثاني', '14 ريالاً عن كل طالب، بلا رسم ثابت']
      row_headers: true
    rubric:
      codes:
        - {code: 20, points: 2, desc: 'يختار العرض الأول ويحسب تكلفتي العرضين للطلاب الـ 130 حساباً صحيحاً ($1640$ و $1820$ ريالاً)، ويبيّن أن الاختيار يتغير عند 80 طالباً (العرض الثاني أرخص: $1120$ مقابل $1240$ ريالاً) أو يذكر أن التكلفتين تتساويان عند 100 طالب.'}
        - {code: 10, points: 1, desc: 'يحقق أحد الجزأين فقط تحقيقاً صحيحاً مبرَّراً بالحساب: إما اختيار العرض الأول لـ 130 طالباً مع تكلفتين صحيحتين، وإما تحديد أن العرض الثاني أرخص عند 80 طالباً مع حساب صحيح.'}
        - {code: 70, points: 0, desc: 'يختار العرض الثاني لـ 130 طالباً، أو يختار العرض الأول دون حساب أو بحساب خاطئ (مثل مقارنة سعر الطالب الواحد 8 و 14 فقط)، أو لا يبرّر.'}
      examples:
        correct:
          - '$600 + 8 \times 130 = 1640$ ريالاً للعرض الأول و $14 \times 130 = 1820$ ريالاً للعرض الثاني، فالأول أرخص. ومع 80 طالباً: $1240$ ريالاً للأول و $1120$ ريالاً للثاني، فيصبح الثاني أرخص.'
          - 'العرض الأول أرخص بـ 180 ريالاً عند 130 طالباً؛ لكن التكلفتين تتساويان عند 100 طالب، فمع 80 طالباً يكون العرض الثاني أفضل.'
        incorrect:
          - 'العرض الأول لأن سعر الطالب فيه 8 ريالات وهو أقل من 14 (لا يحسب الرسم الثابت).'
          - 'العرض الثاني لأنه بلا رسم ثابت، وهو الأرخص دائماً مهما كان عدد الطلاب.'
    model_answer: 'للطلاب الـ 130: العرض الأول $600 + 8 \times 130 = 1640$ ريال، والعرض الثاني $14 \times 130 = 1820$ ريال، فالعرض الأول أرخص بمقدار 180 ريالاً. ومع 80 طالباً: العرض الأول $600 + 8 \times 80 = 1240$ ريال والثاني $14 \times 80 = 1120$ ريال، فيصبح العرض الثاني أرخص؛ إذ تتساوى التكلفتان عند $n = 100$ طالب.'
    verify: "600 + 8 * 130 == 1640 and 14 * 130 == 1820 and 1640 < 1820 and 600 + 8 * 80 == 1240 and 14 * 80 == 1120 and 1240 > 1120 and solve(Eq(600 + 8 * x, 14 * x), x)[0] == 100"
    solution: |
      تكلفة العرض الأول لـ 130 طالباً: $600 + 8 \times 130 = 1640$ ريال.
      تكلفة العرض الثاني: $14 \times 130 = 1820$ ريال.
      العرض الأول أرخص بمقدار $1820 - 1640 = 180$ ريالاً، فنختاره.
      عند 80 طالباً: العرض الأول $600 + 8 \times 80 = 1240$ ريال، والثاني $14 \times 80 = 1120$ ريال، فيصبح العرض الثاني أرخص.
      تتساوى التكلفتان عندما $600 + 8n = 14n$ ، أي $n = 100$: العرض الأول أفضل لأكثر من 100 طالب، والثاني أفضل لأقل من 100 طالب.
    remediation: |
      درّب الطالب على كتابة تكلفة كل عرض بدلالة عدد الطلاب ($600 + 8n$ و $14n$) وحسابها عند العدد المطلوب ثم مقارنة الناتجين،
      وناقش لماذا قد يتغير العرض الأفضل عندما يتغير عدد الطلاب (دور الرسم الثابت وسعر الطالب الواحد).
    misconceptions: [compare-fixed-fee-only, ignore-fixed-fee, extrapolation-always-valid]
    qatar_link: 'الصف الثامن، الوحدة 2 (2-8 و 2-9): المقطع $y$ و $y = mx + b$ — مقارنة نموذجين خطيين في موقف حياتي'
