  # ------------------------------------------------------------ 01 معرفة · سهل
  - id: M8-PSI4-01
    topic: D3
    cognitive: knowing
    area: compute
    difficulty: easy
    benchmark: intermediate
    format: mc
    context: qatar
    time: 60
    stem: |
      ما المتوسط الحسابي لسعر الكيلوغرام الواحد للأنواع الأربعة بالريال؟
    options: ['$45$', '$50$', '$55$', '$200$']
    option_values: [45, 50, 55, 200]
    key: B
    rationale:
      A: 'حسب الوسيط بدل المتوسط: بعد ترتيب الأسعار $30$ ، $40$ ، $50$ ، $80$ يكون الوسيط $(40 + 50) \div 2 = 45$.'
      C: 'أخذ منتصف أصغر سعر وأكبر سعر $(30 + 80) \div 2 = 55$ وأهمل السعرين الآخرين.'
      D: 'جمع الأسعار الأربعة ولم يقسم المجموع على عددها.'
    solution: |
      نجمع الأسعار الأربعة: $40 + 80 + 30 + 50 = 200$.
      نقسم المجموع على عدد الأنواع: $200 \div 4 = 50$.
      المتوسط الحسابي $50$ ريالاً، والإجابة B.
    remediation: |
      المتوسط الحسابي هو مجموع القيم مقسوماً على عددها. للتفريق بينه وبين الوسيط رتّب الأسعار تصاعدياً: الوسيط هو القيمة الوسطى بعد الترتيب، أما المتوسط فيستعمل كل القيم.
    misconceptions: [mean-median-confusion, midrange-instead-of-mean, mean-equals-sum]
    qatar_link: 'الصف السادس — الإحصاء: المتوسط الحسابي (مراجعة للصف الثامن)'
    verify: "Rational(40 + 80 + 30 + 50, 4)"

  # ------------------------------------------------------------ 02 تطبيق · متوسط
  - id: M8-PSI4-02
    topic: N6
    cognitive: applying
    area: implement
    difficulty: medium
    benchmark: intermediate
    format: numeric
    context: qatar
    time: 120
    stem: |
      يشتري المتجر التمر الخلاص بسعر 32 ريالاً للكيلوغرام الواحد، ويبيعه بالسعر المبيّن في الجدول.
      أعلن المتجر في اليوم الثاني حسماً قدره $10\%$ على سعر الخلاص، فاشترى زبون $2\frac{1}{2}\,\text{kg}$ منه بعد الحسم.
      كم ريالاً ربح المتجر من هذه الصفقة؟
    answer: {value: 10, unit: 'ريال', tol: 0.01}
    solution: |
      السعر بعد الحسم: $40 - 40 \times 0.10 = 36$ ريالاً للكيلوغرام.
      ثمن البيع: $36 \times 2.5 = 90$ ريالاً.
      تكلفة شراء الكمية نفسها: $32 \times 2.5 = 80$ ريالاً.
      الربح: $90 - 80 = 10$ ريالات.
    remediation: |
      الحسم $10\%$ يعني أن السعر الجديد يساوي $90\%$ من السعر الأصلي، أي $40 \times 0.90 = 36$. بعد ذلك احسب ربح الكيلوغرام الواحد (سعر البيع مطروحاً منه سعر الشراء) واضربه في الكمية المباعة.
    misconceptions: [subtract-percent-as-riyals, stop-at-intermediate-result, discount-ignored]
    qatar_link: 'الصف السابع — الوحدة 3: النسب المئوية (الحسم وهامش الربح)'
    verify: "Rational(5, 2) * (40 * (1 - Rational(10, 100)) - 32)"

  # ------------------------------------------------------------ 03 تطبيق · متوسط
  - id: M8-PSI4-03
    topic: D2
    cognitive: applying
    area: implement
    difficulty: medium
    benchmark: high
    format: dragdrop_order
    context: qatar
    time: 150
    stem: |
      يُحسب إيراد المتجر من كل نوع بضرب الكمية المباعة في سعر الكيلوغرام الواحد.
      رتّب الأنواع الأربعة من الأعلى إيراداً إلى الأقل إيراداً في اليوم الأول.
    cards:
      - {id: khalas, text: 'خلاص', value: 2800}
      - {id: sukkari, text: 'سكري', value: 3200}
      - {id: khanizi, text: 'خنيزي', value: 1800}
      - {id: barhi, text: 'برحي', value: 1500}
    key: [sukkari, khalas, khanizi, barhi]
    direction: desc
    order_labels: ['الأعلى إيراداً', 'الأقل إيراداً']
    solution: |
      الإيراد = الكمية المباعة × سعر الكيلوغرام:
      خلاص: $70 \times 40 = 2800$ ريال. سكري: $40 \times 80 = 3200$ ريال. خنيزي: $60 \times 30 = 1800$ ريال. برحي: $30 \times 50 = 1500$ ريال.
      الترتيب من الأعلى إلى الأقل: سكري ثم خلاص ثم خنيزي ثم برحي، فالخلاص هو الأكثر مبيعاً لكن السكري هو الأعلى إيراداً.
    remediation: |
      الإيراد يعتمد على كمّيتين معاً: الكمية المباعة وسعر الكيلوغرام. احسب الإيراد لكل نوع أولاً ثم قارن النتائج؛ فالنوع الأكثر مبيعاً بالكيلوغرام قد لا يكون الأعلى إيراداً.
    misconceptions: [compare-one-quantity, visual-impression-over-values]
    qatar_link: 'الصف السادس — الإحصاء: قراءة التمثيل بالأعمدة؛ الصف السابع — الوحدة 2: التناسب ومعدل الوحدة'
    verify: "[70 * 40, 40 * 80, 60 * 30, 30 * 50] == [2800, 3200, 1800, 1500] and 3200 > 2800 > 1800 > 1500"

  # ------------------------------------------------------------ 04 استدلال · صعب
  - id: M8-PSI4-04
    topic: D4
    cognitive: reasoning
    area: integrate
    difficulty: hard
    benchmark: high
    format: mc
    context: qatar
    time: 150
    stem: |
      تُعبَّأ علب الهدايا المشكّلة بالأنواع الأربعة بحيث يتناسب عدد التمرات من كل نوع مع الكمية المباعة منه في اليوم الأول، وتُسحب تمرة واحدة عشوائياً من علبة مشكّلة.
      ما احتمال أن تكون التمرة المسحوبة من أحد النوعين الأعلى سعراً؟
    options: ['$\frac{13}{20}$', '$\frac{7}{13}$', '$\frac{1}{2}$', '$\frac{7}{20}$']
    option_values: ['13/20', '7/13', '1/2', '7/20']
    key: D
    rationale:
      A: 'اختار النوعين الأقل سعراً (الخلاص والخنيزي) بدل النوعين الأعلى سعراً: $\frac{70 + 60}{200} = \frac{13}{20}$.'
      B: 'قارن مبيعات النوعين ($70$) بمبيعات النوعين الآخرين ($130$) بدل مقارنتها بالمجموع الكلي.'
      C: 'عدّ النوعين من أربعة أنواع فكتب $\frac{2}{4}$ دون النظر إلى نسب المبيعات.'
    solution: |
      أعلى نوعين سعراً: السكري ($80$ ريالاً) والبرحي ($50$ ريالاً).
      تمثّل المبيعات نسب التمور في العلبة، ومجموع الأعمدة الأربعة $70 + 40 + 60 + 30 = 200$.
      عدد النواتج المناسبة (سكري أو برحي): $40 + 30 = 70$.
      الاحتمال $= \frac{70}{200} = \frac{7}{20}$، والإجابة D.
    remediation: |
      احتمال الحدث يساوي عدد النواتج المناسبة مقسوماً على عدد النواتج الممكنة كلها. هنا تمثّل أطوال الأعمدة نسب التمور في العلبة، فمجموعها هو الكل ومجموع عمودي النوعين المطلوبين هو الجزء.
    misconceptions: [wrong-event, part-part-vs-part-whole, equiprobability-bias]
    qatar_link: 'الصف السابع — الفصل الثاني: الاحتمال النظري'
    verify: "Rational(40 + 30, 70 + 40 + 60 + 30)"

  # ------------------------------------------------------------ 05 استدلال · صعب (الأخير)
  - id: M8-PSI4-05
    topic: N5
    cognitive: reasoning
    area: justify
    difficulty: hard
    benchmark: advanced
    format: cr_explain
    context: qatar
    time: 240
    points: 2
    stem: |
      يريد سالم شراء $2\frac{1}{2}\,\text{kg}$ من التمر الخلاص. يبيع متجران الخلاص بالسعر المبيّن في الجدول، ولكل منهما عرض مختلف:
      - العرض الأول: اشترِ $2\,\text{kg}$ واحصل على $\frac{1}{2}\,\text{kg}$ مجاناً.
      - العرض الثاني: حسم $25\%$ على ثمن الكمية كلها.
      أي العرضين أفضل لسالم؟ فسّر إجابتك بالحسابات.
    rubric:
      codes:
        - code: 20
          points: 2
          desc: 'يختار العرض الثاني ويبرر بمقارنة صحيحة لكلفة الكمية نفسها ($80$ ريالاً في العرض الأول و$75$ ريالاً في العرض الثاني)، أو لسعر الكيلوغرام ($32$ و$30$ ريالاً).'
        - code: 10
          points: 1
          desc: 'يحسب كلفة أحد العرضين حساباً صحيحاً فقط، أو يختار العرض الثاني دون حسابات كافية للمقارنة.'
        - code: 70
          points: 0
          desc: 'يختار العرض الأول، أو يعدّ العرضين متساويين (مثلاً لأن نصف الكيلوغرام يساوي $25\%$ من $2\,\text{kg}$).'
      examples:
        correct:
          - 'العرض الثاني أفضل: في الأول يدفع $80$ ريالاً مقابل $2.5\,\text{kg}$ وفي الثاني يدفع $75$ ريالاً.'
          - 'سعر الكيلوغرام في العرض الأول $32$ ريالاً وفي الثاني $30$ ريالاً، فالثاني أرخص.'
        incorrect:
          - 'العرضان متساويان لأن نصف الكيلوغرام يساوي $25\%$ من $2\,\text{kg}$.'
          - 'العرض الأول أفضل لأنه يعطي كمية مجانية.'
    model_answer: 'العرض الثاني أفضل. في العرض الأول يدفع سالم ثمن $2\,\text{kg}$ فقط: $2 \times 40 = 80$ ريالاً مقابل $2.5\,\text{kg}$. وفي العرض الثاني يكون الثمن $2.5 \times 40 = 100$ ريال، والحسم $25\%$ يساوي $25$ ريالاً، فيدفع $75$ ريالاً. إذن العرض الثاني أرخص بمقدار $5$ ريالات للكمية نفسها.'
    solution: |
      سعر الكيلوغرام الواحد $40$ ريالاً، والكمية المطلوبة $2.5\,\text{kg}$.
      العرض الأول: يدفع ثمن $2\,\text{kg}$ فقط: $2 \times 40 = 80$ ريالاً.
      العرض الثاني: الثمن قبل الحسم $2.5 \times 40 = 100$ ريال، والحسم $25\%$ يساوي $25$ ريالاً، فيدفع $100 - 25 = 75$ ريالاً.
      العرض الثاني أرخص بمقدار $5$ ريالات للكمية نفسها، فهو الأفضل لسالم.
      الكمية المجانية في العرض الأول تعادل $\frac{0.5}{2.5} = 20\%$ فقط من الكمية التي يحصل عليها، وهي أقل من الحسم $25\%$.
    remediation: |
      قارن العروض دائماً على كمية واحدة: احسب المبلغ الذي يدفعه الزبون للكمية نفسها في كل عرض، أو احسب سعر الكيلوغرام الواحد. تُحسب نسبة الكمية المجانية من الكمية الكلية التي يحصل عليها الزبون لا من الكمية التي دفع ثمنها.
    misconceptions: [free-item-vs-percent, percent-wrong-base]
    qatar_link: 'الصف السابع — الوحدة 2: الدرس 2-1 معدلات الوحدة؛ الوحدة 3: النسب المئوية (الحسم)'
    verify: "2 * 40 == 80 and Rational(5, 2) * 40 * (1 - Rational(25, 100)) == 75 and 75 < 80 and Rational(1, 2) / Rational(5, 2) == Rational(1, 5) and Rational(1, 5) < Rational(1, 4)"
