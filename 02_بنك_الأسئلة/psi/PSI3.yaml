  # ------------------------------------------------------------ 01 معرفة · سهل
  - id: M8-PSI3-01
    topic: A5
    cognitive: knowing
    area: compute
    difficulty: easy
    benchmark: intermediate
    format: mc
    context: qatar
    time: 50
    stem: |
      اعتماداً على الجدول، ما سرعة القطار بوحدة $\text{km/min}$ (كيلومتر لكل دقيقة)؟
    options: ['$5$', '$4$', '$1.25$', '$0.8$']
    option_values: [5, 4, "5/4", "4/5"]
    key: C
    verify: "Rational(5, 4)"
    rationale:
      A: 'أخذ المسافة بين قراءتين متتاليتين ($5\,\text{km}$) على أنها السرعة بدل قسمتها على الزمن (4 دقائق).'
      B: 'أخذ الفرق بين زمنين متتاليين (4 دقائق) على أنه السرعة.'
      D: 'قسم الزمن على المسافة $4 \div 5 = 0.8$ فعكس المعدل.'
    solution: |
      السرعة = المسافة ÷ الزمن. من الصف الثاني: $5 \div 4 = 1.25$.
      النسبة نفسها تتكرر في بقية الصفوف ($10 \div 8 = 1.25$ و $15 \div 12 = 1.25$)، فالعلاقة خطية والسرعة ثابتة: $1.25\,\text{km/min}$.
      وهذه السرعة هي ميل المستقيم الذي يمثّل العلاقة بين المسافة والزمن.
    remediation: |
      اطلب من الطالب قسمة المسافة على الزمن في صفين مختلفين للتأكد من ثبات المعدل،
      وذكّره بأن السرعة = المسافة ÷ الزمن وأن هذا المعدل هو ميل التمثيل البياني للعلاقة.
    misconceptions: [slope-as-rise-only, slope-as-run-only, rate-inverted]
    qatar_link: 'الصف الثامن، الوحدة 2 (2-6 و 2-7): التناسب وميل المستقيم، $y = mx$'

  # ------------------------------------------------------------ 02 تطبيق · متوسط
  - id: M8-PSI3-02
    topic: N5
    cognitive: applying
    area: implement
    difficulty: medium
    benchmark: intermediate
    format: mc
    context: qatar
    time: 90
    stem: |
      تعلن شركة المترو أن سرعة هذا القطار $75\,\text{km/h}$.
      كم دقيقة تستغرق رحلة طولها $30\,\text{km}$ بهذه السرعة؟
    options: ['0.4 دقيقة', '24 دقيقة', '40 دقيقة', '150 دقيقة']
    option_values: ["2/5", 24, 40, 150]
    key: B
    verify: "Rational(30, 75) * 60"
    rationale:
      A: 'حسب الزمن بالساعات $30 \div 75 = 0.4$ ولم يحوّله إلى دقائق بالضرب في 60.'
      C: 'قرأ $0.4$ ساعة على أنها 40 دقيقة (ضرب في 100 بدل 60).'
      D: 'قسم السرعة على المسافة $75 \div 30 = 2.5$ ساعة أي 150 دقيقة، فعكس العلاقة بين المسافة والزمن.'
    solution: |
      الزمن = المسافة ÷ السرعة: $30 \div 75 = 0.4$ ساعة.
      نحوّل الساعات إلى دقائق: $0.4 \times 60 = 24$ دقيقة.
      طريقة أخرى: $75\,\text{km/h} = 75 \div 60 = 1.25\,\text{km/min}$ وهي سرعة الجدول نفسها، والزمن $30 \div 1.25 = 24$ دقيقة.
    remediation: |
      درّب الطالب على كتابة وحدة كل ناتج (ساعة أم دقيقة)، وعلى تحويل الساعات إلى دقائق بالضرب في 60،
      وعلى فحص معقولية الجواب: القطار يقطع أكثر من كيلومتر في الدقيقة، فالرحلة أقصر من 30 دقيقة.
    misconceptions: [time-unit-error, time-hours-minutes, rate-inverted]
    qatar_link: 'الصف السابع، الوحدة 2: معدل الوحدة وتحويل الوحدات؛ الصف الثامن، الوحدة 2 (2-6): معدل التغير'

  # ------------------------------------------------------------ 03 تطبيق · متوسط
  - id: M8-PSI3-03
    topic: N1
    cognitive: applying
    area: implement
    difficulty: medium
    benchmark: high
    format: dragdrop_slots
    context: qatar
    time: 120
    stem: |
      تغادر قطارات الخط الأحمر المحطة المركزية كل 6 دقائق، وتغادرها قطارات الخط الأخضر كل 8 دقائق.
      غادر قطار من كل خط المحطة معاً عند الساعة 6:00 صباحاً.
      أكمل الجملة بسحب البطاقات المناسبة إلى الخانات.
    cards:
      - {id: m14, text: '14', value: 14}
      - {id: m24, text: '24', value: 24}
      - {id: m48, text: '48', value: 48}
      - {id: t614, text: '6:14', value: 374}
      - {id: t624, text: '6:24', value: 384}
      - {id: t648, text: '6:48', value: 408}
    template: 'يغادر قطاران من الخطين المحطة معاً مرة كل [[1]] دقيقة، فيغادران معاً عند الساعة 6:00 ثم عند الساعة [[2]] ثم عند الساعة [[3]].'
    template_dir: rtl
    key: {1: m24, 2: t624, 3: t648}
    verify: "s1 == lcm(6, 8) and s2 == 6 * 60 + s1 and s3 == 6 * 60 + 2 * s1"
    solution: |
      يغادر القطاران معاً بعد عدد من الدقائق يكون مضاعفاً مشتركاً للعددين 6 و 8.
      مضاعفات 6: 6 و 12 و 18 و 24 ، ومضاعفات 8: 8 و 16 و 24 ، فالمضاعف المشترك الأصغر هو 24.
      إذن يغادران معاً كل 24 دقيقة: بعد 24 دقيقة من 6:00 تكون الساعة 6:24، وبعد 48 دقيقة تكون الساعة 6:48.
      الرقم 14 ناتج جمع العددين، والرقم 48 ناتج ضربهما، وكلاهما لا يمثّل أول لقاء للقطارين.
    remediation: |
      اطلب من الطالب كتابة مضاعفات كل عدد حتى أول عدد مشترك، وتمييز المضاعف المشترك الأصغر عن مجموع العددين وحاصل ضربهما،
      ثم تحويل الدقائق إلى الساعة تدريجياً (6:00 ثم 6:24 ثم 6:48).
    misconceptions: [lcm-as-sum, lcm-as-product]
    qatar_link: 'مراجعة من الصفوف السابقة: المضاعف المشترك الأصغر وتطبيقاته الحياتية'

  # ------------------------------------------------------------ 04 استدلال · صعب
  - id: M8-PSI3-04
    topic: A4
    cognitive: reasoning
    area: analyze
    difficulty: hard
    benchmark: high
    format: numeric
    context: qatar
    time: 150
    stem: |
      تقارن سلمى بين بطاقتين لدفع أجرة المترو، كما في الجدول.
      إذا ركبت $n$ رحلة في الشهر، فما أقل عدد صحيح من الرحلات تكون عنده تكلفة البطاقة (أ) أقل من تكلفة البطاقة (ب)؟
    table:
      headers: ['البطاقة', 'رسم الاشتراك الشهري', 'أجرة الرحلة الواحدة']
      rows:
        - ['البطاقة (أ)', '60 ريالاً', '2 ريال']
        - ['البطاقة (ب)', 'لا يوجد', '5 ريالات']
      row_headers: true
    answer: {value: 21, unit: 'رحلة'}
    verify: "min([n for n in range(1, 200) if 60 + 2 * n < 5 * n])"
    hint: 'عند أي عدد من الرحلات تتساوى التكلفتان؟'
    solution: |
      تكلفة البطاقة (أ) في الشهر: $60 + 2n$ ، وتكلفة البطاقة (ب): $5n$.
      نريد أن تكون (أ) أقل: $60 + 2n < 5n$ ، أي $60 < 3n$ ، ومنه $n > 20$.
      عند $n = 20$ تتساوى التكلفتان (100 ريال لكل منهما) فلا تكون (أ) أقل، لذا أقل عدد صحيح هو 21 رحلة.
      تحقق: عند 21 رحلة تكلفة (أ) $60 + 42 = 102$ ريالاً وتكلفة (ب) $105$ ريالات.
    remediation: |
      اطلب من الطالب كتابة تكلفة كل بطاقة بدلالة $n$ ، وإيجاد نقطة التساوي أولاً ($n = 20$) ثم اختبار عددين حولها،
      وتذكيره بأن «أقل من» تستثني حالة التساوي، فيكون الجواب أول عدد صحيح بعد 20.
    misconceptions: [strict-vs-inclusive-inequality, operation-confusion, fixed-charge-omitted]
    qatar_link: 'الصف الثامن، الوحدة 4 (4-1 إلى 4-4): أنظمة المعادلات؛ الصف السابع: المتباينات الخطية (الفصل الثاني، يناير–مارس)'

  # ------------------------------------------------------------ 05 استدلال · صعب (اختر وبرّر)
  - id: M8-PSI3-05
    topic: D2
    cognitive: reasoning
    area: justify
    difficulty: hard
    benchmark: advanced
    format: select_explain
    context: qatar
    time: 210
    points: 1
    stem: |
      يبيّن الرسم عدد ركاب الخطين الأحمر والأخضر (بالآلاف) في أوقات مختلفة من يوم دراسي.
      قال أحمد: «زاد عدد ركاب كل من الخطين بمقدار 4 آلاف راكب بين الساعة 6:00 والساعة 8:00، لذلك فإن النسبة المئوية للزيادة متساوية في الخطين».
      هل أحمد على صواب؟ اختر الإجابة ثم برّر بالحساب.
    figure:
      type: bar
      categories: ['6:00', '8:00', '10:00', '12:00', '14:00']
      series:
        - {name: 'الخط الأحمر', values: [4, 8, 6, 5, 7], color: '#8A1538'}
        - {name: 'الخط الأخضر', values: [6, 10, 7, 5, 6], color: '#4E8A3E'}
      value_labels: true
      y_max: 12
      y_step: 2
      y_label: 'عدد الركاب (بالآلاف)'
      x_label: 'الساعة'
      title: 'عدد ركاب الخطين خلال اليوم'
      alt: 'أعمدة مجمّعة لعدد ركاب الخطين الأحمر والأخضر عند الساعات 6 و 8 و 10 و 12 و 14'
    options: ['نعم، أحمد على صواب', 'لا، أحمد ليس على صواب']
    key: B
    rubric:
      full: 'يختار «لا» ويبرّر بحساب النسبتين أو مقارنتهما: الخط الأحمر من 4 إلى 8 آلاف أي زيادة $100\%$ (تضاعف)، والخط الأخضر من 6 إلى 10 آلاف أي زيادة $66.7\%$ تقريباً فقط؛ أو يوضح أن الزيادة المطلقة متساوية لكن الأساس مختلف (4 مقابل 6) فالنسبة المئوية مختلفة.'
      zero: 'يختار «نعم»، أو يختار «لا» دون تبرير يستند إلى حساب النسبة أو مقارنة الأساسين (مثل «لأن الخط الأخضر أعلى»).'
      examples:
        correct:
          - 'لا؛ الأحمر زاد من 4 إلى 8 أي $\frac{4}{4} = 100\%$ ، والأخضر زاد من 6 إلى 10 أي $\frac{4}{6} \approx 66.7\%$ ، فالنسبتان مختلفتان.'
          - 'لا؛ الزيادة 4 آلاف لكل منهما لكنها تمثّل ضعف عدد ركاب الأحمر الأصلي، وأقل من ضعف عدد ركاب الأخضر.'
        incorrect:
          - 'نعم؛ لأن الزيادة 4 آلاف في الخطين.'
          - 'لا؛ لأن الخط الأخضر أعلى (دون حساب).'
    verify: "8 - 4 == 10 - 6 and Rational(8 - 4, 4) == 1 and Rational(10 - 6, 6) < 1"
    solution: |
      الزيادة المطلقة متساوية: الخط الأحمر $8 - 4 = 4$ آلاف، والخط الأخضر $10 - 6 = 4$ آلاف.
      لكن النسبة المئوية للزيادة تُقارن بالقيمة الأصلية: الأحمر $\frac{4}{4} = 100\%$ ، والأخضر $\frac{4}{6} \approx 66.7\%$.
      النسبتان مختلفتان، فأحمد ليس على صواب: الخط الأحمر تضاعف عدد ركابه، أما الأخضر فلم يتضاعف.
    remediation: |
      درّب الطالب على حساب التغير المئوي بقسمة مقدار التغير على القيمة الأصلية،
      ثم مقارنة زيادتين متساويتين في المقدار على أساسين مختلفين.
    misconceptions: [compare-counts-not-percents, percent-wrong-base]
    qatar_link: 'الصف السابع، الوحدة 3: النسب المئوية والتغير المئوي؛ قراءة التمثيل بالأعمدة المجمّعة'
