items:
  # ------------------------------------------------------------ 01 معرفة · سهل
  - id: M8-PSI2-01
    topic: N5
    cognitive: knowing
    area: compute
    difficulty: easy
    benchmark: intermediate
    format: mc
    context: qatar
    time: 45
    stem: |
      تُحضَّر تربة الأحواض بخلط الرمل والسماد العضوي بنسبة $3 : 2$ (رمل : سماد) بالأكياس.
      كم كيساً من الرمل يلزم مع 6 أكياس من السماد؟
    options: ['3 أكياس', '4 أكياس', '7 أكياس', '9 أكياس']
    option_values: [3, 4, 7, 9]
    key: D
    verify: "6 * Rational(3, 2)"
    rationale:
      A: 'قسم 6 على 2 فوجد قيمة الجزء الواحد ($6 \div 2 = 3$) وتوقف قبل ضربها في عدد أجزاء الرمل.'
      B: 'عكس النسبة فحسب $6 \times \frac{2}{3} = 4$ بدل $6 \times \frac{3}{2}$.'
      C: 'استعمل التفكير الجمعي: الرمل يزيد على السماد بجزء واحد، فأضاف 1 إلى 6 وحصل على 7.'
    solution: |
      النسبة رمل : سماد هي $3 : 2$ ، أي أن لكل جزأين من السماد ثلاثة أجزاء من الرمل.
      مع 6 أكياس من السماد تكون قيمة الجزء الواحد $6 \div 2 = 3$ أكياس.
      عدد أكياس الرمل: $3 \times 3 = 9$ أكياس.
    remediation: |
      استعمل شريط الأجزاء لتمثيل النسبة، وأوجد قيمة الجزء الواحد ثم اضربها في عدد أجزاء الرمل،
      وقارن النتيجة بالحل بالتناسب $\frac{3}{2} = \frac{x}{6}$.
    misconceptions: [stop-at-intermediate-result, rate-inverted, additive-ratio-reasoning]
    qatar_link: 'الصف السابع، الوحدة 2: علاقات التناسب (النسب المتكافئة ومعدل الوحدة)'

  # ------------------------------------------------------------ 02 تطبيق · متوسط
  - id: M8-PSI2-02
    topic: G2
    cognitive: applying
    area: implement
    difficulty: medium
    benchmark: intermediate
    format: multi_numeric
    context: qatar
    time: 130
    stem: |
      يبلغ سعر المتر الطولي من السياج 45 ريالاً، وسيُحاط محيط الحديقة كله بالسياج.
      احسب مساحة الحديقة وتكلفة السياج.
    fields: [{label: 'المساحة ($\text{m}^2$)', value: 88}, {label: 'تكلفة السياج (ريال)', value: 1980}]
    scoring: {mode: all}
    verify: "[10 * 4 + 6 * (12 - 4), (10 + 4 + (10 - 6) + (12 - 4) + 6 + 12) * 45]"
    hint: 'أوجد أولاً طولي الضلعين غير المكتوبين $CD$ و $DE$.'
    solution: |
      الضلعان غير المكتوبين: $CD = 10 - 6 = 4$ و $DE = 12 - 4 = 8$ (بالأمتار).
      نقسم الحديقة إلى مستطيلين: السفلي $10 \times 4 = 40$ والعلوي $6 \times 8 = 48$ ،
      فالمساحة $40 + 48 = 88\,\text{m}^2$.
      المحيط: $10 + 4 + 4 + 8 + 6 + 12 = 44\,\text{m}$ ، وتكلفة السياج $44 \times 45 = 1980$ ريال.
    remediation: |
      درّب الطالب على استنتاج الأضلاع غير المكتوبة من فروق الأطوال المتقابلة قبل الجمع،
      وعلى التحقق من أن محيط الشكل على هيئة L يساوي محيط المستطيل المحيط به ($2 \times (10 + 12) = 44$).
    misconceptions: [missing-side-not-deduced, area-perimeter-confusion]
    qatar_link: 'الصف السابع، الفصل الثاني: المحيط والمساحة (الأشكال المركبة من مستطيلات)'

  # ------------------------------------------------------------ 03 تطبيق · متوسط
  - id: M8-PSI2-03
    topic: G2
    cognitive: applying
    area: implement
    difficulty: medium
    benchmark: high
    format: mc
    context: qatar
    time: 90
    stem: |
      يصل ممر مستقيم بين النقطتين $F$ و $D$ (الخط المتقطع في الرسم).
      ما طول الممر؟
    options: ['$10\,\text{m}$', '$14\,\text{m}$', '$48\,\text{m}$', '$100\,\text{m}$']
    option_values: [10, 14, 48, 100]
    key: A
    verify: "sqrt(6**2 + (12 - 4)**2)"
    rationale:
      B: 'جمع طولي الضلعين القائمين $6 + 8 = 14$ بدل تطبيق نظرية فيثاغورس.'
      C: 'ضرب طولي الضلعين القائمين $6 \times 8 = 48$ (خلط بين العمليات).'
      D: 'حسب مجموع المربعين $6^2 + 8^2 = 100$ ولم يأخذ الجذر التربيعي.'
    solution: |
      الممر $FD$ هو الوتر في المثلث القائم $FED$ الذي قائمته عند $E$.
      $FE = 6\,\text{m}$ و $ED = 12 - 4 = 8\,\text{m}$.
      $FD^2 = 6^2 + 8^2 = 36 + 64 = 100$ ، إذن $FD = \sqrt{100} = 10\,\text{m}$.
    remediation: |
      ارسم المثلث القائم مع الطالب وحدّد الوتر، وذكّره بأن مجموع مربعي الضلعين القائمين يساوي مربع الوتر،
      وأن الإجابة طول فيلزم أخذ الجذر التربيعي في النهاية.
    misconceptions: [pythagoras-sum-of-sides, operation-confusion, forget-square-root]
    qatar_link: 'الصف الثامن، الوحدة 6: نظرية فيثاغورس وعكسها (الفصل الثاني، أبريل–مايو؛ بند جسري)'

  # ------------------------------------------------------------ 04 استدلال · صعب (رسم على الشبكة)
  - id: M8-PSI2-04
    topic: G1
    cognitive: reasoning
    area: analyze
    difficulty: hard
    benchmark: high
    format: grid_plot
    context: qatar
    time: 180
    stem: |
      تخطّط المدرسة لإنشاء حوض زهور مستطيل داخل الحديقة، وفق الشروط الآتية:
      زاويته السفلية اليسرى عند النقطة $(1, 1)$ ، ومساحته $12\,\text{m}^2$ ، ومحيطه $14\,\text{m}$ ، وضلعه الأفقي أطول من ضلعه الرأسي.
      طول ضلع كل مربع في الشبكة $1\,\text{m}$. ارسم الحوض بتعيين رؤوسه الأربعة على الشبكة.
    grid: {xmin: 0, xmax: 10, ymin: 0, ymax: 12}
    given: {polygons: [{points: [[0, 0], [10, 0], [10, 4], [6, 4], [6, 12], [0, 12]]}]}
    mode: polygon
    count: 4
    key: [[1, 1], [5, 1], [5, 4], [1, 4]]
    verify: "[sorted(P) == sorted([(1, 1), (1 + s[0], 1), (1 + s[0], 1 + s[1]), (1, 1 + s[1])]) for s in solve([Eq(x * y, 12), Eq(2 * (x + y), 14)], [x, y]) if s[0] > s[1]] == [True]"
    hint: 'مجموع بعدي المستطيل يساوي نصف محيطه.'
    solution: |
      نفرض أن بعدي الحوض $a$ و $b$ بالأمتار.
      المحيط $2(a + b) = 14$ ، فمجموع البعدين $a + b = 7$ ، والمساحة $a \times b = 12$.
      العددان اللذان مجموعهما 7 وحاصل ضربهما 12 هما 3 و 4.
      الضلع الأفقي أطول، فعرض الحوض الأفقي 4 وارتفاعه 3.
      نبدأ من النقطة $(1, 1)$ فتكون الرؤوس: $(1, 1)$ و $(5, 1)$ و $(5, 4)$ و $(1, 4)$.
    remediation: |
      اطلب من الطالب تجريب أزواج الأعداد التي مجموعها 7 وكتابة حاصل ضربها في جدول حتى يصل إلى 12،
      ثم يحدد الاتجاه الأفقي والرأسي بحسب الشرط قبل التعيين على الشبكة.
    misconceptions: [area-perimeter-confusion, horizontal-vertical-swapped]
    qatar_link: 'الصف الثامن، الوحدة 3 (3-1): التمثيل على المستوى الإحداثي؛ الصف السابع: المساحة والمحيط'

  # ------------------------------------------------------------ 05 استدلال · صعب (اختر وبرّر)
  - id: M8-PSI2-05
    topic: A5
    cognitive: reasoning
    area: justify
    difficulty: hard
    benchmark: advanced
    format: select_explain
    context: qatar
    time: 200
    points: 1
    stem: |
      تقيس مجموعة النادي الزراعي ارتفاع نبتتين بالسنتيمتر كل أسبوع منذ يوم الزراعة (الأسبوع 0)، ويعرض الرسم النتائج.
      قال سالم: «نبتة النعناع نمت أسرع من نبتة الريحان خلال الأسابيع الستة لأن خطها أعلى في الرسم».
      هل سالم على صواب؟ اختر الإجابة ثم برّر باستعمال أرقام من الرسم.
    figure:
      type: line
      x: ['0', '1', '2', '3', '4', '5', '6']
      series:
        - {name: 'الريحان', values: [2, 5, 8, 11, 14, 17, 20]}
        - {name: 'النعناع', values: [10, 12, 14, 16, 18, 20, 22]}
      y_max: 24
      y_step: 4
      y_label: 'الارتفاع (cm)'
      x_label: 'الأسبوع'
      title: 'ارتفاع النبتتين'
      alt: 'رسم خطي لارتفاع نبتتي الريحان والنعناع خلال ستة أسابيع'
    options: ['نعم، سالم على صواب', 'لا، سالم ليس على صواب']
    key: B
    rubric:
      full: 'يختار «لا» ويبرّر بمقارنة مقدار النمو لا الارتفاع: الريحان نما $20 - 2 = 18\,\text{cm}$ والنعناع نما $22 - 10 = 12\,\text{cm}$ (أو معدل $3\,\text{cm}$ مقابل $2\,\text{cm}$ في الأسبوع، أو أن خط الريحان أشد ميلاً).'
      zero: 'يختار «نعم»، أو يختار «لا» دون تبرير يستند إلى مقدار النمو (مثل الاكتفاء بقول إن الريحان أسرع دون أرقام).'
      examples:
        correct:
          - 'لا؛ الريحان زاد من $2\,\text{cm}$ إلى $20\,\text{cm}$ أي $18\,\text{cm}$ بينما زاد النعناع $12\,\text{cm}$ فقط، فالريحان أسرع نمواً.'
          - 'لا؛ خط الريحان أشد ميلاً: يزداد $3\,\text{cm}$ كل أسبوع مقابل $2\,\text{cm}$ للنعناع.'
        incorrect:
          - 'نعم؛ لأن النعناع أطول في كل الأسابيع.'
          - 'لا؛ لأن الريحان أسرع (دون أي أرقام).'
    verify: "(20 - 2) > (22 - 10) and Rational(20 - 2, 6) == 3 and Rational(22 - 10, 6) == 2 and 10 > 2"
    solution: |
      ارتفاع النعناع أكبر من ارتفاع الريحان في كل الأسابيع (يبدأ من $10\,\text{cm}$ مقابل $2\,\text{cm}$)، لكن هذا لا يعني أنه نما أسرع.
      النمو يُقاس بالتغير في الارتفاع: الريحان من 2 إلى 20 أي $18\,\text{cm}$ في 6 أسابيع (بمعدل $3\,\text{cm}$ في الأسبوع).
      النعناع من 10 إلى 22 أي $12\,\text{cm}$ (بمعدل $2\,\text{cm}$ في الأسبوع).
      إذن الريحان هو الأسرع نمواً، وسالم ليس على صواب.
    remediation: |
      درّب الطالب على التمييز بين قيمة الارتفاع عند لحظة معينة ومقدار التغير بين لحظتين،
      وعلى ربط الأسرع نمواً بالميل الأكبر للخط لا بكون الخط أعلى (المقطع $y$ مقابل الميل).
    misconceptions: [highest-value-vs-largest-increase, slope-intercept-confusion]
    qatar_link: 'الصف الثامن، الوحدة 2 (2-6 و 2-9): الميل ومعدل التغير في المواقف الحياتية'
