items:
  # ------------------------------------------------------------ 01 معرفة · سهل
  - id: M8-PSI5-01
    topic: N1
    cognitive: knowing
    area: identify
    difficulty: easy
    benchmark: intermediate
    format: mc
    context: qatar
    time: 45
    stem: |
      ما كتابة كمية الإنتاج اليومي $7200\,\text{m}^3$ بالصيغة العلمية؟
    options: ['$72 \times 10^2$', '$7.2 \times 10^2$', '$7.2 \times 10^3$', '$0.72 \times 10^4$']
    key: C
    rationale:
      A: 'العدد $72 \times 10^2$ يساوي $7200$ لكنه ليس بالصيغة العلمية لأن العدد الأول $72$ ليس بين $1$ و $10$.'
      B: 'أخطأ في الأس فاختار $2$ (عدد أصفار العدد) بدل $3$ (عدد المنازل التي تحركت بها الفاصلة العشرية)، فصارت القيمة $720$.'
      D: 'العدد الأول $0.72$ أصغر من $1$، فالصيغة ليست علمية وإن كانت قيمتها $7200$.'
    solution: |
      في الصيغة العلمية يُكتب العدد على الصورة $a \times 10^n$ حيث $1 \leq a < 10$.
      نحرّك الفاصلة العشرية في $7200$ ثلاث منازل إلى اليسار لنحصل على $7.2$، فيكون الأس $3$.
      إذن $7200 = 7.2 \times 10^3$، والإجابة C.
    remediation: |
      في الصيغة العلمية يُكتب العدد على الصورة $a \times 10^n$ حيث $a$ بين $1$ و $10$ و $n$ عدد صحيح. حرّك الفاصلة العشرية حتى يصبح العدد الأول بين $1$ و $10$، وعدد المنازل التي تحركتها هو الأس.
    misconceptions: [scientific-coefficient-out-of-range, scientific-exponent-miscount]
    qatar_link: 'الصف الثامن — الوحدة 1: الدرس 1-9 الصيغة العلمية'
    verify: "[1 <= c < 10 and c * 10**e == 7200 for c, e in [(72, 2), (Rational(72, 10), 2), (Rational(72, 10), 3), (Rational(72, 100), 4)]] == [False, False, True, False]"

  # ------------------------------------------------------------ 02 تطبيق · متوسط
  - id: M8-PSI5-02
    topic: G4
    cognitive: applying
    area: implement
    difficulty: medium
    benchmark: intermediate
    format: numeric
    context: qatar
    time: 90
    stem: |
      ما سعة الخزان بالمتر المكعب؟ استعمل $\pi \approx 3.14$.
    answer: {value: 2512, unit: 'm³', tol: 0.01}
    solution: |
      نصف قطر القاعدة $= 20 \div 2 = 10\,\text{m}$.
      حجم الأسطوانة $= \pi r^2 h \approx 3.14 \times 10^2 \times 8 = 3.14 \times 800 = 2512\,\text{m}^3$.
    remediation: |
      حجم الأسطوانة يساوي مساحة القاعدة الدائرية مضروبة في الارتفاع. المعطى في الشكل هو القطر، فاقسمه على $2$ لتحصل على نصف القطر قبل أن تربّعه.
    misconceptions: [square-diameter, forgot-to-square-radius, circumference-instead-of-area]
    qatar_link: 'الصف الثامن — الوحدة 7: حجم الأسطوانة (أبريل–مايو) — بند جسري؛ الصف السابع — الحجم'
    verify: "Rational(314, 100) * 10**2 * 8"

  # ------------------------------------------------------------ 03 تطبيق · متوسط
  - id: M8-PSI5-03
    topic: A5
    cognitive: applying
    area: represent
    difficulty: medium
    benchmark: high
    format: grid_plot
    context: qatar
    time: 120
    stem: |
      بعد صيانة الخزان أُوقف التوزيع عنه ثم مُلئ بمضخة احتياطية بمعدل ثابت بدءاً من ارتفاع $2\,\text{m}$، فصار ارتفاع الماء يزداد $0.5\,\text{m}$ كل ساعة.
      مثّل على الشبكة النقاط $(t, h)$ التي تبيّن ارتفاع الماء $h$ بالمتر بعد $t = 0$ و $t = 4$ و $t = 8$ ساعات.
    grid: {xmin: 0, xmax: 12, ymin: 0, ymax: 8, x_name: 't', y_name: 'h'}
    mode: points
    count: 3
    key: [[0, 2], [4, 4], [8, 6]]
    solution: |
      ارتفاع الماء بعد $t$ ساعة: $h = 2 + 0.5t$.
      عند $t = 0$ يكون $h = 2$. وعند $t = 4$ يكون $h = 2 + 0.5 \times 4 = 4$. وعند $t = 8$ يكون $h = 2 + 0.5 \times 8 = 6$.
      النقاط المطلوبة $(0, 2)$ و $(4, 4)$ و $(8, 6)$، وتقع على مستقيم ميله $0.5$ وهو معدل الملء.
    remediation: |
      الميل هنا $0.5$ ويمثّل معدل الملء (ارتفاع الماء في كل ساعة)، والقيمة $2$ هي الارتفاع الابتدائي (المقطع $y$ عند $t = 0$). احسب $h = 2 + 0.5t$ لكل قيمة من $t$ ثم عيّن النقطة $(t, h)$ على الشبكة.
    misconceptions: [x-y-coordinates-swapped, forget-constant-term]
    qatar_link: 'الصف الثامن — الوحدة 2: الدروس 2-6 إلى 2-9 (ميل المستقيم والمقطع y والنموذج y = mx + b)'
    verify: "sorted(P) == sorted([(0, 2), (4, 4), (8, 6)]) and all(q[1] == 2 + Rational(1, 2) * q[0] for q in P)"

  # ------------------------------------------------------------ 04 استدلال · صعب
  - id: M8-PSI5-04
    topic: D2
    cognitive: reasoning
    area: analyze
    difficulty: hard
    benchmark: high
    format: mc
    context: qatar
    time: 150
    stem: |
      افترض أن الخزان لا يفرغ تماماً ولا يفيض خلال اليوم.
      في أي ساعة من اليوم يكون مستوى الماء في الخزان أقل ما يمكن؟
    options: ['الساعة 20', 'الساعة 12', 'الساعة 8', 'الساعة 4']
    key: A
    rationale:
      B: 'اختار الساعة التي يبلغ فيها الاستهلاك أعلى قيمة ($500$)، وخلط بين معدل الاستهلاك ومستوى الماء؛ فالمستوى يواصل الانخفاض بعد هذه الساعة لأن الاستهلاك ما زال أكبر من الإنتاج.'
      C: 'اختار الساعة التي يبدأ عندها الاستهلاك بالزيادة على الإنتاج، وهي بداية الانخفاض وليست نهايته، فعندها يكون المستوى أعلى ما يمكن.'
      D: 'قرأ الرسم كأنه يمثل مستوى الماء فاختار أدنى نقطة في خط الاستهلاك ($100$)، مع أن الاستهلاك فيها أقل من الإنتاج فيرتفع المستوى.'
    solution: |
      عندما يزيد الإنتاج ($300$) على الاستهلاك يرتفع مستوى الماء، وعندما يزيد الاستهلاك على الإنتاج ينخفض.
      من الرسم: الاستهلاك أكبر من $300$ بين الساعة $8$ والساعة $20$ فقط، فينخفض المستوى طوال هذه الفترة، ثم يعود إلى الارتفاع بعد الساعة $20$.
      إذن أدنى مستوى عند الساعة $20$، والإجابة A.
    remediation: |
      فرّق بين معدل الاستهلاك (ارتفاع الخط في الرسم) ومستوى الماء في الخزان (ما تراكم فيه). ينخفض المستوى ما دام الاستهلاك أكبر من الإنتاج، ولا يبدأ بالارتفاع إلا عندما يصبح الاستهلاك أقل من الإنتاج.
    misconceptions: [rate-vs-accumulation-confusion, consumption-graph-read-as-level, start-end-confusion]
    qatar_link: 'الصف الثامن — الوحدة 3: الدرس 3-5 فترات التزايد والتناقص؛ الصف السادس — الإحصاء: قراءة التمثيل بالخطوط'
    verify: "[v == min(w) for w in [[sum(((300 - [200, 100, 300, 500, 400, 300, 200][i]) + (300 - [200, 100, 300, 500, 400, 300, 200][i + 1])) * 2 for i in range(k)) for k in (5, 3, 2, 1)]] for v in w] == [True, False, False, False]"

  # ------------------------------------------------------------ 05 استدلال · صعب (الأخير)
  - id: M8-PSI5-05
    topic: N5
    cognitive: reasoning
    area: integrate
    difficulty: hard
    benchmark: advanced
    format: select_explain
    context: qatar
    time: 240
    stem: |
      كان الخزان ممتلئاً تماماً عند الساعة 8. قالت منى: «سيفرغ الخزان تماماً قبل الساعة 20 لأن الاستهلاك يزيد على الإنتاج خلال هذه الفترة».
      هل منى على صواب؟ اختر الإجابة ثم فسّر بالحسابات.
    options: ['نعم، منى على صواب', 'لا، منى ليست على صواب']
    key: B
    points: 1
    rubric:
      full: 'يختار «لا، منى ليست على صواب» ويبرر كمياً بمقارنة أكبر نقص ممكن في الماء بسعة الخزان: أقصى فرق بين الاستهلاك والإنتاج $200\,\text{m}^3$ في الساعة، فالنقص في $12$ ساعة لا يزيد على $2400\,\text{m}^3$ وهو أقل من سعة الخزان $2512\,\text{m}^3$ (أو يحسب النقص الفعلي $1200\,\text{m}^3$ ويقارنه بالسعة).'
      zero: 'يختار «نعم»، أو يختار «لا» دون مقارنة كمية بين النقص المتوقع وسعة الخزان (مثل: لأن الإنتاج مستمر).'
      examples:
        correct:
          - 'أكبر زيادة في الاستهلاك على الإنتاج $500 - 300 = 200$ في الساعة، ولمدة $12$ ساعة تصبح $2400$ وهذا أقل من $2512$ فلن يفرغ.'
          - 'النقص الفعلي بين الساعة 8 والساعة 20 يساوي $1200\,\text{m}^3$ فيتبقى $1312\,\text{m}^3$ في الخزان.'
        incorrect:
          - 'لا، لأن الإنتاج لا يتوقف.'
          - 'نعم، لأن الاستهلاك أكبر من الإنتاج.'
    solution: |
      سعة الخزان $= 3.14 \times 10^2 \times 8 = 2512\,\text{m}^3$.
      أكبر فرق بين الاستهلاك والإنتاج في الرسم $500 - 300 = 200\,\text{m}^3$ في الساعة، وذلك عند الساعة 12.
      حتى لو بقي هذا الفرق ثابتاً من الساعة 8 إلى الساعة 20 ($12$ ساعة) فأكبر نقص ممكن $12 \times 200 = 2400\,\text{m}^3$ وهو أقل من $2512\,\text{m}^3$.
      إذن لا يفرغ الخزان ومنى ليست على صواب. والنقص الفعلي أقل من ذلك: $1200\,\text{m}^3$.
    remediation: |
      عند مقارنة كمية ما بسعة الخزان احسب الكمية القصوى الممكنة (المعدل مضروباً في الزمن) وقارنها بالسعة. لا يكفي أن يكون الاستهلاك أكبر من الإنتاج؛ المهم مقدار الفرق ومدته.
    misconceptions: [rate-vs-accumulation-confusion, forgot-to-square-radius, square-diameter]
    qatar_link: 'الصف السابع — الوحدة 2: معدلات الوحدة؛ الصف الثامن — الوحدة 7: حجم الأسطوانة (بند جسري)'
    verify: "Rational(314, 100) * 10**2 * 8 == 2512 and 12 * (500 - 300) == 2400 and 2400 < 2512 and Rational((0 + 200) * 4, 2) + Rational((200 + 100) * 4, 2) + Rational((100 + 0) * 4, 2) == 1200 and 2512 - 1200 == 1312"
