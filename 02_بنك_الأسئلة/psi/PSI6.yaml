  # ------------------------------------------------------------ 01 معرفة · سهل
  - id: M8-PSI6-01
    topic: N2
    cognitive: knowing
    area: order
    difficulty: easy
    benchmark: intermediate
    format: dragdrop_order
    context: qatar
    time: 120
    stem: |
      فارق الأهداف لأي فريق هو الأهداف التي سجّلها الفريق مطروحاً منها الأهداف التي استقبلها.
      رتّب الفرق الخمسة من الأعلى فارقاً إلى الأدنى فارقاً.
    cards:
      - {id: asood, text: 'الأسود', value: -4}
      - {id: dhiab, text: 'الذئاب', value: -3}
      - {id: suqur, text: 'الصقور', value: 6}
      - {id: fuhud, text: 'الفهود', value: 2}
      - {id: nusur, text: 'النسور', value: -1}
    key: [suqur, fuhud, nusur, dhiab, asood]
    direction: desc
    order_labels: ['الأعلى فارقاً', 'الأدنى فارقاً']
    solution: |
      فارق الأهداف لكل فريق: الصقور $8 - 2 = 6$ ، الفهود $5 - 3 = 2$ ، النسور $3 - 4 = -1$ ، الذئاب $1 - 4 = -3$ ، الأسود $3 - 7 = -4$.
      على خط الأعداد كلما اتجهنا يميناً زاد العدد، فالترتيب من الأعلى إلى الأدنى: $6$ ثم $2$ ثم $-1$ ثم $-3$ ثم $-4$.
      أي: الصقور ثم الفهود ثم النسور ثم الذئاب ثم الأسود.
    remediation: |
      على خط الأعداد كلما اتجهنا يميناً زاد العدد، والعدد السالب الأقرب إلى الصفر هو الأكبر: $-1 > -3 > -4$. احسب فارق كل فريق أولاً ثم رتّب الأعداد دون إهمال الإشارة.
    misconceptions: [negative-magnitude-order, ignore-negative-sign]
    qatar_link: 'الصف السابع — الوحدة 1: الأعداد الصحيحة (مقارنة الأعداد الصحيحة وترتيبها وطرحها)'
    verify: "[8 - 2, 5 - 3, 3 - 4, 1 - 4, 3 - 7] == [6, 2, -1, -3, -4] and 6 > 2 > -1 > -3 > -4"

  # ------------------------------------------------------------ 02 تطبيق · متوسط
  - id: M8-PSI6-02
    topic: D3
    cognitive: applying
    area: implement
    difficulty: medium
    benchmark: intermediate
    format: multi_numeric
    context: qatar
    time: 120
    stem: |
      اعتمد على عمود «أهداف له» في الجدول، وأوجد المتوسط الحسابي والوسيط لعدد الأهداف التي سجّلتها الفرق الخمسة.
    fields:
      - {label: 'المتوسط الحسابي', value: 4}
      - {label: 'الوسيط', value: 3}
    scoring: {mode: all}
    solution: |
      الأهداف التي سجّلتها الفرق: $3$ و $1$ و $8$ و $5$ و $3$.
      المتوسط الحسابي: $(3 + 1 + 8 + 5 + 3) \div 5 = 20 \div 5 = 4$.
      بعد الترتيب تصبح القيم $1$ ، $3$ ، $3$ ، $5$ ، $8$ والقيمة الوسطى $3$، فالوسيط $3$.
    remediation: |
      المتوسط الحسابي هو مجموع القيم مقسوماً على عددها. أما الوسيط فهو القيمة الوسطى بعد ترتيب القيم؛ لا تأخذ القيمة الوسطى من القائمة قبل ترتيبها.
    misconceptions: [mean-median-confusion, median-without-sorting, divide-by-wrong-count]
    qatar_link: 'الصف السادس — الإحصاء: المتوسط الحسابي والوسيط'
    verify: "[Rational(3 + 1 + 8 + 5 + 3, 5), median([3, 1, 8, 5, 3])]"

  # ------------------------------------------------------------ 03 تطبيق · متوسط
  - id: M8-PSI6-03
    topic: G2
    cognitive: applying
    area: formulate
    difficulty: medium
    benchmark: high
    format: numeric
    context: qatar
    time: 150
    stem: |
      ملعب المباراة النهائية مستطيل الشكل، طوله يزيد على عرضه بمقدار $20\,\text{m}$ ومحيطه $200\,\text{m}$.
      ما مساحة الملعب بالمتر المربع؟
    answer: {value: 2400, unit: 'm²', tol: 0.01}
    solution: |
      نفرض أن عرض الملعب $x$ فيكون طوله $x + 20$.
      المحيط $= 2 \times (x + x + 20) = 4x + 40 = 200$، إذن $4x = 160$ و $x = 40$.
      العرض $40\,\text{m}$ والطول $60\,\text{m}$.
      المساحة $= 60 \times 40 = 2400\,\text{m}^2$.
    remediation: |
      نرمز لعرض الملعب بالرمز $x$ فيكون طوله $x + 20$. المحيط يساوي ضعف مجموع الطول والعرض فنكوّن معادلة ونحلّها، ثم نضرب الطول في العرض لإيجاد المساحة. المحيط وحدته المتر والمساحة وحدتها المتر المربع.
    misconceptions: [perimeter-extra-added-once, perimeter-half-only, area-perimeter-confusion]
    qatar_link: 'الصف السابع، الفصل الثاني: المساحة والمحيط؛ الصف الثامن — الوحدة 2: الدرس 2-3 المعادلات متعددة الخطوات'
    verify: "(lambda w: w * (w + 20))(solve(Eq(2 * (x + (x + 20)), 200), x)[0])"

  # ------------------------------------------------------------ 04 استدلال · صعب
  - id: M8-PSI6-04
    topic: D4
    cognitive: reasoning
    area: justify
    difficulty: hard
    benchmark: high
    format: select_explain
    context: qatar
    time: 180
    stem: |
      يريد مدرب فريق الصقور اختيار لاعب لتنفيذ ركلة الترجيح الحاسمة في المباراة النهائية. يبيّن الجدول نتائج لاعبين في ركلات الترجيح خلال الموسم الماضي.
      قال المدرب: «أختار راشداً لأنه سجّل أهدافاً أكثر من سالم».
      هل تبرير المدرب صحيح؟ اختر الإجابة ثم فسّر.
    table:
      headers: ['اللاعب', 'عدد الركلات', 'عدد الأهداف']
      rows:
        - ['سالم', '12', '9']
        - ['راشد', '20', '14']
      row_headers: true
    options: ['نعم، تبرير المدرب صحيح', 'لا، تبرير المدرب ليس صحيحاً']
    key: B
    points: 1
    rubric:
      full: 'يختار «لا» ويقارن الاحتمال التجريبي لكل لاعب (عدد الأهداف مقسوماً على عدد الركلات): سالم $\frac{9}{12} = 0.75$ وراشد $\frac{14}{20} = 0.7$، فاحتمال تسجيل سالم أكبر رغم أن عدد أهداف راشد أكبر.'
      zero: 'يختار «نعم»، أو يختار «لا» دون مقارنة النسب (مثل: لأن راشداً أخطأ أكثر).'
      examples:
        correct:
          - 'سالم سجّل $\frac{9}{12} = 75\%$ من ركلاته وراشد سجّل $\frac{14}{20} = 70\%$ فسالم أفضل.'
          - 'لا يصح الاعتماد على عدد الأهداف لأن عدد الركلات مختلف، والاحتمال التجريبي لسالم $0.75$ أكبر من $0.7$.'
        incorrect:
          - 'نعم، لأن راشداً سجّل $14$ هدفاً وسالم سجّل $9$ أهداف.'
          - 'لا، لأن راشداً أخطأ $6$ ركلات وسالم أخطأ $3$ ركلات فقط.'
    solution: |
      الاحتمال التجريبي للتسجيل هو عدد الأهداف مقسوماً على عدد الركلات.
      سالم: $\frac{9}{12} = 0.75$. راشد: $\frac{14}{20} = 0.7$.
      احتمال تسجيل سالم أكبر، وراشد سجّل أهدافاً أكثر لأنه نفّذ ركلات أكثر (20 مقابل 12). لذلك تبرير المدرب غير صحيح.
    remediation: |
      الاحتمال التجريبي هو عدد مرات النجاح مقسوماً على عدد المحاولات. عندما يختلف عدد المحاولات قارن النسب (أو الكسور) لا الأعداد المطلقة.
    misconceptions: [compare-counts-not-rates, compare-one-quantity]
    qatar_link: 'الصف السابع — الفصل الثاني: الاحتمال التجريبي'
    verify: "Rational(9, 12) > Rational(14, 20) and 14 > 9 and Rational(9, 12) == Rational(3, 4) and Rational(14, 20) == Rational(7, 10) and Rational(3, 4) > Rational(7, 10)"

  # ------------------------------------------------------------ 05 استدلال · صعب (الأخير)
  - id: M8-PSI6-05
    topic: A6
    cognitive: reasoning
    area: generalize
    difficulty: hard
    benchmark: advanced
    format: mc
    context: qatar
    time: 150
    stem: |
      في الموسم القادم ستشارك 8 فرق في البطولة بالنظام نفسه، أي يلعب كل فريق مع كل فريق آخر مرة واحدة. يبيّن الجدول عدد المباريات الكلي في البطولة لعدد مختلف من الفرق.
      كم مباراة ستُلعب في البطولة الموسَّعة؟
    table:
      headers: ['عدد الفرق $n$', '2', '3', '4', '5']
      rows:
        - ['عدد المباريات', '1', '3', '6', '10']
      row_headers: true
    options: ['$56$', '$28$', '$22$', '$12$']
    option_values: [56, 28, 22, 12]
    key: B
    rationale:
      A: 'حسب $8 \times 7 = 56$ فعدّ كل مباراة مرتين (مرة لكل فريق) ولم يقسم على $2$.'
      C: 'افترض أن الزيادة ثابتة $+4$ (من $6$ إلى $10$) فتابع بالإضافة $10 + 4 + 4 + 4 = 22$.'
      D: 'ضاعف عدد المباريات عند مضاعفة عدد الفرق من $4$ إلى $8$: $6 \times 2 = 12$.'
    solution: |
      عدد المباريات هو عدد أزواج الفرق: كل فريق يلعب مع الفرق الأخرى كلها، ولا تُحسب المباراة مرتين.
      الزيادات بين القيم المتتالية في الجدول هي $2$ ثم $3$ ثم $4$، فهي ليست ثابتة والنمط غير خطي.
      عند $n$ فريقاً يكون العدد $\frac{n(n - 1)}{2}$، وعند $8$ فرق: $\frac{8 \times 7}{2} = 28$.
      وبتتبع الزيادات: $10 + 5 = 15$ ثم $15 + 6 = 21$ ثم $21 + 7 = 28$. والإجابة B.
    remediation: |
      عندما لا تكون الزيادة بين القيم المتتالية ثابتة فالنمط غير خطي، ولا يصح مضاعفة العدد ولا إضافة قيمة ثابتة. كل فريق من $n$ فريقاً يلعب مع $n - 1$ فريقاً، ثم نقسم على $2$ لأن كل مباراة تُحسب مرة واحدة.
    misconceptions: [count-pairs-twice, constant-difference-assumption, linear-scaling-of-quadratic]
    qatar_link: 'الصف الثامن — الوحدة 3: الدرس 3-1 العلاقات والدوال؛ والدرس المحذوف 3-3 (مقارنة الدوال الخطية وغير الخطية) — بند جسري.'
    verify: "Rational(8 * (8 - 1), 2) if [Rational(n * (n - 1), 2) for n in (2, 3, 4, 5)] == [1, 3, 6, 10] else 0"
