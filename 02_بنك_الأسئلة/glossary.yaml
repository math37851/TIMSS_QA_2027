# أنماط مرفوضة (تفضيلات المستخدم: الأرقام والرموز بالإنجليزية، والبدائل A–D)
forbidden_patterns:
  - {pattern: "[٠-٩]",        message: "أرقام هندية/مشرقية: استخدم 0–9"}
  - {pattern: "[۰-۹]",        message: "أرقام فارسية: استخدم 0–9"}
  - {pattern: "٪",            message: "علامة نسبة مئوية عربية: استخدم %"}
  - {pattern: "٫",            message: "فاصلة عشرية عربية: استخدم النقطة ."}
  - {pattern: "(^|\\s)[أبجد]\\)", message: "ترقيم بدائل عربي: استخدم A, B, C, D"}
